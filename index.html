    yanis (triste): Toi, t'es jamais l\xE0. Eux, ils sont l\xE0.
    moi: Alors je serai plus l\xE0. Promis. Et toi, tu viens t'entra\xEEner au city avec moi le week-end.
    ~ var.yanis_protege += 1; rel.yanis += 10
    ~ souvenir(yanis, promesse, "Tu lui as promis d'\xEAtre plus pr\xE9sent")
  * En parler \xE0 maman #famille
    ~ rel.yanis -= 8; rel.maman += 4; var.yanis_protege += 1
    yanis (colere): Balance !
  * Laisser couler, il est grand
    ~ var.yanis_neglige += 1
    yanis: T'inqui\xE8te, je g\xE8re.
* Le complimenter sur sa casquette
  ~ var.yanis_neglige += 1; rel.yanis += 3
  yanis (fier): Elle est styl\xE9e, hein ?
maman: \xC0 table, les gar\xE7ons !
~ rel.maman += 3; stat.moral += 5`,title:"Le petit fr\xE8re",when:"var.alerte_yanis",chapters:["ch1"],priority:60,once:!0},{id:"ch1_appel_argent",trigger:"activity:appeler_maman",script:`!son telephone
maman: All\xF4, mon ch\xE9ri ? \u2026Oui, oui, tout va bien.
maman (inquiet): Enfin\u2026 La machine \xE0 laver a l\xE2ch\xE9. Et l'assurance de la voiture tombe ce mois-ci. Mais ne t'inqui\xE8te pas, je vais faire des heures en plus.
* [stat.argent >= 150] Lui envoyer 150 \u20AC de tes \xE9conomies #famille #genereux
  ~ stat.argent -= 150; rel.maman += 10; stat.moral += 3; var.aide_maman += 1
  maman (emu): Non, je ne peux pas accepter\u2026 Bon. Merci, mon grand. Je te les rendrai.
* Lui sugg\xE9rer de demander une aide au club #debrouillard
  maman: Au club ? Je n'oserai jamais\u2026
  ~ var.aide_club_demande = vrai; rel.maman += 2
* Tu verras \xE7a avec quelqu'un d'autre, maman. Moi, je dois me concentrer.
  ~ rel.maman -= 8
  maman (triste): Oui\u2026 Bien s\xFBr. Concentre-toi.`,title:"Fin de mois difficile",when:"temps.semaine >= 2",chapters:["ch1"],priority:50,once:!0},{id:"ch1_point_moreau",trigger:"talk:moreau",script:`moreau: Tu tombes bien, {joueur.nom}. On est \xE0 mi-saison. Je vais \xEAtre franc.
si stat.statut >= 50
  moreau: Tu fais partie des gar\xE7ons que je regarde de pr\xE8s. Ne g\xE2che pas \xE7a.
sinon si stat.statut >= 30
  moreau: Tu as des qualit\xE9s. Mais aujourd'hui, tu n'es pas au-dessus du lot.
sinon
  moreau: Pour l'instant, je ne vois pas pourquoi je te garderais l'an prochain.
[mem.moreau.fete] !rappel moreau.fete
[mem.moreau.fete] moreau (colere): Et les soir\xE9es la veille des matchs, c'est termin\xE9. C'est clair ?
moreau: Qu'est-ce que tu attends de moi ?
* Que vous me disiez o\xF9 progresser. #discipline
  moreau: Ton jeu sans ballon. Et ta r\xE9gularit\xE9. Le talent sans r\xE9gularit\xE9, \xE7a ne vaut rien.
  ~ rel.moreau += 6; stat.mental += 2
* Du temps de jeu. Je m\xE9rite d'\xEAtre titulaire. #ambition
  test stat.statut + stat.confiance / 3 vs 55
  si reussite
    moreau: \u2026C'est ce que j'aime entendre. Prouve-le samedi.
    ~ rel.moreau += 3; stat.statut += 5
  sinon
    moreau (colere): M\xE9riter ? Tu ne m\xE9rites rien. Tu gagnes ta place ou tu la perds.
    ~ rel.moreau -= 5
* Rien. Je fais mon truc.
  ~ rel.moreau -= 6
  moreau: Alors fais-le bien.`,title:"Le point avec le coach",when:"temps.semaine >= 3",chapters:["ch1"],priority:50,once:!0},{id:"ch1_recruteur",trigger:"tick_start",script:`!lieu couloir 214
!placer moi 250 gauche
> Un homme en doudoune rouge t'attend pr\xE8s du distributeur. Logo de l'Olympique Marvaux sur la poitrine.
> \xAB Recruteur. Je t'ai vu jouer. Marvaux cherche des gar\xE7ons comme toi pour son centre. Meilleures installations, meilleure prime de signature. \xBB
> \xAB R\xE9fl\xE9chis. Si Rivemont ne te garde pas\u2026 ou m\xEAme s'il te garde, d'ailleurs. Voil\xE0 ma carte. \xBB
* Prendre la carte #ambition
  ~ var.carte_marvaux = vrai
  > Tu glisses la carte dans ta poche. Elle p\xE8se \xE9trangement lourd.
* Refuser poliment : \xAB Rivemont m'a donn\xE9 ma chance. \xBB #loyal
  ~ var.loyal_rivemont = vrai; stat.reputation += 1
  > L'homme hausse les \xE9paules. \xAB La loyaut\xE9, \xE7a ne paie pas toujours, petit. \xBB
  ~ souvenir(moreau, loyaute, "Tu as refus\xE9 l'approche de Marvaux par loyaut\xE9")`,title:"Un inconnu en tribune",when:"temps.semaine >= 4 et temps.semaine <= 6 et stat.reputation >= 12",chapters:["ch1"],priority:40,once:!0,chance:70},{id:"ch1_duel_lucas",trigger:"enter:terrain",script:`~ var.entraine = vrai; var.duel_moi = 0; var.duel_lucas = 0; var.duel_manche = 0
!placer moreau 300 gauche
!placer lucas 430 gauche
!placer moi 390 droite
moreau: La finale de la Coupe des Espoirs approche. Il me faut un titulaire de plus.
moreau: Ferrand, {joueur.nom}. Un contre un, trois manches. Le meilleur d\xE9marre la finale.
lucas (fier): Pr\xE9pare-toi \xE0 pleurer.
[mem.lucas.humiliation] lucas (colere): Et cette fois, pas de plateau pour te sauver.
!equipe chasubles orange #ffffff #25222b orange
!ballon pied moi
-> manche

@manche
~ var.duel_manche += 1
> Manche {var.duel_manche} sur 3. Toi {var.duel_moi} \u2013 {var.duel_lucas} Lucas.
+ Jouer en puissance #physique
  test stat.physique + stat.forme / 6 vs 54
  si reussite
    !courir moi +40
    > \xC9paule contre \xE9paule, tu fais c\xE9der Lucas.
    ~ var.duel_moi += 1
  sinon
    !anim lucas tacle
    > Lucas tient bon et te pique le ballon.
    ~ var.duel_lucas += 1
+ Jouer en finesse #technique
  test (joueur.poste == "defenseur" ? stat.defense : stat.technique) + stat.forme / 6 vs 56
  si reussite
    > Un geste propre, pr\xE9cis. Lucas est battu.
    ~ var.duel_moi += 1
  sinon
    > Trop appliqu\xE9. Lucas anticipe.
    ~ var.duel_lucas += 1
+ Jouer avec la t\xEAte #mental
  test stat.mental + stat.confiance / 4 vs 52
  si reussite
    > Tu attends sa faute. Il s'\xE9nerve, se jette\u2026 et tu en profites.
    ~ var.duel_moi += 1
  sinon
    > Tu r\xE9fl\xE9chis une seconde de trop.
    ~ var.duel_lucas += 1
[var.duel_manche < 3] -> manche
!ballon cacher
si var.duel_moi > var.duel_lucas
  ~ var.titulaire_coupe = vrai; stat.statut += 10; stat.confiance += 6; rel.lucas -= 8
  moreau: {joueur.nom} d\xE9marre la finale. Ferrand, sur le banc.
  lucas (colere): C'est pas fini.
  * Lui tendre la main #fairplay
    ~ rel.lucas += 12
    > Lucas regarde ta main longtemps. Puis il la serre, du bout des doigts.
    lucas: \u2026T'as bien jou\xE9. \xC7a m'arrache la bouche de le dire.
  * Le chambrer : \xAB Bien essay\xE9. \xBB #provoc
    ~ rel.lucas -= 12
    ~ souvenir(lucas, chambrage, "Tu l'as chambr\xE9 apr\xE8s le duel")
sinon
  ~ stat.statut -= 4; stat.confiance -= 5; rel.lucas += 5
  moreau: Ferrand d\xE9marre. {joueur.nom}, tu seras le premier rempla\xE7ant. Sois pr\xEAt.
  lucas (fier): La classe, \xE7a ne s'apprend pas.`,title:"Le duel",when:"temps.semaine >= 5 et temps.semaine <= 6",chapters:["ch1"],priority:95,once:!0},{id:"ch1_examens",trigger:"tick_start",script:`!lieu salle_cours 200
> Examens blancs du bac. Trois heures de sciences, deux de fran\xE7ais.
[rel.ines >= 15] !placer ines 232 gauche
[rel.ines >= 15] ines: Respire. Tu sais plus de choses que tu ne le crois.
test stat.etudes vs 45
si reussite
  > Tu rends ta copie avec un sentiment \xE9trange : tu as compris ce que tu \xE9crivais.
  ~ stat.etudes += 6; rel.maman += 3
  [var.promesse_bac] ~ souvenir(maman, examens, "Tes bonnes notes aux examens blancs")
sinon
  > Tu bloques sur la moiti\xE9 des questions. Ta m\xE8re va recevoir le bulletin.
  ~ stat.moral -= 6; rel.maman -= 3
  [var.promesse_bac] maman (inquiet): Tu m'avais promis, tu te souviens ?`,title:"Les examens blancs",when:"temps.semaine == 6",chapters:["ch1"],priority:60,once:!0},{id:"ch1_finale_coupe",trigger:"tick_end",script:`~ var.match_joue = vrai; var.stade_taille = 2; var.score_nous = 0; var.score_eux = 0; var.minute = 0; var.note_match = 6
~ var.adversaire = "Olympique Marvaux U17"; var.adv_court = "OM"; var.adv_couleur = "#d63c3c"
!lieu stade 320 nuit
!equipe nous {var.club_couleur} {var.club_couleur2} #ffffff {var.club_couleur}
!equipe eux #d63c3c #ffffff #ffffff #d63c3c
!fx foule 0.7
> Finale de la Coupe des Espoirs. Trois mille personnes, des recruteurs plein les tribunes, et l'Olympique Marvaux en face.
~ var.titulaire = var.titulaire_coupe ou stat.statut >= 48
si var.titulaire
  > Tu es titulaire.
sinon
  > Tu commences sur le banc. Moreau te fait signe : tu entreras \xE0 l'heure de jeu.
[var.djibril_au_match] > Dans un coin de la tribune, tu reconnais Djibril, en doudoune, qui agite un drapeau du club\u2026 \xE0 l'envers.
!son sifflet
si var.titulaire
  ~ var.minute = 28
  !preset milieu
  > {var.minute}e minute. Le ballon te parvient \xE0 trente m\xE8tres du but.
  * Frappe lointaine #frappe
    test stat.frappe + stat.forme / 5 vs 60
    !anim moi frappe
    !son frappe
    si reussite
      !ballon vers but tir
      !fx filet
      !son but
      !titre BUT !
      ~ var.score_nous += 1; var.buts += 1; var.note_match += 1.2; stat.confiance += 5
      > Lucarne ! Le stade explose.
    sinon
      !ballon vers dessus tir
      ~ var.note_match -= 0.3
      > Au-dessus.
  * Jouer simple et d\xE9caler #collectif
    test stat.passe vs 48
    !ballon vers co1 passe
    si reussite
      ~ var.note_match += 0.5; rel.moreau += 2
      > Le jeu respire. Rivemont prend le contr\xF4le du match.
    sinon
      ~ var.note_match -= 0.2
      > La passe est intercept\xE9e.
!preset defense
~ var.minute = 52
> {var.minute}e minute. Contre-attaque de Marvaux\u2026
!ballon vers but_gauche tir
!fx filet
~ var.score_eux += 1
> But de Marvaux. {var.club_court} {var.score_nous}\u2013{var.score_eux}.
[non var.titulaire] > Moreau se tourne vers le banc. \xAB {joueur.nom}, \xE9chauff\xE9 ? Tu entres. \xBB
[non var.titulaire] ~ var.titulaire = vrai
~ var.minute = 71
!preset attaque
!placer karim 330 droite 2
!ballon pied karim
> {var.minute}e minute. Karim r\xE9cup\xE8re le ballon sur l'aile gauche.
si mem.karim.couvert ou mem.karim.accompagne
  !rappel karim.{mem.karim.accompagne ? "accompagne" : "couvert"}
  karim (content): {joueur.nom} ! Je t'avais dit que je te revaudrais \xE7a !
  > Il ignore Lucas, pourtant d\xE9marqu\xE9, et te glisse le ballon dans la course.
  !ballon vers moi passe
  ~ var.bonus_karim = 14
  -> occasion
sinon si mem.karim.trahison ou mem.karim.refus
  !rappel karim.{mem.karim.trahison ? "trahison" : "refus"}
  > Tu es seul au point de penalty. Karim te voit. Il te regarde une seconde\u2026 et sert Lucas.
  !placer lucas 520 droite 1
  !ballon vers lucas passe
  -> lucas_frappe
sinon
  > Karim l\xE8ve la t\xEAte et centre au hasard dans la surface.
  !ballon vers moi centre
  ~ var.bonus_karim = 0
  -> occasion

@occasion
* Frapper du premier coup #frappe
  test stat.frappe + var.bonus_karim + stat.forme / 6 vs 60
  !anim moi frappe
  !son frappe
  si reussite
    !ballon vers but tir
    -> egalisation
  sinon
    !anim gk plongeon
    !ballon vers gk tir
    > Le gardien sort le grand jeu.
    ~ var.note_match -= 0.3
    -> fin_match
* Contr\xF4ler et dribbler le gardien #technique
  test stat.technique + var.bonus_karim + stat.confiance / 6 vs 62
  si reussite
    !courir moi 570
    !anim gk plongeon
    !ballon vers but passe
    -> egalisation
  sinon
    !anim gk plongeon
    !ballon vers gk passe
    ~ var.note_match -= 0.4
    > Le gardien plonge dans tes pieds.
    -> fin_match
* [var.lucas_club == rivemont] Remiser pour Lucas, mieux plac\xE9 #collectif
  !placer lucas 540 droite 1
  !ballon vers lucas passe
  ~ rel.lucas += 12; var.note_match += 0.6
  ~ souvenir(lucas, passe_finale, "Tu lui as offert l'\xE9galisation en finale")
  test 55 vs 50
  si reussite
    !anim lucas frappe
    !ballon vers but tir
    -> egalisation
  sinon
    !anim lucas frappe
    !ballon vers dessus tir
    > Lucas croque. Il se prend la t\xEAte \xE0 deux mains.
    -> fin_match

@lucas_frappe
!anim lucas frappe
!son frappe
test 50 vs 50
si reussite
  !ballon vers but tir
  !fx filet
  !son but
  ~ var.score_nous += 1
  > Lucas \xE9galise. Il court vers le virage sans te regarder.
  -> fin_match
sinon
  !ballon vers dessus tir
  > Lucas tire dans les nuages.
  -> fin_match

@egalisation
!fx filet
!son but
!fx foule 1
!titre BUT !
!anim moi joie
~ var.score_nous += 1; var.note_match += 1.3; stat.confiance += 5
[var.bonus_karim > 0] ~ var.buts += 1
[var.bonus_karim > 0] ~ rel.karim += 6
> {var.club_court} {var.score_nous}\u2013{var.score_eux} !
-> fin_match

@fin_match
~ var.minute = 90
!fx foule 0.6
si var.score_nous == var.score_eux
  > \xC9galit\xE9 au coup de sifflet final. Tirs au but.
  !preset penalty
  > Quatre tirs partout. Moreau te d\xE9signe pour le cinqui\xE8me.
  * Placer en force, c\xF4t\xE9 ouvert #frappe
    test stat.frappe + stat.mental / 3 vs 66
    !anim moi frappe
    !son frappe
    si reussite
      !ballon vers but tir
      ~ var.score_nous += 1
    sinon
      !anim gk plongeon
      !ballon vers gk tir
  * Panenka, au milieu #artiste
    test stat.technique + stat.confiance / 2 vs 74
    !anim moi passe
    si reussite
      !ballon vers but lob
      ~ var.score_nous += 1; stat.notoriete += 3
    sinon
      !ballon vers gk lob
      ~ stat.confiance -= 8
      > Le gardien n'a m\xEAme pas boug\xE9. Il cueille le ballon. Humiliation.
  * Attendre le plongeon du gardien #mental
    test stat.mental + stat.confiance / 3 vs 64
    !anim moi passe
    si reussite
      !anim gk plongeon
      !ballon vers but passe
      ~ var.score_nous += 1
    sinon
      !ballon vers gk passe
si var.score_nous > var.score_eux
  !fx confettis
  !fx foule 1
  !son but
  !titre VICTOIRE !
  !anim moi joie boucle
  > Rivemont remporte la Coupe des Espoirs !
  ~ var.coupe_espoirs = vrai; var.trophees += 1; stat.reputation += 8; stat.statut += 8; stat.moral += 15; rel.moreau += 6
  ~ actu("Coupe des Espoirs : Rivemont l'emporte face \xE0 Marvaux !")
sinon
  !anim moi triste
  > D\xE9faite en finale. Les joueurs de Marvaux dansent devant leur tribune.
  ~ stat.moral -= 10; stat.reputation += 2
~ var.matchs += 1; var.notes_total += var.note_match
!anim moi idle
!fx foule 0.3`,title:"Finale de la Coupe des Espoirs",when:"temps.semaine == 7",chapters:["ch1"],priority:85,once:!0},{id:"ch1_verdict",trigger:"chapter_end",script:`!lieu bureau_moreau 120 jour
~ var.note_saison = stat.statut + rel.moreau / 2 + (stat.technique + stat.frappe + stat.passe + stat.defense + stat.physique + stat.mental) / 12 + stat.discipline / 5 + (var.coupe_espoirs ? 10 : 0)
moreau: Assieds-toi. C'est la fin de la saison. Tu sais pourquoi tu es l\xE0.
[var.karim_denonce] moreau: Pour Benali\u2026 il quitte le centre. Il a perdu le go\xFBt, apr\xE8s cette histoire. Je voulais que tu le saches.
[var.karim_denonce] ~ var.karim_renvoye = vrai; var.karim_club = "aucun"
si var.note_saison >= 70
  moreau (content): Le club te propose un contrat stagiaire professionnel. Trois ans.
  ~ objectifReussi(contrat)
  [mem.moreau.loyaute] !rappel moreau.loyaute
  [mem.moreau.loyaute] moreau: Et je sais que tu as dit non \xE0 Marvaux. \xC7a compte, pour moi.
  [mem.moreau.loyaute] ~ rel.moreau += 6
  * Signer sans h\xE9siter #loyal #cle
    ~ var.loyal_rivemont = vrai; rel.moreau += 5
    ~ souvenir(moreau, signature, "Tu as sign\xE9 ton premier contrat \xE0 Rivemont")
    moreau: Bienvenue chez les grands. Le plus dur commence.
  * [var.carte_marvaux] Appeler Marvaux pour faire monter les ench\xE8res #ambition #cle
    ~ var.loyal_rivemont = faux; rel.moreau -= 12; stat.argent += 3000
    ~ souvenir(moreau, chantage, "Tu as utilis\xE9 l'offre de Marvaux pour n\xE9gocier")
    moreau (colere): Tu crois que je ne sais pas qui t'a appel\xE9 ? \u2026Le pr\xE9sident a accept\xE9 d'augmenter ta prime. Moi, je n'oublierai pas.
  * [var.carte_marvaux] Rejoindre l'Olympique Marvaux #ambition #cle
    ~ var.club = "Olympique Marvaux"; var.club_id = "marvaux"; var.club_court = "OM"; var.club_couleur = "#d63c3c"; var.club_couleur2 = "#ffffff"; var.loyal_rivemont = faux; var.stade_nom = "V\xE9lodrome des Pins"; rel.moreau -= 25; stat.argent += 8000
    ~ souvenir(moreau, depart, "Tu as quitt\xE9 Rivemont pour l'ennemi jur\xE9, Marvaux")
    moreau (triste): Marvaux. \xC9videmment. Bonne chance, alors.
sinon si var.note_saison >= 52 et var.carte_marvaux
  moreau: Le club ne te propose pas de contrat. Je suis d\xE9sol\xE9.
  > En sortant, tu retrouves la carte du recruteur de Marvaux dans ta poche.
  * Appeler Marvaux #ambition #cle
    ~ var.club = "Olympique Marvaux"; var.club_id = "marvaux"; var.club_court = "OM"; var.club_couleur = "#d63c3c"; var.club_couleur2 = "#ffffff"; var.loyal_rivemont = faux; var.stade_nom = "V\xE9lodrome des Pins"; stat.argent += 2000
    > Marvaux accepte de te prendre \xE0 l'essai. Tu signes un contrat stagiaire.
  * Rejoindre le FC Valmont, en National 3 #humble #cle
    ~ var.club = "FC Valmont"; var.club_id = "valmont"; var.club_court = "FCV"; var.club_couleur = "#2f9a4c"; var.club_couleur2 = "#ffffff"; var.stade_nom = "Stade Municipal de Valmont"; var.chemin_amateur = vrai
sinon
  moreau (triste): Le club ne te propose pas de contrat. Tu as des qualit\xE9s, mais pas encore le niveau. Je suis d\xE9sol\xE9.
  ~ objectifEchoue(contrat)
  moreau: J'ai un ami, Patrick Gomis, qui entra\xEEne le FC Valmont en National 3. Si tu veux continuer, je l'appelle.
  * Accepter : repartir d'en bas #humble #cle
    ~ var.club = "FC Valmont"; var.club_id = "valmont"; var.club_court = "FCV"; var.club_couleur = "#2f9a4c"; var.club_couleur2 = "#ffffff"; var.stade_nom = "Stade Municipal de Valmont"; var.chemin_amateur = vrai; rel.moreau += 6
    ~ souvenir(moreau, valmont, "Il t'a recommand\xE9 au FC Valmont quand le club ne t'a pas gard\xE9")
    moreau: Bien. Le chemin est plus long, mais il existe.
  * [var.promesse_bac ou stat.etudes >= 50] Arr\xEAter le foot et te consacrer aux \xE9tudes #cle
    ~ var.arret_foot = vrai
    moreau (pensif): C'est peut-\xEAtre la d\xE9cision la plus courageuse que j'aie entendue dans ce bureau.
    ~ fin("une_autre_vie")
  * Rentrer au quartier sans rien dire \xE0 personne #cle
    ~ var.arret_foot = vrai
    ~ fin("le_quartier")`,title:"Le verdict",chapters:["ch1"],priority:100,once:!0},{id:"ch2_debut",trigger:"chapter_start",script:`> Deux ans ont pass\xE9.
~ var.bac = stat.etudes >= 55
si var.bac
  > Tu as obtenu ton bac{stat.etudes >= 72 ? ", avec mention" : ""}.
  [var.promesse_bac] !rappel maman.promesse
  [var.promesse_bac] > Ta m\xE8re a pleur\xE9 au t\xE9l\xE9phone. Elle a fait encadrer le dipl\xF4me.
  [var.promesse_bac] ~ rel.maman += 10
sinon
  > Le bac, tu l'as rat\xE9.
  [var.promesse_bac] !rappel maman.promesse
  [var.promesse_bac] > Ta m\xE8re n'a rien dit. C'\xE9tait pire que des cris.
  [var.promesse_bac] ~ rel.maman -= 12
~ stat.technique += 6; stat.frappe += 5; stat.passe += 5; stat.defense += 4; stat.physique += 8; stat.mental += 5
~ stat.technique += stat.discipline >= 60 ? 3 : 0; stat.physique += stat.discipline >= 60 ? 3 : 0
~ stat.energie = 100; stat.forme = 55
~ eloigner(maman, rel.maman >= 60 ? 3 : 10); eloigner(karim, rel.karim >= 50 ? 2 : 10); eloigner(djibril, rel.djibril >= 40 ? 2 : 8); eloigner(yanis, var.yanis_protege >= 2 ? 2 : 8)
si var.club_id == rivemont
  appel club_rivemont
  ~ var.salaire = 1200; stat.statut = 32; var.niveau = "Pro"
  > Contrat stagiaire pro au Stade Rivemont. Tu t'entra\xEEnes avec l'\xE9quipe premi\xE8re, o\xF9 Didier Moreau vient d'\xEAtre nomm\xE9 entra\xEEneur.
sinon si var.club_id == marvaux
  appel club_marvaux
  ~ var.salaire = 1600; stat.statut = 30
  > Tu as rejoint l'Olympique Marvaux. Meilleures installations, plus gros salaire\u2026 et des supporters de Rivemont qui t'ont rebaptis\xE9 \xAB le tra\xEEtre \xBB.
sinon
  appel club_valmont
  ~ var.salaire = 350; stat.statut = 55
  > Tu joues au FC Valmont, en National 3. La semaine, tu travailles dans un magasin de sport. Le soir, tu t'entra\xEEnes sous les ordres de Patrick Gomis.
si non var.karim_renvoye
  si var.karim_couvert ou var.karim_accompagne
    ~ var.karim_club = "rivemont"
    > Karim a sign\xE9 pro au Stade Rivemont.{var.club_id == rivemont ? " Vous partagez toujours le m\xEAme vestiaire." : ""}
  sinon
    ~ var.karim_club = "valmont"
    > Karim n'a pas \xE9t\xE9 conserv\xE9 par Rivemont. Il joue maintenant au FC Valmont, en amateur.
    [var.club_id == valmont] > Votre premier entra\xEEnement ensemble a \xE9t\xE9\u2026 glacial.
~ var.lucas_club = "rivemont"
> Lucas Ferrand, lui, a sign\xE9 pro au Stade Rivemont. \xC9videmment.
~ objectif(titulaire, "Gagner ta place de titulaire")
!lieu {var.club_id == valmont ? "quartier" : "ville"} 300 jour`,title:"Deux ans plus tard",chapters:["ch2"],priority:100,once:!0},{id:"ch2_agents",trigger:"tick_start",script:`!lieu ville 300 jour
!placer santini 344 gauche
> Une berline s'arr\xEAte \xE0 ta hauteur. Un homme en costume cr\xE8me en sort, lunettes de soleil sur le nez.
santini (content): Mon champion ! Marco Santini. J'ai n\xE9goci\xE9 trois des dix plus gros transferts de l'histoire. Avec moi, dans trois ans, tu gagnes en une semaine ce que ta m\xE8re gagne en dix ans.
!entrer lambert gauche 262
lambert: Bonjour. Sophie Lambert. Pardon de m'imposer : j'ai cru comprendre que vous cherchiez un agent.
lambert: Je n'ai que six joueurs. Tous jouent encore, tous ont fini leurs \xE9tudes ou presque. Je ne promets pas des millions. Je promets des carri\xE8res longues.
santini (moqueur): Des carri\xE8res longues\u2026 et pauvres.
~ rencontrer(santini); rencontrer(lambert)
* Signer avec Marco Santini #ambition #cle
  ~ var.agent = "santini"; var.agent_nom = "Santini & Associ\xE9s"; rel.santini += 20; stat.argent += 5000
  ~ souvenir(santini, signature, "Tu as sign\xE9 avec lui \xE0 18 ans")
  santini (fier): Excellent choix ! Voil\xE0 une petite avance pour f\xEAter \xE7a.
* Signer avec Sophie Lambert #prudent #cle
  ~ var.agent = "lambert"; var.agent_nom = "Lambert Conseil"; rel.lambert += 20
  ~ souvenir(lambert, signature, "Tu l'as choisie \xE0 18 ans, plut\xF4t que Santini")
  lambert: Merci de votre confiance. On avance pas \xE0 pas.
* [rel.maman >= 40] Laisser ta m\xE8re g\xE9rer tes contrats #famille
  ~ var.agent = ""; rel.maman += 10
  > Ta m\xE8re \xE9clate de rire au t\xE9l\xE9phone. Puis elle accepte, tr\xE8s s\xE9rieusement.
* Personne pour l'instant
  ~ var.agent = ""
  santini: Tu reviendras. Ils reviennent tous.`,title:"Les agents",when:"var.club_id != valmont",chapters:["ch2"],priority:80,once:!0},{id:"ch2_keller_tradition",trigger:"enter:vestiaire",script:`!placer keller 200 gauche
!placer moi 160 droite
keller: C'est toi, le gamin du centre ? Thomas Keller. Capitaine.
~ rencontrer(keller)
keller: Ici, les jeunes portent les sacs de ballons, ramassent les plots et chantent devant tout le monde au premier repas. C'est la tradition.
* Accepter avec le sourire #humble
  ~ rel.keller += 12; stat.statut += 3
  > Le soir m\xEAme, tu chantes un vieux tube devant trente joueurs hilares.
  keller (rire): Tu chantes comme une casserole. Mais t'as du cran.
  ~ souvenir(keller, chanson, "Tu as accept\xE9 la tradition sans broncher")
* Refuser : \xAB Je suis l\xE0 pour jouer, pas pour porter des sacs. \xBB #fier
  ~ rel.keller -= 15; stat.confiance += 3
  keller (colere): Comme tu veux, petit. On verra combien de temps tu tiens.
  ~ souvenir(keller, refus, "Tu as refus\xE9 la tradition des jeunes")
* N\xE9gocier : porter les sacs, mais ne pas chanter #malin
  test stat.mental + stat.confiance / 4 vs 52
  si reussite
    keller: \u2026Ha. Un n\xE9gociateur. D'accord. Mais tu porteras les sacs pendant un an.
    ~ rel.keller += 5
  sinon
    keller: Ici, on ne n\xE9gocie pas avec le capitaine. Tu chanteras deux fois.
    ~ rel.keller -= 3`,title:"Le capitaine",when:"var.club_id == rivemont",chapters:["ch2"],priority:70,once:!0},{id:"ch2_premier_salaire",trigger:"tick_start",script:`!lieu appartement 200 soir
> Ton premier vrai salaire vient de tomber, avec la prime de signature. Plus d'argent que ta m\xE8re n'en gagne en six mois.
~ stat.argent += 4000
* Aider maman \xE0 quitter la cit\xE9 des Tilleuls #famille #cle
  ~ stat.argent -= 3500; rel.maman += 15; rel.yanis += 10; var.maman_demenagee = vrai; var.yanis_protege += 1
  ~ souvenir(maman, demenagement, "Tu l'as aid\xE9e \xE0 quitter la cit\xE9 des Tilleuls")
  > Au t\xE9l\xE9phone, ta m\xE8re ne parvient pas \xE0 finir ses phrases.
* T'offrir une voiture de sport #flambeur #cle
  ~ stat.argent -= 3800; stat.notoriete += 4; stat.moral += 8; var.voiture = vrai; rel.maman -= 4
  > Rouge, bruyante, magnifique. Ta m\xE8re a vu la photo sur les r\xE9seaux. Elle n'a rien dit.
* Pr\xEAter de l'argent \xE0 Djibril pour son \xAB projet \xBB #ami
  ~ stat.argent -= 3000; rel.djibril += 15; var.pret_djibril = vrai
  > Djibril t'envoie un message : \xAB Je te le rends au centuple, fr\xE8re. Tu verras. \xBB
* Tout mettre de c\xF4t\xE9 #prudent
  ~ stat.discipline += 3
  > Tu ouvres un livret d'\xE9pargne. Un jour, tu seras content de l'avoir fait.`,title:"Le premier salaire",when:"temps.semaine == 2 et var.salaire >= 1000",chapters:["ch2"],priority:75,once:!0},{id:"ch2_debut_pro",trigger:"tick_end",script:`~ var.match_joue = vrai; var.score_nous = 0; var.score_eux = 1; var.minute = 74; var.note_match = 6
~ var.adversaire = "Paris \xC9toile FC"; var.adv_court = "PEF"; var.adv_couleur = "#1d2f5e"; var.stade_taille = 3
!lieu stade 320 nuit
!equipe nous {var.club_couleur} {var.club_couleur2} #ffffff {var.club_couleur}
!equipe eux #1d2f5e #d63c3c #ffffff #1d2f5e
!fx foule 0.8
> Premi\xE8re division. Vingt-cinq mille spectateurs. Paris \xC9toile m\xE8ne 1\u20130. 74e minute.
[var.club_id == rivemont] moreau: {joueur.nom}. \xC9chauff\xE9 ? Tu entres. Montre-leur.
[var.club_id != rivemont] hansen: Tu entres. Sans peur.
!son sifflet
> Tu poses le pied sur la pelouse. Tes jambes tremblent.
[var.club_id == rivemont et rel.keller >= 10] keller: Respire, petit. Un ballon \xE0 la fois.
~ var.matchs += 1
!preset attaque
~ var.minute = 81
> {var.minute}e minute. Premier ballon dans tes pieds.
* Jouer simple : une passe, un appel #prudent
  test stat.passe vs 45
  !ballon vers co1 passe
  si reussite
    ~ var.note_match += 0.5; stat.confiance += 4
    > Propre. Le public applaudit poliment. Tu respires enfin.
  sinon
    ~ var.note_match -= 0.3
    > Passe rat\xE9e. Quelques sifflets.
* Tenter ta chance, frappe directe #ambition
  test stat.frappe + stat.confiance / 4 vs 64
  !anim moi frappe
  !son frappe
  si reussite
    !ballon vers but tir
    !fx filet
    !son but
    !fx foule 1
    !titre BUT !
    ~ var.score_nous += 1; var.buts += 1; var.note_match += 1.5; stat.reputation += 6; stat.notoriete += 6; stat.confiance += 8
    > Pour ton premier ballon en pro, tu \xE9galises ! Le stade est debout.
    ~ actu("Premier ballon, premier but : le jeune {joueur.nom} sauve {var.club} face \xE0 Paris \xC9toile !")
  sinon
    !ballon vers dessus tir
    ~ var.note_match -= 0.5
    > Ta frappe s'envole. En tribune de presse, quelqu'un \xE9crit \xAB pr\xE9cipit\xE9 \xBB.
* Dribbler le meilleur d\xE9fenseur du pays #artiste
  test stat.technique + stat.confiance / 4 vs 66
  si reussite
    !courir moi 470
    > Tu l'effaces d'un passement de jambes. Le stade rugit.
    ~ var.note_match += 1; stat.notoriete += 4; stat.reputation += 3
  sinon
    !anim def1 tacle
    > Il te prend le ballon comme on prend un bonbon \xE0 un enfant.
    ~ var.note_match -= 0.5; stat.confiance -= 4
!ballon cacher
!son sifflet
~ var.notes_total += var.note_match; stat.statut += arrondi((var.note_match - 6) * 4) + 3
> Coup de sifflet final. Tu es officiellement un joueur de premi\xE8re division.
!fx foule 0.3`,title:"Les d\xE9buts en premi\xE8re division",when:"var.club_id != valmont et temps.semaine >= 3 et (stat.statut >= 40 ou temps.semaine >= 5)",chapters:["ch2"],priority:80,once:!0},{id:"ch2_retrouvailles_ines",trigger:"enter:ville",script:`!placer ines 344 gauche
!placer moi 300 droite
ines (surpris): {joueur.nom} ? \xC7a alors ! Tu as grandi. Et on parle de toi dans le journal, maintenant.
ines: Moi, j'ai eu mon concours. Kin\xE9, deuxi\xE8me ann\xE9e. Je fais mon stage dans un centre de r\xE9\xE9ducation.
[var.bac] ines (content): Et ton bac ? \u2026Tu l'as eu ? Je savais que les maths finiraient par rentrer !
* L'inviter \xE0 d\xEEner au Phare #romance #cle
  test rel.ines + stat.confiance / 2 vs 30
  si reussite
    ines (content): \u2026D'accord. Mais c'est moi qui choisis le dessert.
    ~ var.rdv_ines = vrai; rel.ines += 10
    ~ planifier(ch2_diner_ines, 1)
  sinon
    ines: C'est gentil\u2026 mais je ne sais pas. On se recroisera ?
    ~ rel.ines += 2
* Lui proposer de rester en contact #ami
  ~ rel.ines += 5
  ines: Avec plaisir. Et si un jour tu te blesses, tu sais qui appeler.
* Pr\xE9texter un rendez-vous et filer
  ~ rel.ines -= 4
  ines (pensif): Ah. Bon. Bonne chance, alors, la star.`,title:"In\xE8s",when:"connu.ines",chapters:["ch2"],priority:55,once:!0},{id:"ch2_diner_ines",trigger:"scheduled",script:`!lieu restaurant 180 soir
!placer ines 230 gauche
!placer moi 190 droite
> Une table pr\xE8s de la fen\xEAtre. In\xE8s commande pour vous deux sans h\xE9siter.
ines: Alors, raconte. \xC7a fait quoi, d'entendre vingt mille personnes crier ton nom ?
* \xCAtre honn\xEAte : la pression, la peur de d\xE9cevoir #sincere
  ~ rel.ines += 12
  ines (emu): Merci de ne pas me faire le num\xE9ro de la star. C'est \xE7a que je pr\xE9f\xE8re, chez toi.
* Frimer : les filles, l'argent, la c\xE9l\xE9brit\xE9 #frime
  ~ rel.ines -= 8
  ines (pensif): \u2026D'accord. Je vois.
* Retourner la question et parler de ses \xE9tudes \xE0 elle #ecoute
  ~ rel.ines += 10
  ines (content): Personne ne me pose jamais la question.
si rel.ines >= 28
  > \xC0 la fin du repas, elle pose sa main sur la tienne.
  ines: On remet \xE7a ? Disons\u2026 tous les jeudis ?
  ~ var.couple = vrai
  ~ souvenir(ines, premier_diner, "Votre premier d\xEEner au Phare")
  ~ actu("In\xE8s et toi, c'est officiel.")
sinon
  ines: C'\xE9tait sympa. On s'appelle ?`,title:"D\xEEner au Phare"},{id:"ch2_karim_situation",trigger:"tick_start",script:`si var.karim_renvoye
  !lieu ville 300 soir
  > \xC0 la sortie d'un fast-food, tu croises Karim. Il porte un uniforme de livreur.
  !rappel karim.trahison
  > Il te reconna\xEEt. Il fait demi-tour sans un mot.
  ~ stat.moral -= 6
sinon si var.karim_club == var.club_id
  !lieu terrain 300
  !placer karim 340 gauche
  si rel.karim >= 30
    karim (content): Tu te rends compte ? Nous deux, pros. Comme on l'avait dit, dans notre chambre pourrie du centre.
    ~ rel.karim += 4
  sinon
    karim: Salut. \u2026Bon entra\xEEnement.
sinon
  > Karim t'envoie un message : \xAB Valmont a gagn\xE9 3\u20130. J'ai mis un doubl\xE9. Toujours l\xE0, toujours debout. \xBB
  * Le f\xE9liciter chaleureusement #ami
    ~ rel.karim += 8
    > \xAB Merci, fr\xE8re. \xC7a me touche. \xBB
  * Ne pas r\xE9pondre
    ~ rel.karim -= 6`,title:"Des nouvelles de Karim",when:"temps.semaine == 3",chapters:["ch2"],priority:60,once:!0},{id:"ch2_premiere_interview",trigger:"enter:salle_presse",script:`!placer clara 290 gauche
!placer moi 230 droite
clara: Clara Mend\xE8s, \xAB Ballon & Crampons \xBB. On dit que vous \xEAtes le grand espoir du club. Vous le pensez aussi ?
~ rencontrer(clara)
* \xAB Je suis l\xE0 pour travailler. Le reste, ce sont des mots. \xBB #humble
  ~ rel.clara += 6; stat.reputation += 2
  clara: R\xE9ponse sage. Rare, \xE0 votre \xE2ge.
* \xAB Dans deux ans, je serai le meilleur joueur du pays. \xBB #ambition
  ~ stat.notoriete += 6; rel.clara -= 2; stat.confiance += 4
  clara (pensif): Je le note. Je vous le ressortirai dans deux ans.
* [var.lucas_club == var.club_id] \xAB Lucas Ferrand ? Il joue gr\xE2ce au nom de son p\xE8re. \xBB #provoc #cle
  ~ stat.notoriete += 8; rel.lucas -= 20; rel.clara += 2; stat.discipline -= 3
  ~ souvenir(lucas, interview, "Tu l'as humili\xE9 dans la presse")
  clara (surpris): \u2026Vous savez que je vais publier \xE7a ?`,title:"Premi\xE8re interview",chapters:["ch2","ch3"],priority:60,once:!0},{id:"ch2_valmont_magasin",trigger:"tick_start",script:`!lieu ville 300 jour
> Ton patron au magasin de sport te demande de travailler le samedi matin\u2026 le jour du match.
* Accepter : la famille a besoin de cet argent #famille
  ~ stat.argent += 600; stat.energie -= 20; stat.forme -= 6; rel.gomis -= 4; rel.maman += 4
* Refuser : le foot passe avant #ambition
  ~ stat.discipline += 2; rel.gomis += 4
  > Ton patron grogne, puis c\xE8de.
* Demander \xE0 Gomis d'en parler \xE0 ton patron #debrouillard
  ~ rel.gomis += 6
  > Gomis passe au magasin avec un maillot d\xE9dicac\xE9 de toute l'\xE9quipe. Probl\xE8me r\xE9gl\xE9.`,title:"Le magasin de sport",when:"var.club_id == valmont et temps.semaine == 2",chapters:["ch2"],priority:70,once:!0},{id:"ch2_valmont_gomis",trigger:"talk:gomis",script:`gomis: Tu sais pourquoi je fais \xE7a, petit ? Chauffeur de bus le jour, entra\xEEneur le soir ?
gomis: Il y a dix ans, un gamin comme toi est pass\xE9 ici. Rejet\xE9 par tous les centres. Aujourd'hui, il joue en \xE9quipe nationale. Je veux revoir \xE7a une fois dans ma vie.
* Lui promettre de lui faire honneur #loyal
  ~ rel.gomis += 12; stat.moral += 6
  ~ souvenir(gomis, promesse, "Tu lui as promis de r\xE9ussir")
* Lui dire que tu ne resteras pas longtemps ici #ambition
  ~ rel.gomis -= 2; stat.confiance += 3
  gomis (rire): J'esp\xE8re bien ! C'est tout l'int\xE9r\xEAt.`,title:"Le discours de Gomis",chapters:["ch2","ch3"],priority:60,once:!0},{id:"ch2_bilan",trigger:"chapter_end",script:`si var.club_id == valmont
  !lieu quartier 400 soir
  si stat.reputation >= 20 ou var.buts >= 5
    > Ton t\xE9l\xE9phone sonne. Le FC Lanvaux, en deuxi\xE8me division, te propose un contrat professionnel.
    [rel.moreau >= 12 et stat.reputation >= 28] > Second appel : Didier Moreau. \xAB Le Stade Rivemont veut te r\xE9cup\xE9rer. Moi aussi. \xBB
    * Signer \xE0 Lanvaux, en D2 #ambition
      ~ var.prochain_club = "lanvaux"
    * [rel.moreau >= 12 et stat.reputation >= 28] Revenir au Stade Rivemont #loyal #cle
      ~ var.prochain_club = "rivemont"; rel.moreau += 8; var.retour_rivemont = vrai; var.loyal_rivemont = vrai
      !rappel moreau.valmont
      ~ souvenir(moreau, retour, "Il t'a fait revenir \xE0 Rivemont apr\xE8s Valmont")
    * Rester \xE0 Valmont avec Gomis #loyal
      ~ var.prochain_club = "valmont"; rel.gomis += 15
      [mem.gomis.promesse] !rappel gomis.promesse
  sinon
    > Une saison correcte \xE0 Valmont. Personne n'appelle. Gomis te pose la main sur l'\xE9paule : \xAB La saison prochaine, petit. \xBB
    ~ var.prochain_club = "valmont"
sinon
  !lieu couloir 300
  si stat.statut >= 50
    > Fin de saison. Tu as gagn\xE9 ta place dans le groupe pro.
    ~ objectifReussi(titulaire); var.prochain_club = var.club_id
  sinon
    > Fin de saison. Le club te propose un pr\xEAt d'un an au FC Lanvaux, en D2, pour gagner du temps de jeu.
    * Accepter le pr\xEAt #humble
      ~ var.prochain_club = var.club_id; var.pret = vrai
      > Une saison en D2, loin des projecteurs. Tu y apprendras beaucoup.
    * Refuser et te battre pour ta place #ambition
      ~ var.prochain_club = var.club_id; stat.confiance += 4`,title:"Fin de saison",chapters:["ch2"],priority:100,once:!0},{id:"ch3_debut",trigger:"chapter_start",script:`> Trois ans ont pass\xE9.
~ stat.technique += 6; stat.frappe += 6; stat.passe += 6; stat.defense += 5; stat.physique += 6; stat.mental += 7
~ stat.technique += stat.discipline >= 60 ? 3 : 0; stat.mental += stat.discipline >= 60 ? 2 : 0
~ stat.energie = 100; stat.forme = 60
~ eloigner(maman, rel.maman >= 60 ? 3 : 10); eloigner(karim, rel.karim >= 50 ? 2 : 10); eloigner(djibril, rel.djibril >= 40 ? 2 : 8); eloigner(yanis, var.yanis_protege >= 2 ? 2 : 8)
si var.prochain_club == lanvaux
  appel club_lanvaux
  ~ var.salaire = 2500; stat.statut = 62
  > Le FC Lanvaux, deuxi\xE8me division. Tu es titulaire indiscutable, et le public t'a adopt\xE9.
sinon si var.prochain_club == valmont
  appel club_valmont
  ~ var.salaire = 600; stat.statut = 72; var.ligue = "d3"
  > Toujours \xE0 Valmont, toujours au magasin le matin. Mais le club est mont\xE9 d'une division, gr\xE2ce \xE0 toi.
sinon si var.club_id == marvaux
  appel club_marvaux
  ~ var.salaire = 9000; stat.statut = max(stat.statut, 44)
  > Trois saisons \xE0 Marvaux. Le V\xE9lodrome des Pins scande ton nom les soirs de victoire.
sinon
  appel club_rivemont
  ~ var.salaire = var.retour_rivemont ? 5000 : 6500; stat.statut = max(stat.statut, 46)
  > Tu es d\xE9sormais un joueur qui compte au Stade Rivemont.
[var.pret] > Ton ann\xE9e de pr\xEAt \xE0 Lanvaux t'a endurci : temps de jeu, coups, terrains impossibles. Tu es revenu transform\xE9.
[var.pret] ~ stat.statut += 16; stat.mental += 4; stat.physique += 3
~ stat.reputation += 6
[var.club_id == rivemont et rel.keller >= 20] > Thomas Keller a pris sa retraite. Avant de partir, il t'a confi\xE9 son brassard d'entra\xEEnement \xAB pour les jours o\xF9 il faudra parler fort \xBB.
[var.club_id == rivemont et rel.keller >= 20] ~ var.heritier_keller = vrai
~ objectif(selection, "\xCAtre s\xE9lectionn\xE9 en \xE9quipe nationale")`,title:"Trois ans plus tard",chapters:["ch3"],priority:100,once:!0},{id:"ch3_derby",trigger:"tick_end",script:`~ var.match_joue = vrai; var.score_nous = 0; var.score_eux = 0; var.minute = 0; var.note_match = 6; var.stade_taille = 3
si var.club_id == rivemont
  ~ var.adversaire = "Olympique Marvaux"; var.adv_court = "OM"; var.adv_couleur = "#d63c3c"
sinon
  ~ var.adversaire = "Stade Rivemont"; var.adv_court = "SR"; var.adv_couleur = "#1f4e9c"
!lieu stade 320 nuit
!equipe nous {var.club_couleur} {var.club_couleur2} #ffffff {var.club_couleur}
!equipe eux {var.adv_couleur} #ffffff #ffffff {var.adv_couleur}
!fx foule 0.95
> Le derby. Quarante mille personnes, des fumig\xE8nes, des chants qui font trembler les tribunes.
[var.club_id == marvaux] > \xC0 chaque ballon que tu touches, la tribune de Rivemont siffle : \xAB Tra\xEEtre ! Tra\xEEtre ! \xBB
~ var.titularisations += 1; var.matchs += 1
~ var.minute = 34
!preset attaque
si var.lucas_club == rivemont et var.club_id == marvaux
  !placer lucas 444 gauche
  > {var.minute}e minute. Lucas Ferrand te fait face. Il te souffle : \xAB Ce soir, on r\xE8gle nos comptes. \xBB
  [mem.lucas.interview] !rappel lucas.interview
sinon si var.lucas_club == rivemont
  !placer lucas 452 droite 1
  > {var.minute}e minute. Lucas se d\xE9marque \xE0 c\xF4t\xE9 de toi.
  [rel.lucas <= -20] > Il ne t'a pas adress\xE9 la parole de la semaine.
sinon
  > {var.minute}e minute. Le ballon arrive dans tes pieds, aux abords de la surface.
* Frapper en force #frappe
  test stat.frappe + stat.forme / 5 vs 68
  !anim moi frappe
  !son frappe
  si reussite
    !ballon vers but tir
    !fx filet
    !son but
    !fx foule 1
    !titre BUT !
    ~ var.score_nous += 1; var.buts += 1; var.note_match += 1.4; stat.reputation += 4; stat.notoriete += 4
    > Le stade explose !
  sinon
    !ballon vers dessus tir
    ~ var.note_match -= 0.3
    > Au-dessus.
* [var.lucas_club == var.club_id] Servir Lucas #collectif
  !ballon vers lucas passe
  test 55 + rel.lucas / 5 vs 50
  si reussite
    !anim lucas frappe
    !ballon vers but tir
    !fx filet
    ~ var.score_nous += 1; var.passes_d += 1; var.note_match += 0.9; rel.lucas += 10
    > Lucas marque. Il court vers toi, h\xE9site\u2026 et te tape dans la main.
  sinon
    > Lucas manque le cadre.
* Provoquer un penalty en entrant dans la surface #malin
  test stat.technique + stat.mental / 4 vs 64
  si reussite
    !anim def1 tacle
    !anim moi chute
    > Penalty ! Tu te rel\xE8ves, tu prends le ballon, tu transformes.
    !ballon vers but tir
    !fx filet
    ~ var.score_nous += 1; var.buts += 1; var.note_match += 1.1
  sinon
    !anim moi chute
    > L'arbitre ne siffle rien. Carton jaune pour simulation.
    ~ var.note_match -= 0.6; var.cartons += 1
~ var.minute = 89
!preset defense
> {var.minute}e minute. Derni\xE8re attaque adverse.
!ballon vers but_gauche tir
si chance(45)
  !fx filet
  ~ var.score_eux += 1
  > But adverse dans les derniers instants.
sinon
  > Le poteau ! Le ballon ressort.
~ var.score_nous += poisson(0.6); var.score_eux += poisson(0.6)
!son sifflet
si var.score_nous > var.score_eux
  !fx confettis
  !anim moi joie boucle
  > Victoire dans le derby, {var.score_nous}\u2013{var.score_eux} ! La ville est \xE0 vous pour une semaine.
  ~ stat.moral += 12; stat.reputation += 5; stat.statut += 5
  [var.club_id == rivemont] ~ rel.vasseur += 8
sinon si var.score_nous == var.score_eux
  > Match nul, {var.score_nous}\u2013{var.score_eux}. Personne n'est content.
sinon
  !anim moi triste
  > D\xE9faite {var.score_nous}\u2013{var.score_eux}. La plus douloureuse de la saison.
  ~ stat.moral -= 10
~ var.notes_total += var.note_match
!anim moi idle
!ballon cacher
!fx foule 0.3`,title:"Le derby",when:"temps.semaine == 3 et (var.club_id == rivemont ou var.club_id == marvaux)",chapters:["ch3"],priority:80,once:!0},{id:"ch3_espoirs",trigger:"tick_start",script:`!son telephone
> Un num\xE9ro inconnu. \xAB Bonjour, ici le staff de l'\xE9quipe nationale Espoirs. Le s\xE9lectionneur Laurent Bastide suit vos performances. Vous \xEAtes convoqu\xE9 pour le prochain rassemblement. \xBB
~ var.selections_espoirs += 1; stat.reputation += 5; stat.confiance += 6; rel.maman += 4
~ rencontrer(bastide)
> Une semaine plus tard, tu marques ton premier but sous le maillot national, chez les Espoirs.
~ var.buts += 1; stat.notoriete += 4; stat.energie -= 15
* Envoyer le maillot \xE0 ta m\xE8re #famille
  ~ rel.maman += 8
  > Elle l'accroche dans l'entr\xE9e. Elle le montre \xE0 tous les voisins.
* L'offrir \xE0 Yanis #famille
  ~ rel.yanis += 10; var.yanis_protege += 1
  > Yanis dort avec, para\xEEt-il.
* Le garder pour toi #fier
  ~ stat.confiance += 3`,title:"L'appel des Espoirs",when:"stat.reputation >= 32",chapters:["ch3"],priority:65,once:!0},{id:"ch3_sponsor",trigger:"tick_start",script:`!lieu ville 300 jour
si var.agent == santini
  !placer santini 344 gauche
  santini (content): Champion ! Deux offres. Vortex, la marque de chaussures. Et PariMax, le site de paris en ligne. PariMax paie trois fois plus.
sinon si var.agent == lambert
  !placer lambert 344 gauche
  lambert: Deux propositions. Vortex, qui veut faire de vous l'image de sa nouvelle chaussure. Et PariMax, un site de paris sportifs. Je vous d\xE9conseille le second.
sinon
  > Deux marques te contactent directement : Vortex, l'\xE9quipementier, et PariMax, un site de paris sportifs.
* Signer avec Vortex #image
  ~ stat.argent += 40000; stat.notoriete += 6; var.sponsor = "vortex"; stat.reputation += 2
  > Ton visage sur des panneaux de quatre m\xE8tres. Yanis t'envoie des photos de chaque affiche qu'il croise.
* Signer avec PariMax (trois fois plus d'argent) #argent #cle
  ~ stat.argent += 120000; stat.notoriete += 4; var.sponsor = "parimax"; stat.reputation -= 3; rel.santini += 10; rel.lambert -= 10
  ~ souvenir(clara, parimax, "Ton contrat avec un site de paris sportifs")
  > Le ch\xE8que est \xE9norme. Quelques journalistes froncent les sourcils.
* Refuser les deux, rester discret #humble
  ~ stat.reputation += 1; rel.lambert += 4; rel.santini -= 8`,title:"Le contrat de sponsoring",when:"stat.reputation >= 26 et temps.semaine >= 2",chapters:["ch3"],priority:60,once:!0},{id:"ch3_karim_blessure",trigger:"tick_start",script:`!son telephone
> Un message de la m\xE8re de Karim : \xAB Karim s'est rompu les ligaments crois\xE9s \xE0 l'entra\xEEnement. Il ne veut voir personne. Peut-\xEAtre toi ? \xBB
* Aller le voir tout de suite, et revenir chaque semaine #loyal #cle
  ~ var.soutien_karim = vrai; rel.karim += 20; stat.energie -= 15; stat.statut -= 2
  ~ souvenir(karim, soutien, "Tu \xE9tais l\xE0 chaque semaine pendant sa r\xE9\xE9ducation")
  !lieu infirmerie 150
  !placer karim 190 gauche
  karim (triste): Neuf mois, ils disent. Peut-\xEAtre plus. Peut-\xEAtre jamais comme avant.
  moi: Alors on fera neuf mois ensemble. Un jour apr\xE8s l'autre.
  [mem.karim.couvert ou mem.karim.accompagne] karim (emu): Encore toi. Toujours toi.
* [stat.argent >= 30000] Lui payer le meilleur chirurgien du pays #genereux
  ~ stat.argent -= 30000; var.chirurgien_karim = vrai; rel.karim += 12
  > Karim t'appelle, la voix cass\xE9e. \xAB T'avais pas \xE0 faire \xE7a. \u2026Merci. \xBB
* Lui envoyer un message, sans plus
  ~ rel.karim += 2
  > \xAB Courage fr\xE9rot. \xBB Deux mots. Tu sais que ce n'est pas assez.
* Tu as trop de matchs en ce moment
  ~ rel.karim -= 12
  ~ souvenir(karim, absence, "Tu n'es jamais venu pendant sa blessure")`,title:"Le genou de Karim",when:"non var.karim_renvoye et temps.semaine >= 3",chapters:["ch3"],priority:70,once:!0},{id:"ch3_djibril_affaire",trigger:"enter:quartier",script:`!placer djibril 400 gauche
!placer moi 360 droite
djibril (content): Fr\xE8re ! J'ai un plan. Le plan de ma vie.
si var.pret_djibril
  djibril: Ton argent, je l'ai fait fructifier. Des montres, des sacs\u2026 qui arrivent par bateau. Pas de facture, pas de taxe. Tu vois ?
sinon
  djibril: Des montres, des sacs\u2026 qui arrivent par bateau. Pas de facture, pas de taxe. Il me manque juste un associ\xE9 avec un peu d'argent. Et un nom.
* Investir avec lui #argent #cle
  ~ var.affaire_djibril = vrai; stat.argent -= min(stat.argent, 20000); rel.djibril += 15
  ~ souvenir(djibril, associe, "Tu as investi dans son trafic")
  djibril (rire): Associ\xE9s ! Comme quand on avait dix ans !
* [stat.argent >= 15000 et rel.djibril >= 25] Lui proposer de monter une vraie marque de v\xEAtements, l\xE9gale, ensemble #ami #cle
  ~ var.affaire_djibril_legale = vrai; stat.argent -= 15000; rel.djibril += 20
  ~ souvenir(djibril, marque, "Tu l'as sorti des combines pour monter une vraie marque")
  djibril (pensif): Une vraie bo\xEEte ? Avec des papiers, un comptable et tout ? \u2026Pourquoi pas. Avec toi, pourquoi pas.
* Refuser et lui demander de laisser tomber ces combines #honnete
  ~ rel.djibril -= 10
  djibril (colere): T'as oubli\xE9 d'o\xF9 tu viens, toi.
  [var.pret_djibril] ~ stat.argent += 3000
  [var.pret_djibril] > Il te rend ton argent le lendemain, en liquide, sans un mot.
* Refuser, mais rester son ami #ami
  ~ rel.djibril -= 2
  djibril: Ok, ok. T'es une star maintenant, faut faire attention, je comprends.`,title:"Le projet de Djibril",when:"temps.semaine >= 2",chapters:["ch3"],priority:60,once:!0},{id:"ch3_yanis_police",trigger:"tick_start",script:`!son telephone
maman (inquiet): C'est Yanis. Il est au commissariat. Ils l'ont trouv\xE9 avec les grands du b\xE2timent D, dans une voiture vol\xE9e.
!lieu quartier 300 soir
* Tout l\xE2cher et y aller, m\xEAme si tu rates l'entra\xEEnement #famille #cle
  ~ var.yanis_protege += 2; rel.yanis += 15; rel.maman += 10; stat.statut -= 6
  ~ souvenir(yanis, commissariat, "Tu as tout l\xE2ch\xE9 pour venir le chercher au commissariat")
  !placer yanis 340 gauche
  yanis (triste): Je voulais juste qu'ils me respectent\u2026 comme ils te respectent toi.
  moi: Ils ne te respectent pas, Yanis. Ils t'utilisent. Moi, je te respecte.
  [mem.yanis.promesse] !rappel yanis.promesse
* Payer un avocat, mais rester avec l'\xE9quipe #argent
  ~ stat.argent -= min(stat.argent, 8000); var.yanis_protege += 1; rel.maman += 2; rel.yanis -= 4
  > L'avocat r\xE8gle l'affaire. Yanis t'envoie un message : \xAB Merci pour l'avocat. \xBB Juste \xE7a.
* Lui dire qu'il doit assumer ses actes #dur
  ~ var.yanis_neglige += 2; rel.yanis -= 15; rel.maman -= 8
  ~ souvenir(yanis, abandon, "Tu l'as laiss\xE9 seul au commissariat")
  maman (triste): C'est ton fr\xE8re\u2026`,title:"Un appel du commissariat",when:"var.yanis_neglige >= var.yanis_protege et temps.semaine >= 2",chapters:["ch3"],priority:72,once:!0},{id:"ch3_photos_boite",trigger:"activity:boite_nuit",script:`> Trois heures du matin. Un flash. Puis un autre.
!fx flashs
> Le lendemain, la photo fait la une des sites people : toi, debout sur une banquette, une bouteille \xE0 la main, la veille d'un match.
~ stat.reputation -= 6; stat.statut -= 8; stat.notoriete += 6; var.scandale += 1
[var.couple] ~ rel.ines -= 12
[var.couple] ines (colere): Tu m'avais dit que tu dormais t\xF4t. Tu me prends pour qui ?
~ souvenir(clara, photos, "Les photos de ta nuit au N\xE9on")
* Pr\xE9senter des excuses publiques #humble
  ~ stat.reputation += 3; stat.discipline += 3
* Ne rien dire et attendre que \xE7a passe
  ~ stat.discipline -= 2
* Attaquer les paparazzis sur les r\xE9seaux #impulsif
  ~ stat.notoriete += 4; stat.reputation -= 3`,title:"Les photos",when:"stat.notoriete >= 15",chapters:["ch3","ch4"],priority:60,once:!0},{id:"ch3_changement_poste",trigger:"talk:moreau",script:`moreau: J'ai besoin de toi ailleurs. Notre milieu d\xE9fensif est bless\xE9 pour trois mois. Tu as le volume, l'intelligence. Je veux t'y essayer.
[mem.moreau.signature] !rappel moreau.signature
* Accepter pour le bien de l'\xE9quipe #collectif #cle
  ~ rel.moreau += 10; stat.statut += 8; stat.defense += 4; stat.passe += 2; stat.notoriete -= 2
  ~ souvenir(moreau, sacrifice, "Tu as accept\xE9 de changer de poste pour l'\xE9quipe")
  moreau: Je savais que je pouvais compter sur toi.
* Refuser : tu veux jouer \xE0 ton poste #individuel
  ~ rel.moreau -= 8; stat.confiance += 3
  moreau (colere): Le poste, c'est moi qui le d\xE9cide. Mais bon. On fera sans toi, l\xE0-bas.
* Proposer un compromis : quelques matchs, puis retour \xE0 ton poste #malin
  ~ rel.moreau += 3; stat.statut += 3
  moreau: March\xE9 conclu.`,title:"Un nouveau r\xF4le",when:"var.club_id == rivemont",chapters:["ch3"],priority:55,once:!0},{id:"ch3_hansen_poste",trigger:"talk:hansen",script:`hansen: Je vais \xEAtre direct. Tu as du talent, mais tu joues pour toi. Ici, on joue pour le syst\xE8me.
* Promettre de te plier au syst\xE8me #collectif
  ~ rel.hansen += 10; stat.statut += 6
* D\xE9fendre ton style : \xAB Je fais gagner l'\xE9quipe \xE0 ma fa\xE7on. \xBB #individuel
  test stat.statut + stat.confiance / 3 vs 60
  si reussite
    hansen: \u2026Prouve-le. Je te laisse cinq matchs.
    ~ rel.hansen += 2; stat.confiance += 4
  sinon
    hansen: Banc, ce week-end. On reparlera de ta fa\xE7on.
    ~ rel.hansen -= 8; stat.statut -= 8`,title:"Les exigences du coach",chapters:["ch3","ch4"],priority:55,once:!0},{id:"ch3_ines_diplome",trigger:"tick_start",script:`!lieu restaurant 180 soir
!placer ines 230 gauche
!placer moi 190 droite
ines (content): J'ai mon dipl\xF4me. Kin\xE9sith\xE9rapeute. Officiellement.
* Lui proposer d'emm\xE9nager ensemble #romance #cle
  ~ var.vit_ensemble = vrai; rel.ines += 15; stat.moral += 10
  ~ souvenir(ines, emmenagement, "Tu lui as propos\xE9 de vivre ensemble le soir de son dipl\xF4me")
  ines (emu): \u2026Oui. \xC9videmment, oui.
* Lui offrir un cadeau somptueux #flambeur
  ~ stat.argent -= min(stat.argent, 5000); rel.ines += 5
  ines (pensif): C'est\u2026 beaucoup. Merci. J'aurais pr\xE9f\xE9r\xE9 du temps, mais merci.
* F\xEAter \xE7a avec ses amis \xE0 elle #ecoute
  ~ rel.ines += 10
  > Tu passes la soir\xE9e avec des \xE9tudiants en kin\xE9 qui te demandent des autographes pour leurs p\xE8res.`,title:"Le dipl\xF4me d'In\xE8s",when:"var.couple et temps.semaine >= 4",chapters:["ch3"],priority:60,once:!0},{id:"ch3_vasseur_prolongation",trigger:"talk:vasseur",script:`vasseur: Asseyez-vous. Je vais droit au but : je veux prolonger votre contrat. Cinq ans. Avec une clause de fid\xE9lit\xE9.
vasseur: Vous gagnez plus. Mais si vous partez avant la fin, vous laissez une partie de vos primes au club.
~ rencontrer(vasseur)
* Signer la prolongation avec la clause #loyal #cle
  ~ var.clause_fidelite = vrai; var.salaire += 3000; rel.vasseur += 15; var.loyal_rivemont = vrai
  ~ souvenir(vasseur, prolongation, "Tu as sign\xE9 une prolongation de cinq ans avec clause de fid\xE9lit\xE9")
  vasseur (content): Voil\xE0 un gar\xE7on qui comprend ce qu'est un club.
* Signer, mais sans clause #prudent
  ~ var.salaire += 1500; rel.vasseur += 4
* Refuser de prolonger pour garder tes options ouvertes #ambition
  ~ rel.vasseur -= 10
  vasseur (pensif): Je vois. Vous avez d\xE9j\xE0 la t\xEAte ailleurs.`,title:"La prolongation",chapters:["ch3"],priority:55,once:!0},{id:"ch3_mercato",trigger:"chapter_end",script:`!lieu {var.agent != "" ? "agence" : "appartement"} 160 jour
~ var.bonus_offres = var.agent == santini ? 10 : var.agent == lambert ? 4 : 0
> Le mercato d'\xE9t\xE9 s'ouvre. Ton t\xE9l\xE9phone ne s'arr\xEAte plus de vibrer.
[var.agent == santini] santini (content): Champion, tout le monde te veut. TOUT LE MONDE.
[var.agent == lambert] lambert: Les offres sont l\xE0. Prenons le temps d'y r\xE9fl\xE9chir ensemble.
si stat.reputation + var.bonus_offres >= 58
  > Real Solaria, Northbury United et l'AC Ventara se sont manifest\xE9s. Des montants qui donnent le vertige.
sinon si stat.reputation + var.bonus_offres >= 40
  > Quelques clubs de premi\xE8re division s'int\xE9ressent \xE0 toi.
sinon
  > Peu d'offres. Le mercato sera calme pour toi.
* [stat.reputation + var.bonus_offres >= 64] Signer au Real Solaria #ambition #cle
  ~ var.prochain_club = "solaria"; var.transfert_record = vrai
* [stat.reputation + var.bonus_offres >= 58] Signer \xE0 Northbury United #ambition #cle
  ~ var.prochain_club = "northbury"; var.transfert_record = vrai
* [stat.reputation + var.bonus_offres >= 58] Signer \xE0 l'AC Ventara #ambition #cle
  ~ var.prochain_club = "ventara"; var.transfert_record = vrai
* [stat.reputation + var.bonus_offres >= 40 et var.club_id != rivemont et var.club_id != marvaux] Rejoindre le Stade Rivemont en D1 #retour
  ~ var.prochain_club = "rivemont"
* [var.agent == santini] Accepter l'offre colossale d'Al-Nour Club #argent #cle
  ~ var.prochain_club = "alnour"
  santini (fier): L\xE0, tu parles ! Ma commission\u2026 pardon, ton avenir est assur\xE9 !
* [var.club_id == rivemont] Rester \xE0 Rivemont : c'est ton club #loyal #cle
  ~ var.prochain_club = "rivemont"; rel.vasseur += 10; rel.moreau += 6
  [mem.vasseur.prolongation] !rappel vasseur.prolongation
  ~ souvenir(moreau, fidele, "Tu as refus\xE9 les plus grands clubs pour rester \xE0 Rivemont")
* [var.club_id != rivemont] Rester dans ton club actuel
  ~ var.prochain_club = var.club_id
[var.clause_fidelite et var.prochain_club != rivemont et var.club_id == rivemont] !rappel vasseur.prolongation
[var.clause_fidelite et var.prochain_club != rivemont et var.club_id == rivemont] > La clause de fid\xE9lit\xE9 s'applique : tu laisses une grosse partie de tes primes au club. Le pr\xE9sident ne te serre pas la main.
[var.clause_fidelite et var.prochain_club != rivemont et var.club_id == rivemont] ~ stat.argent -= min(stat.argent, 60000); rel.vasseur -= 30`,title:"Le mercato",chapters:["ch3"],priority:100,once:!0},{id:"ch4_debut",trigger:"chapter_start",script:`> Quatre ans ont pass\xE9.
~ stat.technique += 5; stat.frappe += 5; stat.passe += 5; stat.defense += 4; stat.physique += 3; stat.mental += 6
~ stat.technique += stat.discipline >= 60 ? 2 : 0; stat.physique -= var.fetes >= 8 ? 4 : 0
~ stat.energie = 100; stat.forme = 62
~ eloigner(maman, rel.maman >= 60 ? 3 : 10); eloigner(karim, rel.karim >= 50 ? 2 : 10); eloigner(djibril, rel.djibril >= 40 ? 2 : 8); eloigner(yanis, var.yanis_protege >= 2 ? 2 : 8)
si var.prochain_club == solaria
  appel club_solaria
  ~ var.salaire = 90000; stat.statut = 40; stat.notoriete += 15; stat.argent += 500000
  > Real Solaria. Le plus grand club du monde. Le transfert le plus cher de l'histoire de ton pays.
sinon si var.prochain_club == northbury
  appel club_northbury
  ~ var.salaire = 75000; stat.statut = 44; stat.notoriete += 12; stat.argent += 400000
  > Northbury United. Pelouse parfaite, stade mythique, presse anglaise impitoyable.
sinon si var.prochain_club == ventara
  appel club_ventara
  ~ var.salaire = 65000; stat.statut = 46; stat.notoriete += 10; stat.argent += 350000
  > L'AC Ventara. Une ville enti\xE8re qui vit et respire pour son club.
sinon si var.prochain_club == alnour
  appel club_alnour
  ~ var.salaire = 160000; stat.statut = 80; stat.reputation -= 8; stat.argent += 900000
  > Al-Nour Club. Un salaire ind\xE9cent, un stade climatis\xE9 \xE0 moiti\xE9 vide, et des journalistes qui parlent de \xAB retraite dor\xE9e \xBB.
sinon si var.prochain_club == rivemont
  appel club_rivemont
  ~ var.salaire = 25000; stat.statut = max(stat.statut, 60); var.capitaine = rel.moreau >= 10 ou var.heritier_keller
  > Le Stade Rivemont. Ton club.
  [var.capitaine] > Didier Moreau t'a remis le brassard de capitaine devant tout le vestiaire.
  [var.capitaine] ~ stat.reputation += 4; stat.confiance += 6
sinon si var.prochain_club == marvaux ou var.club_id == marvaux
  appel club_marvaux
  ~ var.salaire = 30000; stat.statut = max(stat.statut, 58)
  > Toujours \xE0 Marvaux, dont tu es devenu l'un des piliers.
sinon si var.prochain_club == lanvaux
  appel club_lanvaux
  ~ var.salaire = 6000; stat.statut = 70; var.ligue = "d1"; var.force_equipe = 58
  > Lanvaux est mont\xE9 en premi\xE8re division. Tu es l'\xE2me de l'\xE9quipe.
sinon
  appel club_valmont
  ~ var.salaire = 1500; stat.statut = 80; var.ligue = "d2"; var.force_equipe = 52
  > Le FC Valmont a gravi les divisions jusqu'en D2. Gomis pleure \xE0 chaque victoire.
[non var.karim_renvoye et var.soutien_karim] > Karim s'est remis de sa blessure. Il est revenu plus fort, et il a m\xEAme \xE9t\xE9 appel\xE9 en \xE9quipe nationale.
[non var.karim_renvoye et var.soutien_karim] ~ var.karim_selection = vrai
[non var.karim_renvoye et non var.soutien_karim] > Karim n'a jamais retrouv\xE9 son niveau apr\xE8s sa blessure. Il joue en D2.
~ objectif(trophee, "Remporter un troph\xE9e majeur")`,title:"Quatre ans plus tard",chapters:["ch4"],priority:100,once:!0},{id:"ch4_aeroport",trigger:"tick_start",script:`!lieu aeroport 120 jour
!figurant fan1 foule 220
!figurant fan2 foule 250 1
!figurant fan3 foule 300
!figurant journaliste foule 180 2
!fx flashs
!son flash
> Des centaines de supporters de {var.club} t'attendent \xE0 l'a\xE9roport. \xC9charpes, banderoles, flashs.
!emote fan1 coeur
* Prendre le temps de signer des autographes \xE0 tout le monde #fans
  ~ stat.reputation += 3; stat.notoriete += 5; stat.energie -= 10
  > Deux heures de selfies. Une gamine pleure en te serrant la main.
* R\xE9pondre en quelques mots dans la langue locale #intelligent
  test (var.langues ? 75 : 40) + stat.mental / 4 vs 55
  si reussite
    > Trois phrases maladroites mais sinc\xE8res. Les supporters t'adorent d\xE9j\xE0.
    ~ stat.reputation += 5; stat.statut += 4
  sinon
    > Ton accent fait rire tout le monde. Une vid\xE9o devient un m\xE8me national. Pas m\xE9chant, mais g\xEAnant.
    ~ stat.notoriete += 6; stat.confiance -= 3
* Filer directement \xE0 la voiture #discret
  ~ stat.reputation -= 2
  > Les journaux titrent sur \xAB l'arrogance \xBB de la recrue.`,title:"L'arriv\xE9e",when:"var.transfert_record",chapters:["ch4"],priority:85,once:!0},{id:"ch4_rinaldi",trigger:"talk:rinaldi",script:`rinaldi: Alors c'est toi, le petit g\xE9nie qu'ils ont pay\xE9 une fortune. Dans ce vestiaire, il n'y a qu'un num\xE9ro 10. C'est moi.
~ rencontrer(rinaldi)
* \xAB Je suis l\xE0 pour gagner avec toi, pas contre toi. \xBB #collectif
  ~ rel.rinaldi += 15; stat.statut += 4
  rinaldi (content): \u2026Bonne r\xE9ponse. Viens, je t'invite \xE0 d\xEEner.
* \xAB Le meilleur jouera. On verra qui. \xBB #ambition #cle
  ~ rel.rinaldi -= 15; stat.confiance += 5
  ~ souvenir(rinaldi, defi, "Tu l'as d\xE9fi\xE9 d\xE8s ton arriv\xE9e")
  rinaldi (colere): Tu vas apprendre, petit.
* Lui demander des conseils #humble
  ~ rel.rinaldi += 10; stat.mental += 2
  rinaldi: Personne ne m'a jamais demand\xE9 \xE7a. Bon. Premier conseil : dors.`,title:"La star",chapters:["ch4"],priority:60,once:!0},{id:"ch4_mal_du_pays",trigger:"tick_start",script:`!lieu appartement 300 nuit
> Un appartement immense, une ville que tu ne connais pas, une langue que tu comprends \xE0 moiti\xE9. Le soir, le silence est assourdissant.
~ stat.moral -= 10
* Appeler la famille tous les soirs #famille
  ~ rel.maman += 8; rel.yanis += 6; stat.moral += 6
* Prendre des cours de langue intensifs #intelligent
  ~ var.langues = vrai; stat.mental += 3; stat.statut += 3
* [var.couple] Demander \xE0 In\xE8s de te rejoindre quelques semaines #romance
  ~ rel.ines += 8; stat.moral += 10
  ines: J'arrive vendredi. Je prends mes cong\xE9s.
* Sortir tous les soirs pour oublier #fete
  ~ var.fetes += 3; stat.moral += 4; stat.forme -= 8; stat.discipline -= 5`,title:"Le mal du pays",when:"var.club_etranger et temps.semaine == 2",chapters:["ch4"],priority:65,once:!0},{id:"ch4_proposition",trigger:"tick_start",script:`!lieu agence 160 soir
si var.agent == santini
  !placer santini 200 gauche
  santini: Champion, j'ai des amis\u2026 g\xE9n\xE9reux. Samedi, tu prends un carton jaune avant la 20e minute. C'est tout. Un carton. Et \xE7a, c'est pour toi.
  > Il fait glisser une enveloppe \xE9paisse sur le bureau.
sinon
  > Djibril t'appelle. Sa voix est tendue. \xAB Des gars avec qui je bosse\u2026 ils veulent un service. Un carton jaune avant la 20e minute, samedi. Ils paient bien. Et\u2026 ils insistent. \xBB
* Accepter : un carton, ce n'est rien #argent #cle
  ~ var.match_arrange = vrai; stat.argent += 50000; var.scandale += 2
  ~ souvenir(clara, enquete, "Le carton jaune \xAB sur commande \xBB")

clara: Je vais \xEAtre honn\xEAte avec vous. J'enqu\xEAte depuis six mois. J'ai des relev\xE9s de paris, des messages, des noms.
[var.match_arrange] clara: Un carton jaune \xE0 la 17e minute. Vous voulez me dire quelque chose avant que je publie ?
[var.affaire_djibril et non var.match_arrange] clara: Une soci\xE9t\xE9 d'import \xE0 votre nom et \xE0 celui de Djibril Sow. Des conteneurs qui n'existent pas sur le papier.

si var.grand_club
  ~ var.nom_finale = "finale de la Ligue des \xC9toiles"; var.adversaire = "Northbury United"; var.adv_court = "NU"; var.adv_couleur = "#c23b3b"

sinon
  ~ var.nom_finale = "finale de la Coupe Nationale"; var.adversaire = "Paris \xC9toile FC"; var.adv_court = "PEF"; var.adv_couleur = "#1d2f5e"
!lieu stade 320 nuit
!equipe nous {var.club_couleur} {var.club_couleur2} #ffffff {var.club_couleur}

> La {var.nom_finale}. Le monde entier regarde.
si var.blesse > 0

  ~ var.score_nous = poisson(1.3); var.score_eux = poisson(1.2)
  si var.score_nous > var.score_eux

    > Victoire {var.score_nous}\u2013{var.score_eux} ! Tes co\xE9quipiers t'apportent la coupe en tribune.
  sinon
    > D\xE9faite {var.score_nous}\u2013{var.score_eux}.
  -> fin
~ var.matchs += 1; var.titularisations += 1
~ var.minute = 63
!preset attaque
> {var.minute}e minute. 0\u20130. Le ballon arrive dans tes pieds.
[var.capitaine] > Le brassard p\xE8se lourd sur ton bras. Tout le stade attend que tu fasses quelque chose.
* Frapper #frappe
  test stat.frappe + stat.forme / 4 + stat.confiance / 6 vs 74
  !anim moi frappe

  si reussite

  si reussite

  !placer karim 520 droite 1

  [mem.karim.soutien] !rappel karim.soutien

  !ballon vers but tir

@but_finale

@suite
~ var.minute = 88

> {var.minute}e minute. Ils poussent, ils poussent\u2026
~ var.score_eux += chance(var.score_nous > 0 ? 38 : 30) ? 1 : 0
[var.score_eux > 0] !ballon vers but_gauche tir
[var.score_eux > 0] !fx filet
[var.score_eux > 0] > But adverse.
si var.score_nous == var.score_eux
  > Prolongations, puis tirs au but. Le dernier tir est pour toi.
  !preset penalty
  test stat.frappe + stat.mental / 3 + stat.confiance / 6 vs 70
  !anim moi frappe
  si reussite
    !ballon vers but tir

    !anim gk plongeon
    !ballon vers gk tir
!son sifflet

  !fx confettis
  !fx foule 1
  !titre VICTOIRE !
  !anim moi joie boucle
  > Tu as gagn\xE9 la {var.nom_finale} !
  ~ var.trophees += 1; var.trophees_majeurs += 1; stat.reputation += 10; stat.moral += 20
  [var.club_id == rivemont] ~ var.titres_rivemont += 1; rel.vasseur += 15; rel.moreau += 10
  ~ objectifReussi(trophee)
  ~ actu("{var.club} remporte la {var.nom_finale} ! {joueur.nom} h\xE9ros de la soir\xE9e.")
sinon
  !anim moi triste
  > D\xE9faite. Tu restes assis au milieu de la pelouse pendant que les autres c\xE9l\xE8brent.
  ~ stat.moral -= 15
~ var.notes_total += var.note_match
!anim moi idle
!ballon cacher
!fx foule 0.3`,title:"La grande finale",when:"temps.semaine == 6",chapters:["ch4"],priority:85,once:!0},{id:"ch4_mondial",trigger:"chapter_end",script:`~ var.score_nous = 0; var.score_eux = 0; var.minute = 0
~ var.club_court_sauve = var.club_court; var.club_court = "NAT"; var.adversaire = "la s\xE9lection adverse"; var.adv_court = "ADV"; var.stade_taille = 3
!lieu stade 320 nuit
!equipe nous #1d2f5e #eef0f4 #eef0f4 #d63c3c

!tenue moi maillot #1d2f5e #eef0f4
!fx foule 1
> Finale du Mondial. Quatre-vingt mille personnes. Un milliard de t\xE9l\xE9spectateurs.
[rel.maman >= 30] > Quelque part dans la tribune, ta m\xE8re porte le maillot que tu lui as envoy\xE9 il y a des ann\xE9es.
~ var.selections += 7
~ var.minute = 78

> {var.minute}e minute. 0\u20130. Tu re\xE7ois le ballon \xE0 l'entr\xE9e de la surface.
si var.karim_selection et rel.karim >= 40
  !placer karim 460 droite 1

sinon
  ~ var.bonus_karim = 0
* Frapper du gauche, d'instinct #frappe
  test stat.frappe + var.bonus_karim + stat.confiance / 5 vs 76
  !anim moi frappe
  !son frappe
  si reussite
    !ballon vers but tir
    -> champion

    !ballon vers dessus tir
    > Au-dessus, de rien du tout.

  si reussite
    !courir moi 540
    !anim moi passe
    !ballon vers but passe
    -> champion
  sinon
    !anim def1 tacle
    > Contr\xE9.
> La finale s'ach\xE8ve sur un 0\u20130. Tirs au but\u2026 perdus.
~ stat.moral -= 15; stat.reputation += 4
-> fin_mondial

@champion

!son but
!fx confettis
!fx foule 1
!titre CHAMPION DU MONDE !
!anim moi joie boucle
~ var.score_nous = 1; var.buts += 1; var.trophees += 1; var.trophees_majeurs += 1; stat.reputation += 15; stat.notoriete += 20
> Tu marques le but du titre. Champion du monde.
~ actu("{joueur.nom} offre le Mondial \xE0 son pays !")
-> fin_mondial

@fin_mondial
~ var.club_court = var.club_court_sauve
!anim moi idle
!fx foule 0.3`,title:"Le Mondial",when:"var.selection",chapters:["ch4"],priority:90,once:!0},{id:"ch4_crampon_or",trigger:"chapter_end",script:`!lieu salle_presse 190 nuit
> Un gala, des smokings, des centaines de photographes. On annonce le Crampon d'Or, le troph\xE9e du meilleur joueur du monde.
> \xAB \u2026 Et le Crampon d'Or est attribu\xE9 \xE0\u2026 {joueur.nom} ! \xBB
~ var.ballon_or = vrai; stat.reputation += 6; stat.notoriete += 10
!fx flashs
* D\xE9dier le troph\xE9e \xE0 ta m\xE8re #famille
  ~ rel.maman += 15
  > Dans la salle, ta m\xE8re ne retient pas ses larmes.
* Le d\xE9dier \xE0 Didier Moreau, qui t'a tout appris #reconnaissance
  ~ rel.moreau += 15
  > Moreau, devant sa t\xE9l\xE9vision, \xE9teint la lumi\xE8re pour que personne ne le voie pleurer.
* \xAB Je le d\xE9die \xE0 moi-m\xEAme. Je l'ai m\xE9rit\xE9. \xBB #ego
  ~ stat.notoriete += 5; stat.reputation -= 4`,title:"Le Crampon d'Or",when:"stat.reputation >= 85 et var.trophees_majeurs >= 1",chapters:["ch4"],priority:80,once:!0},{id:"ch5_debut",trigger:"chapter_start",script:`> Six ans ont pass\xE9. Six saisons, des victoires, des d\xE9faites, des matins o\xF9 le corps grince un peu plus.
~ stat.physique -= 8; stat.technique += 2; stat.mental += 8; stat.passe += 3; stat.energie = 90; stat.forme = 55

~ eloigner(maman, rel.maman >= 60 ? 3 : 12); eloigner(karim, rel.karim >= 50 ? 2 : 12); eloigner(yanis, var.yanis_protege >= 2 ? 2 : 10)
~ var.carriere_banc = stat.statut < 45
~ var.matchs += 180; var.titularisations += arrondi(180 * (var.carriere_banc ? 0.3 : min(0.95, stat.statut / 100 * (var.grand_club ? 0.7 : 1.1)))); var.buts += arrondi(stat.frappe / 2 + (joueur.poste == "attaquant" ? 40 : joueur.poste == "milieu" ? 15 : 5)); var.notes_total += 180 * (5.6 + stat.reputation / 50)
si var.grand_club
  ~ var.trophees += 3 + plancher(stat.reputation / 40); var.trophees_majeurs += stat.reputation >= 75 ? 1 : 0
  > Avec {var.club}, tu as accumul\xE9 les titres nationaux. Ton armoire d\xE9borde.
sinon si var.club_id == rivemont
  ~ var.trophees += stat.reputation >= 55 ? 2 : 1; var.titres_rivemont += stat.reputation >= 55 ? 1 : 0
  > Avec Rivemont, tu as v\xE9cu des soirs de gloire{var.titres_rivemont >= 1 ? ", et m\xEAme un titre de champion" : ""}.
sinon
  ~ var.trophees += 1
  > Tu as jou\xE9, beaucoup. Gagn\xE9, parfois.
~ stat.reputation += 4; var.salaire = arrondi(var.salaire * 0.7)
[var.carriere_banc] > Tu as pass\xE9 une bonne partie de ces ann\xE9es sur le banc. Toujours pr\xEAt, rarement appel\xE9.
[var.affaire_djibril_legale] > La marque que tu as lanc\xE9e avec Djibril habille d\xE9sormais trois clubs. Il t'appelle \xAB patron \xBB pour rire.
[var.djibril_prison] > Djibril est sorti de prison l'an dernier. Il ne t'a jamais rappel\xE9.
~ objectif(sortie, "R\xE9ussir ta sortie")`,title:"Six ans plus tard",chapters:["ch5"],priority:100,once:!0},{id:"ch5_derniere_decision",trigger:"tick_start",script:`!lieu appartement 250 soir

  ~ souvenir(moreau, dernier_retour, "Tu es revenu finir ta carri\xE8re \xE0 Rivemont")
  > Les supporters ont accroch\xE9 une banderole immense : \xAB BIENVENUE \xC0 LA MAISON \xBB.
  [rel.moreau >= 20] moreau (emu): Je t'ai gard\xE9 ton ancien casier.
* Rester dans ton club actuel #constance
  ~ stat.statut += 5`,title:"La derni\xE8re d\xE9cision",when:"temps.semaine == 1",chapters:["ch5"],priority:85,once:!0},{id:"ch5_karim",trigger:"tick_start",script:`!lieu city 200 soir
!placer karim 250 gauche
!placer moi 200 droite

  karim (content): Le city des Tilleuls\u2026 Tu te rappelles ? C'est ici qu'on r\xEAvait de tout \xE7a.
  karim: Moi, j'arr\xEAte \xE0 la fin de la saison. J'ouvre une \xE9cole de foot. Et je veux que tu en sois le parrain.
  [mem.karim.couvert] !rappel karim.couvert

  * Lui proposer de la monter ensemble #ami
    ~ rel.karim += 15; var.ecole_karim = vrai
sinon si rel.karim >= 0
  karim: Salut. \xC7a fait longtemps. Je voulais juste\u2026 te dire bravo. Pour tout.
  * Lui proposer d'aller boire un verre, comme avant #reconciliation
    ~ rel.karim += 20
    > Vous parlez jusqu'\xE0 deux heures du matin. Les vieilles blessures se referment un peu.

    ~ rel.karim += 3
sinon
  > Karim est l\xE0, au bord du terrain. Il te regarde. Puis il s'en va.

  [mem.karim.refus] !rappel karim.refus

    > Tu perds le ballon. Il rigole.
    ~ var.note_match -= 0.3`,title:"Provocation",weight:1.2},{id:"mo_choc",trigger:"pool:moment",script:`~ var.minute = min(88, var.minute + hasard(10, 28))
!preset milieu
!anim adv1 tacle
!anim moi chute
> {var.minute}e minute. Un tacle par derri\xE8re. Tu restes au sol, la cheville en feu.
* Serrer les dents et continuer #courage
  test stat.physique + stat.sante / 4 vs 60
  si reussite
    > La douleur s'estompe. Tu finis le match.
    ~ var.note_match += 0.2; stat.sante -= 6
  sinon

    ~ actu("Bless\xE9 \xE0 la cheville, tu seras absent deux semaines.")
* Demander le changement #prudent
  > Tu sors sous les applaudissements. Bruno pose de la glace : rien de grave.
  ~ stat.sante -= 3; var.note_match -= 0.2`,title:"Le choc",weight:"0.6 + var.genou * 0.4 + (stat.energie < 30 ? 1 : 0)"},{id:"karim_console",trigger:"activity:jeux_video",script:`!placer karim 100 droite
karim (rire): Toi contre moi. Le perdant range la chambre pendant une semaine.
* Jouer s\xE9rieusement pour gagner #ambition
  test stat.mental vs 50
  si reussite
    > 3\u20132 dans les arr\xEAts de jeu. Karim jette la manette sur le lit.
    ~ rel.karim += 2
  sinon
    > 4\u20130. Karim fait le tour de la chambre en criant.
    ~ rel.karim += 4
* Le laisser gagner discr\xE8tement #ami
  ~ rel.karim += 5
  karim: T'es nul, fr\xE9rot. Mais je t'aime bien quand m\xEAme.
* Lui demander comment il va, vraiment #ecoute
  karim (pensif): \u2026Pas fort. La famille, l'argent. Si je ne signe pas pro, je ne sais pas ce qu'on fera.
  ~ rel.karim += 6`,title:"Soir\xE9e console",when:"non var.karim_renvoye",chapters:["ch1"],cooldown:2},{id:"karim_conversation",trigger:"talk:karim",script:`si chapitre == ch1
  karim: Tu crois qu'on va y arriver, nous deux ?
  * \xAB On n'a pas le choix. \xBB #ambition
    ~ rel.karim += 3; stat.confiance += 2
  * \xAB Peu importe, tant qu'on est ensemble. \xBB #ami
    ~ rel.karim += 5
sinon si rel.karim >= 40
  karim (content): T'as vu le dernier but que j'ai mis ? Dis-moi qu'il \xE9tait plus beau que le tien.
  * Le chambrer gentiment #ami
    ~ rel.karim += 3
  * Lui dire que tu es fier de lui #sincere
    ~ rel.karim += 5
sinon
  karim: \xC7a va ? \u2026Bon. On se voit.
  * Lui proposer un resto, comme avant #reconciliation
    ~ rel.karim += 6
  * Le laisser tranquille
    ~ rel.karim += 0`,title:"Discussion avec Karim",when:"rel.karim > -20 et non var.karim_renvoye",cooldown:3},{id:"lucas_conversation",trigger:"talk:lucas",script:`si rel.lucas >= 20
  lucas: Tu veux bosser les frappes apr\xE8s la s\xE9ance ? Pas pour toi, hein. Pour moi.
  * Accepter #collectif
    ~ rel.lucas += 5; stat.frappe += 1
  * D\xE9cliner
    ~ rel.lucas -= 1
sinon si rel.lucas <= -25
  lucas (colere): Qu'est-ce que tu regardes ?
  [mem.lucas.humiliation] !rappel lucas.humiliation
  * Lui proposer d'enterrer la hache de guerre #fairplay
    test 40 + rel.lucas / 2 + stat.mental / 4 vs 45
    si reussite
      lucas (pensif): \u2026On verra. Peut-\xEAtre.
      ~ rel.lucas += 12
    sinon
      lucas: Tu r\xEAves.
  * Le provoquer #provoc
    ~ rel.lucas -= 6
sinon
  lucas: Mon p\xE8re dit que tu as un bon pied gauche. Venant de lui, c'est un compliment. Ne t'emballe pas.
  * Lui demander comment c'est, d'\xEAtre \xAB le fils de \xBB #ecoute
    lucas (triste): Tout le monde attend que je sois lui. Personne ne m'a jamais demand\xE9 ce que je voulais \xEAtre.
    ~ rel.lucas += 8
    ~ souvenir(lucas, confidence, "Le jour o\xF9 il t'a parl\xE9 de son p\xE8re")
  * Le remercier sans plus
    ~ rel.lucas += 1`,title:"Lucas",when:"temps.semaine >= 2",cooldown:4},{id:"ines_conversation",trigger:"talk:ines",script:`si chapitre == ch1
  ines: Tu bloques sur quoi, cette semaine ? Les fonctions ou les probabilit\xE9s ?
  * R\xE9viser avec elle #etudes
    ~ stat.etudes += 5; rel.ines += 4; stat.energie -= 5
    ines (content): Tu vois, quand tu veux !
  * Lui parler d'autre chose #romance
    ~ rel.ines += 3
    ines: Toi, tu essaies de te d\xE9barrasser des maths. \u2026Bon. Raconte, alors.
sinon si var.couple
  ines (content): Tu as l'air fatigu\xE9. Viens l\xE0. Ne bouge pas, je vais d\xE9nouer ce trap\xE8ze.
  ~ stat.sante += 5; stat.moral += 5; rel.ines += 3
sinon
  ines: \xC7a va, la star ?
  * Lui proposer un caf\xE9 #romance
    ~ rel.ines += 4
  * Rester bref
    ~ rel.ines += 0`,title:"In\xE8s",cooldown:3},{id:"maman_visite",trigger:"activity:voir_famille",script:`!placer maman 140 droite
si chapitre == ch1
  maman: Tu manges bien, au centre ? Tu dors assez ? Tu r\xE9vises ?
  [var.promesse_bac] maman: Tu te souviens de ta promesse, hein ?

sinon si stat.argent >= 50000 et non var.maman_demenagee
  maman: Les voisins disent que tu gagnes beaucoup d'argent maintenant. Ne laisse pas \xE7a te changer.
  * Lui proposer de lui acheter une maison #famille #cle
    ~ stat.argent -= 40000; rel.maman += 15; var.maman_demenagee = vrai; var.yanis_protege += 1
    ~ souvenir(maman, maison, "Tu lui as offert une maison")

  * La rassurer : tu restes le m\xEAme #famille
    ~ rel.maman += 4
sinon
  maman: Raconte-moi ta semaine. Tout. M\xEAme les trucs pas int\xE9ressants.
  ~ rel.maman += 2
[temps.semaine % 2 == 1 et var.age < 30] yanis: Tu viens jouer au city apr\xE8s ?
[temps.semaine % 2 == 1 et var.age < 30] ~ rel.yanis += 3; var.yanis_protege += 0.5`,title:"Chez maman",cooldown:2},{id:"yanis_city",trigger:"activity:foot_quartier",script:`!placer yanis 160 droite
yanis (content): Montre-moi ton crochet ! Celui de la t\xE9l\xE9 !
* Passer l'apr\xE8s-midi \xE0 lui apprendre #famille
  ~ rel.yanis += 6; var.yanis_protege += 1
  > Il le rate trente fois. \xC0 la trente et uni\xE8me, il hurle de joie.
* Jouer avec les grands, Yanis regarde
  ~ rel.yanis += 1`,title:"Le city avec Yanis",when:"var.age < 30",cooldown:3},{id:"djibril_conversation",trigger:"talk:djibril",script:`si var.affaire_djibril_legale
  djibril (content): Patron ! On a re\xE7u la commande de trois clubs. Trois ! Ma m\xE8re croit que je vends de la drogue tellement je gagne bien.
  ~ rel.djibril += 4; stat.argent += 5000
sinon si var.affaire_djibril
  djibril: \xC7a tourne bien, \xE7a tourne bien. T'inqui\xE8te pas pour les d\xE9tails.
  ~ rel.djibril += 2
sinon si chapitre == ch1
  djibril: Alors, le centre ? Ils vous nourrissent aux brocolis, c'est \xE7a ?
  * Rire avec lui #ami
    ~ rel.djibril += 3; stat.moral += 3
  * Lui conseiller de reprendre une formation #conseil
    ~ rel.djibril -= 1; var.conseil_djibril += 1
    djibril (pensif): Une formation\u2026 Ouais. Peut-\xEAtre. Un jour.
sinon
  djibril: Tu te souviens quand on faisait des matchs jusqu'\xE0 minuit en bas des tours ?
  ~ rel.djibril += 3; stat.moral += 2`,title:"Djibril",when:"non var.djibril_prison",cooldown:4},{id:"moreau_conversation",trigger:"talk:moreau",script:`si rel.moreau >= 40
  moreau: Tu sais ce que je vois quand je te regarde jouer ? Un gar\xE7on qui a compris. C'est rare.
  ~ stat.confiance += 3; rel.moreau += 2
sinon si rel.moreau <= -15
  moreau: Je n'ai rien \xE0 te dire que je ne t'aie d\xE9j\xE0 dit. Travaille.
  * Lui demander une seconde chance #humble
    ~ rel.moreau += 6
    moreau: Les secondes chances, \xE7a se gagne sur le terrain.
  * Hausser les \xE9paules
    ~ rel.moreau -= 3
sinon
  moreau: Une question ?
  * Lui demander comment progresser #discipline
    ~ rel.moreau += 3; stat.mental += 1
    moreau: Regarde les matchs. Pas les buts : les d\xE9placements sans ballon.
  * Lui demander s'il a \xE9t\xE9 un bon joueur #ecoute
    moreau (pensif): Un bon d\xE9fenseur, oui. Pas un grand. Les grands, je les entra\xEEne.
    ~ rel.moreau += 4`,title:"Le coach",when:"temps.semaine >= 2",cooldown:4},{id:"bruno_soins",trigger:"talk:bruno",script:`si var.genou >= 2
  bruno (inquiet): Ton genou me fait peur. Fais tes \xE9tirements, viens aux soins. Je ne plaisante pas.
  ~ souvenir(bruno, alerte, "Il t'avait pr\xE9venu pour ton genou")
  * Promettre de faire attention #prudent
    ~ rel.bruno += 4; var.genou = max(0, var.genou - 0.5)
  * \xAB \xC7a va, Bruno, je suis jeune. \xBB
    ~ rel.bruno -= 3
sinon
  bruno: Viens, je te masse les mollets. Gratuitement, en plus.
  ~ stat.sante += 6; stat.energie += 6; rel.bruno += 2`,title:"Bruno",cooldown:3},{id:"keller_conseils",trigger:"talk:keller",script:`si rel.keller >= 15
  keller: Tu veux un conseil de vieux ? Garde des amis en dehors du foot. Ceux d'ici partiront tous un jour.
  ~ rel.keller += 3; stat.mental += 1
sinon
  keller: Tu cours beaucoup. Pas toujours au bon endroit.
  ~ stat.mental += 1`,title:"Le capitaine",when:"temps.semaine >= 2",cooldown:4},{id:"clara_entretien",trigger:"talk:clara",script:`clara: Une question rapide : qu'est-ce que le football vous a appris, en dehors du terrain ?
* \xAB La patience. \xBB #humble
  ~ rel.clara += 3; stat.reputation += 1
* \xAB Que tout le monde veut quelque chose de toi. \xBB #sincere
  ~ rel.clara += 5
* \xAB Rien. Je joue, c'est tout. \xBB
  ~ rel.clara -= 2`,title:"Clara Mend\xE8s",when:"connu.clara",cooldown:4},{id:"vasseur_rendezvous",trigger:"talk:vasseur",script:`vasseur: Vous savez combien vous valez sur le march\xE9 ? Moi, oui. Alors continuez comme \xE7a.

~ rel.hansen += 2; stat.statut += 1`,title:"L'entra\xEEneur",when:"vu(ch3_hansen_poste) ou chapitre == ch2",cooldown:4},{id:"rinaldi_conversation",trigger:"talk:rinaldi",script:`si rel.rinaldi >= 10

sinon

  ~ rel.rinaldi -= 1`,title:"Rinaldi",when:"vu(ch4_rinaldi)",cooldown:4},{id:"agent_point",trigger:"activity:rencontre_agent",script:`si var.agent == santini
  !placer santini 200 gauche
  santini: Champion ! J'ai une marque de boissons \xE9nergisantes qui veut ta t\xEAte sur ses canettes. Deux jours de tournage.
  * Accepter #argent
    ~ stat.argent += 15000; stat.notoriete += 3; stat.energie -= 20
