   Une seule ambiance sombre assum\xE9e (jeu pixel art), contours \xAB pixel \xBB nets. */
:root {
  color-scheme: dark;
  --bg: #0b0d14;
  --bg2: #10131d;
  --panel: #171b28;
  --panel2: #20253a;
  --line: #313a57;
  --line2: #4a5683;
  --ink: #f3efe4;
  --dim: #aab1c7;
  --faint: #6d7491;
  --accent: #f5c542;
  --accent-ink: #1b1505;
  --accent2: #3fb36b;
  --good: #6ad48a;
  --bad: #f06a6a;
  --mem: #b893ff;
  --rel: #4fd6c4;
  --info: #7cb7ff;
  --gold: #ffd25a;
  --font: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --font-label: 'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
  --b: 3px;
  --text: clamp(14px, calc(var(--px, 3px) * 5.6), 21px);
  --small: clamp(12px, calc(var(--px, 3px) * 4.4), 16px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { overflow: hidden; -webkit-font-smoothing: none; }
/* La ligature \xAB fi \xBB de Pixelify Sans ressemble \xE0 un \xAB A \xBB : ligatures d\xE9sactiv\xE9es partout */
html, body, button, input, select, textarea { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'clig' 0, 'dlig' 0; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* \u2500\u2500 Bo\xEEtes et boutons pixel \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.pbox {
  background: var(--panel);
  box-shadow:
    0 calc(var(--b) * -1) 0 0 var(--line), 0 var(--b) 0 0 var(--line),
    calc(var(--b) * -1) 0 0 0 var(--line), var(--b) 0 0 0 var(--line),
    inset 0 var(--b) 0 0 rgba(255, 255, 255, 0.05), inset 0 calc(var(--b) * -1) 0 0 rgba(0, 0, 0, 0.28);
}
.pbtn {
  appearance: none; border: 0; cursor: pointer; padding: 0.5em 1em; background: var(--panel2); color: var(--ink);
  font-size: var(--small); letter-spacing: 0.02em; line-height: 1.2; text-align: left;
  box-shadow:
    0 calc(var(--b) * -1) 0 0 var(--line2), 0 var(--b) 0 0 var(--line2),
    calc(var(--b) * -1) 0 0 0 var(--line2), var(--b) 0 0 0 var(--line2),
    inset 0 calc(var(--b) * -1) 0 0 rgba(0, 0, 0, 0.35);
  transition: transform 60ms, background 80ms;
}
.pbtn:hover:not(:disabled) { background: #2a3150; box-shadow: 0 calc(var(--b) * -1) 0 0 var(--accent), 0 var(--b) 0 0 var(--accent), calc(var(--b) * -1) 0 0 0 var(--accent), var(--b) 0 0 0 var(--accent), inset 0 calc(var(--b) * -1) 0 0 rgba(0,0,0,0.35); }
.pbtn:active:not(:disabled) { transform: translateY(2px); }
.pbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.pbtn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.pbtn.primary:hover:not(:disabled) { background: #ffdd73; }
.pbtn.danger { background: #4a2028; }
.pbtn.ghost { background: transparent; }
.pbtn.small { padding: 0.25em 0.6em; font-size: 13px; }
.label { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.muted { color: var(--dim); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
.fill { width: 100%; height: 100%; display: block; }
.kbd { font-family: var(--font-label); font-size: 10px; padding: 1px 4px; background: #2b3250; color: var(--dim); }

/* \u2500\u2500 \xC9cran de jeu \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.game-shell { position: fixed; inset: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 40%, #151a2a, var(--bg) 70%); }
.stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.stage[data-layout='portrait'] { align-items: flex-start; }
.frame { position: relative; width: var(--gw); height: var(--gh); box-shadow: 0 0 0 3px #05060a, 0 18px 60px rgba(0,0,0,0.6); }
.game-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; cursor: pointer; }
.ui-layer { position: absolute; inset: 0; pointer-events: none; font-size: var(--text); }
.ui-layer > * { pointer-events: auto; }

/* HUD */
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: calc(var(--px) * 2.5); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-date { background: rgba(11, 13, 20, 0.78); padding: 4px 10px 5px; font-size: var(--small); line-height: 1.25; max-width: 55%; }
.hud-date b { color: var(--accent); font-weight: 700; }
.hud-date .loc { color: var(--dim); font-size: 0.85em; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.hud-stats { display: flex; gap: 8px; background: rgba(11, 13, 20, 0.78); padding: 4px 8px; flex-wrap: wrap; justify-content: flex-end; }
.hud-stat { display: flex; flex-direction: column; gap: 2px; min-width: 52px; }
.hud-stat .label { font-size: 9px; color: var(--dim); display: flex; justify-content: space-between; gap: 4px; }
.hud-stat .label b { color: var(--ink); font-weight: 400; }
.meter { height: 5px; background: #2a2f45; position: relative; }

.ed-detail-head h3 { margin: 0; font-size: 20px; min-width: 0; flex: 1 1 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Formulaires */
.ed-form { display: flex; flex-direction: column; gap: 14px; }
.ed-h { margin: 8px 0 0; font-size: 17px; color: var(--accent); border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.ed-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; align-items: start; }
.ed-grid.tight { gap: 6px 10px; }
.span2 { grid-column: span 2; }
.span3 { grid-column: 1 / -1; }
.ed-f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; min-width: 0; }
.ed-f > input, .ed-f > select, .ed-f > textarea { width: 100%; min-width: 0; }
.ed-l { font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.ed-hint { font-size: 12px; color: var(--faint); line-height: 1.35; }
.ed-err { font-size: 12px; color: #ffb3b3; line-height: 1.35; }
.ed-check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; min-height: 30px; }
.ed-check input { accent-color: var(--accent); width: 16px; height: 16px; }
.ed-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ed-chip { border: 0; background: #2b3250; color: var(--dim); padding: 4px 9px; font-size: 13px; cursor: pointer; font-family: inherit; }
.ed-chip:hover { color: var(--ink); }
.ed-chip.on { background: var(--accent); color: var(--accent-ink); }
.ed-chip.bad { background: #4a1f26; color: #ffb3b3; }
.ed-chip small { opacity: 0.7; }
.ed-chip:disabled { cursor: default; }
.ed-color { display: flex; gap: 6px; align-items: center; min-width: 0; }
.ed-color input[type='color'] { width: 34px; height: 32px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; }
.ed-color.var input[type='color'] { opacity: 0.45; }
.ed-color .txt { flex: 1; min-width: 0; }
.ed-rows { display: flex; flex-direction: column; gap: 8px; }
.ed-row { display: flex; gap: 8px; background: var(--panel2); padding: 8px; align-items: flex-start; }
.ed-rows.compact .ed-row { padding: 6px; background: #1a1f31; }
.ed-row-body { flex: 1; min-width: 0; }
.ed-row-tools { display: flex; flex-direction: column; gap: 4px; }
.ed-ico { border: 0; background: #2b3250; color: var(--ink); min-width: 28px; height: 28px; cursor: pointer; font-size: 13px; padding: 0 6px; flex: none; }
.ed-ico:hover:not(:disabled) { background: #3a4470; }
.ed-ico.danger:hover:not(:disabled) { background: #6a2830; }
.ed-ico:disabled { opacity: 0.35; cursor: default; }
.ed-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ed-id > code, .ed-code-inline { font-family: var(--mono); font-size: 13px; background: #0e1119; padding: 6px 8px; }
.ed-fold { background: var(--panel); box-shadow: 0 0 0 2px var(--line); }
.ed-fold-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: none; border: 0; color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; text-align: left; }
.ed-fold-head:hover { background: #1b2034; }
.ed-caret { color: var(--accent); width: 12px; }
.ed-fold-body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.ed-refs { display: flex; flex-direction: column; gap: 4px; }
.ed-link { border: 0; background: none; color: var(--info); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; font: inherit; margin-right: 8px; text-align: left; }
.ed-link:hover { color: #b5d6ff; }
.ed-badge { font-family: var(--font-label); font-size: 10px; padding: 1px 5px; flex: none; }
.ed-badge.bad { background: #4a1f26; color: #ffb3b3; }
.ed-badge.warn { background: #4a3a1f; color: #ffe0a3; }
.ed-badge.ok { background: #1f4a30; color: #9ff0b8; }
.ed-pill { font-family: var(--font-label); font-size: 11px; padding: 4px 9px; letter-spacing: 0.04em; background: #2b3250; color: var(--dim); }
.ed-pill.bad { background: #4a1f26; color: #ffb3b3; }
.ed-pill.warn { background: #4a3a1f; color: #ffe0a3; }
.ed-pill.ok { background: #1f4a30; color: #9ff0b8; }
.ed-pill.btn { border: 0; cursor: pointer; }
.ed-issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ed-issues li { font-size: 13px; padding: 5px 8px; border-left: 3px solid var(--line2); background: var(--panel); line-height: 1.4; }
.ed-issues li.error { border-color: var(--bad); background: #2a1418; }
.ed-issues li.warning { border-color: var(--gold); background: #2a2414; }
.ed-issues.big li { font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.ed-sev { font-family: var(--font-label); font-size: 10px; text-transform: uppercase; color: var(--dim); }
.ed-confirm { background: #2a1e10; box-shadow: 0 0 0 2px var(--gold); padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.ed-confirm.top { margin: 8px 12px 0; }
.ed-ok { color: var(--good); font-size: 14px; margin: 0; }
.ed-warnbox { background: #33290f; color: #ffe0a3; padding: 8px 10px; font-size: 14px; }
.ed-toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 60; background: #1d2238; box-shadow: 0 0 0 2px var(--accent), 0 10px 30px rgba(0, 0, 0, 0.5); padding: 9px 14px; font-size: 14px; max-width: min(92vw, 640px); transition: opacity 160ms, transform 160ms; }
.ed-toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Aper\xE7us */
.ed-look { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 14px; align-items: start; }
.ed-look-preview { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #0e1018; padding: 12px 10px; position: sticky; top: 0; }
.ed-portrait { width: 96px; height: 96px; background: #151a2a; box-shadow: 0 0 0 2px var(--line2); }
.ed-locprev { display: flex; flex-direction: column; gap: 6px; }
.ed-locprev canvas { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; height: auto; background: #000; display: block; box-shadow: 0 0 0 2px var(--line); }
.ed-locprev canvas.placing { cursor: crosshair; box-shadow: 0 0 0 3px var(--accent); }
.ed-placing { font-size: 13px; color: var(--accent); }
.ed-cover { max-width: 520px; }
.ed-cover canvas { width: 100%; aspect-ratio: 16 / 9; display: block; image-rendering: pixelated; background: #000; }

/* \xC9diteur de script */
.ed-script { display: flex; flex-direction: column; gap: 6px; }
.ed-script-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ed-script-tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ed-sep { width: 2px; align-self: stretch; background: var(--line); margin: 0 4px; }
.ed-builder { padding: 12px; }
.ed-bpreview { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.ed-bpreview pre { background: #0b0e16; padding: 8px 10px; margin: 0; font-size: 12.5px; overflow: auto; white-space: pre; width: 100%; line-height: 1.5; color: #d8dcea; }
.ed-script-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.ed-script-main.with-side { grid-template-columns: minmax(0, 1fr) 300px; }
.ed-code { display: flex; height: clamp(280px, 56vh, 680px); resize: vertical; overflow: hidden; background: #0b0e16; box-shadow: 0 0 0 2px var(--line); font-family: var(--mono); font-size: 13px; line-height: var(--lh); min-height: 160px; }
.ed-code:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.ed-gutter { width: 46px; flex: none; overflow: hidden; padding: 8px 8px 8px 0; text-align: right; color: var(--faint); background: #0e1220; user-select: none; font-variant-numeric: tabular-nums; }
.ed-gutter > div { height: var(--lh); }
.ed-gutter .ge { color: #ff9b9b; background: #3a1820; }
.ed-gutter .gw { color: #ffd27a; background: #33290f; }
.ed-code-area { position: relative; flex: 1; min-width: 0; }
.ed-hl, .ed-ta { position: absolute; inset: 0; margin: 0; padding: 8px 10px; font: inherit; line-height: var(--lh); white-space: pre; tab-size: 2; letter-spacing: 0; word-spacing: 0; overflow-wrap: normal; word-break: normal; box-sizing: border-box; }
.ed-hl { overflow: hidden; pointer-events: none; color: #d8dcea; }
.ed-hl .l { height: var(--lh); min-width: 100%; width: max-content; }
.ed-hl .l.le { background: rgba(240, 106, 106, 0.16); }
.ed-hl .l.lw { background: rgba(255, 210, 90, 0.1); }
.ed-ta { width: 100%; height: 100%; background: transparent; color: transparent; caret-color: #ffffff; border: 0; outline: none; resize: none; overflow: auto; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: rgba(245, 197, 66, 0.35); }
i[class^='t-'] { font-style: normal; }
.t-c { color: #6d7491; } .t-n { color: #f5c542; } .t-ch { color: #ffd25a; } .t-k { color: #b893ff; } .t-lock { color: #f0a15a; }
.t-fx { color: #6ad48a; } .t-j { color: #7cb7ff; } .t-s { color: #f08a5d; } .t-kw { color: #ff7ab8; } .t-nar { color: #aab1c7; }
.t-sp { color: #4fd6c4; } .t-spx { color: #ff8a8a; text-decoration: underline wavy #ff8a8a; } .t-emo { color: #8fa0c8; } .t-x { color: #e2c2ff; } .t-tag { color: #c9a0ff; }
.ed-side { background: var(--panel); padding: 10px; max-height: clamp(280px, 56vh, 680px); overflow: auto; font-size: 13px; box-shadow: 0 0 0 2px var(--line); }
.ed-plan-node { margin: 6px 0 10px; }
.ed-plan-node > .ed-link { color: var(--accent); font-family: var(--mono); }
.ed-plan-ch { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--dim); font-size: 12px; padding: 2px 0 2px 10px; cursor: pointer; font-family: inherit; }
.ed-plan-ch:hover { color: var(--ink); background: #1b2034; }
.ed-script-status { font-size: 12px; color: var(--dim); min-height: 16px; }
.ed-script-status .bad { color: #ffb3b3; }
.ed-help { display: flex; flex-direction: column; gap: 8px; }
.ed-help h4 { margin: 10px 0 4px; color: var(--gold); font-size: 14px; }
.ed-help dl { margin: 0; }
.ed-help dl > div { display: grid; grid-template-columns: minmax(170px, 40%) 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.ed-help.compact dl > div { grid-template-columns: 1fr; gap: 2px; }
.ed-help dt code { font-size: 12px; color: #ffe7a0; background: none; padding: 0; white-space: pre-wrap; word-break: break-word; }
.ed-help dd { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.4; }
.ed-help-ids { margin-top: 8px; }

/* Validation, simulation */
.ed-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.ed-kpis > div { background: var(--panel2); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.ed-kpis b { font-size: 22px; }
.ed-kpis span { font-size: 12px; color: var(--dim); }
.ed-kpis .bad b { color: var(--bad); }
.ed-bars { display: flex; flex-direction: column; gap: 6px; }
.ed-bar { display: grid; grid-template-columns: minmax(150px, 260px) 1fr 120px; gap: 10px; align-items: center; font-size: 13px; }
.ed-bar.zero .ed-link { color: #ff9b9b; }
.ed-bar-track { height: 10px; background: #2a2f45; }
.ed-bar-track i { display: block; height: 100%; background: var(--accent2); }
.ed-progress { height: 8px; background: #2a2f45; min-width: 120px; }
.ed-progress i { display: block; height: 100%; background: var(--accent); transition: width 120ms; }
.ed-order { margin: 6px 0; padding-left: 22px; font-size: 13px; }
.ed-order li { margin: 3px 0; }
.ed-steps { padding-left: 22px; margin: 0; }
.ed-steps li { margin: 6px 0; line-height: 1.45; }
.ed-json { min-height: 52vh; width: 100%; font-size: 12.5px; white-space: pre; }

/* Biblioth\xE8que */
.ed-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.ed-lib-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ed-lib-card h2 { margin: 0; font-size: 19px; }
.ed-lib-card p { margin: 0; }
.ed-recover { display: flex; gap: 10px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }

@media (max-width: 1100px) {
  .ed-script-main.with-side { grid-template-columns: minmax(0, 1fr); }
  .ed-side { max-height: 320px; }
}
@media (max-width: 860px) {
  .ed-body { flex-direction: column; }
  .ed-nav { width: auto; border-right: 0; border-bottom: 2px solid var(--line); padding: 6px 10px; overflow: visible; }
  .ed-nav-toggle { display: block; width: 100%; text-align: left; background: var(--panel2); border: 0; color: var(--ink); padding: 8px 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .ed-nav-items { display: none; }
  .ed-nav.open .ed-nav-items { display: block; max-height: 62vh; overflow: auto; }
  .ed-nav-cover { display: none; }
  .ed-main { padding: 12px 12px 80px; }
  .ed-md { grid-template-columns: minmax(0, 1fr); }
  .ed-list { position: static; max-height: 360px; }
  .ed-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span2 { grid-column: 1 / -1; }
  .ed-look { grid-template-columns: minmax(0, 1fr); }
  .ed-look-preview { position: static; }
  .ed-title b { max-width: 60vw; }
  .ed-bar { grid-template-columns: minmax(0, 1fr) 90px; }
  .ed-bar .ed-bar-track { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 520px) {
  .ed-grid { grid-template-columns: minmax(0, 1fr); }
  .ed-help dl > div { grid-template-columns: 1fr; gap: 2px; }
  .ed-top .pbtn.small { padding: 0.25em 0.45em; }

* Le dire tout de suite \xE0 Bruno #prudent
  ~ var.blesse = 1; stat.sante -= 5; rel.bruno += 4
  > Petite \xE9longation. Une semaine de repos et de soins.
* Serrer les dents et continuer #risque
  test stat.physique + stat.sante / 4 vs 58
  si reussite
    > La douleur passe. Tu as eu de la chance.
  sinon
    > \xC7a empire. D\xE9chirure. Trois semaines d'arr\xEAt.
    ~ var.blesse = 3; var.blessures += 1; var.genou += 1; stat.sante -= 20
    ~ souvenir(bruno, alerte, "Il t'avait dit d'\xE9couter ton corps")`,title:"Une douleur \xE0 la cuisse",when:"var.blesse == 0",cooldown:6,weight:"1 + var.genou * 0.6 + (stat.energie < 40 ? 2 : 0) + (stat.sante < 60 ? 1.5 : 0)"},{id:"al_grippe",trigger:"random",script:`> Fi\xE8vre, courbatures, nez qui coule. La grippe t'a eu.
~ stat.energie -= 30; stat.forme -= 8; stat.sante -= 10
* Rester au lit et te soigner #prudent
  ~ stat.energie += 15; actions -= 1
* T'entra\xEEner quand m\xEAme #risque
  ~ stat.statut += 2; stat.sante -= 10`,title:"La grippe",cooldown:10,weight:1},{id:"al_supporter",trigger:"random",script:`> \xC0 la sortie de l'entra\xEEnement, un gamin de huit ans t'attend avec un maillot trop grand et un feutre.
* Signer, discuter, faire un selfie #fans
  ~ stat.reputation += 1; stat.moral += 4; stat.notoriete += 1
  > Sa m\xE8re te remercie. Le gamin ne dit pas un mot ; il tremble de bonheur.
* Signer vite fait, tu es press\xE9
  ~ stat.moral += 1
* L'ignorer
  ~ stat.reputation -= 1
  > Sur les r\xE9seaux, une vid\xE9o montre un enfant en larmes et toi qui passes. Mauvaise publicit\xE9.
  ~ stat.notoriete += 1`,title:"Un jeune supporter",when:"stat.reputation >= 10",cooldown:5,weight:1.2},{id:"al_recruteur",trigger:"random",script:`> On murmure que des recruteurs \xE9trangers \xE9taient au stade cette semaine. Pour toi.
~ stat.reputation += 3; stat.confiance += 4`,title:"Des recruteurs dans les tribunes",when:"stat.forme >= 60",cooldown:6,weight:1},{id:"al_panne_reveil",trigger:"random",script:`> Ton t\xE9l\xE9phone s'est \xE9teint pendant la nuit. Tu ouvres les yeux\u2026 vingt minutes apr\xE8s le d\xE9but de l'entra\xEEnement.
* Courir jusqu'au centre sans petit-d\xE9jeuner #effort
  ~ stat.energie -= 20; stat.statut -= 1
  > Tu arrives en sueur, avec dix minutes de retard. Le coach te regarde, sans un mot.
* Inventer une excuse #mensonge
  test stat.mental vs 55
  si reussite
    > \xAB Un accident sur la rocade. \xBB Personne ne v\xE9rifie.
  sinon
    > Le coach a vu ta story Instagram de la veille \xE0 deux heures du matin.
    ~ stat.statut -= 6; stat.discipline -= 4
* Appeler pour pr\xE9venir et assumer #honnete
  ~ stat.statut -= 2; stat.discipline += 1`,title:"Panne de r\xE9veil",cooldown:8,weight:1},{id:"al_interview_improvisee",trigger:"random",script:`> \xC0 la sortie du stade, un journaliste te tend un micro. \xAB Votre entra\xEEneur ne vous fait pas assez jouer. Vous \xEAtes frustr\xE9 ? \xBB
* \xAB Je respecte ses choix et je travaille. \xBB #humble
  ~ stat.statut += 2; stat.reputation += 1
* \xAB Oui. Je m\xE9rite plus de temps de jeu. \xBB #ambition
  ~ stat.notoriete += 3; stat.statut -= 4; stat.confiance += 2
* \xAB Pas de commentaire. \xBB
  ~ stat.notoriete += 1`,title:"Micro tendu",when:"temps.chapitre >= 2",cooldown:4,weight:1.2},{id:"al_rumeur_transfert",trigger:"random",script:`> Un grand journal annonce que tu es \xAB dans le viseur \xBB d'un club \xE9tranger. Ton t\xE9l\xE9phone explose.
* D\xE9mentir publiquement : tu es bien ici #loyal
  ~ stat.statut += 3; stat.reputation += 1
  [var.club_id == rivemont] ~ rel.vasseur += 4
* Laisser planer le doute #ambition
  ~ stat.notoriete += 3; stat.statut -= 3
  > Les supporters commencent \xE0 te siffler.`,title:"Rumeur de transfert",when:"temps.chapitre >= 3 et stat.reputation >= 40",cooldown:6,weight:1},{id:"al_coequipier_endette",trigger:"random",script:`> Un jeune co\xE9quipier vient te voir, g\xEAn\xE9. Son p\xE8re a perdu son travail ; la famille ne peut plus payer le loyer.
* Lui pr\xEAter de l'argent #genereux
  ~ stat.argent -= 4000; stat.moral += 6; stat.statut += 2; var.mentorat += 1
  > Il te rembourse six mois plus tard, jusqu'au dernier euro. Et il te le rappelle chaque fois qu'il marque.
* L'orienter vers l'aide sociale du club #prudent
  ~ var.mentorat += 1
* Lui dire que ce n'est pas ton probl\xE8me
  ~ stat.statut -= 2; stat.moral -= 2`,title:"Un co\xE9quipier dans le besoin",when:"temps.chapitre >= 2 et stat.argent >= 5000",cooldown:12,weight:.8},{id:"al_maman_malade",trigger:"random",script:`!son telephone
> Ta m\xE8re a fait un malaise au travail. Rien de grave, disent les m\xE9decins, mais elle doit se reposer.
* Aller la voir imm\xE9diatement, quitte \xE0 rater un entra\xEEnement #famille
  ~ rel.maman += 12; stat.statut -= 4; var.entraine = vrai
  > Elle sourit en te voyant entrer. \xAB Tu n'aurais pas d\xFB venir. \xBB Elle te serre la main tr\xE8s fort.
* [stat.argent >= 2000] Lui payer une aide \xE0 domicile #genereux
  ~ stat.argent -= 2000; rel.maman += 6
* Lui envoyer un message
  ~ rel.maman -= 6`,title:"Un appel de l'h\xF4pital",when:"rel.maman >= 0 et non var.maman_partie",cooldown:30,weight:.5},{id:"al_defi_reseaux",trigger:"random",script:`> Un d\xE9fi de jonglage circule sur les r\xE9seaux. Des milliers de joueurs pros s'y collent.
* Relever le d\xE9fi avec une figure folle #artiste
  test stat.technique vs 60
  si reussite
    > Trois millions de vues en une nuit.
    ~ stat.notoriete += 6; stat.moral += 4
  sinon
    > Tu rates tout, en beaut\xE9. Douze millions de vues. Pour les mauvaises raisons.
    ~ stat.notoriete += 8; stat.confiance -= 4
* Laisser passer
  ~ stat.discipline += 1`,title:"Le d\xE9fi viral",when:"stat.notoriete >= 8",cooldown:6,weight:.9},{id:"al_achat_impulsif",trigger:"random",script:`> Une montre de luxe dans une vitrine. Le prix d'un petit appartement.
* L'acheter #flambeur
  ~ stat.argent -= min(stat.argent, 15000); stat.notoriete += 3; stat.moral += 4
* Passer ton chemin #prudent
  ~ stat.discipline += 1`,title:"La vitrine",when:"stat.argent >= 20000",cooldown:10,weight:.7},{id:"al_hopital_enfants",trigger:"random",script:`> Le club organise une visite \xE0 l'h\xF4pital p\xE9diatrique. Tu n'es pas oblig\xE9 d'y aller.
* Y aller, et rester toute l'apr\xE8s-midi #genereux
  ~ stat.reputation += 2; stat.moral += 8; var.engagement += 1; stat.energie -= 10
  > Un petit gar\xE7on chauve te fait promettre de marquer samedi. Tu promets.
  ~ var.promesse_enfant = vrai
* Envoyer des maillots d\xE9dicac\xE9s
  ~ stat.reputation += 1`,title:"Visite \xE0 l'h\xF4pital des enfants",when:"temps.chapitre >= 2",cooldown:15,weight:.6},{id:"al_bonne_nuit",trigger:"random",script:`> Tu as dormi neuf heures d'affil\xE9e. Tu te r\xE9veilles avec l'impression de pouvoir courir un marathon.
~ stat.energie += 25; stat.moral += 5; stat.forme += 4`,title:"Une nuit parfaite",cooldown:4,weight:1.2},{id:"al_ancien_joueur",trigger:"random",script:`> Un ancien joueur du club, la soixantaine, t'aborde au bord du terrain.

  ~ stat.mental += 3; stat.energie += 5
* Le remercier, poliment, sans plus
  ~ stat.mental += 1`,title:"Le vieux du club",when:"temps.chapitre >= 2",cooldown:12,weight:.8},{id:"al_pari_djibril",trigger:"random",script:`> Djibril t'envoie un message : \xAB Fr\xE8re, dis-moi juste si votre d\xE9fenseur central est bless\xE9 pour samedi. C'est pour un pari, rien de m\xE9chant. \xBB

  ~ rel.djibril -= 3; stat.discipline += 2`,title:"Le tuyau",when:"temps.chapitre >= 3 et rel.djibril >= 10 et non var.djibril_prison",cooldown:20,weight:.6},{id:"al_ines_message",trigger:"random",script:`> \xAB Pens\xE9 \xE0 toi en voyant la mer ce matin. Rentre vite. \xBB
* Lui r\xE9pondre longuement #romance
  ~ rel.ines += 4; stat.moral += 4
* Un c\u0153ur, et au lit
  ~ rel.ines += 1`,title:"Un message d'In\xE8s",when:"var.couple",cooldown:4,weight:1.2},{id:"al_promesse_enfant",trigger:"random",script:`> Une lettre arrive au club, \xE9crite au feutre. \xAB Merci d'avoir marqu\xE9. Je suis gu\xE9ri. Sign\xE9 : le petit gar\xE7on de l'h\xF4pital. \xBB
~ stat.moral += 15; stat.reputation += 2`,title:"La promesse",when:"var.promesse_enfant et var.buts >= 1",once:!0,weight:3},{id:"intro",trigger:"manual",script:`!moment soir
!retirer moreau
!placer moi 150 gauche
!placer maman 112 droite
> Rivemont, fin ao\xFBt. La vieille voiture de ta m\xE8re s'est arr\xEAt\xE9e devant le centre de formation du Stade Rivemont.
maman (inquiet): Voil\xE0. On y est.
maman: Tu as pris ta trousse de toilette ? Tes prot\xE8ge-tibias ? Ton chargeur ?
* Maman. J'ai tout. Promis.
  maman (content): D'accord, d'accord. Je me tais.
* (La serrer dans tes bras sans rien dire) #famille
  ~ rel.maman += 6
  maman (emu): Mon grand\u2026
maman: \xC9coute-moi bien. Le foot, c'est ton r\xEAve, je le sais. Mais promets-moi une chose.
maman (serieux): Tu passes ton bac. Quoi qu'il arrive.
* Je te le promets. #cle #famille
  ~ var.promesse_bac = vrai; rel.maman += 8
  ~ souvenir(maman, promesse, "Tu lui as promis de passer ton bac")
  maman (content): Je te fais confiance.
* Je ferai de mon mieux.
  ~ rel.maman += 2
  maman: \xAB De mon mieux \xBB\u2026 Bon. C'est d\xE9j\xE0 \xE7a.
* Je vais devenir pro, maman. Le bac, \xE7a ne sert \xE0 rien. #cle #ambition
  ~ rel.maman -= 8; stat.confiance += 5
  ~ souvenir(maman, refus_bac, "Tu lui as dit que le bac ne servait \xE0 rien")
  maman (triste): \u2026On en reparlera.
maman: Ton fr\xE8re t'a fait \xE7a. Il a pass\xE9 la soir\xE9e dessus.
> Elle te tend un dessin : toi, en maillot, soulevant une coupe immense. En bas, en grosses lettres : \xAB MON FR\xC8RE LE CHAMPION \xBB.
~ rencontrer(yanis)
maman (emu): Allez, file. Ils t'attendent.
!sortir maman gauche
!lieu chambre_centre 230 jour
> Ta chambre. Deux lits, un bureau, une fen\xEAtre sur le terrain. Ton colocataire est d\xE9j\xE0 install\xE9.
!placer karim 90 droite
karim (content): Yo ! T'es le nouveau ? Karim. Ailier gauche, le plus rapide du centre. Et le plus beau, accessoirement.
* Enchant\xE9. Moi, c'est {joueur.nom}. #sociable
  ~ rel.karim += 5
  karim: Bienvenue, {joueur.nom}. T'inqui\xE8te, je te fais visiter.
* \xAB Le plus rapide \xBB ? On verra \xE7a sur le terrain. #ambition
  ~ rel.karim += 2; stat.confiance += 2
  karim (rire): Ha ! J'aime bien. On fera la course demain.
* (Hocher la t\xEAte, sans plus)
  ~ rel.karim -= 2
  karim: Pas bavard, hein ? \xC7a viendra.
karim: Le coach Moreau fait sa premi\xE8re s\xE9ance demain matin, sur le terrain. Un conseil : sois \xE0 l'heure. Il ne pardonne rien.
~ objectif(contrat, "D\xE9crocher un contrat professionnel \xE0 la fin de la saison")
> D\xE9place-toi avec \u2190 \u2192 ou en cliquant. Interagis avec E. Chaque semaine, tu as 3 actions ; l'entra\xEEnement collectif t'attend au terrain (passe par le couloir puis le vestiaire, ou ouvre le PLAN).`,title:"L'arriv\xE9e"},{id:"ch1_premier_entrainement",trigger:"enter:terrain",script:`~ var.entraine = vrai
!placer moreau 300 gauche
!placer moi 250 droite
!placer karim 336 gauche 1
!placer lucas 366 gauche 2
moreau: Bonjour, messieurs. Pour les nouveaux : je suis Didier Moreau. Ici, personne ne vous doit rien.
moreau: Sur cent gamins qui passent ce portail, dix signent pro. Trois font carri\xE8re. Regardez votre voisin : statistiquement, il ne sera plus l\xE0 dans deux ans.
lucas (fier): Moi, je serai l\xE0. Mon p\xE8re dit que\u2026
moreau (colere): Ton p\xE8re n'est pas sur ce terrain, Ferrand.
!emote lucas sueur
moreau: Exercice. Trois contre deux, on termine par une frappe. {joueur.nom}, tu commences.
~ rencontrer(lucas); rencontrer(moreau)
!equipe chasubles orange #ffffff #25222b orange
!preset exercice
!camera moi
> Le ballon arrive dans tes pieds. Karim se d\xE9marque \xE0 gauche, Lucas s'agite au point de penalty. Un d\xE9fenseur en chasuble fonce sur toi.
* Faire la passe \xE0 Karim #collectif
  test stat.passe vs 40
  !ballon vers karim passe
  !son passe
  si reussite
    !anim karim frappe
    !son frappe
    !ballon vers but tir
    > Passe millim\xE9tr\xE9e. Karim n'a plus qu'\xE0 pousser le ballon au fond.
    karim (content): \xC7a, c'est une passe !
    ~ rel.karim += 10; rel.moreau += 4; stat.passe += 1
    ~ souvenir(karim, premiere_passe, "Ta passe d\xE9cisive d\xE8s le premier entra\xEEnement")
  sinon
    > Ta passe est un peu longue. Karim la r\xE9cup\xE8re quand m\xEAme et tente sa chance : \xE0 c\xF4t\xE9.
    ~ rel.karim += 4; rel.moreau += 2
  moreau: Bonne lecture. Le football se joue \xE0 onze.
* Tenter de dribbler le d\xE9fenseur #individuel
  test stat.technique vs 45
  si reussite
    !courir moi 470
    > Crochet, acc\xE9l\xE9ration : le d\xE9fenseur est dans le vent.
    !anim moi frappe
    !son frappe
    !ballon vers but tir
    > Et tu conclus !
    ~ stat.confiance += 6; rel.moreau += 2; rel.karim -= 3; stat.technique += 1
    karim (pensif): J'\xE9tais seul, hein\u2026
  sinon
    !anim plot1 tacle
    !ballon vers plot1 passe
    > Le d\xE9fenseur te lit comme un livre ouvert. Ballon perdu.
    ~ stat.confiance -= 5; rel.moreau -= 4; rel.karim -= 3
    moreau: Le dribble est un outil. Pas une religion.
* Frapper directement #individuel #frappe
  test stat.frappe vs 52
  !anim moi frappe
  !son frappe
  si reussite
    !ballon vers but tir
    > De loin, ta frappe se loge sous la barre. Un silence, puis quelques sifflements admiratifs.
    ~ stat.confiance += 8; rel.moreau += 3; stat.reputation += 2; rel.lucas -= 5
    lucas (colere): Coup de chance.
  sinon
    !ballon vers dessus tir
    > Le ballon termine sa course dans le grillage. Quelqu'un ricane.
    ~ stat.confiance -= 4; rel.moreau -= 5
    lucas (moqueur): Joli. Les oiseaux te remercient.
* Garder le ballon et temporiser #prudent
  > Tu prot\xE8ges le ballon, dos au jeu, en attendant du soutien. Le jeu ralentit.
  moreau: Temporiser, c'est bien. Trop temporiser, c'est dispara\xEEtre.
  ~ rel.moreau += 1; stat.mental += 1
!ballon cacher
moreau: Bien. Tout le monde \xE0 la douche. On remet \xE7a la semaine prochaine.
> Chaque semaine, l'entra\xEEnement collectif a lieu ici. Le coach remarque les absents.`,title:"Premier entra\xEEnement",when:"temps.semaine == 1",chapters:["ch1"],priority:100,once:!0},{id:"ch1_cantine_lucas",trigger:"enter:cantine",script:`!placer lucas 300 gauche
!placer moi 250 droite
> Plateau en main, tu cherches une place. Lucas te barre la route, entour\xE9 de deux types de l'\xE9quipe.
lucas (fier): Tiens, le prodige. Il para\xEEt que ta m\xE8re t'a accompagn\xE9 jusqu'\xE0 la porte. Elle te coupe aussi ta viande ?
> Ses copains rient. Toute la cantine regarde.
* R\xE9pondre avec humour #sociable
  test stat.mental + stat.confiance / 4 vs 50
  si reussite
    moi: Au moins, elle ne vient pas jouer \xE0 ma place. Ton p\xE8re, il fait encore tes contr\xF4les orient\xE9s ?
    > \xC9clat de rire g\xE9n\xE9ral. M\xEAme un des copains de Lucas pouffe.
    ~ stat.confiance += 5; rel.lucas -= 6; stat.reputation += 1
    lucas (colere): \u2026Tu vas le regretter.
  sinon
    moi: Euh\u2026 Elle est sympa, ma m\xE8re.
    > Ta r\xE9plique tombe \xE0 plat. Les rires redoublent.
    ~ stat.moral -= 5; stat.confiance -= 3
* L'ignorer et passer ton chemin #prudent
  > Tu le contournes sans un mot. Lucas hausse les \xE9paules, d\xE9\xE7u de ne pas avoir son spectacle.
  ~ stat.mental += 2; rel.lucas += 2
* Lui renverser ton plateau dessus #impulsif #cle
  ~ var.bagarre_cantine = vrai; rel.lucas -= 25; stat.discipline -= 10; stat.confiance += 6
  !anim moi interagir
  !emote lucas colere
  > Pur\xE9e, sauce et compote sur un surv\xEAtement tout neuf. Lucas se jette sur toi ; il faut trois \xE9ducateurs pour vous s\xE9parer.
  ~ souvenir(lucas, humiliation, "Tu l'as humili\xE9 devant toute la cantine")
  ~ planifier(ch1_convocation_bagarre, 1)
  karim (surpris): T'es compl\xE8tement fou\u2026 Mais c'\xE9tait magnifique.
  ~ rel.karim += 4
* [rel.karim >= 15] Laisser Karim lui r\xE9pondre
  karim: Lucas, t'as pas des crampons \xE0 faire cirer par ton papa ?
  > Lucas rougit et s'\xE9loigne. Karim te fait un clin d'\u0153il.
  ~ rel.karim += 3; rel.lucas -= 4`,title:"Le plateau",when:"temps.semaine <= 3",chapters:["ch1"],priority:60,once:!0},{id:"ch1_convocation_bagarre",trigger:"scheduled",script:`!lieu bureau_moreau 120
moreau (colere): Assieds-toi. La cantine. Le plateau. Explique-moi.
* Lucas m'a provoqu\xE9. #honnete
  moreau: Et alors ? Sur le terrain, on te provoquera chaque week-end. Tu renverseras ton plateau sur l'arbitre ?
  ~ rel.moreau -= 4
* Vous avez raison, coach. \xC7a ne se reproduira pas. #discipline
  ~ rel.moreau += 3; stat.discipline += 4
  moreau: J'esp\xE8re bien.
moreau: Tu es priv\xE9 du prochain match. Et tu nettoies le vestiaire toute la semaine.
~ var.suspendu = 1; stat.statut -= 6`,title:"Convocation"},{id:"ch1_rencontre_ines",trigger:"enter:salle_cours",script:`!placer ines 196 gauche
!placer moi 160 droite
> Cours de math\xE9matiques, obligatoire pour les pensionnaires. Une fille rel\xE8ve la t\xEAte quand tu entres.
ines: Tu es le nouveau footeux ? Assieds-toi, il reste une place \xE0 c\xF4t\xE9 de moi. Je ne mords pas. Enfin, pas en maths.
~ rencontrer(ines)
* Tu es aussi au centre ? #sociable
  ines: Non, je suis au lyc\xE9e d'\xE0 c\xF4t\xE9. Le centre loue nos salles. Je pr\xE9pare le concours de kin\xE9. Kin\xE9 du sport.
  ~ rel.ines += 4
* Les maths, c'est pas trop mon truc\u2026 #honnete
  ines (content): \xC7a tombe bien, c'est le mien. Je t'aide, si tu veux. En \xE9change, tu m'expliques le hors-jeu : mon p\xE8re hurle devant la t\xE9l\xE9 et je n'ai jamais compris pourquoi.
  ~ rel.ines += 6; var.aide_ines = vrai
* (Jouer les beaux gosses) Tu viens me voir jouer samedi ?
  ines (pensif): \u2026On se conna\xEEt depuis dix secondes.
  ~ rel.ines -= 3
ines: Bon. Exercice 4. Tu commences ?
[var.aide_ines] ~ stat.etudes += 4`,title:"La voisine de table",chapters:["ch1"],priority:60,once:!0},{id:"ch1_karim_secret",trigger:"tick_start",script:`!lieu chambre_centre 200 nuit
!placer karim 120 droite
!placer moi 200 gauche
> Il est minuit pass\xE9. Karim est assis sur son lit, habill\xE9, son sac sur les genoux.
karim (triste): Tu dors pas ? \u2026\xC9coute. Mon p\xE8re est \xE0 l'h\xF4pital depuis lundi. Le c\u0153ur. Ma m\xE8re dit que c'est grave.
karim: Les sorties sont interdites en semaine, tu le sais. Mais je dois le voir. J'y vais cette nuit et je reviens avant le r\xE9veil.
karim: Si le surveillant passe pour l'appel de minuit et demi\u2026 tu peux dire que je suis aux toilettes ? Ou glisser un oreiller sous ma couette ?
* Je te couvre. Vas-y. #loyal #cle
  ~ var.karim_couvert = vrai; rel.karim += 18
  ~ souvenir(karim, couvert, "Tu l'as couvert la nuit o\xF9 il est all\xE9 voir son p\xE8re")
  karim (emu): Je te revaudrai \xE7a. Je te le jure.
  !sortir karim droite
  test stat.mental + stat.confiance / 3 vs 55
  si reussite
    > Le surveillant passe et jette un \u0153il \xE0 l'oreiller sous la couette. Ton c\u0153ur cogne. Il repart.
    > Karim rentre \xE0 l'aube, les yeux rouges. Il te serre la main sans un mot.
  sinon
    > Le surveillant soul\xE8ve la couette. L'oreiller roule par terre.
    ~ var.karim_pris = vrai; rel.moreau -= 8; stat.discipline -= 6
    ~ planifier(ch1_karim_sanction, 1)
* Je viens avec toi. #loyal #cle
  ~ var.karim_accompagne = vrai; rel.karim += 22; stat.discipline -= 4
  ~ souvenir(karim, accompagne, "Tu l'as accompagn\xE9 \xE0 l'h\xF4pital, en pleine nuit")
  karim (surpris): T'es s\xE9rieux ? \u2026Merci, fr\xE8re.
  !fondu
  > Deux heures de bus de nuit. Le p\xE8re de Karim dort, reli\xE9 \xE0 des machines. Karim lui tient la main longtemps.
  > Vous rentrez au petit matin\u2026 pile quand Moreau termine son jogging.
  ~ rel.moreau -= 10; stat.energie -= 30
  ~ planifier(ch1_karim_sanction, 1)
* D\xE9sol\xE9. Si on se fait prendre, on est vir\xE9s tous les deux. #prudent #cle
  ~ var.karim_refuse = vrai; rel.karim -= 18
  ~ souvenir(karim, refus, "Tu as refus\xE9 de le couvrir la nuit o\xF9 son p\xE8re \xE9tait \xE0 l'h\xF4pital")
  karim (triste): \u2026Ouais. Je comprends. Laisse tomber.
  > Il d\xE9fait son sac en silence et se couche dos \xE0 toi. Tu ne dors pas beaucoup cette nuit-l\xE0.
* Je pr\xE9viens le surveillant. Les r\xE8gles sont les r\xE8gles. #trahison #cle
  ~ var.karim_denonce = vrai; rel.karim -= 45; rel.moreau += 5; stat.discipline += 5
  ~ souvenir(karim, trahison, "Tu l'as d\xE9nonc\xE9 au surveillant")
  karim (colere): T'as fait QUOI ?
  > Le lendemain, tout le centre sait que tu as \xAB balanc\xE9 \xBB. Karim est priv\xE9 de sortie pour un mois.
  ~ stat.reputation -= 3; rel.lucas += 6`,title:"La nuit de Karim",when:"temps.semaine == 3 et non var.karim_renvoye",chapters:["ch1"],priority:90,once:!0},{id:"ch1_karim_sanction",trigger:"scheduled",script:`!lieu bureau_moreau 120
!placer karim 92 droite
moreau (colere): Entrez. Tous les deux.
si var.karim_accompagne
  moreau: Six heures du matin, en plein footing, je croise deux de mes joueurs qui rentrent en douce. Vous me prenez pour qui ?
sinon
  moreau: Un oreiller sous une couette. S\xE9rieusement ? On n'est pas en colonie de vacances.
karim: Coach, c'est moi. Mon p\xE8re est \xE0 l'h\xF4pital, je\u2026
moreau: Je sais, pour ton p\xE8re, Benali. L'h\xF4pital a appel\xE9. Tu crois que je n'aurais pas sign\xE9 une autorisation si tu me l'avais demand\xE9e ?
!emote karim sueur
* Assumer : \xAB C'\xE9tait aussi mon id\xE9e. \xBB #loyal
  ~ rel.karim += 8; rel.moreau += 4
  moreau: Au moins, tu ne te caches pas.
* Rester silencieux
  ~ rel.moreau -= 2
moreau: Une semaine de corv\xE9es pour vous deux. La prochaine fois, vous frappez \xE0 cette porte avant de faire le mur.
~ stat.statut -= 4`,title:"Dans le bureau du coach"},{id:"ch1_djibril_fete",trigger:"enter:quartier",script:`!placer djibril 400 gauche
!placer moi 356 droite
djibril (content): Regardez qui revient au bercail ! Le footballeur professionnel !
djibril: Samedi soir, grosse soir\xE9e chez mon cousin. Tout le quartier sera l\xE0. Tu viens, j'esp\xE8re ? Tu nous dois bien \xE7a.
moi: Samedi ? J'ai match dimanche matin.
djibril: Justement ! Tu passes, tu rentres \xE0 minuit. Allez, Cendrillon.
* D'accord, mais je rentre t\xF4t. #fete
  ~ var.fete_veille_match = vrai; rel.djibril += 10; stat.moral += 6
  djibril: Voil\xE0 ! Je savais que t'\xE9tais rest\xE9 un vrai.
* D\xE9sol\xE9, pas cette fois. Le match compte trop. #discipline
  ~ rel.djibril -= 6; stat.discipline += 3
  djibril (pensif): T'as chang\xE9, toi. Bon. La prochaine, alors.
* [rel.djibril >= 30] Lui proposer plut\xF4t de venir voir ton match #sociable
  djibril (rire): Moi, dans un stade, \xE0 neuf heures du matin ? \u2026Bon. Pour toi, d'accord.
  ~ var.djibril_au_match = vrai; rel.djibril += 4
djibril: Au fait. Ton petit fr\xE8re tra\xEEne avec les grands du b\xE2timent D. Je dis \xE7a, je dis rien.
~ var.alerte_yanis = vrai`,title:"La soir\xE9e de Djibril",when:"temps.semaine >= 2 et temps.semaine <= 6",chapters:["ch1"],priority:60,once:!0},{id:"ch1_lendemain_de_fete",trigger:"tick_end",script:`!lieu chambre_centre 200 aube
> Tu es rentr\xE9 \xE0 trois heures du matin. \xAB Minuit \xBB, c'\xE9tait optimiste.
~ stat.energie -= 35; stat.forme -= 10
test stat.discipline vs 45
si echec
  > Pire : une photo de toi, verre \xE0 la main, tourne sur les r\xE9seaux. Quelqu'un l'a montr\xE9e au coach.
  ~ rel.moreau -= 10; stat.statut -= 8
  ~ souvenir(moreau, fete, "Ta soir\xE9e la veille d'un match de championnat")
sinon
  > Personne ne semble au courant. Pour cette fois.`,title:"Lendemain de f\xEAte",when:"var.fete_veille_match",chapters:["ch1"],priority:70,once:!0},{id:"ch1_yanis_batiment_d",trigger:"enter:appart_maman",script:`!placer yanis 200 gauche
!placer moi 156 droite
yanis (content): T'es l\xE0 ! Tu restes manger ? Maman fait des p\xE2tes au thon !
> Yanis porte une casquette neuve. Bien trop ch\xE8re pour le budget de la famille.
* Elle vient d'o\xF9, cette casquette ? #famille
  yanis (inquiet): \u2026Un cadeau. Des grands du b\xE2timent D. Je leur rends des petits services.
  * Lui parler s\xE9rieusement, comme un grand fr\xE8re #famille #cle
