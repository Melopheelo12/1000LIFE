~ var.sorts += 1; stat.reputation += 5; rel.selene += 8; stat.sortileges += 3`,title:"Un sort de haut niveau",when:"stat.sortileges >= 45",priority:6,once:!0},{id:"co_potion_explosion",trigger:"activity:preparer_potion",script:`!fx tremblement
!fx fumee moi
> BOUM. Ton chaudron se transforme en geyser vert. Le plafond du cachot en garde une tache en forme de grenouille.
varn (colere): R\xE9curez. Tout. Et notez ce que vous avez mal fait. Trois fois.
~ stat.moral -= 3; stat.potions += 1; rel.varn -= 1`,title:"Le chaudron explose",when:"stat.potions < 35",cooldown:3,chance:25},{id:"co_potion_parfaite",trigger:"activity:preparer_potion",script:`> Ta potion prend exactement la couleur d\xE9crite dans le livre : un bleu de nuit, avec des reflets d'argent.
varn: \u2026Correct.
> Venant d'elle, c'est un discours.
~ rel.varn += 3; stat.potions += 1; stat.ecus += 5`,title:"La potion parfaite",when:"stat.potions >= 40",cooldown:4},{id:"co_varn_talent",trigger:"activity:preparer_potion",script:`varn: Vous. Restez une minute.
varn (pensif): Vous avez le nez. \xC7a ne s'apprend pas. Ne le g\xE2chez pas en faisant le pitre avec Lambert.
~ rel.varn += 6
~ souvenir(varn, talent, "Elle t'a dit que tu avais le nez pour les potions")`,title:"Le talent",when:"stat.potions >= 28",priority:5,once:!0},{id:"co_brax_conseil",trigger:"activity:entrainement_duel",script:`!placer brax 380 gauche
brax: Ton probl\xE8me, c'est les pieds. Un duel se gagne avec les pieds. La baguette, c'est pour finir.
~ stat.duel += 3; rel.brax += 4`,title:"Le conseil de Brax",when:"stat.duel < 25",priority:5,once:!0},{id:"co_brax_defi",trigger:"activity:entrainement_duel",script:`!placer brax 380 gauche
brax: Montre-moi ce que tu vaux. Contre moi. Trois sorts.
test stat.duel + stat.courage / 4 vs 40 + temps.chapitre * 4
si reussite
  !fx sort moi brax
  > Ton troisi\xE8me sort touche son \xE9paule. Il hausse un sourcil.
  ~ rel.brax += 6; stat.duel += 2; stat.reputation += 2
sinon
  !fx sort brax moi
  > Tu te retrouves la t\xEAte dans le sable. Il te tend la main.
  ~ rel.brax += 2; stat.duel += 1`,title:"Brax te teste",when:"stat.duel >= 30",cooldown:5},{id:"co_bebe_creature",trigger:"activity:soigner_creatures",script:`!placer gaspard 150 droite
gaspard (content): Chut. Regarde.
> Dans la paille, un \u0153uf dor\xE9 se fendille. Un minuscule griffon en sort, tout mouill\xE9, et ouvre le bec vers toi.
gaspard: Le premier visage qu'il voit, c'est sa m\xE8re pour la vie. F\xE9licitations.
~ stat.creatures += 4; stat.moral += 5; rel.gaspard += 5`,title:"La naissance",priority:5,once:!0},{id:"co_creature_ami",trigger:"activity:soigner_creatures",script:`> {var.familier_nom} saute sur ton \xE9paule d\xE8s que tu entres. Il a grandi. Ses yeux de lune brillent plus fort qu'avant.
~ stat.creatures += 1; stat.moral += 3
si stat.ombre >= 30
  > Mais il gronde doucement en reniflant tes mains. Il sent quelque chose qu'il n'aime pas.
  ~ stat.moral -= 2`,title:"Ton familier",when:"var.familier",cooldown:5},{id:"co_passage_secret",trigger:"activity:explorer",script:`> L'escalier s'arr\xEAte net entre deux \xE9tages. Tu pousses une pierre qui d\xE9passe\u2026 et un pan de mur pivote.
> Un passage \xE9troit, qui sent la cire et la poussi\xE8re. Il m\xE8ne directement \xE0 la cour, derri\xE8re la statue.
~ stat.ruse += 3; var.passage = vrai`,title:"Le passage secret",priority:5,once:!0},{id:"co_carte",trigger:"activity:explorer",script:`> Dans une salle oubli\xE9e, une carte du ch\xE2teau peinte sur le mur. Des petits points se d\xE9placent dessus : tous les habitants du ch\xE2teau, en temps r\xE9el.
> Un point immobile, au fond de la R\xE9serve, porte un nom effac\xE9.
~ stat.savoir += 3; var.carte_vue = vrai
si var.malrik_nom
  > Tu sais quel nom c'\xE9tait.`,title:"La carte vivante",when:"chapitre != ch1",priority:5,once:!0},{id:"co_cerf_premier",trigger:"activity:cueillette_foret",script:`> Entre les arbres, un \xE9clair d'argent. Un cerf immense te regarde un instant, puis s'\xE9vanouit dans la brume.
~ stat.creatures += 2; stat.moral += 4; var.cerf_vu = vrai`,title:"Une silhouette d'argent",priority:5,once:!0},{id:"co_foret_danger",trigger:"activity:cueillette_foret",script:`> La brume s'\xE9paissit. Des yeux rouges s'allument entre les troncs. Puis d'autres.
* Rester calme et reculer lentement. #creature
  test stat.creatures + stat.courage / 3 vs 35
  si reussite
    > Les yeux s'\xE9teignent un \xE0 un. Tu rentres sans un bruit.
    ~ stat.creatures += 2
  sinon
    > Une meute de loups-brume te poursuit jusqu'\xE0 la cabane. Gaspard les chasse en hurlant.
    ~ stat.energie -= 25; rel.gaspard -= 1
* Courir ! #peur
  ~ stat.energie -= 15; stat.courage -= 1`,title:"Les yeux dans la brume",cooldown:3,chance:30},{id:"co_vision_lumiere",trigger:"activity:mediter",script:`> Au c\u0153ur de la m\xE9ditation, une lumi\xE8re d'argent t'entoure. La voix du grimoire s'\xE9loigne, comme un bruit de l'autre c\xF4t\xE9 d'une porte.
~ stat.ombre -= 4; stat.moral += 3`,title:"La lumi\xE8re du cercle",when:"stat.ombre >= 15",cooldown:4},{id:"co_vision_future",trigger:"activity:divination",script:`si var.visions >= 6
  > Les \xE9toiles te montrent une clairi\xE8re, douze pierres, une lumi\xE8re violette. Et ta propre main, tendue vers un livre.
  ~ var.vision_cercle = vrai
sinon si var.visions >= 3
  > Les \xE9toiles te montrent No\xE9, seul, dans une robe noire. Il pleure.
  ~ var.vision_noe = vrai
sinon
  > Les \xE9toiles te montrent une silhouette en robe violette, au sommet d'une tour. Est-ce toi ?
~ stat.savoir += 1`,title:"Une vision",cooldown:3},{id:"co_grimoire_premiere",trigger:"activity:lire_grimoire",script:`> Les lettres se r\xE9arrangent sous tes yeux pour former ta langue. La voix est douce, polie, presque timide.
malrik: Merci de revenir. Tu es le premier \xE0 me lire depuis si longtemps. Je vais t'apprendre des choses merveilleuses.
~ rel.malrik += 6; rencontrer(malrik)`,title:"Ce que dit le grimoire",priority:6,once:!0},{id:"co_grimoire_prix",trigger:"activity:lire_grimoire",script:`> Tu l\xE8ves les yeux du grimoire. Il fait nuit. Tu \xE9tais venu \xE0 midi. Et tu ne te souviens de rien.
> Sur ton bras, une marque noire en forme de lettre que tu ne sais pas lire.
~ stat.moral -= 8; var.marque = vrai
* (Cacher la marque sous ta manche)
  ~ stat.ruse += 1
* (Aller voir S\xE9l\xE8ne, ou Halloran) #lumiere
  ~ rel.selene += 6; stat.ombre -= 6
  selene (inquiet): Oh, mon petit astre\u2026 Viens m\xE9diter \xE0 la tour. Tous les jours. Promets-le.`,title:"Le prix",when:"stat.ombre >= 35",priority:6,once:!0},{id:"co_auberge_client",trigger:"activity:travailler_auberge",script:`> Un vieux voyageur encapuchonn\xE9 te laisse un pourboire \xE9norme : une pi\xE8ce d'argent grav\xE9e d'un cerf.
> \xAB Pour celui qui saura parler aux b\xEAtes. \xBB Quand tu rel\xE8ves la t\xEAte, il a disparu.
~ stat.ecus += 20; stat.creatures += 2`,title:"Le client myst\xE9rieux",priority:5,once:!0},{id:"epilogue_commun",trigger:"manual",script:`> Et les autres ?
si var.noe_sauve et rel.noe >= 40
  > No\xE9 a repris la boulangerie de son p\xE8re, \xE0 Pierrelune. Ses brioches l\xE9vitent l\xE9g\xE8rement. Il t'en garde toujours une, la plus dor\xE9e.
sinon si var.noe_sauve
  > No\xE9 est rentr\xE9 chez lui. Il t'\xE9crit \xE0 chaque solstice, des lettres courtes, maladroites, qui finissent toujours par \xAB merci \xBB.
sinon si var.noe_perdu
  > Personne ne sait ce qu'est devenu No\xE9. Certains disent l'avoir vu sur les routes du Nord, en robe noire, seul.
sinon si rel.noe >= 20
  > No\xE9 et toi, vous vous croisez de temps en temps. Les souvenirs de la barque, la premi\xE8re nuit, vous font encore rire.
sinon
  > No\xE9 et toi vous \xEAtes perdus de vue. Une amiti\xE9 d'enfance qui n'a pas surv\xE9cu aux secrets.
si var.couple
  > Ayla a appris \xE0 apprivoiser ses visions. Elle dit qu'elle ne voit plus l'avenir : elle te voit, toi, et \xE7a lui suffit.
sinon si rel.ayla >= 40
  > Ayla est devenue astronome \xE0 l'observatoire des Cimes. Elle a donn\xE9 ton nom \xE0 une petite \xE9toile, sans te le dire.
sinon si rel.ayla < 0
  > Ayla est partie sans dire au revoir. Elle l'avait sans doute vu venir.
si var.sera_alliee
  > S\xE9raphine de Valcourt a renonc\xE9 \xE0 son h\xE9ritage pour ouvrir une \xE9cole gratuite. Sa m\xE8re ne lui parle plus. Elle n'a jamais \xE9t\xE9 aussi heureuse.
sinon si rel.sera <= -30
  > S\xE9raphine de Valcourt si\xE8ge au Conseil des mages. Elle a vot\xE9 contre chacune de tes demandes. Par principe.
si var.lia_sauvee
  > Lia Kade est entr\xE9e en deuxi\xE8me ann\xE9e avec les meilleures notes de sa promotion. Elle raconte \xE0 qui veut l'entendre que tu lui as appris \xE0 ne pas avoir peur.
si var.orin_vaincu
  > Orin Kael a \xE9t\xE9 jug\xE9 par le Conseil. On l'a envoy\xE9 dans une tour sans fen\xEAtre, au bord de la mer. Il \xE9crit des lettres que personne n'ouvre.
sinon si var.issue == "scelle" ou var.issue == "detruit"
  > Orin Kael s'est enfui avant l'aube. Sa robe noire a \xE9t\xE9 retrouv\xE9e au bord du lac.
si var.familier
  > {var.familier_nom} ne t'a jamais quitt\xE9. Il dort au pied de ton lit, une patte sur ta chaussure, au cas o\xF9 tu partirais sans lui.
si rel.claire >= 50
  > Ta m\xE8re garde toutes tes lettres dans une bo\xEEte \xE0 biscuits. Elle les relit le dimanche, en faisant semblant de comprendre les mots compliqu\xE9s.
sinon si rel.claire < 15
  > Ta m\xE8re t'aime toujours. Mais entre vous, il y a cinq ann\xE9es de lettres trop courtes, et des silences qui ne partent plus.
[var.halloran_parti et rel.halloran >= 30] > Sur la tombe de l'Archimage Halloran, quelqu'un d\xE9pose chaque ann\xE9e une bougie violette. C'est toi.`,title:"Ce qu'ils sont devenus"},{id:"re_noe",trigger:"talk:noe",script:`si chapitre == ch1
  noe (inquiet): Tu trouves pas que \xE7a sent bizarre, ici ? Chez moi, \xE7a sent le pain chaud. Ici, \xE7a sent la bougie et le vieux chien.
  * \xAB On s'y fera. Ensemble. \xBB #loyal
    ~ rel.noe += 5
    noe (content): Ensemble. D'accord. Mais si un fant\xF4me me parle, je dors dans ton lit.
  * Lui apprendre le sort de lumi\xE8re que tu viens de r\xE9ussir. #etude
    ~ rel.noe += 3; stat.sortileges += 1
  * \xAB Le vieux chien, c'est peut-\xEAtre Gaspard. \xBB #humour
    ~ rel.noe += 3; stat.moral += 2
sinon si rel.noe >= 45
  noe (content): Regarde ! J'ai enfin r\xE9ussi \xE0 faire l\xE9viter une brioche. Bon, elle a pris feu apr\xE8s. Mais elle a l\xE9vit\xE9.
  * L'applaudir comme au grand tournoi. #loyal
    ~ rel.noe += 4; stat.moral += 2
  * R\xE9viser avec lui jusqu'au couvre-feu. #etude
    ~ rel.noe += 3; stat.savoir += 2; stat.energie -= 10
    ~ souvenir(noe, revisions, "Vous avez r\xE9vis\xE9 ensemble jusqu'au couvre-feu")
  * [chapitre == ch4 ou chapitre == ch5] Lui demander s'il a peur de ce qui arrive. #ecoute
    noe (pensif): Tout le temps. Mais quand t'es l\xE0, un peu moins.
    ~ rel.noe += 6
sinon si rel.noe < 15
  noe: Ah. Salut. \u2026Je dois aller \xE0 la biblioth\xE8que. Enfin, je crois.
  * Le retenir : \xAB No\xE9, attends. Je suis d\xE9sol\xE9. \xBB #reconciliation
    test rel.noe + 30 + stat.courage / 4 vs 45
    si reussite
      noe (emu): \u2026Moi aussi, je suis d\xE9sol\xE9. On recommence ?
      ~ rel.noe += 12
    sinon
      noe (triste): Pas maintenant. Peut-\xEAtre plus tard.
      ~ rel.noe += 2
  * Le laisser partir.
    ~ rel.noe -= 2
sinon
  noe: Tu crois qu'on aura notre dipl\xF4me, nous deux ? Le fils du boulanger et\u2026 toi ?
  * \xAB On l'aura. Et on f\xEAtera \xE7a avec tes brioches. \xBB #loyal
    ~ rel.noe += 4
  * \xAB Toi, s\xFBrement. Moi, je ne sais pas. \xBB #honnete
    noe (rire): Menteur. T'es le meilleur de nous deux, et tu le sais.
    ~ rel.noe += 3; stat.moral += 2`,title:"No\xE9",when:"non var.noe_perdu",cooldown:3},{id:"re_sera",trigger:"talk:sera",script:`si rel.sera <= -15
  sera (colere): Qu'est-ce que tu veux ? Mon autographe ?
  * Lui renvoyer sa pique. #provocation
    ~ rel.sera -= 4; stat.courage += 1
    sera (rire): Pas mal. Pour un roturier.
  * Reconna\xEEtre qu'elle est la meilleure en duel de la promotion. #humble
    test 30 + rel.sera / 2 + stat.ruse / 3 vs 30
    si reussite
      sera (surpris): \u2026C'est vrai. Mais je n'aime pas qu'on me flatte.
      ~ rel.sera += 8
    sinon
      sera: Je n'ai pas besoin qu'on me le dise.
      ~ rel.sera += 1
  * Passer ton chemin.
sinon si rel.sera >= 30
  sera (content): Tu tombes bien. J'ai besoin de quelqu'un qui ne tremble pas devant moi pour m'entra\xEEner. Il n'y a que toi.
  * Accepter un duel amical. #duel
    test stat.duel vs 35 + temps.chapitre * 4
    si reussite
      !fx sort moi
      > Tu la d\xE9sarmes. Elle \xE9clate de rire, pour la premi\xE8re fois depuis que tu la connais.
      ~ rel.sera += 5; stat.duel += 2
    sinon
      > Elle te d\xE9sarme en deux gestes. Puis elle t'explique, patiemment, ce que tu as mal fait.
      ~ rel.sera += 4; stat.duel += 2
  * Lui demander des nouvelles de sa m\xE8re. #ecoute
    si mem.sera.confidence
      sera (pensif): Elle m'a \xE9crit. Trois lignes. \xAB Tiens ton rang. \xBB Comme d'habitude.
      ~ rel.sera += 6
    sinon
      sera (surpris): Ma m\xE8re ? Pourquoi est-ce que \xE7a t'int\xE9resse ? \u2026Elle va bien. Je crois.
      ~ rel.sera += 3
sinon
  sera: Les Valcourt ont donn\xE9 sept Archimages \xE0 cette \xE9cole. Toi, tu as donn\xE9\u2026 quoi, d\xE9j\xE0 ?
  * \xAB Moi, je suis arriv\xE9 ici sans rien. Tout ce que je sais, je l'ai gagn\xE9. \xBB #fierte
    ~ rel.sera += 4; stat.courage += 1
    sera (pensif): \u2026Hm. \xC7a, au moins, personne ne pourra te l'enlever.
  * Lui proposer de s'entra\xEEner ensemble avant l'examen de duel. #duel
    sera (surpris): Avec toi ? \u2026Bon. Mais si tu me fais perdre mon temps, je te transforme en crapaud.
    ~ rel.sera += 5; stat.duel += 1
  * \xAB Du talent, apparemment, puisque tu me parles. \xBB #humour
    ~ rel.sera += 3; stat.ruse += 1
  * L'ignorer. #indifference
    ~ rel.sera -= 2`,title:"S\xE9raphine",cooldown:3},{id:"re_ayla",trigger:"talk:ayla",script:`si var.couple
  ayla (content): Je t'ai vu arriver il y a trois jours. Dans une vision. Tu avais exactement cette t\xEAte-l\xE0.
  * L'embrasser sur le front. #romance
    ~ rel.ayla += 5; stat.moral += 4
  * Lui proposer de monter voir les \xE9toiles, ce soir. #romance
    ~ rel.ayla += 4; stat.moral += 3; stat.energie -= 5
    ~ souvenir(ayla, ensemble, "Vous avez pass\xE9 la nuit \xE0 compter les \xE9toiles")
  * Lui demander si ses visions lui font encore mal. #ecoute
    ayla (triste): Moins quand tu es l\xE0. C'est idiot, hein ?
    ~ rel.ayla += 6
sinon si rel.ayla >= 25
  ayla (pensif): Tu crois qu'on peut changer ce qu'on voit ? Ce qui doit arriver ?
  * \xAB Oui. Sinon, \xE0 quoi bon voir ? \xBB #espoir
    ~ rel.ayla += 5; var.visions += 1
  * \xAB Je ne sais pas. Mais je t'aiderai \xE0 essayer. \xBB #loyal
    ~ rel.ayla += 6
  * Lui demander ce qu'elle a vu sur toi. #curiosite
    ayla: Une tour. Une barque. Et quelque chose de violet qui t'attend. Je ne sais pas encore si c'est une bonne chose.
    ~ var.visions += 2; rel.ayla += 2
sinon
  ayla: Chut. J'\xE9coute les \xE9toiles. Elles sont bavardes, ce soir.
  * S'asseoir et \xE9couter avec elle, en silence. #patience
    ~ rel.ayla += 4; stat.moral += 2
  * Lui demander ce qu'elles disent. #curiosite
    ayla (rire): Que tu poses trop de questions.
    ~ rel.ayla += 2; var.visions += 1
  * La laisser tranquille.`,title:"Ayla",when:"chapitre != ch1",cooldown:3},{id:"re_selene",trigger:"talk:selene",script:`selene (content): Ah, mon petit astre ! Une question ? Une r\xE9clamation ? Une r\xE9v\xE9lation cosmique ?
* Demander une le\xE7on particuli\xE8re. #etude
  test stat.discipline + stat.sortileges / 2 vs 45
  si reussite
    > Une heure de travail intense. Tu en ressors la t\xEAte qui bourdonne et la baguette qui cr\xE9pite.
    ~ stat.sortileges += 3; stat.energie -= 12; rel.selene += 3
  sinon
    selene: Tu t'es endormi deux fois. Reviens quand tu auras dormi, petit astre.
    ~ stat.sortileges += 1; rel.selene += 1
* [stat.ombre >= 20] Lui avouer que la voix du grimoire ne se tait plus. #honnete
  selene (inquiet): Viens. Assieds-toi. On va respirer ensemble, et tu vas me raconter.
  ~ stat.ombre -= 8; rel.selene += 6; stat.moral += 2
  ~ souvenir(selene, aveu, "Tu lui as parl\xE9 de la voix du grimoire")
* Lui demander pourquoi elle appelle tout le monde \xAB petit astre \xBB. #curiosite
  selene (rire): Parce que vous \xEAtes tous en train de vous allumer, et que je ne sais jamais lequel brillera le plus fort.
  ~ rel.selene += 3; stat.moral += 2`,title:"Professeure Arkadi",cooldown:4},{id:"re_varn",trigger:"talk:varn",script:`varn: Vous \xEAtes encore l\xE0. Je suppose que vous avez une question. Faites court.
* Poser une question pr\xE9cise sur le dosage de l'essence de mandragore. #etude
  test stat.potions vs 30 + temps.chapitre * 4
  si reussite
    varn (surpris): \u2026La question est pertinente. La r\xE9ponse : jamais plus de trois gouttes, sauf si vous voulez dormir un an.
    ~ rel.varn += 4; stat.potions += 2
  sinon
    varn: La r\xE9ponse est \xE0 la page quatre du manuel. Que vous auriez lu si vous l'aviez ouvert.
    ~ rel.varn -= 1
* [stat.ecus >= 10] Lui offrir une racine de lune achet\xE9e au march\xE9. #genereux
  ~ stat.ecus -= 10; rel.varn += 7
  varn (pensif): \u2026Elle est fra\xEEche. O\xF9 l'avez-vous trouv\xE9e ? Peu importe. Merci.
* Lui demander pourquoi elle ne sourit jamais. #provocation
  varn: Parce que chaque fois que je souris, un \xE9l\xE8ve fait exploser un chaudron. C'est statistique.
  ~ rel.varn += 1; stat.moral += 1`,title:"Ma\xEEtresse Varn",cooldown:4},{id:"re_pell",trigger:"talk:pell",script:`pell (content): Chut. On parle bas, \xE0 la biblioth\xE8que. M\xEAme les livres font la sieste.
* Proposer de l'aider \xE0 ranger les rayonnages. #genereux
  > Deux heures \xE0 grimper aux \xE9chelles. Les livres se laissent ranger, sauf un, qui te mord le doigt.
  ~ rel.pell += 5; stat.savoir += 2; stat.energie -= 10
* Lui demander un livre qui n'est pas au programme. #curiosite
  pell: Celui-ci. \xAB Petite histoire des sceaux et des serments \xBB. Personne ne l'a emprunt\xE9 depuis quarante ans.
  ~ stat.savoir += 3; rel.pell += 2; var.sceau_connu = vrai
* [rel.pell >= 20 et chapitre != ch1] Lui demander, \xE0 voix tr\xE8s basse, ce qu'il y a dans la R\xE9serve. #ruse
  pell (inquiet): Des livres qui ne devraient pas exister. Et un qui\u2026 respire. Si tu y vas un jour, ne lis rien \xE0 voix haute.
  ~ var.pell_alliee = vrai; rel.pell += 3; var.rumeur_grimoire = vrai`,title:"Madame Pell",cooldown:4},{id:"re_brax",trigger:"talk:brax",script:`si rel.brax >= 30
  brax (content): Ah, mon meilleur \xE9l\xE8ve. Ne le r\xE9p\xE8te pas aux autres, ils sont jaloux.
  * Lui demander comment il a perdu son \u0153il. #curiosite
    brax: Un dragon de glace. Ou une porte de placard. \xC7a d\xE9pend si je veux impressionner.
    ~ rel.brax += 3; stat.moral += 2
  * Lui demander une botte secr\xE8te. #duel
    test stat.duel vs 40
    si reussite
      brax: La parade miroir. Tu renvoies le sort de l'autre, avec ses int\xE9r\xEAts. Ne l'utilise que si tu n'as plus le choix.
      ~ var.parade_miroir = vrai; rel.brax += 4
      ~ souvenir(brax, eleve, "Il t'a appris sa botte secr\xE8te")
    sinon
      brax: Pas encore. Reviens quand tu tiendras debout plus de trois sorts.
      ~ stat.duel += 1
sinon
  brax: Tu veux t'entra\xEEner ou tu veux discuter ? Les deux ne vont pas ensemble.
  * \xAB M'entra\xEEner. \xBB #courage
    ~ stat.duel += 2; stat.energie -= 10; rel.brax += 2
  * \xAB Discuter. \xBB #ecoute
    brax (pensif): Bon. Alors \xE9coute : un mage qui ne sait pas perdre ne gagnera jamais rien. Voil\xE0. C'\xE9tait la discussion.
    ~ rel.brax += 2; stat.courage += 1`,title:"Ma\xEEtre Brax",cooldown:3},{id:"re_gaspard",trigger:"talk:gaspard",script:`gaspard (content): Entre, entre. Attention au chaudron, il y a un b\xE9b\xE9 griffon dedans. Non, je plaisante. Un peu.
* Accepter une tasse de th\xE9 et un g\xE2teau dur comme la pierre. #patience
  > Le th\xE9 est bon. Le g\xE2teau, tu le gardes dans ta poche pour plus tard. Peut-\xEAtre pour te d\xE9fendre.
  ~ rel.gaspard += 4; stat.moral += 3
* L'aider \xE0 nourrir les b\xEAtes. #creature
  ~ rel.gaspard += 3; stat.creatures += 2; stat.energie -= 8
* [var.familier] Demander des nouvelles de {var.familier_nom}. #creature
  gaspard (rire): Il a mang\xE9 mon chapeau. Le deuxi\xE8me cette semaine. Il va tr\xE8s bien.
  ~ rel.gaspard += 3; stat.moral += 4
* [chapitre != ch1] Lui demander ce qu'il y a au fond de la for\xEAt. #curiosite
  gaspard (inquiet): Des choses vieilles. Des pierres qui se souviennent. N'y va jamais seul, tu m'entends ?
  ~ var.rumeur_grimoire = vrai; rel.gaspard += 1`,title:"Gaspard",cooldown:3},{id:"re_lia",trigger:"talk:lia",script:`si var.lia_sauvee
  lia (content): Je ne t'ai jamais vraiment dit merci. Pour le cachot. Alors : merci. Voil\xE0. C'est dit. Ne pleure pas.
  ~ rel.lia += 4
sinon
  lia (inquiet): Tu peux m'expliquer la troisi\xE8me loi des transmutations ? Je relis la page depuis une heure et les mots changent de place.
  * Lui expliquer patiemment. #genereux
    test stat.savoir vs 30
    si reussite
      lia (content): Ah ! C'\xE9tait donc \xE7a ! Tu devrais \xEAtre professeur.
      ~ rel.lia += 5; stat.savoir += 1; stat.reputation += 1
    sinon
      > Vous vous embrouillez tous les deux. Vous finissez par rire, la t\xEAte sur le livre.
      ~ rel.lia += 3
  * Lui dire que les mots changent vraiment de place : c'est un livre ensorcel\xE9. #humour
    lia (rire): Je savais que je n'\xE9tais pas folle !
    ~ rel.lia += 4; stat.moral += 2`,title:"Lia",when:"var.mentor_lia",cooldown:3},{id:"re_tobias",trigger:"talk:tobias",script:`tobias (rire): J'ai un plan. Une bombe \xE0 bulles dans la soupi\xE8re des professeurs. Tu en es ?
* \xC9videmment. #rebelle
  test stat.ruse vs 30
  si reussite
    > Le d\xEEner se termine sous une pluie de bulles roses. Personne ne sait qui a fait le coup. Sauf vous.
    ~ rel.tobias += 6; stat.ruse += 2; stat.moral += 4
  sinon
    > S\xE9l\xE8ne vous attrape la main dans la soupi\xE8re. Avertissement pour tous les deux.
    ~ rel.tobias += 3; var.avertissements += 1; stat.discipline -= 6
* Non, et toi non plus. #regle
  tobias: Rabat-joie. \u2026Bon, d'accord. Mais tu me dois une blague.
  ~ rel.tobias -= 1; stat.discipline += 1
* Proposer une meilleure id\xE9e : des chaussettes qui chantent. #ruse
  tobias (surpris): \u2026Tu es un g\xE9nie. Un g\xE9nie mal\xE9fique.
  ~ rel.tobias += 5; stat.ruse += 1`,title:"Tobias",cooldown:3},{id:"re_marthe",trigger:"talk:marthe",script:`marthe (content): Voil\xE0 mon \xE9l\xE8ve pr\xE9f\xE9r\xE9 ! Assieds-toi. Tu as une mine de chandelle mouill\xE9e.
* Accepter un chocolat chaud offert par la maison. #repos
  ~ stat.moral += 5; stat.energie += 6; rel.marthe += 3
* Lui demander les rumeurs du village. #curiosite
  si chapitre == ch1 ou chapitre == ch2
    marthe (pensif): On dit que deux \xE9l\xE8ves ont disparu, l'\xE9t\xE9 dernier, pr\xE8s des pierres. On n'en parle pas trop. \xC7a porte malheur.
    ~ var.rumeur_grimoire = vrai; stat.savoir += 1
  sinon
    marthe (inquiet): Des gens en robe noire passent la nuit, vers la for\xEAt. Ils ne prennent jamais rien \xE0 boire. C'est mauvais signe, les gens qui ne boivent rien.
    ~ var.mefiance_orin = vrai; stat.savoir += 1
  ~ rel.marthe += 2
* Lui proposer de faire la vaisselle en \xE9change. #genereux
  ~ rel.marthe += 5; stat.ecus += 4; stat.energie -= 8`,title:"Marthe",cooldown:3},{id:"re_orin",trigger:"talk:orin",script:`si stat.ombre >= 25 ou var.cercle_orin
  orin (content): Tu sens \xE7a, toi aussi ? Cette force qui gronde sous le ch\xE2teau ? Les autres ont peur. Toi et moi, on \xE9coute.
  * \xAB J'\xE9coute. \xBB #ombre
    ~ rel.orin += 5; stat.ombre += 3; stat.puissance += 1
  * \xAB Moi, j'essaie surtout de la faire taire. \xBB #lumiere
    orin (pensif): Dommage. Vraiment dommage.
    ~ rel.orin -= 3; var.mefiance_orin = vrai
sinon
  orin: Le pr\xE9fet Kael, \xE0 ton service. Si quelqu'un t'emb\xEAte, viens me voir. Je r\xE8gle toujours les probl\xE8mes. D'une mani\xE8re ou d'une autre.
  * Le remercier. #poli
    ~ rel.orin += 3
  * [stat.ruse >= 30] Remarquer la tache d'encre violette sur sa manche. #ruse
    orin (surpris): \u2026De l'encre. J'\xE9cris beaucoup. Tu as l'\u0153il, dis donc.
    ~ var.mefiance_orin = vrai; stat.ruse += 2; rel.orin -= 1
  * Lui demander pourquoi il tra\xEEne toujours pr\xE8s de la biblioth\xE8que. #curiosite
    orin (rire): Parce que j'aime lire. C'est un crime, maintenant ?
    ~ var.mefiance_orin = vrai`,title:"Orin Kael",when:"non var.orin_demasque",cooldown:4},{id:"re_daval",trigger:"talk:daval",script:`daval: \xC9l\xE8ve {joueur.nom}. Vous avez quelque chose \xE0 me dire ? Tout le monde a toujours quelque chose \xE0 dire \xE0 un inspecteur.
* [(var.malrik_nom ou var.grimoire_trouve) et non var.daval_sait] Tout lui raconter : le grimoire, Malrik, le cercle. #honnete
  daval (surpris): \u2026Vous vous rendez compte que vous venez d'avouer \xEAtre entr\xE9 dans la R\xE9serve ?
  ~ var.daval_sait = vrai; var.avertissements += 1; rel.daval += 10
  ~ souvenir(daval, verite, "Tu lui as tout racont\xE9")
  daval (pensif): Je vais devoir vous sanctionner. Et ensuite, je vais devoir vous croire. C'est tr\xE8s d\xE9sagr\xE9able.
* Rien, inspecteur. Rien du tout. #prudence
  daval: C'est ce que disent toujours ceux qui ont le plus \xE0 dire.
  ~ rel.daval -= 2
* [var.mefiance_orin] Lui conseiller de surveiller le pr\xE9fet Kael. #ruse
  daval (pensif): Le pr\xE9fet mod\xE8le ? Int\xE9ressant. Tr\xE8s int\xE9ressant.
  ~ rel.daval += 4; var.denonce_orin = vrai

// \u2500\u2500\u2500 Moments partag\xE9s (activit\xE9s) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500`,title:"Inspecteur Daval",when:"chapitre == ch4",cooldown:3},{id:"re_veillee_noe",trigger:"activity:veillee",script:`!placer noe 150 droite
> Le feu cr\xE9pite dans la salle commune. No\xE9, emmitoufl\xE9 dans une couverture trop grande, mange des marrons grill\xE9s par magie.
noe (pensif): Tu crois qu'on se souviendra de tout \xE7a, quand on sera vieux ? Des marrons, du feu, de la barque ?
* \xAB Je me souviendrai de tout. Promis. \xBB #loyal
  ~ rel.noe += 5; stat.moral += 3
  ~ souvenir(noe, veillee, "Tu lui as promis de te souvenir de tout")
* \xAB Moi, je me souviendrai surtout de ta t\xEAte quand le lac t'a parl\xE9. \xBB #humour
  noe (rire): Il m'a VRAIMENT parl\xE9 !
  ~ rel.noe += 4; stat.moral += 4`,title:"Au coin du feu",when:"non var.noe_perdu et rel.noe >= 30",cooldown:4,chance:50},{id:"re_lettre_maman",trigger:"activity:ecrire_lettre",script:`> Tu trempes la plume dans l'encre. Qu'est-ce que tu racontes \xE0 ta m\xE8re, cette fois ?
* La v\xE9rit\xE9 : les cours, les amis, et aussi les choses \xE9tranges. #honnete
  ~ rel.claire += 3
  ~ planifier(re_reponse_maman, 2)
* Que tout va bien. Toujours bien. #prudence
  ~ rel.claire += 1
* [stat.ecus >= 10] Glisser quelques \xE9cus dans l'enveloppe. #genereux
  ~ stat.ecus -= 10; rel.claire += 5
  ~ souvenir(claire, ecus, "Tu lui as envoy\xE9 une partie de tes \xE9cus")
  ~ planifier(re_reponse_maman, 2)`,title:"Une lettre pour la maison",cooldown:3},{id:"re_reponse_maman",trigger:"scheduled",script:`> Une enveloppe qui sent la farine et la lavande. L'\xE9criture de ta m\xE8re, appliqu\xE9e, un peu tremblante.
si mem.claire.ecus
  > \xAB Tu n'aurais pas d\xFB, pour l'argent. Je l'ai mis de c\xF4t\xE9. Pour toi. Pour quand tu reviendras. \xBB
si stat.ombre >= 30
  > \xAB Tes derni\xE8res lettres me font un peu peur, mon tr\xE9sor. Tu as l'air si loin. Promets-moi de faire attention. \xBB
  ~ stat.ombre -= 3
sinon
  > \xAB J'ai lu ta lettre trois fois. Je suis si fi\xE8re de toi. Je n'ai pas tout compris, mais je suis fi\xE8re. \xBB
~ stat.moral += 5; rel.claire += 3`,title:"La r\xE9ponse de ta m\xE8re"},{id:"re_chocolat_ayla",trigger:"activity:chocolat",script:`!placer ayla 200 gauche
> Ayla entre dans l'auberge, les joues rouges de froid. Elle s'assoit en face de toi sans demander, comme si elle avait su que tu serais l\xE0. \xC9videmment qu'elle le savait.
ayla (content): Je prends la m\xEAme chose que toi. Je l'ai vu.
* Partager ton chocolat en attendant le sien. #romance
  ~ rel.ayla += 5; stat.moral += 3
* Lui demander ce qu'elle a vu d'autre. #curiosite
  ayla (rire): Que tu allais me poser cette question. Et que j'allais rire.
  ~ rel.ayla += 3; var.visions += 1`,title:"Une table pour deux",when:"chapitre != ch1 et rel.ayla >= 20",cooldown:4,chance:50}],endings:[{id:"exil",title:"L'Exil",type:"tragique",when:"var.expulse",priority:100,summary:"Renvoy\xE9 d'Ombrelune, baguette bris\xE9e, tu as d\xFB apprendre \xE0 vivre sans magie.",location:"quai",script:`!moment soir
> La barque glisse sur le lac. Derri\xE8re toi, les tours d'Ombrelune disparaissent dans la brume. Sur tes genoux, les deux morceaux de ta baguette.
si var.noe_perdu
  > Personne n'est venu te dire au revoir. Pas m\xEAme No\xE9. Surtout pas No\xE9.
sinon si rel.noe >= 30
  > Sur le quai, une silhouette rousse agite les bras jusqu'\xE0 ce que tu ne la voies plus. No\xE9.
!rappel noe.quai
> Les ann\xE9es passent. Tu travailles \xE0 la boulangerie de Pierrelune, puis dans une imprimerie, puis ailleurs.
> Parfois, en p\xE9trissant la p\xE2te, une \xE9tincelle jaillit de tes doigts. Une toute petite. Tu la regardes s'\xE9teindre, et tu souris quand m\xEAme.
si var.issue != "scelle" et var.issue != "detruit" et var.grimoire_trouve
  > On raconte qu'une nuit, au cercle de pierres, quelque chose s'est r\xE9veill\xE9. Tu n'\xE9tais pas l\xE0 pour l'arr\xEAter.
appel epilogue_commun
> La magie ne t'a pas quitt\xE9. C'est toi qu'on a oblig\xE9 \xE0 la quitter. Ce n'est pas la m\xEAme chose.`},{id:"ombre",title:"Le Mage noir",type:"tragique",when:'var.issue == "ombre"',priority:90,summary:"Tu as accept\xE9 l'h\xE9ritage de Malrik. Ombrelune porte d\xE9sormais ton nom\u2026 et le craint.",location:"foret",script:`!moment nuit
!placer orin 420 gauche
> Les disciples s'agenouillent un par un dans l'herbe br\xFBl\xE9e. Orin te tend le grimoire, les mains tremblantes de joie.
orin (fier): Ma\xEEtre.
> Le mot ne te fait rien. Ou peut-\xEAtre que si. Une chaleur froide, au fond de la poitrine, l\xE0 o\xF9 il y avait autrefois autre chose.
!rappel malrik.ultimatum
> La voix de Malrik ne parle plus dans ta t\xEAte. Elle n'en a plus besoin : elle est ta voix, maintenant.
si var.couple
  > Ayla t'attend \xE0 l'or\xE9e de la for\xEAt. Elle te regarde longtemps. Puis elle recule d'un pas, et un autre. Elle avait vu ce soir-l\xE0. Elle avait esp\xE9r\xE9 se tromper.
si var.noe_sauve
  > No\xE9 ne viendra plus jamais \xE0 la boulangerie quand tu y passes. On dit qu'il ferme les volets.
> Les ann\xE9es qui suivent, on parle de toi \xE0 voix basse dans les tavernes. On cache les enfants. On ferme les portes.
appel epilogue_commun
> Tu es devenu le plus puissant mage de ta g\xE9n\xE9ration. Tu es aussi le plus seul. Les deux vont souvent ensemble, disait Halloran. Tu ne l'avais pas cru.`},{id:"sacrifice",title:"Le Sceau vivant",type:"inattendue",when:'var.issue == "sacrifice"',priority:85,summary:"Ton propre sang a scell\xE9 Malrik pour toujours. Le prix : ta magie.",location:"infirmerie",script:`!moment jour
!placer pell 140 droite
> Tu te r\xE9veilles \xE0 l'infirmerie. Il y a des fleurs partout. Et un silence \xE9trange, comme une pi\xE8ce dont on aurait retir\xE9 la musique.
pell (triste): Tu as dormi neuf jours. Et\u2026 mon petit, essaie d'allumer la bougie.
> Tu tends la main. Rien. Pas une \xE9tincelle. Le sang d'Ilyana a referm\xE9 le cercle, et il a emport\xE9 ta magie avec lui.
si var.couple
  !placer ayla 230 gauche
  ayla (emu): Je l'avais vu. Je t'ai laiss\xE9 faire quand m\xEAme. Pardonne-moi.
  > Elle prend ta main. Elle ne l\xE2che plus.
si var.noe_sauve
  > No\xE9 passe chaque jour avec un panier de brioches. Il ne parle pas de magie. Il parle de pain, de farine, du temps qu'il fait. C'est exactement ce qu'il te faut.
> Tu re\xE7ois ton dipl\xF4me \xE0 titre honorifique. Le premier dipl\xF4me d'Ombrelune d\xE9cern\xE9 \xE0 quelqu'un qui ne peut plus faire de magie.
> Sur le mur du grand hall, on grave ton nom, sous celui d'Ilyana. Les \xE9l\xE8ves des si\xE8cles suivants passeront devant sans savoir. C'est tr\xE8s bien comme \xE7a.
appel epilogue_commun
> Le grimoire ne murmure plus. Plus personne ne murmure, dans ta t\xEAte. Pour la premi\xE8re fois depuis cinq ans, tu dors toute la nuit.`},{id:"chute",title:"La Chute d'Ombrelune",type:"tragique",when:'var.issue == "echec" ou var.issue == "fuite"',priority:80,summary:"Malrik s'est relev\xE9. Ombrelune a br\xFBl\xE9, et le monde des mages ne sera plus jamais le m\xEAme.",location:"cour",script:`!moment nuit
!fx fumee
> La cour est jonch\xE9e de vitraux bris\xE9s. Les tours fument encore. La flamme d'\xC9veil, dans le grand hall, ne s'est jamais rallum\xE9e.
si var.issue == "fuite"
  > Tu t'es enfui. Tu te r\xE9p\xE8tes que personne n'aurait pu tenir. Tu te le r\xE9p\xE9teras toute ta vie.
sinon
  > Tu as tenu jusqu'au bout. Ce n'\xE9tait pas assez. Parfois, rien n'est assez.
> Malrik a quitt\xE9 la for\xEAt \xE0 l'aube, entour\xE9 de ses disciples. On dit qu'il a pris le visage d'un jeune homme p\xE2le, et qu'il cherche sa s\u0153ur, partout, dans chaque ville.
si var.noe_sauve
  !placer noe 260 droite
  noe (triste): On recommencera. Ailleurs. Avec les petits qui restent. Il faudra bien que quelqu'un leur apprenne.
  > Il a raison. Il faudra bien.
appel epilogue_commun
> Ombrelune n'est plus qu'une ruine au bord d'un lac. Mais les ruines, \xE7a se reconstruit. C'est ce que disait ta m\xE8re, en p\xE9trissant la p\xE2te.`},{id:"renoncement",title:"La Vie ordinaire",type:"neutre",when:"var.renonce",priority:75,summary:"Tu as rendu ta baguette apr\xE8s le dipl\xF4me pour une vie simple, loin de la magie.",location:"village",script:`!moment jour
!placer claire 220 gauche
> Le lendemain du dipl\xF4me, tu poses ta baguette sur le bureau de l'Archimage. Personne ne te retient. Personne n'ose.
!rappel claire.retour
claire (emu): Tu es rentr\xE9. Pour de bon ?
> Pour de bon. Tu ouvres une petite librairie \xE0 Pierrelune, avec des livres qui ne parlent pas et ne mordent pas.
si var.issue == "scelle" ou var.issue == "detruit"
  > Personne, au village, ne sait que tu as sauv\xE9 le monde des mages une nuit d'\xE9t\xE9. Tu ne le dis \xE0 personne. Tu n'en as pas besoin.
si var.couple
  > Ayla vient te voir chaque dimanche. Elle dit que la librairie sent le papier et la paix. Un jour, elle ne repart plus.
> Le soir, quand la boutique est ferm\xE9e, il t'arrive d'allumer une bougie d'un claquement de doigts. Juste une. Juste pour te souvenir.
appel epilogue_commun
> On dit que la magie, c'est le pouvoir. Toi, tu as d\xE9couvert que c'\xE9tait aussi le pouvoir de dire non.`},{id:"archimage",title:"L'H\xE9ritier de la tour",type:"heureuse",when:'(var.issue == "scelle" ou var.issue == "detruit") et stat.savoir >= 60 et stat.reputation >= 50 et rel.halloran >= 20',priority:70,summary:"Des ann\xE9es plus tard, tu deviens Archimage d'Ombrelune, le plus jeune de son histoire.",location:"bureau_archimage",script:`!moment soir
> Quinze ans plus tard. Le bureau de l'Archimage n'a pas chang\xE9 : les m\xEAmes livres, le m\xEAme feu, la m\xEAme odeur de cire et de vieux parchemin.
> Seulement, maintenant, c'est ton nom qui est grav\xE9 sur la porte.
!rappel halloran.confiance_voix
> Sur le bureau, une lettre jaunie, trouv\xE9e dans un tiroir le jour de ta nomination : \xAB Pour celui qui viendra apr\xE8s moi. Il saura quoi faire. Ou il ne saura pas, et il fera quand m\xEAme. \u2014 C. H. \xBB
si var.noe_sauve
  > No\xE9 livre le pain du ch\xE2teau chaque matin. Il entre dans ton bureau sans frapper, comme quand vous aviez onze ans.
si var.lia_sauvee
  > Lia enseigne la botanique. Ses \xE9l\xE8ves la trouvent s\xE9v\xE8re. Elle dit que c'est toi qui lui as appris.
> Ce soir, une barque arrive sur le lac. Des enfants qui ont peur, les yeux \xE9carquill\xE9s devant les tours illumin\xE9es. Tu descends les accueillir.
appel epilogue_commun
> \xAB Bienvenue \xE0 Ombrelune \xBB, dis-tu. Et tu penses : moi aussi, j'\xE9tais \xE0 votre place. Moi aussi, j'avais peur.`},{id:"deux_etoiles",title:"Deux \xE9toiles",type:"heureuse",when:"var.couple et rel.ayla >= 45",priority:65,summary:"Ayla et toi, main dans la main, au-del\xE0 des visions et des sceaux.",location:"tour_ouest",script:`!moment nuit
!placer ayla 230 gauche
> Le soir du dipl\xF4me, vous montez au sommet de la tour ouest. Comme la premi\xE8re fois. Il y a encore une tache de cire de la lanterne que tu avais fait tomber.
!rappel ayla.lanternes
ayla (content): Tu sais ce que je vois, l\xE0, maintenant ?
* Notre avenir ? #romance
  ayla (rire): Non. Je vois un idiot qui a de la cire sur sa robe. Et c'est la plus belle vision que j'aie jamais eue.
* Rien. Et c'est tr\xE8s bien. #paix
  ayla (emu): Rien. Pas de futur, pas de cercle, pas de grimoire. Juste maintenant. Je ne savais pas que c'\xE9tait possible.
> Des ann\xE9es plus tard, vous vivez dans une maison au bord d'une falaise, avec une lunette astronomique sur le toit et beaucoup trop de chats.
si var.issue == "scelle" ou var.issue == "detruit"
  > Le monde des mages vous doit tout. Vous n'en parlez jamais. Le soir, vous comptez les \xE9toiles, et vous ne vous mettez jamais d'accord sur le chiffre.
appel epilogue_commun
> Elle n'a jamais retrouv\xE9 ses visions. Elle dit qu'elle n'en a plus besoin, puisque tu es l\xE0.`},{id:"professeur",title:"Ma\xEEtre des potions",type:"secrete",when:"var.offre_prof",priority:60,summary:"Apprenti puis successeur de Ma\xEEtresse Varn, tu r\xE8gnes sur les cachots d'Ombrelune.",location:"cachot_potions",script:`!moment soir
> Dix ans plus tard. Les cachots d'Ombrelune sentent toujours la menthe br\xFBl\xE9e et le soufre. Le chaudron de Varn tr\xF4ne au centre. C'est le tien, maintenant.
!rappel varn.apprenti
> Le jour de son d\xE9part, Varn t'a tendu une petite cl\xE9 de cuivre : celle de son armoire personnelle. \xC0 l'int\xE9rieur, une seule fiole, et une \xE9tiquette : \xAB Pour les jours o\xF9 ils te rendent fou. Chocolat chaud, trois gouttes. \xBB
> Tu as ri pendant une heure. Tu n'avais jamais imagin\xE9 que Varn puisse aimer le chocolat.
> Tes \xE9l\xE8ves te trouvent terrifiant. Ils ont tort, un peu. Mais tu entretiens soigneusement la l\xE9gende. Tu as une r\xE9putation \xE0 tenir.
si var.noe_sauve
  > No\xE9 te fournit en farine de lune pour les potions de sommeil. Il refuse d'\xEAtre pay\xE9.
appel epilogue_commun
> Le premier jour de chaque ann\xE9e, tu fais exploser un chaudron devant les nouveaux. Expr\xE8s. Pour qu'ils sachent qu'on a le droit de rater.`},{id:"gardien",title:"Le Gardien de la for\xEAt",type:"secrete",when:"var.offre_gardien",priority:58,summary:"Tu as succ\xE9d\xE9 \xE0 Gaspard. La for\xEAt d'Ombrelune et toutes ses cr\xE9atures sont \xE0 toi.",location:"cabane",script:`!moment soir
!placer gaspard 160 droite
> L'hiver suivant le dipl\xF4me, Gaspard t'a remis les cl\xE9s de la cabane. Elles sont attach\xE9es \xE0 une plume de griffon et \xE0 un bout de ficelle.
!rappel gaspard.successeur
gaspard (emu): Les b\xEAtes t'ont choisi bien avant moi. Je n'ai fait que leur ob\xE9ir.
> Il est parti vivre au village, \xE0 c\xF4t\xE9 de l'auberge de Marthe. Il vient le dimanche. Il pr\xE9tend que c'est pour v\xE9rifier ton travail. C'est pour le Cerf.
si var.cerf_vu
  > Le Cerf d'argent se montre \xE0 toi, parfois, \xE0 la lisi\xE8re de la clairi\xE8re. Il ne fuit plus. Il te regarde comme on regarde un vieil ami.
si var.familier
  > {var.familier_nom} est devenu le chef de toutes les cr\xE9atures de la for\xEAt. Personne ne lui a demand\xE9 son avis. Il l'a d\xE9cid\xE9 tout seul.
appel epilogue_commun
> Le cercle de pierres, tu le gardes aussi. Chaque nuit de pleine lune, tu viens v\xE9rifier qu'il dort. Il dort.`},{id:"champion",title:"Le Champion",type:"heureuse",when:"var.champion et stat.duel >= 38",priority:55,summary:"Champion d'Ombrelune, puis de tout le royaume : ta baguette est la plus rapide de ta g\xE9n\xE9ration.",location:"arene",script:`!moment jour
!placer brax 380 gauche
> Trois ans apr\xE8s le dipl\xF4me, la Grande Ar\xE8ne de la capitale. Quarante mille spectateurs. En face de toi, le champion en titre, invaincu depuis dix ans.
!rappel brax.eleve
brax (fier): Les pieds. N'oublie pas les pieds.
> Tu n'oublies pas les pieds. Trois sorts. Le troisi\xE8me touche son \xE9paule. Il hausse un sourcil, exactement comme Brax autrefois. Puis il s'incline.
> La foule hurle ton nom. Tu cherches un visage dans les tribunes.
si var.noe_sauve
  > No\xE9 est au premier rang. Il a peint ton nom sur une banderole, avec une faute d'orthographe. Tu ne la corrigeras jamais.
sinon si var.couple
  > Ayla est au premier rang. Elle ne regarde pas le duel : elle te regarde, toi. Elle savait d\xE9j\xE0 comment \xE7a finirait.
appel epilogue_commun
> Des ann\xE9es plus tard, tu ouvres une \xE9cole de duel \xE0 Pierrelune. La premi\xE8re le\xE7on est toujours la m\xEAme : \xAB Un duel se gagne avec les pieds. La baguette, c'est pour finir. \xBB`},{id:"explorateur",title:"Au-del\xE0 des cartes",type:"inattendue",when:"var.offre_explorer",priority:50,summary:"Avec la Guilde des Arpenteurs, tu cartographies les terres sauvages du Nord.",location:"quai",script:`!moment jour
> Le lendemain du dipl\xF4me, un navire aux voiles bleues t'attend au bout du lac. La Guilde des Arpenteurs. Les terres sauvages du Nord.
> Tu montes \xE0 bord avec une malle, une baguette, et un carnet vide.
> Les ann\xE9es suivantes, le carnet se remplit : des dragons de glace qui chantent, des for\xEAts qui changent de place pendant la nuit, une cit\xE9 engloutie o\xF9 les poissons portent des couronnes.
si var.familier
  > {var.familier_nom} voyage dans ta capuche. Il a mordu un dragon. Le dragon s'est excus\xE9.
si var.couple
  > Ayla t'\xE9crit \xE0 chaque escale. Ses lettres arrivent toujours la veille du jour o\xF9 tu en as besoin. Elle sait.
> Ta carte du Nord est aujourd'hui accroch\xE9e dans toutes les \xE9coles de magie. Dans un coin, en tout petit, tu as dessin\xE9 une barque sur un lac, et deux enfants dedans.
!rappel noe.quai
appel epilogue_commun
> Le monde est bien plus grand qu'un ch\xE2teau. Tu l'as toujours su. Maintenant, tu l'as vu.`},{id:"seul",title:"Le Mage solitaire",type:"neutre",when:"var.allies == 0",priority:45,summary:"Tu as tout affront\xE9 seul. Tu as surv\xE9cu, mais personne n'\xE9tait l\xE0 pour le voir.",location:"dortoir",script:`!moment nuit
> Le soir du dipl\xF4me, le dortoir est vide. Les autres sont \xE0 la f\xEAte, dans la cour. Tu entends les rires \xE0 travers la fen\xEAtre.
si var.issue == "scelle" ou var.issue == "detruit"
  > Tu as sauv\xE9 l'\xE9cole, cette nuit-l\xE0. Seul. Personne ne t'a vu le faire. Personne ne te croirait.
sinon
  > Tu as travers\xE9 cinq ann\xE9es sans jamais t'appuyer sur personne. C'\xE9tait plus s\xFBr. C'\xE9tait aussi plus froid.
> Les ann\xE9es suivantes, tu deviens un mage respect\xE9, discret, efficace. On vient te consulter pour les sorts difficiles. On repart sans te conna\xEEtre.
si var.noe_perdu
  > Parfois, tu penses \xE0 No\xE9. \xC0 ce que tu aurais pu dire, ce soir-l\xE0, dans la for\xEAt.
appel epilogue_commun
