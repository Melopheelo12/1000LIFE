malrik: Le tournoi approche. Je peux t'aider \xE0 le gagner. Un peu de ma force contre un peu de ta confiance. Rien de plus.
* March\xE9 conclu. #ombre
  ~ var.pacte = vrai; stat.puissance += 8; stat.duel += 8; stat.ombre += 15; rel.malrik += 15
  ~ souvenir(malrik, pacte, "Tu as accept\xE9 son pacte")
  !fx magie moi
  malrik (fier): Tu ne le regretteras pas. Ou alors\u2026 si tard que \xE7a n'aura plus d'importance.
* Qui es-tu vraiment ? #curiosite
  malrik (triste): Un \xE9l\xE8ve qui a eu peur de mourir. Qui a cherch\xE9 un moyen de ne jamais dispara\xEEtre. Et qui a r\xE9ussi, d'une certaine fa\xE7on.
  ~ var.malrik_nom = vrai
  malrik: R\xE9fl\xE9chis \xE0 mon offre. Je ne suis pas press\xE9. Je n'ai que \xE7a, du temps.
* Non. Sors de ma t\xEAte. #lumiere
  ~ stat.courage += 4; stat.ombre -= 5; rel.malrik -= 10
  ~ souvenir(malrik, refus, "Tu as refus\xE9 son pacte")
  malrik (colere): Tu reviendras. Ils reviennent tous.
!sortir malrik droite`,title:"La proposition de Malrik",when:"var.grimoire_trouve et non var.grimoire_ferme et rel.malrik >= 10",chapters:["ch3"],priority:9,once:!0},{id:"ch3_noe_foret",trigger:"tick_start",script:`!lieu cabane 150 soir
!placer gaspard 200 gauche
gaspard (inquiet): Ton ami, le rouquin. Il est parti dans la for\xEAt il y a deux heures. Seul. Il disait qu'il allait \xAB prouver qu'il valait quelque chose \xBB.
* J'y vais. #courage
  ~ var.foret_ok = vrai
  !lieu foret 300 nuit
  > La nuit, la for\xEAt de Brume ne ressemble \xE0 rien de connu. Des yeux brillent entre les troncs.
  > Puis un cri. La voix de No\xE9.
  !placer noe 450 gauche
  > Il est accul\xE9 contre un arbre. Devant lui, la silhouette noire sans visage.
  * (Lancer un sort de toutes tes forces) #duel
    test stat.puissance + stat.duel / 2 vs 40
    si reussite
      !fx sort moi
      > La silhouette se disperse comme de la fum\xE9e au vent.
      ~ rel.noe += 15; stat.courage += 5; stat.reputation += 4
      ~ souvenir(noe, sauve_foret, "Tu l'as sauv\xE9 de la silhouette noire dans la for\xEAt")
      noe (emu): Tu es venu\u2026 Tu es vraiment venu\u2026
    sinon
      !fx fumee
      > Ton sort la traverse sans effet. Elle griffe le bras de No\xE9 avant de dispara\xEEtre.
      ~ rel.noe += 8; var.noe_blesse = vrai; stat.moral -= 6
      ~ souvenir(noe, sauve_foret, "Tu es venu le chercher dans la for\xEAt, m\xEAme si \xE7a a mal tourn\xE9")
  * [var.familier] Appeler {var.familier_nom}. #creature
    test stat.creatures vs 35
    si reussite
      > Le renardeau de brume surgit en grondant. Sa lumi\xE8re argent\xE9e fait reculer la silhouette, qui s'\xE9vanouit.
      ~ rel.noe += 15; stat.creatures += 5; rel.gaspard += 5
      ~ souvenir(noe, sauve_foret, "Toi et ton renardeau l'avez sauv\xE9 dans la for\xEAt")
    sinon
      > Le renardeau h\xE9site, terrifi\xE9. La silhouette frappe No\xE9 avant de fondre dans la nuit.
      ~ rel.noe += 8; var.noe_blesse = vrai
  * [stat.ombre >= 30] Lui parler dans la langue du grimoire. #ombre
    > Tu prononces un mot que tu ne connaissais pas il y a une minute. La silhouette s'incline devant toi. Et s'en va.
    ~ rel.noe += 4; stat.ombre += 8
    noe (inquiet): \u2026C'\xE9tait quoi, ce mot ? Pourquoi elle t'a ob\xE9i ?
    ~ souvenir(noe, obeissance, "Il t'a vu donner un ordre \xE0 la silhouette noire")
* Gaspard, allez-y, vous connaissez la for\xEAt mieux que moi. #prudence
  ~ rel.noe -= 6; rel.gaspard -= 2
  > Gaspard revient \xE0 l'aube, No\xE9 sur l'\xE9paule, inconscient, le bras couvert de marques noires.
  ~ var.noe_blesse = vrai
  ~ souvenir(noe, pas_venu, "Tu n'es pas venu le chercher dans la for\xEAt")
si var.noe_blesse
  ~ planifier(ch3_noe_infirmerie, 1)`,title:"No\xE9 dans la for\xEAt",when:"temps.semaine == 3 et non var.noe_perdu",chapters:["ch3"],priority:8,once:!0},{id:"ch3_noe_infirmerie",trigger:"scheduled",script:`!lieu infirmerie 150 jour
!placer noe 130 droite
> No\xE9 est allong\xE9, le bras band\xE9. Les marques noires remontent jusqu'\xE0 l'\xE9paule.
noe (triste): La gu\xE9risseuse dit que \xE7a partira. Peut-\xEAtre. Un jour.
noe: Tu sais ce qui est bizarre ? Depuis que la chose m'a touch\xE9, j'entends une voix. Elle dit que je pourrais devenir fort. Comme toi.
* Ne l'\xE9coute pas. Jamais. C'est le grimoire. #lumiere
  ~ rel.noe += 6; var.noe_prevenu = vrai
  ~ souvenir(noe, prevenu, "Tu l'as pr\xE9venu de ne pas \xE9couter la voix")
* Tu es d\xE9j\xE0 fort, No\xE9. Tu n'as pas besoin de \xE7a. #loyal
  ~ rel.noe += 10; var.noe_prevenu = vrai
* Qu'est-ce qu'elle te dit exactement ? #curiosite
  noe: Qu'Orin peut m'aider. Qu'il a des r\xE9ponses.
  ~ var.noe_orin = vrai; stat.ruse += 1`,title:"Au chevet de No\xE9"},{id:"ch3_cercle_pierres",trigger:"enter:foret",script:`> Au fond de la for\xEAt, derri\xE8re un rideau de brume, une clairi\xE8re parfaite. Douze pierres dress\xE9es, couvertes de runes \xE0 demi effac\xE9es.
> Au centre, le sol est marqu\xE9 d'un cercle qui brille faiblement.
~ var.cercle_trouve = vrai
* D\xE9chiffrer les runes. #etude
  test stat.savoir vs 40
  si reussite
    > \xAB Ici fut li\xE9 celui qui voulut lier la mort. Par le sang de son sang, il sera d\xE9li\xE9. Par la lune et l'argent, il sera scell\xE9. \xBB
    ~ var.runes_lues = vrai; stat.savoir += 4
  sinon
    > Les runes sont trop anciennes. Tu ne comprends que deux mots : \xAB sang \xBB et \xAB sceau \xBB.
    ~ stat.savoir += 2
* (Entrer dans le cercle) #courage
  !fx magie moi
  > Une chaleur douce. Puis un murmure, tr\xE8s loin : \xAB \u2026pas encore\u2026 \xBB
  ~ stat.puissance += 2; stat.ombre -= 3`,title:"Le cercle de pierres",chapters:["ch3","ch4"],priority:6,once:!0},{id:"ch3_ayla_crise",trigger:"talk:ayla",script:`ayla (inquiet): Je n'arrive plus \xE0 dormir. Chaque nuit, je vois le ch\xE2teau en feu. Et des \xE9l\xE8ves en robe noire qui chantent.
ayla (triste): Et toi. Toujours toi, au milieu. Je ne sais pas si tu es celui qui allume le feu ou celui qui l'\xE9teint.
* Alors on va le d\xE9couvrir ensemble. Viens m\xE9diter avec moi \xE0 la tour. #romance
  ~ rel.ayla += 12; var.ayla_proche = vrai
  ~ souvenir(ayla, ensemble, "Tu lui as promis de comprendre ses visions avec elle")
  ayla (emu): Ensemble ? \u2026D'accord.
* [stat.ombre >= 25] Peut-\xEAtre que je serai celui qui l'allume. #ombre
  ~ rel.ayla -= 10
  ayla (inquiet): Ne dis pas \xE7a. M\xEAme pour rire.
* Ce ne sont que des r\xEAves, Ayla. #rationnel
  ~ rel.ayla -= 4
  ayla (triste): Pour toi, peut-\xEAtre.`,title:"Les visions d'Ayla",chapters:["ch3"],priority:7,once:!0},{id:"ch3_ayla_aveu",trigger:"enter:tour_ouest",script:`!placer ayla 230 gauche
> Il est tard. Le vitrail de la tour projette des \xE9toiles de couleur sur le sol. Ayla est l\xE0, comme si elle t'attendait.
ayla: J'ai enfin vu la fin de mon r\xEAve, cette nuit. Le ch\xE2teau br\xFBle, mais quelqu'un tient ma main. C'est toi.
* (Lui prendre la main) #romance
  ~ var.couple = vrai; rel.ayla += 15; stat.moral += 10
  ~ souvenir(ayla, main, "Tu lui as pris la main sous le vitrail de la tour")
  ayla (content): \u2026Ah. Donc c'\xE9tait \xE7a.
  > Vous restez longtemps sans parler, \xE0 regarder les \xE9toiles bouger sur les dalles.
* Ayla\u2026 je tiens \xE0 toi, mais comme une amie. #honnete
  ~ rel.ayla -= 3; var.ayla_amie = vrai
  ayla (triste): Je sais. Je l'avais vu aussi. Je voulais juste\u2026 v\xE9rifier.
  ~ souvenir(ayla, amie, "Tu lui as dit que tu tenais \xE0 elle comme \xE0 une amie")`,title:"Sous les \xE9toiles",when:"var.ayla_proche et rel.ayla >= 35",chapters:["ch3","ch4"],priority:8,once:!0},{id:"ch3_orin_vol",trigger:"tick_start",script:`!lieu grand_hall 400 nuit
!placer orin 450 gauche
orin: J'ai besoin d'un service. Ma\xEEtresse Varn garde une fiole de Larme de Lune dans son armoire. Il me la faut.
orin (content): Tu as la cl\xE9 de la R\xE9serve, tu as d\xE9j\xE0 prouv\xE9 que tu savais te faufiler. Ce sera un jeu d'enfant.
* D'accord. #ombre
  test stat.ruse vs 36
  si reussite
    > Le cachot, minuit. L'armoire grince \xE0 peine. La fiole brille dans ta main comme un morceau de ciel.
    ~ var.larme_volee = vrai; stat.ombre += 6; rel.orin += 8
    ~ souvenir(orin, larme, "Tu as vol\xE9 la Larme de Lune pour lui")
    ~ planifier(ch3_vol_decouvert, 1)
  sinon
    > Un bocal tombe. Le bruit r\xE9sonne dans tout le cachot. Tu t'enfuis, mais tu as laiss\xE9 ta trace.
    ~ var.larme_volee = vrai; stat.ombre += 4; var.trace_vol = vrai
    ~ planifier(ch3_vol_decouvert, 1)
* Pourquoi as-tu besoin de Larme de Lune ? #ruse
  orin (pensif): Pour soigner un ami. Un tr\xE8s vieil ami, tr\xE8s malade.
  > Tu penses au grimoire. Au jeune homme p\xE2le. Un frisson.
  ~ var.mefiance_orin = vrai
  * Je ne peux pas faire \xE7a. #lumiere
    ~ rel.orin -= 8; var.cercle_orin = faux
    orin (colere): Alors tu n'as plus ta place dans le cercle. Rends-moi la cl\xE9.
    ~ souvenir(orin, refus_vol, "Tu as refus\xE9 de voler pour lui")
  * Bon\u2026 d'accord. #ombre
    ~ var.larme_volee = vrai; stat.ombre += 6; rel.orin += 6
    ~ planifier(ch3_vol_decouvert, 1)
* Non. Et je quitte ton cercle. #lumiere
  ~ rel.orin -= 10; var.cercle_orin = faux; stat.courage += 3
  ~ souvenir(orin, refus_vol, "Tu as refus\xE9 de voler pour lui et tu as quitt\xE9 le cercle")
  orin: Tu fais une erreur. Une grosse erreur.`,title:"Une petite faveur",when:"var.cercle_orin et temps.semaine >= 2",chapters:["ch3"],priority:7,once:!0},{id:"ch3_vol_decouvert",trigger:"scheduled",script:`!lieu cachot_potions 200 jour
!placer varn 300 gauche
!placer noe 150 droite
varn (colere): Quelqu'un a vol\xE9 la Larme de Lune. Une fiole qui vaut plus que ce ch\xE2teau. Et j'ai trouv\xE9 ceci pr\xE8s de l'armoire.
> Elle brandit une \xE9charpe bleue. Celle de No\xE9, pr\xEAt\xE9e la semaine derni\xE8re\u2026 \xE0 toi.
noe (inquiet): C'est\u2026 c'est mon \xE9charpe, mais je n'ai rien fait ! Je le jure !
* C'est moi. No\xE9 n'y est pour rien. #honnete
  ~ var.avertissements += 1; stat.discipline -= 15; rel.varn -= 10; rel.noe += 12
  ~ souvenir(noe, avoue, "Tu as avou\xE9 le vol pour qu'il ne soit pas accus\xE9")
  varn: \u2026Un avertissement, et vous r\xE9curerez les chaudrons jusqu'\xE0 No\xEBl. Mais vous avez avou\xE9. C'est plus que ce que font la plupart des voleurs.
  ~ rel.varn += 3
* (Se taire) #ombre
  ~ rel.noe -= 20; var.noe_accuse = vrai; stat.ombre += 5
  ~ souvenir(noe, accuse, "Tu l'as laiss\xE9 accuser du vol \xE0 ta place")
  varn: Lambert. Un avertissement. Et vous \xEAtes priv\xE9 de sorties pour l'ann\xE9e.
  noe (triste): \u2026
  > No\xE9 te regarde. Il sait. Il ne dit rien. C'est pire que s'il criait.
* [var.trace_vol] (Accuser Orin) C'est le pr\xE9fet qui m'a oblig\xE9 ! #courage
  ~ var.avertissements += 1; stat.discipline -= 8; rel.noe += 6; rel.orin -= 15
  varn (pensif): Kael ? Le pr\xE9fet mod\xE8le ? \u2026Sans preuve, je ne peux rien contre lui. Mais je vais le surveiller.
  ~ var.varn_mefiante = vrai`,title:"Le voleur de Larme de Lune"},{id:"ch3_sera_alliee",trigger:"talk:sera",script:`sera: \xC9coute. Je ne vais pas le dire deux fois. Tu es la seule personne ici qui ne me traite pas comme une Valcourt.
sera (pensif): Alors je te dois la v\xE9rit\xE9. Orin r\xE9unit des \xE9l\xE8ves la nuit, sous la tapisserie. Ils parlent d'un \xAB ma\xEEtre \xBB qui va revenir. Tobias y allait. Il a arr\xEAt\xE9. Il a eu peur.
~ var.sera_alliee = vrai; var.mefiance_orin = vrai
* Merci, S\xE9raphine. On est alli\xE9s, alors ? #loyal
  ~ rel.sera += 10
  ~ souvenir(sera, alliance, "Vous avez scell\xE9 une alliance")
  sera (fier): Alli\xE9s. Mais ne le dis \xE0 personne. J'ai une r\xE9putation.
* Pourquoi tu me dis \xE7a maintenant ? #ruse
  sera: Parce que j'ai vu ta t\xEAte quand Orin te parle. Tu as peur de lui, toi aussi.
  ~ rel.sera += 5`,title:"Une alli\xE9e inattendue",when:"rel.sera >= 15",chapters:["ch3","ch4"],priority:7,once:!0},{id:"ch3_brax_eleve",trigger:"activity:entrainement_duel",script:`!placer brax 380 gauche
brax: Toi. Reste apr\xE8s l'entra\xEEnement.
brax: J'ai \xE9t\xE9 champion trois fois. Personne ne m'a jamais battu en finale. Tu sais pourquoi ?
* Parce que vous \xEAtes le meilleur ?
  brax (rire): Parce que je n'avais peur de rien. Erreur. La peur, c'est ce qui te garde en vie.
* Parce que vous travailliez plus que les autres ?
  brax: Aussi. Mais surtout parce que je savais perdre. \xC0 l'entra\xEEnement. Mille fois.
brax: Je vais t'apprendre la parade miroir. Le sort de l'adversaire lui revient en pleine figure. \xC7a demande du sang-froid.
~ stat.duel += 6; var.sorts += 1; rel.brax += 10; var.parade_miroir = vrai
~ souvenir(brax, eleve, "Il t'a appris la parade miroir")`,title:"L'\xE9l\xE8ve de Brax",when:"stat.duel >= 40",chapters:["ch3","ch4"],priority:7,once:!0},{id:"ch3_lia_harcelee",trigger:"enter:salle_commune",script:`!placer lia 120 droite
!placer tobias 220 gauche
> Lia est recroquevill\xE9e sur le canap\xE9. Tobias rit, son cahier de runes \xE0 la main.
tobias (rire): \xAB Mon r\xEAve est de devenir archimage. \xBB Elle a \xE9crit \xE7a. Archimage ! Une naine de Racine !
* Rends-lui son cahier, Tobias. Tout de suite. #courage
  si rel.tobias >= 0
    tobias (inquiet): \u2026Ok, ok. C'\xE9tait pour rire.
    > Il lui rend son cahier. Puis, plus bas : \xAB D\xE9sol\xE9, petite. \xBB
    ~ rel.lia += 10; rel.tobias += 3
  sinon
    test stat.courage + stat.duel / 3 vs 38
    si reussite
      > Tu n'as m\xEAme pas besoin de sortir ta baguette. Ton regard suffit.
      ~ rel.lia += 12; stat.reputation += 4; rel.tobias -= 5
    sinon
      > Tobias te bouscule en ricanant. Lia r\xE9cup\xE8re son cahier toute seule, en tremblant.
      ~ rel.lia += 6; stat.moral -= 4
  ~ souvenir(lia, defendue, "Tu l'as d\xE9fendue contre Tobias")
* Lia, ne pleure pas. Montre-lui ce que tu sais faire. #mentor
  !fx magie lia
  > Lia s\xE8che ses larmes, pointe sa baguette, et le cahier s'envole des mains de Tobias pour revenir dans les siennes.
  ~ rel.lia += 14; stat.reputation += 3
  ~ souvenir(lia, confiance, "Tu lui as donn\xE9 confiance en elle face \xE0 Tobias")
  tobias (surpris): \u2026Pas mal, la naine.`,title:"Lia en larmes",when:"var.mentor_lia et temps.semaine >= 2",chapters:["ch3","ch4"],priority:7,once:!0},{id:"ch3_gaspard_histoire",trigger:"talk:gaspard",script:`gaspard (pensif): Assieds-toi. Il est temps que quelqu'un te raconte.
gaspard: Il y a quarante ans, j'\xE9tais \xE9l\xE8ve ici. Comme toi. Dans ma classe, il y avait un gar\xE7on. Malrik. Le plus dou\xE9 de tous.
gaspard (triste): Sa petite s\u0153ur est morte d'une fi\xE8vre. Il ne l'a pas support\xE9. Il a cherch\xE9 un moyen de vaincre la mort. Il a fini par enfermer sa propre \xE2me dans un livre pour ne jamais mourir.
gaspard: Halloran l'a scell\xE9 dans le cercle de pierres de la for\xEAt. Mais le sceau s'use. Et Malrik a des disciples. Des \xE9l\xE8ves qui l'entendent.
~ var.malrik_nom = vrai
si var.grimoire_trouve et non var.grimoire_ferme
  gaspard (inquiet): Toi, tu l'entends. Je le vois \xE0 tes yeux. Fais attention, petit. Il ne veut pas un ami. Il veut un corps.
  ~ stat.moral -= 3`,title:"L'histoire de Malrik",when:"rel.gaspard >= 30",chapters:["ch3","ch4"],priority:7,once:!0},{id:"ch3_maman_malade",trigger:"tick_start",script:`> Un corbeau, en pleine nuit. Pas l'\xE9criture de ta m\xE8re : celle de la voisine.
> \xAB Ta maman est tomb\xE9e malade. Les m\xE9decins ne comprennent pas. Elle demande apr\xE8s toi. \xBB
* Pr\xE9parer un rem\xE8de et l'envoyer par corbeau. #soin
  test stat.potions vs 40
  si reussite
    > Tu passes la nuit au cachot. Au matin, une fiole dor\xE9e s'envole vers chez toi. Trois jours plus tard, une lettre : \xAB Je vais mieux. Je ne sais pas ce que tu m'as envoy\xE9, mais merci. \xBB
    ~ rel.claire += 15; stat.potions += 3; stat.moral += 6
    ~ souvenir(claire, remede, "Tu lui as envoy\xE9 un rem\xE8de quand elle \xE9tait malade")
  sinon
    > Ta potion vire au gris. Rat\xE9e. Tu en envoies une autre, plus simple. Elle gu\xE9rira, lentement, sans toi.
    ~ rel.claire += 5; stat.moral -= 4
* [stat.ecus >= 30] Envoyer tous tes \xE9cus pour payer un gu\xE9risseur. #genereux
  ~ stat.ecus -= 30; rel.claire += 12
  ~ souvenir(claire, ecus, "Tu as envoy\xE9 toutes tes \xE9conomies pour la soigner")
* [stat.ombre >= 35] Demander au grimoire un sort de gu\xE9rison. #ombre
  > Le grimoire te donne le sort. Ta m\xE8re gu\xE9rit en une nuit. Mais depuis, ses lettres sont\u2026 diff\xE9rentes. Plus froides.
  ~ stat.ombre += 10; rel.malrik += 8; rel.claire -= 5
  ~ souvenir(claire, sort_noir, "Tu l'as gu\xE9rie avec un sort du grimoire")`,title:"Mauvaise nouvelle",when:"temps.semaine == 4",chapters:["ch3"],priority:7,once:!0},{id:"ch3_halloran_sceau",trigger:"enter:grand_hall",script:`!placer halloran 380 gauche
halloran: {joueur.nom}. Viens. J'ai besoin de te parler, et le hall a trop d'oreilles.
!lieu bureau_archimage 120 soir
!placer halloran 250 gauche
halloran (pensif): Je suis vieux. Le sceau qui retient Malrik est li\xE9 \xE0 ma propre vie. Quand je mourrai, il se brisera.
halloran: Il faudra quelqu'un pour le refaire. Quelqu'un qui conna\xEEt le cercle, les runes et les trois ingr\xE9dients du rituel.
halloran (inquiet): Je ne te demande rien aujourd'hui. Mais r\xE9fl\xE9chis. Le moment venu, il faudra choisir.
~ var.sceau_connu = vrai; rel.halloran += 5`,title:"Le sceau",when:"rel.halloran >= 15 et temps.semaine >= 3",chapters:["ch3","ch4"],priority:7,once:!0},{id:"ch3_somnambule",trigger:"tick_end",script:`> Tu te r\xE9veilles debout, pieds nus, dans la biblioth\xE8que. Il fait nuit. Ta main est pos\xE9e sur la porte de la R\xE9serve.
> Tu ne te souviens pas d'\xEAtre venu.
* (Retourner au lit et ne plus jamais y penser)
  ~ stat.moral -= 6; stat.ombre += 3
* (Aller m\xE9diter \xE0 la tour jusqu'\xE0 l'aube) #lumiere
  ~ stat.ombre -= 8; stat.energie -= 20; stat.moral += 2
* (En parler \xE0 Ayla, demain) #ecoute
  ~ rel.ayla += 6; stat.ombre -= 3
  ayla (inquiet): Il t'appelle. Il te veut, toi. Il faut que tu r\xE9sistes.`,title:"Somnambule",when:"var.grimoire_trouve et stat.ombre >= 30",chapters:["ch3","ch4","ch5"],priority:6,once:!0},{id:"ch3_fin",trigger:"chapter_end",script:`!lieu grand_hall 300 jour
~ var.note_annee3 = (stat.sortileges + stat.potions + stat.savoir) / 3 + stat.discipline / 6
si var.note_annee3 >= 46
  > Troisi\xE8me ann\xE9e : Mention Excellence. Ton nom est grav\xE9 sur la plaque des meilleurs \xE9l\xE8ves.
  ~ stat.reputation += 8; stat.moral += 5
sinon si var.note_annee3 >= 30
  > Troisi\xE8me ann\xE9e : admis.
sinon
  > Troisi\xE8me ann\xE9e : admis de justesse. Une lettre de mise en garde est envoy\xE9e \xE0 ta famille.
  ~ rel.claire -= 4; stat.moral -= 4
~ objectifReussi("troisieme_annee")
si var.champion
  > Lors du banquet, la coupe du Tournoi des Duels tr\xF4ne devant toi. Tout le monde scande ton nom.
  ~ stat.moral += 6
> Pendant l'\xE9t\xE9, deux anciens \xE9l\xE8ves disparaissent de chez eux. Leurs familles re\xE7oivent la m\xEAme carte : un livre noir, dessin\xE9 \xE0 l'encre.`,title:"Fin de la troisi\xE8me ann\xE9e",chapters:["ch3"],priority:100,once:!0},{id:"ch4_rentree",trigger:"tick_start",script:`!lieu grand_hall 300 jour
!placer daval 420 gauche
!placer halloran 480 gauche
> Le banquet de rentr\xE9e est silencieux. \xC0 c\xF4t\xE9 de l'Archimage, un homme en costume sombre, qui ne mange rien.
daval: Je suis l'inspecteur Daval, envoy\xE9 du Conseil des Mages. Deux anciens \xE9l\xE8ves ont disparu. Des cr\xE9atures meurent dans la for\xEAt. Des livres interdits circulent.
daval (colere): Je trouverai les responsables. Et croyez-moi : je trouve toujours.
halloran (triste): L'inspecteur a tous les pouvoirs cette ann\xE9e. Je vous demande de coop\xE9rer.
> L'Archimage a vieilli d'un coup. Ses mains tremblent en levant son verre.
~ objectif("quatrieme_annee", "Survivre \xE0 la quatri\xE8me ann\xE9e")`,title:"L'inspecteur",when:"temps.semaine == 1",chapters:["ch4"],priority:20,once:!0},{id:"ch4_attaque",trigger:"enter:cour",script:`!placer noe 200 droite
!placer lia 160 droite
> Des cris. Au milieu de la cour, une cr\xE9ature faite de fum\xE9e noire, haute comme deux hommes. Les \xE9l\xE8ves fuient dans tous les sens.
!fx tremblement
noe (inquiet): {joueur.nom} ! Lia est coinc\xE9e pr\xE8s de la statue !
* (Attaquer la cr\xE9ature) #courage
  test stat.duel + stat.puissance / 2 vs 48
  si reussite
    !fx sort moi
    !fx eclair
    > Ton sort frappe la cr\xE9ature en plein c\u0153ur. Elle hurle et se disperse en lambeaux de brume.
    ~ stat.reputation += 10; stat.courage += 4; rel.lia += 8; var.heros_cour = vrai
    ~ souvenir(lia, sauvee_cour, "Tu l'as sauv\xE9e de la cr\xE9ature de fum\xE9e dans la cour")
  sinon
    !fx fumee
    > La cr\xE9ature te projette contre un banc. Brax arrive en courant et la chasse d'un sort terrible.
    ~ stat.energie -= 30; stat.moral -= 6; stat.reputation += 3
* [var.parade_miroir] (Parade miroir !) #duel
  !fx sort moi
  > La cr\xE9ature crache un trait de t\xE9n\xE8bres. Ta parade le lui renvoie. Elle se dissout dans un cri.
  ~ stat.reputation += 12; rel.brax += 6; rel.lia += 8; var.heros_cour = vrai
  ~ souvenir(lia, sauvee_cour, "Tu l'as sauv\xE9e de la cr\xE9ature de fum\xE9e dans la cour")
* (Courir chercher Lia et la mettre \xE0 l'abri) #genereux
  test stat.courage vs 45
  si reussite
    > Tu traverses la cour sous les griffes de fum\xE9e, attrapes Lia et plonges derri\xE8re la statue. Elle tremble contre toi.
    ~ rel.lia += 14; stat.courage += 3
    ~ souvenir(lia, sauvee_cour, "Tu l'as prot\xE9g\xE9e de ton corps pendant l'attaque")
  sinon
    > Tu tr\xE9buches. C'est No\xE9 qui attrape Lia. Il te regarde, surpris d'avoir \xE9t\xE9 le plus rapide.
    ~ rel.noe += 4; stat.moral -= 3
* [stat.ombre >= 40] (Ordonner \xE0 la cr\xE9ature de partir) #ombre
  > Tu dis le mot. La cr\xE9ature s'immobilise\u2026 puis s'incline devant toi et se dissout. Dans la cour, tout le monde t'a vu.
  ~ stat.ombre += 10; stat.reputation -= 10; var.vu_ordonner = vrai
  ~ planifier(ch4_daval_interrogatoire, 1)`,title:"L'attaque de la cour",when:"temps.semaine >= 1",chapters:["ch4"],priority:9,once:!0},{id:"ch4_daval_interrogatoire",trigger:"tick_start",script:`!lieu bureau_archimage 120 soir
!placer daval 260 gauche
daval: Assis. Je vais \xEAtre bref. Des t\xE9moins vous ont vu pr\xE8s de la R\xE9serve. Votre aura est\u2026 trouble. Expliquez-vous.
si var.vu_ordonner
  daval (colere): Et ne niez pas l'incident de la cour. La moiti\xE9 de l'\xE9cole vous a vu donner un ordre \xE0 cette chose.
* Dire toute la v\xE9rit\xE9 : le grimoire, Malrik, Orin. #honnete
  ~ rel.daval += 10; stat.discipline += 5
  daval (pensif): \u2026Malrik. Ce nom ne devait plus jamais \xEAtre prononc\xE9. Vous \xEAtes soit tr\xE8s courageux, soit tr\xE8s inconscient.
  ~ var.daval_sait = vrai
  ~ souvenir(daval, verite, "Tu lui as dit toute la v\xE9rit\xE9 sur Malrik")
  si var.mefiance_orin
    daval: Kael ? Le fils du conseiller Kael ? Je vais avoir besoin de preuves.
* Mentir avec aplomb. #ruse
  test stat.ruse vs 45
  si reussite
    > Tu inventes une histoire parfaite. Daval prend des notes, puis te cong\xE9die d'un geste.
    ~ stat.ruse += 3; stat.ombre += 2
  sinon
    daval: Vous mentez mal. Avertissement officiel. Au prochain, c'est l'expulsion.
    ~ var.avertissements += 1; stat.discipline -= 15; rel.daval -= 10
* Je ne dirai rien sans l'Archimage. #courage
  ~ rel.daval -= 5; rel.halloran += 4; stat.courage += 2
  daval: Votre Archimage ne sera pas toujours l\xE0 pour vous prot\xE9ger.`,title:"L'interrogatoire",when:"temps.semaine >= 2 et (stat.ombre >= 25 ou var.vu_ordonner ou var.larme_volee ou joueur.origine == trouve)",chapters:["ch4"],priority:9,once:!0},{id:"ch4_heritage",trigger:"tick_start",script:`!lieu bureau_archimage 120 nuit
!placer halloran 250 gauche
halloran (triste): Assieds-toi. J'aurais d\xFB te le dire il y a longtemps. Le soir de ton arriv\xE9e, j'ai reconnu tes yeux.
halloran: Malrik avait une s\u0153ur, Ilyana. Elle n'est pas morte de la fi\xE8vre, comme on l'a racont\xE9. Elle a fui. Elle a eu un enfant, qui a eu un enfant\u2026
halloran (inquiet): Tu es du sang de Malrik, {joueur.nom}. Le dernier.
~ var.heritier = vrai
halloran: Les runes du cercle disent : \xAB Par le sang de son sang, il sera d\xE9li\xE9. \xBB Ton sang peut le lib\xE9rer. Mais il peut aussi le sceller pour toujours.
* Pourquoi ne pas me l'avoir dit avant ? #colere
  ~ rel.halloran -= 5
  halloran (triste): Parce que j'avais peur. Peur que tu fasses le m\xEAme choix que lui.
* Alors c'est \xE0 moi de le sceller. #lumiere
  ~ rel.halloran += 10; stat.courage += 5
  halloran (emu): Pas encore. Pas seul. Mais oui. Peut-\xEAtre.
* [stat.ombre >= 30] \u2026Alors c'est pour \xE7a qu'il m'appelle. Il est ma famille. #ombre
  ~ stat.ombre += 8; rel.malrik += 10
  halloran (inquiet): Il n'est la famille de personne. Il a mang\xE9 tout ce qu'il y avait d'humain en lui.`,title:"L'h\xE9ritage",when:"joueur.origine == trouve et temps.semaine >= 2",chapters:["ch4"],priority:10,once:!0},{id:"ch4_orin_masque",trigger:"tick_start",script:`!lieu grand_hall 395 nuit
!placer orin 440 gauche
> Minuit, devant la tapisserie \xE0 la lune. Orin t'attend. Il ne sourit plus.
orin: Assez jou\xE9. Le ma\xEEtre revient. Le sceau de Halloran se fissure un peu plus chaque nuit.
orin (fier): Quand Malrik reviendra, ceux qui l'auront servi seront r\xE9compens\xE9s. Les autres\u2026 dispara\xEEtront, comme les deux idiots de l'\xE9t\xE9.
si var.pacte ou var.cercle_orin
  orin: Toi, tu es d\xE9j\xE0 des n\xF4tres. Il te veut \xE0 sa droite.
  * Je suis avec vous. #ombre
    ~ var.disciple = vrai; stat.ombre += 12; rel.orin += 10; rel.malrik += 10
    ~ souvenir(orin, disciple, "Tu as jur\xE9 fid\xE9lit\xE9 \xE0 Malrik")
    orin (content): Je savais que tu ferais le bon choix.
  * Non. C'est fini, Orin. #lumiere
    ~ var.cercle_orin = faux; rel.orin -= 20; stat.courage += 4
    orin (colere): Alors tu seras le premier \xE0 tomber.
sinon
  * Tu es compl\xE8tement fou. #courage
    ~ rel.orin -= 10; stat.courage += 2
    orin (rire): Fou ? Non. Simplement en avance.
  * (Faire semblant de s'int\xE9resser, pour en savoir plus) #ruse
    test stat.ruse vs 44
    si reussite
      orin: Le rituel aura lieu au cercle de pierres. Le dernier soir de l'ann\xE9e. Il ne manque que le sang de son sang.
      ~ var.infos_rituel = vrai; stat.ruse += 3
    sinon
      orin (pensif): Tu me prends pour un idiot ? D\xE9gage.
!sortir orin droite
si var.daval_sait ou var.sera_alliee
  > Le lendemain, Daval fait fouiller la chambre d'Orin. Il n'y trouve rien. Orin a disparu du ch\xE2teau pendant la nuit.
  ~ var.orin_demasque = vrai
sinon
  > Le lendemain, Orin te salue dans le hall avec son plus beau sourire de pr\xE9fet. Comme si de rien n'\xE9tait.`,title:"Le masque tombe",when:"temps.semaine >= 3",chapters:["ch4"],priority:9,once:!0},{id:"ch4_noe_tentation",trigger:"talk:noe",script:`noe (inquiet): Il faut que je te dise un truc. Orin est venu me voir. Il dit que le ma\xEEtre peut me rendre fort. Plus besoin de rater mes sorts. Plus jamais.
si var.noe_accuse
  noe (colere): Et franchement, depuis que tu m'as laiss\xE9 accuser du vol, je ne sais plus trop \xE0 qui faire confiance.
si mem.noe.revisions ou mem.noe.sauve_foret ou mem.noe.defendu
  > Il te regarde, et tu sais qu'il se souvient de tout ce que tu as fait pour lui.
* Tu n'as pas besoin de lui. Tu m'as, moi. #loyal
  test rel.noe vs 40
  si reussite
    noe (emu): \u2026Ouais. Je t'ai, toi. J'avais besoin de l'entendre.
    ~ rel.noe += 10; var.noe_sauve = vrai
    ~ souvenir(noe, choix, "Tu l'as retenu quand Orin voulait le recruter")
  sinon
    noe (triste): C'est facile \xE0 dire. Tu es champion, tu es le chouchou des profs. Moi, je suis juste \xAB le fils du boulanger \xBB.
    ~ var.noe_perdu = vrai
    > Le lendemain, le lit de No\xE9 est vide. Il a laiss\xE9 un mot : \xAB Pardon. \xBB
* C'est un pi\xE8ge, No\xE9. Les deux disparus de l'\xE9t\xE9, c'\xE9tait ses recrues. #honnete
  test stat.savoir + rel.noe / 2 vs 40
  si reussite
    noe (inquiet): \u2026Tu es s\xFBr ? Alors j'ai failli\u2026 Merci.
    ~ var.noe_sauve = vrai; rel.noe += 6
  sinon
    noe: Tu dis \xE7a parce que tu ne veux pas que je devienne aussi fort que toi.
    ~ var.noe_perdu = vrai
    > Le lendemain, le lit de No\xE9 est vide.
* Fais ce que tu veux, No\xE9. #indifference
  ~ var.noe_perdu = vrai; rel.noe -= 15
  > Le lendemain, le lit de No\xE9 est vide. Sur ton oreiller, l'\xE9charpe bleue qu'il t'avait pr\xEAt\xE9e.
si var.noe_perdu
  ~ souvenir(noe, perdu, "Il est parti rejoindre Orin")`,title:"La tentation de No\xE9",when:"temps.semaine >= 3",chapters:["ch4"],priority:9,once:!0},{id:"ch4_sera_mere",trigger:"enter:grand_hall",script:`!placer sera 300 droite
sera (colere): Ma m\xE8re si\xE8ge au Conseil. Elle a demand\xE9 \xE0 Daval d'expulser tous les \xE9l\xE8ves \xAB de sang douteux \xBB. Les enfants sans lign\xE9e. Les orphelins.
sera (triste): Et elle veut que je t\xE9moigne contre eux. Contre toi, peut-\xEAtre.
* Tu n'as pas \xE0 faire ce qu'elle veut. Tu n'es pas elle. #ecoute
  ~ rel.sera += 12; var.sera_rebelle = vrai
  ~ souvenir(sera, liberte, "Tu lui as dit qu'elle n'\xE9tait pas oblig\xE9e d'ob\xE9ir \xE0 sa m\xE8re")
  sera (fier): \u2026Non. Je ne suis pas elle. Je vais lui \xE9crire. Et elle ne va pas aimer ma lettre.
* Fais ce qu'il faut pour te prot\xE9ger. Je comprendrais. #genereux
  ~ rel.sera += 6
  sera (surpris): Tu\u2026 tu ne m'en voudrais pas ? Pourquoi tu es comme \xE7a ?`,title:"La m\xE8re de S\xE9raphine",when:"var.sera_alliee et temps.semaine >= 2",chapters:["ch4"],priority:8,once:!0},{id:"ch4_mission_sceau",trigger:"tick_start",script:`!lieu bureau_archimage 120 soir
!placer halloran 250 gauche
halloran (triste): Je n'ai plus le temps d'attendre que tu sois pr\xEAt. Le sceau se brise.
halloran: Pour le refaire, il faut trois choses. La Larme de Lune, distill\xE9e de ta main. Une plume du Cerf d'argent, offerte, jamais prise. Et la rune du sceau, retrouv\xE9e dans les \xE9toiles.
halloran: Veux-tu m'aider ?
* Oui. Dites-moi quoi faire. #lumiere
  ~ var.mission = vrai; rel.halloran += 8
  ~ objectif("larme", "Distiller la Larme de Lune (pr\xE9parer des potions)")
  ~ objectif("plume", "Obtenir une plume du Cerf d'argent (soigner les cr\xE9atures ou explorer la for\xEAt)")
  ~ objectif("rune", "Retrouver la rune du sceau (\xE9tudier ou lire les \xE9toiles)")
* [var.disciple] (Accepter\u2026 pour mieux trahir) #ombre
  ~ var.mission = vrai; var.double_jeu = vrai; stat.ombre += 6
  ~ objectif("larme", "Distiller la Larme de Lune (pr\xE9parer des potions)")
  ~ objectif("plume", "Obtenir une plume du Cerf d'argent (soigner les cr\xE9atures ou explorer la for\xEAt)")
  ~ objectif("rune", "Retrouver la rune du sceau (\xE9tudier ou lire les \xE9toiles)")
* Je ne suis pas pr\xEAt. Je suis d\xE9sol\xE9. #peur
  ~ rel.halloran -= 4; stat.moral -= 4
  halloran (triste): Personne ne l'est jamais.`,title:"La mission",when:"temps.semaine >= 3 et (var.sceau_connu ou var.heritier ou var.malrik_nom)",chapters:["ch4"],priority:8,once:!0},{id:"ch4_larme",trigger:"activity:preparer_potion",script:`!placer varn 300 gauche
> La recette de la Larme de Lune tient sur une page. Il faut pourtant douze heures, une main qui ne tremble pas, et une lune pleine dans la fen\xEAtre du cachot.
si var.varn_mefiante ou rel.varn >= 15
  varn: Laissez-moi vous aider. Je sais pour quoi c'est faire.
  ~ rel.varn += 4
test stat.potions + stat.savoir / 4 + (rel.varn >= 15 ? 10 : 0) vs 45
si reussite
  > Au petit matin, une goutte d'argent liquide repose au fond de la fiole. Elle chante.
  ~ var.larme_ok = vrai; stat.potions += 5
  ~ objectifReussi("larme")
  varn (fier): \u2026Je n'ai r\xE9ussi la mienne qu'au troisi\xE8me essai. \xC0 vingt-cinq ans.
sinon
  > La potion tourne au noir \xE0 la onzi\xE8me heure. Il faudra recommencer.
  ~ stat.potions += 2; stat.moral -= 3`,title:"La Larme de Lune",when:"var.mission et non var.larme_ok",chapters:["ch4","ch5"],priority:9,cooldown:1,tags:["important"]},{id:"ch4_cerf",trigger:"activity:cueillette_foret",script:`> La brume s'\xE9carte. Au milieu de la clairi\xE8re, un cerf immense, au pelage d'argent. Il te regarde sans peur.
* (Tendre la main, paume ouverte, et attendre) #creature
  test stat.creatures + rel.gaspard / 3 + stat.courage / 5 vs 45
  si reussite
    > Le cerf s'approche, incline la t\xEAte, et une plume d'argent se d\xE9tache de sa crini\xE8re pour tomber dans ta main.
    ~ var.plume_ok = vrai; stat.creatures += 5
    ~ objectifReussi("plume")
  sinon
    > Le cerf recule et s'\xE9vanouit dans la brume. Il reviendra peut-\xEAtre.
    ~ stat.creatures += 2
* [stat.ombre >= 40] (Le figer d'un sort et prendre la plume de force) #ombre
  > Le cerf s'effondre, fig\xE9. Tu arraches la plume. Elle noircit dans ta main.
  ~ stat.ombre += 15; rel.gaspard -= 20; var.plume_noire = vrai
  ~ souvenir(gaspard, cerf, "Tu as bless\xE9 le Cerf d'argent pour lui voler une plume")`,title:"Le Cerf d'argent",when:"var.mission et non var.plume_ok",chapters:["ch4","ch5"],priority:9,cooldown:1,tags:["important"]},{id:"ch4_cerf_gaspard",trigger:"activity:soigner_creatures",script:`!placer gaspard 150 droite
gaspard: Tu cherches le Cerf, hein ? Halloran m'a dit. Il ne se montre qu'\xE0 ceux qu'il a d\xE9j\xE0 vus aider les b\xEAtes.
gaspard (content): Il te conna\xEEt. Viens.
!lieu foret 300 soir
> Il siffle doucement. La brume s'\xE9carte, et le Cerf d'argent appara\xEEt. Il marche droit vers toi et d\xE9pose une plume \xE0 tes pieds.
~ var.plume_ok = vrai; stat.creatures += 4; rel.gaspard += 6
~ objectifReussi("plume")
!rappel gaspard.biche`,title:"Le Cerf d'argent",when:"var.mission et non var.plume_ok et rel.gaspard >= 30",chapters:["ch4","ch5"],priority:9,once:!0,tags:["important"]},{id:"ch4_rune",trigger:"activity:divination",script:`> Les \xE9toiles s'alignent dans le vitrail de la tour. Une forme se dessine, puis s'efface. Il faut la saisir au vol.
si var.couple ou var.ayla_proche
  !placer ayla 250 gauche
  ayla: Je la vois aussi. Regarde, l\xE0. Trois traits et un cercle.
  ~ rel.ayla += 4
test stat.savoir + (var.couple ? 12 : 0) + (var.runes_lues ? 10 : 0) vs 48
si reussite
  > Tu la vois. Tu la dessines. La rune du sceau brille un instant sur le papier, puis se grave dans ta m\xE9moire.
  ~ var.rune_ok = vrai; stat.savoir += 5
  ~ objectifReussi("rune")
sinon
  > Les \xE9toiles bougent trop vite. Il faudra revenir.
  ~ stat.savoir += 2`,title:"La rune du sceau",when:"var.mission et non var.rune_ok",chapters:["ch4","ch5"],priority:9,cooldown:1,tags:["important"]},{id:"ch4_rune_etude",trigger:"activity:etudier",script:`!placer pell 300 gauche
pell: Vous cherchez la rune du sceau. Ne niez pas. J'ai quelque chose pour vous.
> Elle pose devant toi un carnet reli\xE9 de cuir. L'\xE9criture de Halloran, jeune. Une page marqu\xE9e : la rune, dessin\xE9e en entier.
~ var.rune_ok = vrai; stat.savoir += 3
~ objectifReussi("rune")
pell (triste): Il me l'avait confi\xE9 il y a quarante ans. \xAB Pour le jour o\xF9 ce ne sera plus moi. \xBB`,title:"La rune dans les livres",when:"var.mission et non var.rune_ok et (var.pell_alliee ou rel.pell >= 5)",chapters:["ch4","ch5"],priority:9,once:!0},{id:"ch4_lia_disparue",trigger:"tick_start",script:`!lieu salle_commune 200 nuit
> Panique dans la salle commune. Lia a disparu. Son lit n'a pas \xE9t\xE9 d\xE9fait.
> Sur son oreiller, un livre noir dessin\xE9 \xE0 l'encre. La signature des disciples.
si var.noe_perdu
  > Et sous le dessin, une \xE9criture que tu connais trop bien. Celle de No\xE9.
* Partir \xE0 sa recherche, cette nuit. #courage
  !lieu grand_hall 395 nuit
  > Le passage derri\xE8re la tapisserie. L'escalier. La salle ronde. Lia est l\xE0, ligot\xE9e par des fils de fum\xE9e.
  test stat.duel + stat.courage / 2 vs 50
  si reussite
    !fx sort moi
    > Deux disciples encagoul\xE9s. Tes sorts les renversent avant qu'ils aient compris. Tu lib\xE8res Lia.
    ~ rel.lia += 15; stat.reputation += 8; var.lia_sauvee = vrai
    ~ souvenir(lia, sauvee, "Tu es venu la chercher dans la salle secr\xE8te")
    lia (emu): Je savais que tu viendrais. Je le savais.
  sinon
    > Ils sont trop nombreux. Tu parviens \xE0 arracher Lia \xE0 leurs fils, mais un sort t'atteint au dos.
    ~ rel.lia += 12; stat.energie -= 40; var.lia_sauvee = vrai; var.blessure_dos = vrai
* Pr\xE9venir Daval et Halloran. #regle
  ~ rel.daval += 6; stat.discipline += 4
  > Les professeurs fouillent le ch\xE2teau toute la nuit. Ils retrouvent Lia \xE0 l'aube, endormie, sans souvenir. Saine et sauve.
  ~ var.lia_sauvee = vrai; rel.lia += 4`,title:"Lia a disparu",when:"var.mentor_lia et temps.semaine >= 4 et rel.lia >= 20",chapters:["ch4"],priority:9,once:!0},{id:"ch4_menace_expulsion",trigger:"tick_start",script:`!lieu bureau_archimage 120 jour
!placer daval 220 gauche
!placer halloran 300 gauche
daval: {var.avertissements} avertissements. Un comportement inacceptable. Je demande l'expulsion imm\xE9diate.
si rel.halloran >= 25 et non mem.halloran.mensonge
  halloran (colere): Refus\xE9. Cet \xE9l\xE8ve a plus fait pour cette \xE9cole que vous n'en ferez jamais, inspecteur.
  ~ var.avertissements = 1; stat.discipline = 30
  daval: \u2026Comme vous voudrez. Mais je consigne mon d\xE9saccord.
sinon si var.champion ou stat.reputation >= 60
  halloran: Un champion du tournoi ne s'expulse pas comme un voleur de pommes. Dernier avertissement.
  ~ var.avertissements = 2; stat.discipline = 25
sinon
  halloran (triste): \u2026Je ne peux plus te prot\xE9ger, {joueur.nom}.
  * Supplier qu'on me laisse une derni\xE8re chance. #humble
    test stat.reputation + rel.halloran / 2 vs 40
    si reussite
      daval: Une seule. La derni\xE8re.
      ~ var.avertissements = 2; stat.discipline = 20
    sinon
      > On te remet ta baguette bris\xE9e en deux. Ton nom est effac\xE9 des registres.
      ~ var.expulse = vrai
      ~ fin(exil)
  * (Partir la t\xEAte haute) #fierte
    > On te remet ta baguette bris\xE9e en deux. Tu ne te retournes pas en descendant vers le quai.
    ~ var.expulse = vrai
    ~ fin(exil)`,title:"Le conseil de discipline",when:"var.avertissements >= 3 ou stat.discipline <= 10",chapters:["ch4","ch5"],priority:15,once:!0},{id:"ch4_marthe_refuge",trigger:"enter:auberge",script:`!placer marthe 340 gauche
marthe (inquiet): Ferme la porte, mon poussin. Vite.
> Dans la cave, trois \xE9l\xE8ves de premi\xE8re ann\xE9e, terrifi\xE9s. Des enfants \xAB de sang douteux \xBB, menac\xE9s d'expulsion par le Conseil.
marthe: Je les cache jusqu'\xE0 ce que \xE7a se calme. Tu ne diras rien, hein ?
* Je peux apporter des potions et des livres. Ils ne vont pas rater leur ann\xE9e. #genereux
  ~ rel.marthe += 12; stat.reputation += 4; stat.potions += 1
  ~ souvenir(marthe, cave, "Tu as aid\xE9 les enfants cach\xE9s dans sa cave")
  ~ var.aide_cave = vrai
* Je ne dirai rien. Promis. #loyal
  ~ rel.marthe += 6
* [rel.daval >= 10] Il faut pr\xE9venir Daval. Il pourrait les prot\xE9ger. #regle
  ~ rel.marthe -= 12; rel.daval += 5
  marthe (colere): Daval ? C'est lui qui veut les renvoyer ! Sors d'ici.`,title:"La cave de la Com\xE8te",chapters:["ch4"],priority:7,once:!0},{id:"ch4_brax_blesse",trigger:"tick_start",script:`!lieu infirmerie 150 nuit
!placer brax 130 droite
> Brax est allong\xE9 sur un lit de l'infirmerie, le torse band\xE9. Il a tenu seul face \xE0 six disciples dans la for\xEAt pour couvrir la fuite de deux \xE9l\xE8ves.
brax (triste): Ils \xE9taient plus forts que je pensais. Organis\xE9s. Quelqu'un les entra\xEEne. Quelqu'un de dou\xE9.
brax: \xC9coute-moi. Quand \xE7a va commencer pour de vrai, ne te bats pas pour gagner. Bats-toi pour que les autres rentrent chez eux.
~ rel.brax += 6; stat.courage += 3
si var.disciple
  > Tu baisses les yeux. Tu connais certains des six. Tu leur as parl\xE9, sous la tapisserie.
  ~ stat.moral -= 8; stat.ombre += 3`,title:"La chute de Brax",when:"temps.semaine == 5",chapters:["ch4"],priority:8,once:!0},{id:"ch4_fin",trigger:"chapter_end",script:`!lieu cour 300 nuit
> Derni\xE8re nuit de l'ann\xE9e. Un grondement monte de la for\xEAt. Au loin, une lueur violette s'\xE9l\xE8ve au-dessus des arbres, puis retombe.
!fx tremblement
> Le sceau s'est fissur\xE9. Tout le monde l'a senti.
~ objectifReussi("quatrieme_annee")
si var.larme_ok et var.plume_ok et var.rune_ok
  > Dans ta malle, la Larme de Lune, la plume d'argent et la rune du sceau. Tout est pr\xEAt.
  ~ var.ingredients = vrai
sinon si var.mission
  > Il te manque encore des ingr\xE9dients du rituel. Il reste une ann\xE9e.
si var.noe_perdu
  > Quelque part dans cette for\xEAt, il y a No\xE9.`,title:"Le sceau se fissure",chapters:["ch4"],priority:100,once:!0},{id:"ch5_rentree",trigger:"tick_start",script:`!lieu grand_hall 300 soir
!placer halloran 420 gauche
> La moiti\xE9 des chaises sont vides. Des familles ont retir\xE9 leurs enfants. Les bougies sous la vo\xFBte vacillent comme si elles avaient peur.
halloran (triste): Ombrelune a connu des jours plus sombres. Elle s'en est toujours relev\xE9e. Elle s'en rel\xE8vera encore.
> Sa voix ne porte plus jusqu'au fond du hall. Il s'appuie sur la table pour ne pas tomber.
si var.noe_perdu
  > \xC0 c\xF4t\xE9 de toi, la place de No\xE9 est vide. Quelqu'un y a pos\xE9 une bougie.
  ~ stat.moral -= 6
~ objectif("maitrise", "R\xE9ussir les \xC9preuves de Ma\xEEtrise")`,title:"La derni\xE8re rentr\xE9e",when:"temps.semaine == 1",chapters:["ch5"],priority:20,once:!0},{id:"ch5_ultimatum",trigger:"tick_start",script:`!lieu dortoir 180 nuit
!entrer malrik droite 260
> Tu ouvres les yeux. Il est assis au bord de ton lit. P\xE2le, jeune, presque doux.
malrik: N'aie pas peur. Ce n'est qu'un r\xEAve. Un r\xEAve o\xF9 l'on peut enfin se parler franchement.
si var.heritier
  malrik (triste): Tu as les yeux d'Ilyana. Ma s\u0153ur. Tu le savais ? Toi et moi, nous sommes la m\xEAme famille.
malrik: Le sceau tombera \xE0 la fin de l'ann\xE9e. Avec ou sans toi. Mais avec toi, personne n'a besoin de souffrir.
malrik (content): Rejoins-moi, et je te donnerai tout. Le savoir que les vieux fous t'ont cach\xE9. La force. Et la s\xE9curit\xE9 pour ceux que tu aimes.
si var.couple
  malrik: Ayla, par exemple. Ses visions la tuent \xE0 petit feu. Moi, je peux les faire taire.
* J'accepte. #ombre
  ~ var.disciple = vrai; var.pacte = vrai; stat.ombre += 15; stat.puissance += 10; rel.malrik += 20
  ~ souvenir(malrik, ultimatum, "Tu as accept\xE9 de le rejoindre")
  malrik (fier): Enfin. Enfin, quelqu'un qui comprend.
* Ma famille, c'est No\xE9, Ayla, Gaspard\u2026 pas toi. #lumiere
  ~ stat.ombre -= 10; stat.courage += 5; rel.malrik -= 20
  ~ souvenir(malrik, rejet, "Tu l'as rejet\xE9 au nom de tes amis")
  malrik (colere): Alors regarde-les mourir.
* Je dois r\xE9fl\xE9chir. #prudence
  malrik: R\xE9fl\xE9chis. Mais le temps, lui, ne r\xE9fl\xE9chit pas.
  ~ stat.moral -= 4
!sortir malrik droite`,title:"L'ultimatum",when:"temps.semaine == 2 et (var.grimoire_trouve ou var.heritier)",chapters:["ch5"],priority:12,once:!0},{id:"ch5_offre_varn",trigger:"talk:varn",script:`varn: J'ai une question, et je ne la poserai qu'une fois. Apr\xE8s tes \xE9tudes, resterais-tu ici ? Comme mon apprenti ?
varn (pensif): Je ne suis pas \xE9ternelle. Il faudra quelqu'un pour apprendre aux enfants \xE0 ne pas s'empoisonner.
* Ce serait un honneur. #etude
  ~ var.offre_prof = vrai; rel.varn += 15
  ~ souvenir(varn, apprenti, "Tu as accept\xE9 de devenir son apprenti")
  varn (content): \u2026Bien. N'en parlez \xE0 personne. J'ai une r\xE9putation de femme sans c\u0153ur \xE0 tenir.
* J'ai d'autres projets. Mais merci. #independance
  ~ rel.varn += 3
  varn: \xC9videmment. Les meilleurs partent toujours.`,title:"La proposition de Ma\xEEtresse Varn",when:"stat.potions >= 45 et rel.varn >= 15",chapters:["ch5"],priority:8,once:!0},{id:"ch5_offre_gaspard",trigger:"talk:gaspard",script:`gaspard (pensif): Mes genoux ne suivent plus. Les b\xEAtes ont besoin de quelqu'un de jeune. Quelqu'un qu'elles aiment.
gaspard: La cabane, la for\xEAt, le Cerf\u2026 \xC7a pourrait \xEAtre \xE0 toi. Si tu veux.
* Oui. Rien ne me rendrait plus heureux. #creature
  ~ var.offre_gardien = vrai; rel.gaspard += 15
  ~ souvenir(gaspard, successeur, "Tu as accept\xE9 de devenir le prochain gardien")
  gaspard (emu): \u2026Les b\xEAtes vont \xEAtre contentes. Moi aussi. Un peu.
* Je ne sais pas encore, Gaspard. #prudence
  gaspard: Prends ton temps. La for\xEAt attendra. Elle a l'habitude.`,title:"Le successeur",when:"rel.gaspard >= 40 et stat.creatures >= 45",chapters:["ch5"],priority:8,once:!0},{id:"ch5_offre_explorateur",trigger:"tick_start",script:`> Une lettre arrive par un oiseau que tu n'as jamais vu : plumes bleues, bec dor\xE9.
> \xAB La Guilde des Arpenteurs cherche de jeunes mages courageux pour cartographier les terres sauvages du Nord : dragons de glace, for\xEAts qui marchent, cit\xE9s englouties. Ton nom nous a \xE9t\xE9 donn\xE9 par un certain Gaspard Hulin. \xBB
* Accepter l'invitation pour apr\xE8s le dipl\xF4me. #aventure
  ~ var.offre_explorer = vrai; stat.moral += 6
* Ranger la lettre dans ta malle. On verra. #prudence
  ~ stat.moral += 2`,title:"Une lettre de tr\xE8s loin",when:"temps.semaine >= 2 et stat.courage >= 55 et stat.creatures >= 30",chapters:["ch5"],priority:7,once:!0},{id:"ch5_doute",trigger:"tick_end",script:`> Tu regardes ta baguette, pos\xE9e sur la table de nuit. Quatre ann\xE9es. Des amis perdus. Une voix dans ta t\xEAte qui ne se tait jamais.
> Tu penses \xE0 ta m\xE8re. \xC0 la maison. \xC0 une vie sans magie, sans grimoire, sans ombre.
* Je vais finir ce que j'ai commenc\xE9. #courage
  ~ stat.moral += 6; stat.courage += 3
* Apr\xE8s le dipl\xF4me, je rends ma baguette. Pour toujours. #renoncement
  ~ var.renonce = vrai; stat.ombre -= 10
  ~ souvenir(claire, retour, "Tu lui as \xE9crit que tu allais peut-\xEAtre rentrer pour de bon")
  ~ rel.claire += 8
* [var.couple] (Aller trouver Ayla) #romance
  !lieu tour_ouest 180 nuit
  !placer ayla 240 gauche
  ayla: Tu as cette t\xEAte-l\xE0. La t\xEAte de quelqu'un qui veut tout abandonner.
  ayla (content): Pas maintenant. Pas si pr\xE8s de la fin. Je l'ai vu : on y arrive.
  ~ stat.moral += 12; rel.ayla += 6`,title:"Tout arr\xEAter",when:"stat.moral <= 45 ou (var.noe_perdu et stat.ombre >= 30) ou (rel.claire >= 65 et temps.semaine >= 3)",chapters:["ch5"],priority:7,once:!0},{id:"ch5_noe_retour",trigger:"tick_start",script:`!lieu foret 400 nuit
!placer noe 460 gauche
> Il t'a donn\xE9 rendez-vous dans la clairi\xE8re par un mot gliss\xE9 sous ta porte. Il porte une robe noire. Ses yeux sont cern\xE9s de violet.
noe (triste): Je ne devrais pas \xEAtre l\xE0. S'ils savent que je t'ai parl\xE9\u2026
noe: Le rituel, c'est la derni\xE8re nuit de l'ann\xE9e. Ils vont utiliser ton sang. Ou celui de quelqu'un d'autre. Je ne sais pas.
* Reviens, No\xE9. Personne ne t'en voudra. Moi, en tout cas. #loyal
  test rel.noe + (mem.noe.revisions ? 15 : 0) + (mem.noe.sauve_foret ? 15 : 0) + (mem.noe.defendu ? 10 : 0) vs 45
  si reussite
    noe (emu): \u2026Tu te souviens de la barque, la premi\xE8re nuit ? Tu m'as dit qu'on n'avait qu'\xE0 rester ensemble.
    > Il arrache sa robe noire et la jette dans la brume.
    ~ var.noe_perdu = faux; var.noe_sauve = vrai; rel.noe += 20
    ~ souvenir(noe, retour, "Tu l'as ramen\xE9 de chez les disciples")
    !rappel noe.quai
  sinon
    noe (triste): Je ne peux pas. Pas maintenant. Il m'a donn\xE9 quelque chose\u2026 je ne sais pas vivre sans.
    > Il dispara\xEEt entre les arbres. Mais il t'a dit l'essentiel.
    ~ var.infos_rituel = vrai
* Pourquoi tu me pr\xE9viens ? #ruse
  noe: Parce que\u2026 parce que tu es mon ami. M\xEAme maintenant.
  ~ var.infos_rituel = vrai; rel.noe += 6
* [var.disciple] Bienvenue chez les n\xF4tres, No\xE9. #ombre
  noe (triste): \u2026Oh. Toi aussi. Alors il n'y a plus personne.
  ~ rel.noe -= 10; stat.ombre += 4`,title:"No\xE9",when:"var.noe_perdu et temps.semaine >= 3",chapters:["ch5"],priority:11,once:!0},{id:"ch5_examens",trigger:"tick_start",script:`!lieu grand_hall 300 jour
> Les \xC9preuves de Ma\xEEtrise. Cinq ann\xE9es r\xE9sum\xE9es en trois jours. Devant un jury de mages venus de tout le pays.
~ var.note_maitrise = (stat.sortileges + stat.potions + stat.savoir + stat.duel) / 4 + stat.discipline / 8 + var.points_classe / 4
si var.points_classe >= 20
  > Tes professeurs ont gliss\xE9 un mot au jury : cinq ann\xE9es de travail s\xE9rieux en classe. \xC7a compte.
* (Commencer par l'\xE9preuve pratique de sortil\xE8ges) #duel
  test stat.sortileges + stat.puissance / 3 vs 55
  si reussite
    !fx magie moi
    > Ta d\xE9monstration laisse le jury muet. Puis l'un d'eux applaudit, seul, dans le silence.
    ~ var.note_maitrise += 8; stat.reputation += 6
  sinon
    > Un sort de trop. La fum\xE9e envahit la salle. Le jury tousse et note quelque chose.
    ~ var.note_maitrise -= 4
* (Commencer par l'\xE9preuve \xE9crite) #etude
  test stat.savoir vs 55
  si reussite
    > Tu remplis douze parchemins. Le dernier, tu l'\xE9cris en runes anciennes, juste pour le plaisir.
    ~ var.note_maitrise += 8; stat.reputation += 4
  sinon
    > La troisi\xE8me question te laisse sans voix. Tu la laisses vide.
    ~ var.note_maitrise -= 4
si var.note_maitrise >= 55
  > R\xE9sultat : Ma\xEEtrise avec les honneurs. Le dipl\xF4me d'or.
  ~ var.mention_or = vrai; stat.reputation += 10
  ~ objectifReussi("maitrise")
sinon si var.note_maitrise >= 35
  > R\xE9sultat : Ma\xEEtrise obtenue.
  ~ objectifReussi("maitrise")
sinon
  > R\xE9sultat : Ma\xEEtrise refus\xE9e. Tu pourras repasser les \xE9preuves l'an prochain.
  ~ objectifEchoue("maitrise"); stat.moral -= 8`,title:"Les \xC9preuves de Ma\xEEtrise",when:"temps.semaine == 3",chapters:["ch5"],priority:10,once:!0},{id:"ch5_halloran_adieu",trigger:"tick_start",script:`!lieu bureau_archimage 120 nuit
!placer halloran 250 gauche
> L'Archimage t'a fait appeler en pleine nuit. Il est assis pr\xE8s du feu, une couverture sur les genoux. Il para\xEEt mille ans.
halloran (triste): Je n'irai pas jusqu'\xE0 la fin de l'ann\xE9e, {joueur.nom}. Le sceau m'a pris tout ce qui me restait.
si rel.halloran >= 20
  halloran (content): Je voulais te dire\u2026 Le soir de ton arriv\xE9e, j'ai eu peur de toi. Aujourd'hui, je suis fier de toi.
  ~ stat.moral += 6
halloran: Quand je ne serai plus l\xE0, le sceau se brisera. Il faudra \xEAtre au cercle de pierres. Tu sauras quoi faire. Ou tu ne sauras pas, et tu feras quand m\xEAme.
* Je serai l\xE0. #lumiere
  ~ rel.halloran += 10; stat.courage += 4
* J'ai peur. #honnete
  halloran: Bien. Ceux qui n'ont pas peur sont les premiers \xE0 mourir. Garde ta peur. Elle est pr\xE9cieuse.
  ~ rel.halloran += 6
> Trois jours plus tard, la flamme d'\xC9veil du grand hall s'\xE9teint. Ombrelune n'a plus d'Archimage.
~ var.halloran_parti = vrai
!rappel halloran.confiance_voix`,title:"L'adieu de l'Archimage",when:"temps.semaine == 4",chapters:["ch5"],priority:12,once:!0},{id:"ch5_allies",trigger:"tick_start",script:`!lieu salle_commune 200 nuit
> Tu r\xE9unis tous ceux qui voudront bien venir. Le rituel aura lieu demain soir, au cercle de pierres.
~ var.allies = 0
si var.noe_sauve et non var.noe_perdu
  !placer noe 120 droite
  noe: Je viens. J'ai une dette, et je veux la payer.
  ~ var.allies += 1
si var.sera_alliee
  !placer sera 300 gauche
  sera (fier): Les Valcourt n'ont jamais fui un combat. Enfin, moi non.
  ~ var.allies += 1
si var.couple ou rel.ayla >= 40
  !placer ayla 250 gauche
  ayla: Je l'ai vu cent fois. Cette fois, je veux voir la fin.
  ~ var.allies += 1
si var.lia_sauvee et rel.lia >= 30
  !placer lia 80 droite
  lia: Je suis petite, mais je connais toutes les plantes qui font tomber les gens. Je viens.
  ~ var.allies += 1
si rel.gaspard >= 30
  ~ var.allies += 1
  > Gaspard viendra aussi, avec les b\xEAtes de la for\xEAt.
si rel.brax >= 30
  ~ var.allies += 1
  > Brax, \xE0 peine remis, a d\xE9j\xE0 sa baguette \xE0 la main.
si var.daval_sait
  ~ var.allies += 1
  > M\xEAme Daval a promis d'envoyer ses gardes.
si var.allies == 0
  > Personne ne vient. Tu iras seul.
  ~ stat.moral -= 10
sinon
  > {var.allies} alli\xE9(s). Ce sera peut-\xEAtre assez.`,title:"Rassembler ceux qui restent",when:"temps.semaine == 4",chapters:["ch5"],priority:11,once:!0},{id:"ch5_main_tendue",trigger:"tick_end",script:`si var.couple
  !lieu tour_ouest 180 nuit
  !placer ayla 240 gauche
  ayla (triste): Tes yeux. Ils deviennent violets quand tu crois que personne ne regarde. Je l'ai vu en r\xEAve, et maintenant je le vois en vrai.
  ayla: Je ne te demande pas de m'expliquer. Je te demande de revenir.
sinon si rel.noe >= 40 et non var.noe_perdu
  !lieu salle_commune 200 nuit
  !placer noe 260 gauche
  noe (inquiet): Je t'ai suivi, l'autre nuit. Jusqu'\xE0 la tapisserie. J'ai entendu ce qu'ils disaient. Ce que TU disais.
  noe (triste): T'es mon meilleur ami. Alors je te le dis comme un meilleur ami : arr\xEAte. S'il te pla\xEEt.
sinon si rel.selene >= 30
  !lieu tour_ouest 180 nuit
  !placer selene 240 gauche
  selene (inquiet): Mon petit astre\u2026 Ta lumi\xE8re s'\xE9teint. Je la vois baisser chaque jour, comme une bougie sous une cloche.
  selene: Il n'est pas trop tard. Il n'est jamais trop tard, tant qu'on choisit encore.
sinon
  !lieu dortoir 180 nuit
  > Une lettre de ta m\xE8re, arriv\xE9e ce soir. Une seule phrase, soulign\xE9e deux fois : \xAB Je ne sais pas ce qui se passe, mais je sens que tu t'\xE9loignes. Reviens-nous. \xBB
* Rompre le pacte avec Malrik. Maintenant. #lumiere
  !fx magie moi
  > Tu br\xFBles le pacte dans ta t\xEAte comme on br\xFBle une lettre. \xC7a fait mal. Horriblement mal. Une partie de ta force s'en va avec lui.
  ~ var.disciple = faux; var.pacte = faux; stat.ombre -= 25; stat.puissance -= 8; stat.moral -= 4; rel.malrik -= 30
  ~ souvenir(malrik, rupture, "Tu as rompu ton pacte avec lui")
  [var.couple] ~ rel.ayla += 10
  [rel.noe >= 40] ~ rel.noe += 10
  malrik (colere): Tu le regretteras. Le soir du cercle, tu le regretteras.
* Tu ne comprends pas. Il va nous rendre plus forts. #ombre
  ~ stat.ombre += 6
  [var.couple] ~ rel.ayla -= 15
  [rel.noe >= 40] ~ rel.noe -= 15
  > Le silence qui suit est le plus long de ta vie.`,title:"La main tendue",when:"var.disciple et temps.semaine >= 2 et (var.couple ou (rel.noe >= 40 et non var.noe_perdu) ou rel.selene >= 30 ou rel.claire >= 50)",chapters:["ch5"],priority:8,once:!0},{id:"ch5_nuit_finale",trigger:"tick_start",script:`!lieu foret 480 nuit
!moment nuit
> La derni\xE8re nuit. Le cercle de pierres br\xFBle d'une lumi\xE8re violette. Douze disciples en robe noire chantent autour du grimoire, pos\xE9 sur la pierre centrale.
!placer orin 520 gauche
orin (fier): Tu es venu ! \xC9videmment que tu es venu. Il savait que tu viendrais.
si var.noe_perdu
  > Parmi les disciples, une silhouette rousse qui tremble. No\xE9.
!fx eclair
!entrer malrik droite 560
> Au-dessus du grimoire, une forme se dresse. Malrik. Plus r\xE9el que jamais. Presque vivant.
malrik: Le sceau est bris\xE9. Il ne me manque qu'un souffle. Le tien, ou celui de n'importe qui dans ce cercle.
~ var.nb_ingredients = (var.larme_ok ? 1 : 0) + (var.plume_ok ? 1 : 0) + (var.rune_ok ? 1 : 0)
~ var.issue_bonus = var.allies >= 2 ? var.allies * 5 : (var.allies == 1 ? 5 : 0)
si var.disciple
  -> disciple
si var.allies >= 2
  > Derri\xE8re toi, des pas. Tes alli\xE9s sortent de la brume, baguettes lev\xE9es. Les disciples h\xE9sitent.
sinon si var.allies == 1
  > Une seule personne t'a suivi. Elle se place dos \xE0 dos avec toi.
sinon
  > Tu es seul face au cercle.
-> combat

@combat
> Les disciples attaquent. Des traits de t\xE9n\xE8bres z\xE8brent la clairi\xE8re.
* (Te battre pour atteindre le grimoire) #duel
  test stat.duel + stat.courage / 3 + var.issue_bonus vs 50
  si reussite
    !fx sort moi orin
    > Tu fends leurs rangs. Orin se dresse devant toi. Un \xE9change, deux, trois\u2026 Il tombe \xE0 genoux.
    ~ var.orin_vaincu = vrai; stat.duel += 4; var.issue_bonus += 6
  sinon
    !fx sort orin moi
    > Orin te projette contre une pierre. Le souffle coup\xE9, tu te rel\xE8ves quand m\xEAme. Le grimoire est \xE0 trois pas.
    ~ stat.energie -= 40
* [var.parade_miroir] (Parade miroir contre le sort d'Orin) #duel
  !fx sort orin moi
  > Le sort d'Orin lui revient en pleine poitrine. Il s'effondre, inconscient.
  ~ var.orin_vaincu = vrai; var.issue_bonus += 6
* (Prot\xE9ger tes alli\xE9s plut\xF4t que foncer) #genereux
  ~ var.protege = vrai; stat.courage += 3; var.issue_bonus += var.allies * 2
  > Tu tiens la ligne. Personne ne tombe de ton c\xF4t\xE9. Mais Malrik grandit, nourri par le chant.
* [var.familier] (Appeler {var.familier_nom}) #creature
  > Une petite boule de lumi\xE8re jaillit des fourr\xE9s et fonce dans les jambes des disciples. Le chant se brise une seconde. Une seconde, c'est assez.
  ~ var.issue_bonus += 5; stat.creatures += 2
-> sceau

@sceau
malrik (colere): Assez !
> Le grimoire s'ouvre en grand. Le vent tourne autour du cercle. C'est maintenant ou jamais.
* [var.mission ou var.sceau_connu ou var.infos_rituel ou var.runes_lues] Accomplir le rituel du sceau. #lumiere
  si var.nb_ingredients == 3
    > La Larme de Lune, la plume d'argent, la rune du sceau. Tout est l\xE0, dans tes mains.
  sinon si var.nb_ingredients >= 1
    > Il te manque des ingr\xE9dients. Ta propre magie devra combler le vide.
  sinon
    > Tu n'as ni Larme, ni plume, ni rune. Seulement ce que tu as appris. Il faudra que ce soit assez.
  !fx magie moi
  test stat.savoir + stat.puissance / 2 + var.issue_bonus + var.nb_ingredients * 12 vs 85
  si reussite
    !fx eclair
    > Tu traces la rune dans l'air, et le monde devient blanc.
    malrik (triste): Ilyana\u2026 pardon\u2026
    > Le grimoire se referme. Pour toujours. Le silence tombe sur la for\xEAt.
    ~ var.issue = "scelle"; stat.ombre = 0; stat.reputation += 20
  sinon
    > La rune vacille. Le sceau ne prend pas. Malrik \xE9clate de rire.
    -> dernier_recours
* [var.heritier] Offrir ton propre sang au cercle pour le sceller \xE0 jamais. #sacrifice
  -> sacrifice
* D\xE9truire le grimoire par la force. #courage
  test stat.puissance + stat.duel / 2 + var.issue_bonus vs 70
  si reussite
    !fx eclair
    !fx tremblement
    > Ton sort frappe le grimoire de plein fouet. Les pages s'embrasent une \xE0 une, et le cri de Malrik se perd dans les flammes.
    ~ var.issue = "detruit"; stat.reputation += 15; stat.ombre += 5
  sinon
    > Le grimoire absorbe ton sort comme une \xE9ponge. Malrik grandit encore.
    -> dernier_recours
* [stat.ombre >= 50] Rejoindre Malrik. Maintenant. #ombre
  -> disciple
-> epilogue

@dernier_recours
> Le vent hurle. Malrik commence \xE0 sortir du cercle, une main apr\xE8s l'autre, comme on sort d'un puits.
* [var.heritier] Offrir ton sang. Il n'y a plus d'autre choix. #sacrifice
  -> sacrifice
* [var.couple ou rel.ayla >= 50] (Prendre la main d'Ayla) #romance
  !placer ayla 440 droite
  > Ayla ferme les yeux. Elle voit ce qui va se passer, et elle le change. Votre magie se m\xEAle, et le sceau prend.
  ~ var.issue = "scelle"; rel.ayla += 10; stat.reputation += 15
* [var.noe_sauve et rel.noe >= 60] (Appeler No\xE9) #loyal
  !placer noe 440 droite
  > No\xE9 entre dans le cercle \xE0 c\xF4t\xE9 de toi. Il tremble de la t\xEAte aux pieds. Il pose sa main sur la tienne.
  noe: Ensemble. On avait dit ensemble.
  test stat.courage + rel.noe / 3 + var.issue_bonus vs 80
  si reussite
    > Deux magies, une seule voix. Le chant des disciples se brise. Le sceau prend.
    ~ var.issue = "scelle"; rel.noe += 10; stat.reputation += 12
  sinon
    > Ce n'est pas assez. No\xE9 est projet\xE9 hors du cercle. Malrik rit, plus fort que jamais.
    ~ var.issue = "echec"; var.noe_blesse = vrai
* (Tenir jusqu'au bout, malgr\xE9 tout) #courage
  test stat.courage + stat.puissance / 2 + var.issue_bonus vs 74
  si reussite
    > Tu tiens. Une seconde, dix, cent. Le chant des disciples se brise. Malrik se dissout, faute de souffle.
    ~ var.issue = "scelle"; stat.reputation += 12
  sinon
    > Tu tombes \xE0 genoux. Malrik sort du cercle. Le ch\xE2teau, au loin, commence \xE0 br\xFBler.
    ~ var.issue = "echec"
* (Fuir) #peur
  ~ var.issue = "fuite"
  > Tu cours. Derri\xE8re toi, la clairi\xE8re s'embrase de violet. Tu ne te retournes pas.
-> epilogue

@sacrifice
> Tu entres dans le cercle. Tu poses ta main ouverte sur le grimoire. \xAB Par le sang de son sang. \xBB
malrik (inquiet): Non\u2026 Non, tu ne comprends pas, tu vas\u2026
!fx eclair
> La lumi\xE8re qui sort de toi est blanche, immense, douce. Malrik hurle, puis se tait. Le grimoire tombe en poussi\xE8re.
~ var.issue = "sacrifice"
-> epilogue

@disciple
malrik (fier): Mon h\xE9ritier. Mon \xE9l\xE8ve. Viens.
> Tu t'avances vers le grimoire, et tu sens la voix de Malrik se glisser en toi comme dans un manteau trop longtemps vide.
* (Accepter tout. Son savoir, sa force, sa m\xE9moire.) #ombre
  ~ var.issue = "ombre"; stat.ombre = 100; stat.puissance += 30
  !fx eclair
  > Quand tu rouvres les yeux, ils sont violets. Les disciples s'agenouillent. Orin sourit.
* (Au dernier instant, retourner sa propre force contre lui) #ruse
  test stat.ruse + stat.puissance / 2 vs 60
  si reussite
    > Il ne s'y attendait pas. Personne ne s'y attendait. Tu le refermes sur lui-m\xEAme, comme une main qui se ferme sur une bougie.
    ~ var.issue = "scelle"; stat.ombre -= 40; stat.reputation += 15
  sinon
    > Il rit. Il savait. Il a toujours su.
    ~ var.issue = "ombre"; stat.ombre = 100
* [var.couple ou var.noe_sauve ou rel.claire >= 50] (Penser \xE0 ceux que tu aimes) #lumiere
  si var.couple
    > Une voix perce le chant des disciples. Celle d'Ayla, quelque part dans la brume : \xAB Je l'ai vu. Tu reviens. Tu reviens toujours. \xBB
  sinon si var.noe_sauve
    > Une voix perce le chant des disciples. Celle de No\xE9 : \xAB H\xE9 ! Le fils du boulanger a besoin de toi ! Reviens ! \xBB
  sinon
    > Une odeur de pain chaud et de lavande traverse la fum\xE9e. Ta m\xE8re. La maison.
  > La voix de Malrik se d\xE9chire comme un vieux drap. Tu recules hors du cercle, le souffle court. Tu es toi. Seulement toi.
  ~ var.disciple = faux; stat.ombre -= 30; rel.malrik -= 30
  malrik (colere): Tra\xEEtre !
  -> sceau
-> epilogue

@epilogue
si var.issue == "scelle" ou var.issue == "detruit"
  > \xC0 l'aube, les disciples sont d\xE9sarm\xE9s, Orin encha\xEEn\xE9, la for\xEAt silencieuse. Les oiseaux recommencent \xE0 chanter.
  si var.noe_perdu
    > No\xE9 est assis parmi les disciples, la t\xEAte dans les mains. Il pleure. Tu t'assois \xE0 c\xF4t\xE9 de lui.
    ~ var.noe_perdu = faux; var.noe_sauve = vrai
sinon si var.issue == "sacrifice"
  > Au matin, on te retrouve au centre du cercle, endormi, plus p\xE2le qu'avant. Vivant. Mais quelque chose en toi s'est \xE9teint.
sinon si var.issue == "fuite" ou var.issue == "echec"
  > Cette nuit-l\xE0, Ombrelune br\xFBle.
sinon si var.issue == "ombre"
  > \xC0 l'aube, la for\xEAt est silencieuse. Les oiseaux ne reviendront pas avant longtemps.`,title:"La nuit du cercle",when:"temps.semaine == 5",chapters:["ch5"],priority:50,once:!0},{id:"ch5_diplome",trigger:"chapter_end",script:`!lieu cour 300 jour
> La remise des dipl\xF4mes a lieu dans la cour, comme le veut la tradition.
si var.issue == "fuite" ou var.issue == "echec"
  > Ou ce qu'il en reste. Les tours sont noircies, les vitraux bris\xE9s. Il n'y a ni musique, ni discours.
sinon si var.issue == "ombre"
  > Personne n'ose te regarder en face. On t'appelle d\xE9j\xE0 autrement.
sinon
  > Les vitraux brillent au soleil. Il y a de la musique, des rires, des familles venues de partout.
  si var.mention_or
    > Ton nom est appel\xE9 en premier. Dipl\xF4me d'or.
  si var.noe_sauve
    !placer noe 250 droite
    noe (content): On l'a fait. On l'a vraiment fait. Le fils du boulanger a son dipl\xF4me !
!placer claire 350 gauche
si rel.claire >= 40
  claire (emu): Mon tr\xE9sor\u2026
  > Ta m\xE8re est venue. Elle ne comprend rien \xE0 la magie, mais elle te serre si fort que tu en perds ton chapeau.
sinon
  claire: F\xE9licitations.
  > Ta m\xE8re est venue. Vous vous serrez la main, un peu g\xEAn\xE9s. Cinq ans de lettres trop courtes.`,title:"La remise des dipl\xF4mes",chapters:["ch5"],priority:100,once:!0},{id:"cours_semaine",trigger:"tick_end",script:"tirer cours 1",title:"Les cours de la semaine",when:"temps.semaine <= 4",priority:40,cooldown:1},{id:"cl_flamme_froide",trigger:"pool:cours",script:`!lieu classe_sorts 160 jour
!placer selene 300 gauche
selene (content): Aujourd'hui, mes petits astres : une flamme qui ne br\xFBle pas. Dans une bulle de verre. Sans casser la bulle, de pr\xE9f\xE9rence.
* Te concentrer, seul, jusqu'\xE0 y arriver. #etude
  test stat.sortileges + stat.puissance / 3 vs 22 + temps.chapitre * 6
  si reussite
    > Une petite flamme bleue danse dans ta bulle. Elle est froide comme un gla\xE7on.
    ~ stat.sortileges += 2; var.points_classe += 2; rel.selene += 2
  sinon
    > Ta bulle explose dans un nuage de suie. S\xE9l\xE8ne te tend un mouchoir sans un mot.
    ~ stat.sortileges += 1; var.points_classe -= 1
* [non var.noe_perdu] Aider No\xE9, dont la bulle fume d\xE9j\xE0. #loyal
  !placer noe 210 droite
  noe (inquiet): Elle va exploser, hein ? Elle va exploser.
  test stat.sortileges + 8 vs 24 + temps.chapitre * 6
  si reussite
    > Tu guides sa baguette. Deux flammes bleues s'allument c\xF4te \xE0 c\xF4te.
    ~ rel.noe += 5; var.points_classe += 1; stat.sortileges += 1
  sinon
    > Les deux bulles explosent en m\xEAme temps. Vous avez de la suie jusqu'aux oreilles, et un fou rire inarr\xEAtable.
    ~ rel.noe += 4; stat.moral += 3
* Faire le malin : une flamme g\xE9ante pour impressionner la classe. #provocation
  test stat.puissance vs 30 + temps.chapitre * 5
  si reussite
    !fx magie moi
    > Une colonne de flamme glac\xE9e monte jusqu'au plafond. Toute la classe applaudit. S\xE9l\xE8ne, un peu moins.
    ~ stat.reputation += 4; stat.discipline -= 3; var.points_classe += 1
  sinon
    > Le plafond est maintenant couvert de givre. Et de suie. Et d'un peu de ta fiert\xE9.
    ~ stat.discipline -= 5; var.points_classe -= 2; stat.moral -= 2`,title:"Cours de sortil\xE8ges : la flamme froide",chapters:["ch1","ch2"],cooldown:6},{id:"cl_potion_sommeil",trigger:"pool:cours",script:`!lieu cachot_potions 120 jour
!placer varn 300 gauche
varn: Potion de sommeil. Par deux. Si votre bin\xF4me s'endort sur sa paillasse, c'est r\xE9ussi. S'il ne se r\xE9veille pas, c'est rat\xE9.
* [non var.noe_perdu] Te mettre avec No\xE9. #loyal
  ~ var.bonus_cours = 0; rel.noe += 2
  noe (inquiet): Je coupe, tu touilles ? Ou je touille et tu coupes ? Je ne sais jamais.
* Te mettre avec S\xE9raphine, la meilleure de la classe. #ambition
  ~ var.bonus_cours = 8; rel.sera += 2
  sera (fier): Ne touche \xE0 rien. Regarde, et prends des notes.
* Travailler seul, dans ton coin. #etude
  ~ var.bonus_cours = 3
test stat.potions + var.bonus_cours vs 26 + temps.chapitre * 6
si reussite
  > La potion prend une couleur de nuit d'\xE9t\xE9. Une seule goutte, et la souris de test ronfle comme un ours.
  ~ stat.potions += 2; var.points_classe += 2; rel.varn += 2
  varn: Acceptable.
sinon
  > La potion tourne au gris. La souris de test se met \xE0 danser. Elle danse encore \xE0 la fin du cours.
  ~ stat.potions += 1; var.points_classe -= 1
  varn (colere): Recommencez chez vous. Deux fois.`,title:"Cours de potions : la potion de sommeil",cooldown:6},{id:"cl_griffon_blesse",trigger:"pool:cours",script:`!lieu cabane 200 jour
!placer gaspard 140 droite
gaspard (inquiet): Un jeune griffon s'est pris l'aile dans un filet de braconnier. Il a peur, et il a un bec qui coupe le fer. Qui veut essayer ?
* (Lever la main et t'approcher doucement, \xE0 genoux) #creature
  test stat.creatures + stat.courage / 4 vs 24 + temps.chapitre * 6
  si reussite
    > Le griffon te laisse approcher. Tu d\xE9fais le filet, fil par fil. Il pose sa t\xEAte contre ton \xE9paule.
    ~ stat.creatures += 3; rel.gaspard += 4; var.points_classe += 2
  sinon
    > Un coup de bec, un seul, et ta manche est en lambeaux. Gaspard prend le relais.
    ~ stat.creatures += 1; stat.energie -= 8
* Proposer un sort d'apaisement plut\xF4t que les mains. #etude
  test stat.sortileges vs 26 + temps.chapitre * 6
  si reussite
    > Le griffon s'endort comme un chaton. Gaspard hoche la t\xEAte, approbateur.
    ~ stat.sortileges += 1; stat.creatures += 1; var.points_classe += 1
  sinon
    > Le sort rate. Le griffon s'enfuit avec le filet. Il faudra le retrouver.
    ~ rel.gaspard -= 1
* Rester au fond, prudemment. #prudence
  > Tu regardes Gaspard faire. C'est d\xE9j\xE0 une le\xE7on, en soi.
  ~ stat.creatures += 1`,title:"Cours de cr\xE9atures : l'aile bless\xE9e",cooldown:6},{id:"cl_etoiles",trigger:"pool:cours",script:`!lieu tour_ouest 160 nuit
!placer selene 280 gauche
selene: Ce soir, la constellation du Li\xE8vre. Dessinez-la, et dites-moi ce qu'elle annonce. Tout le monde voit le li\xE8vre. Les meilleurs voient ce qu'il fuit.
* [rel.ayla >= 10] T'asseoir \xE0 c\xF4t\xE9 d'Ayla. #romance
  !placer ayla 220 droite
  ayla (content): Il ne fuit rien. Il court vers quelque chose. Regarde ses oreilles.
  ~ rel.ayla += 4; var.bonus_cours = 10
* Observer seul, longtemps, sans rien dessiner. #patience
  ~ var.bonus_cours = 5
* Recopier la carte du manuel. Personne ne verra la diff\xE9rence. #ruse
  ~ var.bonus_cours = 0; stat.discipline -= 2
test stat.savoir + var.bonus_cours vs 28 + temps.chapitre * 5
si reussite
  > Ton dessin est juste. Et dans un coin, tu as not\xE9 une \xE9toile que personne n'a vue. S\xE9l\xE8ne la regarde longtemps.
  ~ stat.savoir += 2; var.visions += 1; var.points_classe += 2; rel.selene += 2
sinon
  > Ton li\xE8vre ressemble \xE0 une th\xE9i\xE8re. S\xE9l\xE8ne dit que c'est \xAB une interpr\xE9tation audacieuse \xBB.
  ~ stat.savoir += 1; var.points_classe -= 1`,title:"Cours d'astronomie : la constellation du Li\xE8vre",chapters:["ch2","ch3","ch4","ch5"],cooldown:6},{id:"cl_duel_classe",trigger:"pool:cours",script:`!lieu arene 220 jour
!placer brax 430 gauche
brax: En piste, par deux. Pas de sorts interdits, pas de pleurs, pas de mordre. Oui, Wren, \xE7a vaut pour toi.
si chapitre == ch1 ou chapitre == ch2
  !placer tobias 330 gauche
  > Ton adversaire : Tobias Wren, qui fait d\xE9j\xE0 craquer ses doigts.
sinon
  !placer sera 330 gauche
  > Ton adversaire : S\xE9raphine de Valcourt. La classe enti\xE8re retient son souffle.
* Attaquer d'entr\xE9e, fort. #courage
  ~ var.bonus_cours = stat.puissance / 4
* D\xE9fendre et attendre l'erreur. #prudence
  ~ var.bonus_cours = stat.ruse / 4
* \xC9couter le conseil de Brax : les pieds d'abord. #etude
  ~ var.bonus_cours = 6
test stat.duel + var.bonus_cours vs 25 + temps.chapitre * 6
si reussite
  !fx sort moi
  > Ton adversaire finit assis dans le sable, baguette envol\xE9e. Brax l\xE8ve un pouce, sans rien dire.
  ~ stat.duel += 2; var.duel_victoires += 1; var.points_classe += 2; rel.brax += 2
  [chapitre != ch1 et chapitre != ch2] ~ rel.sera += 2
sinon
  > Tu te retrouves le nez dans le sable. Brax t'aide \xE0 te relever : \xAB Les pieds, je t'avais dit. \xBB
  ~ stat.duel += 1; var.duel_defaites += 1; stat.moral -= 2`,title:"Cours de duel : en piste",cooldown:5},{id:"cl_histoire",trigger:"pool:cours",script:`!lieu bibliotheque 160 jour
> Le cours d'histoire de la magie est donn\xE9 par Sire Bertold, un fant\xF4me en collerette qui enseigne ici depuis trois cents ans. Il n'a jamais remarqu\xE9 qu'il \xE9tait mort.
> \xAB \u2026 et c'est ainsi que la guerre des Quatre Affinit\xE9s dura cent onze ans, \xE0 cause d'une querelle sur la couleur des nappes\u2026 \xBB
* (Dormir, la t\xEAte dans les bras) #repos
  ~ stat.energie += 10; var.points_classe -= 1
* (\xC9couter et prendre des notes) #etude
  ~ stat.savoir += 2; var.points_classe += 1
* [chapitre != ch1] Lui poser une question sur l'\xE9l\xE8ve qui a \xE9t\xE9 scell\xE9, autrefois. #curiosite
  > Le fant\xF4me s'arr\xEAte net. Toute la classe se retourne.
  > \xAB Un sceau de sang, jeune \xE9l\xE8ve. Le sang de sa s\u0153ur. On ne l'a jamais refait depuis. On ne devrait jamais avoir \xE0 le refaire. \xBB
  ~ var.sceau_connu = vrai; stat.savoir += 2; var.rumeur_grimoire = vrai`,title:"Cours d'histoire de la magie",cooldown:6},{id:"cl_runes",trigger:"pool:cours",script:`!lieu bibliotheque 200 jour
!placer pell 330 gauche
pell: Madame Arkadi est souffrante, c'est donc moi qui vous fais r\xE9citer vos runes. Traduisez ce texte. Il parle de serments. Et de ce qu'il en co\xFBte de les briser.
* Traduire avec soin, rune par rune. #etude
  ~ var.bonus_cours = 6
* Deviner le sens g\xE9n\xE9ral et broder. #ruse
  ~ var.bonus_cours = 0
test stat.savoir + var.bonus_cours vs 30 + temps.chapitre * 5
si reussite
  > Ta traduction est presque parfaite. Madame Pell la garde, \xAB pour l'archiver \xBB. Tu as l'impression d'avoir compris quelque chose d'important.
  ~ var.runes_lues = vrai; stat.savoir += 2; var.points_classe += 2; rel.pell += 3
sinon
  > Ta traduction parle d'une ch\xE8vre amoureuse d'un nuage. Madame Pell soupire tr\xE8s longtemps.
  ~ stat.savoir += 1; var.points_classe -= 1`,title:"Cours de runes anciennes",chapters:["ch2","ch3","ch4","ch5"],cooldown:6},{id:"cl_fleurs_cloches",trigger:"pool:cours",script:`!lieu serres 180 jour
!placer gaspard 300 gauche
gaspard: Les fleurs-cloches sonnent quand on les arrose trop. Et quand elles sonnent trop, elles mordent. Arrosez juste ce qu'il faut. Ni plus, ni moins.
* Arroser goutte \xE0 goutte, en \xE9coutant. #patience
  test stat.potions + stat.creatures / 2 vs 22 + temps.chapitre * 6
  si reussite
    > Ta fleur tinte doucement, une seule note, claire. Gaspard sourit.
    ~ stat.potions += 2; var.points_classe += 2
  sinon
    > Ta fleur sonne comme un tocsin, puis te mord le pouce. Toute la serre se met \xE0 carillonner.
    ~ stat.potions += 1; stat.energie -= 5; var.points_classe -= 1
* Copier le dosage de ton voisin. #ruse
  > Ton voisin a tout faux. Vos deux fleurs vous mordent en m\xEAme temps.
  ~ stat.moral -= 2
* Chanter pour la fleur pendant que tu l'arroses. #humour
  > Tu ne sais pas si c'est le chant ou l'eau, mais ta fleur se met \xE0 sonner en rythme avec toi. Gaspard rit si fort qu'il en pleure.
  ~ rel.gaspard += 4; stat.moral += 3; var.points_classe += 1`,title:"Cours de botanique : les fleurs-cloches",chapters:["ch1","ch2","ch3"],cooldown:6},{id:"cl_metamorphose",trigger:"pool:cours",script:`!lieu classe_sorts 160 jour
!placer selene 300 gauche
selene (content): Transformez votre th\xE9i\xE8re en tortue. Une vraie tortue. Pas une tortue avec un bec verseur, monsieur Wren.
test stat.sortileges + stat.savoir / 3 vs 26 + temps.chapitre * 6
si reussite
  > Ta th\xE9i\xE8re se change en une petite tortue \xE0 carapace fleurie. Elle te regarde, digne et un peu vex\xE9e.
  ~ stat.sortileges += 2; var.points_classe += 2
  * Garder la tortue comme mascotte du dortoir. #humour
    ~ stat.moral += 4
  * La retransformer pour la rendre. #regle
    ~ rel.selene += 3; stat.discipline += 2
sinon
  > Ta tortue a un bec verseur. Et elle siffle quand elle s'\xE9nerve. S\xE9l\xE8ne la note \xAB int\xE9ressante \xBB.
  ~ stat.sortileges += 1; stat.moral += 1`,title:"Cours de m\xE9tamorphose",cooldown:6},{id:"cl_mimeur",trigger:"pool:cours",script:`!lieu arene 220 jour
!placer brax 430 gauche
brax: Un Mimeur. Cr\xE9ature d'ombre. Il copie tout ce que tu fais, en mieux. Pour le battre, il faut faire ce que tu n'as jamais fait.
> La cr\xE9ature se dresse devant toi : ta silhouette, en noir, sans visage.
si stat.ombre >= 30
  > Mais elle ne copie pas tes gestes. Elle copie ce qu'il y a dessous. Elle sourit, avec ta bouche.
  ~ stat.moral -= 4
* Faire quelque chose d'absurde : une r\xE9v\xE9rence, un pas de danse. #humour
  test stat.ruse + stat.courage / 3 vs 30 + temps.chapitre * 5
  si reussite
    > Le Mimeur s'embrouille, tente de copier ta r\xE9v\xE9rence, tr\xE9buche sur ses propres pieds et se dissout en fum\xE9e.
    ~ stat.ruse += 2; var.points_classe += 2; rel.brax += 3
  sinon
    > Il fait la r\xE9v\xE9rence mieux que toi. Puis il te pousse. Brax le renvoie dans sa bo\xEEte.
    ~ stat.moral -= 2
* Attaquer de toutes tes forces. #courage
  test stat.duel + stat.puissance / 3 vs 34 + temps.chapitre * 5
  si reussite
    !fx sort moi
    > Ton sort le traverse de part en part. Brax hausse un sourcil : \xAB Brutal. Mais efficace. \xBB
    ~ stat.duel += 2; var.points_classe += 1
  sinon
    !fx sort moi
    > Il te renvoie ton propre sort, en mieux, exactement comme Brax l'avait dit.
    ~ stat.energie -= 12`,title:"Cours de d\xE9fense : le Mimeur",chapters:["ch3","ch4","ch5"],cooldown:6},{id:"cl_projet_groupe",trigger:"pool:cours",script:`!lieu bibliotheque 220 jour
!placer noe 150 droite
!placer sera 300 gauche
> S\xE9l\xE8ne a form\xE9 les groupes au hasard. Le hasard a un sens de l'humour cruel : toi, No\xE9 et S\xE9raphine, sur un expos\xE9 de trente parchemins.
sera: Je r\xE9dige. Vous recopiez. C'est plus efficace.
noe (colere): Et pourquoi c'est toi qui r\xE9diges ?
sera (fier): Parce que je sais \xE9crire, Lambert.
* Prendre le parti de No\xE9. #loyal
  ~ rel.noe += 4; rel.sera -= 4
  noe (content): Merci.
* Donner raison \xE0 S\xE9raphine : elle \xE9crit vraiment mieux. #honnete
  ~ rel.sera += 4; rel.noe -= 3
  sera (surpris): \u2026Merci. Je crois.
* Proposer de se partager le travail selon les talents de chacun. #ecoute
  test stat.ruse + stat.savoir / 3 vs 28 + temps.chapitre * 4
  si reussite
    > S\xE9raphine r\xE9dige, No\xE9 dessine les sch\xE9mas, toi tu fais les recherches. Votre expos\xE9 est le meilleur de la classe.
    ~ rel.noe += 3; rel.sera += 4; var.points_classe += 3
  sinon
    > Ils se disputent pendant deux heures. Vous rendez dix parchemins, dont trois de disputes.
    ~ var.points_classe -= 1; stat.moral -= 2`,title:"Travail de groupe",when:"non var.noe_perdu",chapters:["ch2","ch3","ch4"],cooldown:7},{id:"cl_examen_blanc",trigger:"pool:cours",script:`!lieu grand_hall 300 jour
!placer selene 380 gauche
> Un examen blanc, pour pr\xE9parer les \xC9preuves de Ma\xEEtrise. Trois heures. Trois sujets. Le grand hall est si silencieux qu'on entend les plumes gratter.
* Commencer par la th\xE9orie. #etude
  test stat.savoir + stat.discipline / 6 vs 45 + temps.chapitre * 2
  si reussite
    > Douze parchemins, sans une rature. Tu sors du hall avec la t\xEAte l\xE9g\xE8re.
    ~ var.points_classe += 3; stat.savoir += 1
  sinon
    > Tu bloques sur le deuxi\xE8me sujet pendant une heure enti\xE8re.
    ~ var.points_classe -= 1; stat.moral -= 3
* Commencer par la pratique. #duel
  test stat.sortileges + stat.puissance / 4 vs 45 + temps.chapitre * 2
  si reussite
    !fx magie moi
    > Ta d\xE9monstration fait lever la t\xEAte de toute la salle. M\xEAme S\xE9l\xE8ne arr\xEAte d'\xE9crire.
    ~ var.points_classe += 3; stat.sortileges += 1
  sinon
    > Un sort de trop. Un pupitre en moins. Tu nettoies pendant la pause.
    ~ var.points_classe -= 1; stat.moral -= 3`,title:"L'examen blanc",chapters:["ch4","ch5"],cooldown:6},{id:"co_sort_rate",trigger:"activity:pratiquer_sorts",script:`!fx fumee moi
> Ton sort rebondit sur le mur, sur le plafond, sur le pupitre\u2026 et finit par transformer tes chaussures en grenouilles.
* Rire et recommencer. #humour
  ~ stat.moral += 2; stat.sortileges += 1
* Recommencer encore et encore jusqu'\xE0 r\xE9ussir. #etude
  ~ stat.sortileges += 2; stat.energie -= 10`,title:"Le sort qui rebondit",cooldown:3,chance:25},{id:"co_sort_avance",trigger:"activity:pratiquer_sorts",script:`!placer selene 300 gauche
selene (surpris): Attends, refais \xE7a.
> Tu refais le geste. Une sph\xE8re de lumi\xE8re dor\xE9e na\xEEt au bout de ta baguette et flotte au-dessus du cercle.
selene (emu): Un Soleil Captif. On ne l'enseigne qu'en derni\xE8re ann\xE9e. Tu l'as trouv\xE9 tout seul.
