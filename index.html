    ~ rel.santini -= 3
sinon
  !placer lambert 200 gauche
  lambert: Votre \xE9pargne est bien plac\xE9e. Et j'ai inscrit votre nom pour une formation en management du sport, \xE0 distance. Pour plus tard.
  * T'inscrire #etudes
    ~ stat.etudes += 6; var.etudes_actives = vrai; rel.lambert += 3
  * Plus tard
    ~ rel.lambert += 0`,title:"Point avec ton agent",cooldown:2},{id:"ines_soiree",trigger:"activity:voir_ines",script:`!placer ines 230 gauche
si var.couple
  ines (content): Ce soir, interdiction de parler foot. Tu tiens combien de temps, \xE0 ton avis ?
  ~ rel.ines += 3; stat.moral += 4
sinon si rel.ines >= 30
  ines: C'est dr\xF4le\u2026 Avec toi, je ne vois pas le temps passer.
  * Lui avouer tes sentiments #romance #cle
    test rel.ines vs 38
    si reussite
      ines (emu): \u2026Enfin. J'attendais que tu le dises.
      ~ var.couple = vrai; rel.ines += 10
      ~ souvenir(ines, aveu, "Le soir o\xF9 tu lui as dit ce que tu ressentais")
    sinon
      ines (pensif): Je t'aime beaucoup\u2026 mais je ne suis pas pr\xEAte. Pas encore.
      ~ rel.ines -= 2
  * Profiter de la soir\xE9e, simplement
    ~ rel.ines += 4
sinon
  ines: Merci pour le d\xEEner. C'\xE9tait sympa.
  ~ rel.ines += 3`,title:"Soir\xE9e avec In\xE8s",cooldown:2}],endings:[{id:"scandale",title:"Le scandale",type:"tragique",when:"var.scandale_revele",priority:100,summary:"Ton nom restera associ\xE9 \xE0 l'affaire qui a \xE9clabouss\xE9 le football.",location:"salle_presse",script:`!moment nuit
> Les gros titres ne parlent plus de tes buts.
si var.match_arrange
  > \xAB Paris truqu\xE9s : le joueur avoue avoir provoqu\xE9 un carton jaune sur commande. \xBB Suspendu \xE0 vie par la commission de discipline.
sinon si var.affaire_djibril
  > \xAB Soci\xE9t\xE9 \xE9cran, blanchiment : le footballeur entendu par les enqu\xEAteurs. \xBB Les sponsors fuient en une matin\xE9e.
sinon
  > \xAB Soir\xE9es, mensonges et vid\xE9os : la chute d'une idole. \xBB Ton contrat est r\xE9sili\xE9 pour faute grave.
!rappel clara.enquete
> Clara Mend\xE8s a obtenu le prix du journalisme sportif pour son enqu\xEAte. Elle a eu la d\xE9cence de ne jamais en parler devant toi.
appel epilogue_commun
> Certains soirs, tu repasses tes plus beaux buts sur ton t\xE9l\xE9phone. Puis tu \xE9teins l'\xE9cran, et le silence revient.`},{id:"blessure",title:"Le genou bris\xE9",type:"tragique",when:"var.carriere_brisee",priority:95,summary:"Une blessure a mis fin \xE0 ta carri\xE8re bien trop t\xF4t.",location:"infirmerie",script:`> Le chirurgien a \xE9t\xE9 honn\xEAte : \xAB Vous marcherez normalement. Vous ne jouerez plus au haut niveau. \xBB
!rappel bruno.alerte
[mem.bruno.alerte] > Bruno t'avait pr\xE9venu. Tu y repenses chaque jour.
si var.couple
  > In\xE8s a dirig\xE9 ta r\xE9\xE9ducation, s\xE9ance apr\xE8s s\xE9ance. \xAB On ne rejoue pas, d'accord. Mais on remarche. Et apr\xE8s, on verra. \xBB
appel epilogue_commun
si stat.etudes >= 50
  > Deux ans plus tard, tu reprends des \xE9tudes de pr\xE9parateur physique. Tu sais mieux que personne ce que co\xFBte un genou.
sinon
  > Tu as gard\xE9 tes crampons dans un placard. Tu n'as jamais r\xE9ussi \xE0 les jeter.`},{id:"le_quartier",title:"Retour aux Tilleuls",type:"inattendue",when:"faux",priority:90,summary:"Tu as tout quitt\xE9 pour rentrer chez toi.",location:"quartier",script:`> Tu as rang\xE9 tes crampons et repris le bus pour la cit\xE9 des Tilleuls. Sans pr\xE9venir personne.
> Le matin, tu travailles \xE0 la boulangerie du centre commercial. Le soir, tu tapes dans un ballon au city avec les petits.
[rel.djibril >= 20] > Djibril a ri en te voyant revenir. Puis il t'a serr\xE9 dans ses bras plus longtemps que d'habitude.
si var.yanis_protege >= 1
  ~ var.yanis_sauve = vrai
  > Et Yanis ne quitte plus tes baskets. Les grands du b\xE2timent D ont cess\xE9 de l'appeler.
appel epilogue_commun
> On ne parle pas de toi dans les journaux. Mais au city stade, tout le monde conna\xEEt ton nom.`},{id:"une_autre_vie",title:"Une autre vie",type:"neutre",when:"var.retraite == etudes",priority:70,summary:"Le football t'a appris beaucoup. Tu as choisi de vivre autre chose.",location:"salle_cours",script:`si var.arret_foot
  > \xC0 seize ans, tu as fait le choix le plus difficile : arr\xEAter le football pour tes \xE9tudes.
  ~ var.bac = stat.etudes >= 45
  [var.bac] > Bac mention bien, puis une \xE9cole de kin\xE9sith\xE9rapie. Dix ans plus tard, tu soignes les joueurs du Stade Rivemont.
  [non var.bac] > Les \xE9tudes ont \xE9t\xE9 plus dures que pr\xE9vu. Mais tu t'es accroch\xE9, et tu as trouv\xE9 ta voie : \xE9ducateur.
sinon
  > Apr\xE8s ta carri\xE8re, tu as repris le chemin de l'\xE9cole. Dipl\xF4me de management du sport en poche, tu diriges aujourd'hui le centre de formation o\xF9 tout a commenc\xE9.
[mem.maman.promesse] !rappel maman.promesse
[mem.maman.promesse] > Ta m\xE8re te l'avait fait promettre. Tu as tenu parole.
appel epilogue_commun`},{id:"enfant_du_club",title:"L'enfant du club",type:"secrete",when:"var.loyal_rivemont et var.club_id == rivemont et var.titres_rivemont >= 2 et rel.vasseur >= 15",priority:88,summary:"Une carri\xE8re enti\xE8re sous le m\xEAme maillot, et un titre pour l'\xE9ternit\xE9.",location:"stade",script:`!moment nuit
!fx foule 1
> Une seule \xE9quipe, toute une vie. Le Stade Rivemont a retir\xE9 ton num\xE9ro.
> Une tribune du {var.stade_nom} porte d\xE9sormais ton nom.
[rel.moreau >= 40] > Le jour de la c\xE9r\xE9monie, Didier Moreau a pleur\xE9. Il niera jusqu'\xE0 sa mort.
[rel.vasseur >= 30] > Le pr\xE9sident Vasseur a fait faire une statue. Elle ne te ressemble pas du tout. Tu l'adores.
appel epilogue_commun
> Les gamins du centre de formation passent devant ta photo chaque matin. Certains la touchent, pour la chance.`},{id:"legende",title:"L\xE9gende du football",type:"heureuse",when:"stat.reputation >= 85 et var.trophees_majeurs >= 2 et var.scandale == 0",priority:80,summary:"Troph\xE9es, records, respect : ton nom est entr\xE9 dans l'histoire.",location:"stade",script:`!moment nuit
!fx confettis
!fx foule 1
> {var.buts} buts, {var.trophees} troph\xE9es, et un nom que les commentateurs prononcent avec respect.
> Tu as soulev\xE9 les plus grandes coupes. On parle de toi comme d'un des meilleurs joueurs de ta g\xE9n\xE9ration.
[var.ballon_or] > Et ce troph\xE9e dor\xE9, sur ta chemin\xE9e, que des millions de gamins r\xEAvent de toucher.
appel epilogue_commun
[rel.maman >= 40] > Au gala de ta retraite, tu as remerci\xE9 une seule personne : \xAB Ma m\xE8re, qui a tout donn\xE9 pour que j'aie ma chance. \xBB`},{id:"seul_au_sommet",title:"Seul au sommet",type:"inattendue",when:"stat.reputation >= 65 et rel.maman < 25 et rel.karim < 20 et non var.couple",priority:82,summary:"C\xE9l\xE8bre, riche, admir\xE9\u2026 et terriblement seul.",location:"appartement",script:`!moment nuit
> Ton appartement est immense. Ton t\xE9l\xE9phone vibre sans arr\xEAt : agents, sponsors, journalistes.
> Mais quand tu cherches un nom \xE0 appeler, juste pour parler, tu ne trouves personne.
appel epilogue_commun
> La gloire t'a tout donn\xE9. Elle t'a aussi tout pris, si doucement que tu ne l'as pas vu venir.`},{id:"entraineur",title:"Le ma\xEEtre et l'\xE9l\xE8ve",type:"heureuse",when:"var.retraite == coach",priority:75,summary:"Tu as raccroch\xE9 les crampons pour transmettre \xE0 ton tour.",location:"terrain",script:`!moment soir
> Dipl\xF4me d'entra\xEEneur en poche, tu reprends l'\xE9quipe des moins de 17 ans du Stade Rivemont.
si rel.moreau >= 30
  !placer moreau 280 droite
  moreau (content): Ici, personne ne vous doit rien. Tu te souviens ?
  > Didier Moreau vient voir chacun de tes entra\xEEnements, depuis le bord du terrain, bras crois\xE9s. Il ne dit jamais rien. Il n'a pas besoin.
[var.mentorat >= 2] > Les jeunes que tu as conseill\xE9s pendant ta carri\xE8re viennent te rendre visite. Deux sont devenus pros.
appel epilogue_commun`},{id:"grand_frere",title:"Le grand fr\xE8re",type:"secrete",when:"var.retraite == famille et var.yanis_sauve",priority:74,summary:"Ta plus belle victoire ne s'est pas jou\xE9e sur un terrain.",location:"city",script:`> Tu as mis fin \xE0 ta carri\xE8re plus t\xF4t que pr\xE9vu, pour rentrer pr\xE8s des tiens.
> Yanis et toi avez ouvert une \xE9cole de foot au pied des tours. Gratuite, pour tous les gamins de la cit\xE9.
appel epilogue_commun
> Le samedi matin, cent enfants courent apr\xE8s un ballon au city stade des Tilleuls. Yanis siffle, tu cries. Personne ne regarde l'heure.`},{id:"affaires",title:"Le businessman",type:"neutre",when:"var.retraite == business",priority:60,summary:"Apr\xE8s les terrains, les affaires.",location:"ville",script:`si var.affaire_djibril_legale
  > Djibril et toi avez fond\xE9 une marque de v\xEAtements de sport. Elle habille aujourd'hui trois clubs de premi\xE8re division.
  ~ rel.djibril += 10
sinon
  > Tu as investi ton argent dans l'immobilier et les restaurants. Tu ne marques plus de buts, mais tu signes des ch\xE8ques.
appel epilogue_commun`},{id:"honorable",title:"Une belle carri\xE8re",type:"neutre",when:"stat.reputation >= 45",priority:50,summary:"Pas une l\xE9gende, mais un pro respect\xE9, de ceux que les supporters n'oublient pas.",location:"stade",script:`!moment soir

abel:"Acheter des ingr\xE9dients rares",description:"De quoi r\xE9ussir des potions de haut niveau.",cost:{actions:1,ecus:10},effects:"stat.potions += 4",feedback:"Ton sac sent l'anis et la poudre d'\xE9toile."},{id:"se_soigner",label:"Se faire soigner",description:"Une infusion am\xE8re et un lit propre.",cost:{actions:1},effects:"stat.energie += 30; stat.moral += 3",feedback:"Tu repars d'un pas plus l\xE9ger.",maxPerTick:1}],chapters:[{id:"ch1",title:"L'\xC9veil",subtitle:"Premi\xE8re ann\xE9e \xB7 11 ans",weeks:5,onStart:"var.annee = 1; var.age = 11"},{id:"ch2",title:"Les Secrets",subtitle:"Deuxi\xE8me ann\xE9e \xB7 12 ans",weeks:5,location:"dortoir",onStart:"var.annee = 2; var.age = 12; stat.energie = 85",intro:"L'\xE9t\xE9 est pass\xE9 trop vite. Le bateau te ram\xE8ne au ch\xE2teau, et cette fois, tu connais le chemin."},{id:"ch3",title:"L'\xC9preuve",subtitle:"Troisi\xE8me ann\xE9e \xB7 13 ans",weeks:5,location:"dortoir",onStart:"var.annee = 3; var.age = 13; stat.energie = 85",intro:"Troisi\xE8me ann\xE9e. On ne te regarde plus comme un petit nouveau. Et le grimoire, lui, ne t'a pas oubli\xE9."},{id:"ch4",title:"La Fracture",subtitle:"Quatri\xE8me ann\xE9e \xB7 14 ans",weeks:5,location:"dortoir",onStart:"var.annee = 4; var.age = 14; stat.energie = 85",intro:"Pendant l'\xE9t\xE9, deux \xE9l\xE8ves ont disparu de leurs familles. Le Conseil des Mages s'inqui\xE8te. Ombrelune n'est plus un refuge."},{id:"ch5",title:"Le Choix",subtitle:"Cinqui\xE8me ann\xE9e \xB7 15 ans",weeks:5,location:"dortoir",onStart:"var.annee = 5; var.age = 15; stat.energie = 85",intro:"Derni\xE8re ann\xE9e. Les examens, l'avenir, et l'Ombre qui gronde sous le ch\xE2teau. Tout va se jouer maintenant."}],creation:{nameLabel:"Ton pr\xE9nom",defaultName:"Elio",look:!0,baseLook:{skin:"peau3",hair:"court",hairColor:"brun",top:"toge",topColor:"$couleur_affinite",topColor2:"#e2b440",bottom:"pantalon",bottomColor:"#25222b",shoes:"#2a2a33",acc:["baguette"]},fields:[{id:"affinite",label:"Ton affinit\xE9 magique",options:[{id:"flamme",label:"Flamme",description:"Le feu, la force, le duel. Robe rouge.",effects:'var.couleur_affinite = "#a8323a"; var.affinite_nom = "Flamme"; stat.duel += 8; stat.puissance += 5; stat.courage += 5'},{id:"onde",label:"Onde",description:"L'eau, le soin, les potions. Robe bleue.",effects:'var.couleur_affinite = "#2f62c9"; var.affinite_nom = "Onde"; stat.potions += 10; stat.moral += 5; rel.noe += 8'},{id:"souffle",label:"Souffle",description:"L'air, les illusions, la divination. Robe argent\xE9e.",effects:'var.couleur_affinite = "#c4cad3"; var.affinite_nom = "Souffle"; stat.sortileges += 8; stat.savoir += 6; rel.ayla += 8'},{id:"racine",label:"Racine",description:"La terre, les plantes, les cr\xE9atures. Robe verte.",effects:'var.couleur_affinite = "#2f6a3a"; var.affinite_nom = "Racine"; stat.creatures += 12; rel.gaspard += 10'}]},{id:"origine",label:"D'o\xF9 tu viens",options:[{id:"sans_magie",label:"Une famille sans magie",description:"Tes parents ont cru \xE0 une blague en recevant la lettre.",effects:"stat.courage += 8; rel.noe += 10; rel.sera -= 10; rel.claire += 10"},{id:"lignee",label:"Une lign\xE9e de mages",description:"Ton nom ouvre des portes. Et attire les jalousies.",effects:"stat.reputation += 10; stat.ecus += 40; rel.sera += 15; stat.savoir += 5"},{id:"trouve",label:"Un enfant trouv\xE9",description:"Recueilli b\xE9b\xE9 devant un orphelinat. Personne ne sait d'o\xF9 tu viens.",effects:"stat.ruse += 10; rel.gaspard += 8; stat.puissance += 6; rel.claire -= 10"}]},{id:"caractere",label:"Ton caract\xE8re",options:[{id:"curieux",label:"Curieux",description:"Tu veux tout comprendre, tout ouvrir.",effects:"stat.savoir += 6; stat.ruse += 3"},{id:"temeraire",label:"T\xE9m\xE9raire",description:"Tu fonces, tu r\xE9fl\xE9chis apr\xE8s.",effects:"stat.courage += 10; stat.discipline -= 5"},{id:"discret",label:"Discret",description:"On ne te remarque pas. \xC7a a ses avantages.",effects:"stat.ruse += 10; stat.discipline += 5"}]}]},start:{location:"quai",event:"intro"},onTickEnd:"stat.energie += 26; stat.ecus += 3; stat.moral += stat.moral < 40 ? 2 : 0; stat.ombre -= stat.ombre > 0 ? 1 : 0; eloigner(claire, 1); eloigner(noe, rel.noe > 20 ? 1 : 0); eloigner(ayla, var.couple ? 1 : 0)",sheet:[{title:"Scolarit\xE9",rows:[{label:"Affinit\xE9",value:"{var.affinite_nom}"},{label:"Ann\xE9e",value:"{var.annee}e ann\xE9e"},{label:"Sorts ma\xEEtris\xE9s",value:"{var.sorts}"},{label:"Points en classe",value:"{var.points_classe}"},{label:"Duels",value:"{var.duel_victoires} victoire(s), {var.duel_defaites} d\xE9faite(s)"},{label:"Avertissements",value:"{var.avertissements}"},{label:"Champion des duels",value:"oui",when:"var.champion"},{label:"Visions",value:"{var.visions}",when:"var.visions > 0"}]}],events:[{id:"al_lettre_maman",trigger:"random",script:`> Un corbeau tapote \xE0 la vitre. Une lettre de ta m\xE8re, qui sent la lessive et le pain grill\xE9.
si rel.claire >= 50
  > \xAB Je relis tes lettres le soir. Je ne comprends pas la moiti\xE9 des mots, mais je suis si fi\xE8re. \xBB
sinon si rel.claire >= 20
  > \xAB Tout va bien ici. Tu nous manques. \xC9cris un peu plus, s'il te pla\xEEt. \xBB
sinon
  > \xAB Je sais que tu es occup\xE9. Juste un mot, de temps en temps. Pour savoir que tu vas bien. \xBB
* (R\xE9pondre tout de suite, longuement) #famille
  ~ rel.claire += 6; stat.moral += 3
* (R\xE9pondre plus tard\u2026 et oublier)
  ~ rel.claire -= 3`,title:"Une lettre de la maison",when:"chapitre != ch1",cooldown:4},{id:"al_escalier",trigger:"random",script:`> En montant au dortoir, l'escalier pivote d'un coup. Tu te retrouves dans un couloir que tu ne connais pas, face \xE0 trois portes.
* Porte de gauche. #curiosite
  > Une pi\xE8ce pleine de cartes anciennes du ch\xE2teau. Tu en m\xE9morises une.
  ~ stat.savoir += 2; stat.ruse += 1
* Porte du milieu. #courage
  > Un placard \xE0 balais. Avec, \xE0 l'int\xE9rieur, un fant\xF4me vex\xE9 d'avoir \xE9t\xE9 d\xE9rang\xE9.
  ~ stat.courage += 1; stat.moral += 2
* Porte de droite. #prudence
  > La salle des troph\xE9es. Tu y croises Brax, qui astique sa propre coupe, g\xEAn\xE9.
  ~ rel.brax += 2`,title:"L'escalier capricieux",cooldown:5},{id:"al_fantome",trigger:"random",script:`> Un fant\xF4me en collerette flotte \xE0 travers le mur du couloir. Il s'appelle Sire Bertold et il adore les ragots.
* Raconte-moi un secret du ch\xE2teau. #curiosite
  si chapitre == ch1 ou chapitre == ch2
    > \xAB Le grimoire de la R\xE9serve ? Il appartenait \xE0 un \xE9l\xE8ve brillant. Il est mort, mais il ne s'en est pas rendu compte. \xBB
    ~ stat.savoir += 2; var.rumeur_grimoire = vrai
  sinon
    > \xAB Le pr\xE9fet Kael parle tout seul dans la tour, la nuit. Enfin, pas tout seul. \xBB
    ~ var.mefiance_orin = vrai; stat.savoir += 1
* (Passer \xE0 travers lui, pour voir) #humour
  > Brr. C'est comme plonger dans un lac en hiver. Sire Bertold est outr\xE9.
  ~ stat.moral += 2`,title:"Le fant\xF4me bavard",cooldown:6},{id:"al_potion_couloir",trigger:"random",script:`> BOUM ! Un \xE9l\xE8ve de premi\xE8re ann\xE9e, couvert de suie violette, sort en toussant d'une salle de classe. Ses sourcils ont disparu.
* L'aider \xE0 se nettoyer avec un sort. #genereux
  ~ stat.reputation += 2; stat.sortileges += 1
* \xC9clater de rire. #moquerie
  ~ stat.moral += 2; stat.reputation -= 1
* Lui expliquer son erreur de dosage. #etude
  test stat.potions vs 25
  si reussite
    > Il t'\xE9coute, \xE9bahi, puis repart vers son chaudron avec un air d\xE9termin\xE9.
    ~ stat.reputation += 3; stat.potions += 1
  sinon
    > Ton explication est fausse. Il le d\xE9couvre en faisant exploser une deuxi\xE8me fois la salle.`,title:"Explosion dans le couloir",cooldown:6},{id:"al_devoir_oublie",trigger:"random",script:`> Horreur : le devoir de th\xE9orie des runes est \xE0 rendre dans une heure. Tu ne l'as m\xEAme pas commenc\xE9.
* Le faire en vitesse, \xE0 la table du petit-d\xE9jeuner. #etude
  test stat.savoir vs 30
  si reussite
    > R\xE9dig\xE9 entre deux tartines. Et pourtant, la note est correcte.
    ~ stat.savoir += 1
  sinon
    > Un torchon. Avec une tache de confiture au milieu.
    ~ stat.discipline -= 4
* Copier sur No\xE9. #ruse
  si non var.noe_perdu
    noe (inquiet): Prends. Mais change quelques mots, hein.
    ~ rel.noe += 1; stat.discipline -= 2
  sinon
    > No\xE9 n'est plus l\xE0 pour te sauver. Tu rends une copie blanche.
    ~ stat.discipline -= 6; stat.moral -= 3
* Aller voir le professeur et avouer. #honnete
  ~ stat.discipline += 2; rel.selene += 2`,title:"Le devoir oubli\xE9",cooldown:5},{id:"al_creature_echappee",trigger:"random",script:`> Un hurlement dans le grand hall. Un lutin \xE0 plumes s'est \xE9chapp\xE9 de la cabane et jette des tartes \xE0 la cr\xE8me sur les professeurs.
* L'attraper doucement. #creature
  test stat.creatures vs 30
  si reussite
    > Tu lui tends une noisette. Il descend de la poutre et se blottit dans ta manche.
    ~ stat.creatures += 2; rel.gaspard += 3; stat.reputation += 3
  sinon
    > Il t'envoie une tarte en pleine figure. Toute l'\xE9cole applaudit.
    ~ stat.moral -= 2; stat.reputation += 1
* Le figer d'un sort. #duel
  ~ stat.sortileges += 1; rel.gaspard -= 2
  > Il tombe comme une pierre. Gaspard arrive en courant et te regarde de travers.`,title:"Une cr\xE9ature s'\xE9chappe",when:"stat.creatures >= 18",cooldown:5},{id:"al_orage",trigger:"random",script:`!moment nuit
> Un orage violet \xE9clate au-dessus du lac. Les \xE9clairs dessinent des runes dans le ciel. Tout le ch\xE2teau reste \xE9veill\xE9.
* Observer et noter les runes. #etude
  ~ stat.savoir += 2; var.visions += 1
* Aller rassurer les premi\xE8res ann\xE9es. #genereux
  ~ stat.reputation += 2; stat.moral += 2
* [stat.ombre >= 20] \xC9couter le tonnerre. Il prononce ton nom. #ombre
  ~ stat.ombre += 4; stat.puissance += 2`,title:"L'orage magique",cooldown:6},{id:"al_colis",trigger:"random",script:`> Sur ton lit, un paquet emball\xE9 de papier noir. Pas de nom, pas de mot. Il est ti\xE8de.
* L'ouvrir. #curiosite
  > Une plume de corbeau et un parchemin : un sort que tu ne connais pas, \xE9crit \xE0 l'encre violette.
  ~ stat.sortileges += 3; stat.ombre += 4
* Le porter \xE0 l'Archimage. #regle
  ~ rel.halloran += 4; stat.discipline += 2
* Le jeter dans la chemin\xE9e. #prudence
  > Il br\xFBle avec une flamme verte. Et une odeur de vieux livre.`,title:"Le colis anonyme",when:"chapitre != ch1",cooldown:8},{id:"al_epuisement",trigger:"random",script:`> Tu t'endors debout en cours. Ta t\xEAte cogne la table. Toute la classe se retourne.
* S\xE9cher l'apr\xE8s-midi pour dormir. #repos
  ~ stat.energie += 25; stat.discipline -= 5
* Tenir bon avec une potion revigorante. #potions
  test stat.potions vs 30
  si reussite
    ~ stat.energie += 20
    > \xC7a a le go\xFBt de fraise et de bitume. Mais \xE7a marche.
  sinon
    ~ stat.energie += 5; stat.moral -= 4
    > Tu passes l'apr\xE8s-midi avec le hoquet. Un hoquet qui fait des bulles.`,title:"\xC0 bout de forces",when:"stat.energie <= 50",cooldown:3},{id:"al_rumeur",trigger:"random",script:`> Une rumeur court dans les couloirs : tu serais l'\xE9l\xE8ve pr\xE9f\xE9r\xE9 de l'Archimage, et tu aurais un sort secret.
* D\xE9mentir. #humble
  ~ stat.reputation -= 2; stat.discipline += 1
* Laisser courir, en souriant myst\xE9rieusement. #ruse
  ~ stat.reputation += 4; stat.ruse += 1
* [stat.ombre >= 25] Montrer un petit sort sombre pour impressionner. #ombre
  ~ stat.reputation += 6; stat.ombre += 4; stat.discipline -= 3`,title:"La rumeur",when:"stat.reputation >= 30",cooldown:6},{id:"al_pari",trigger:"random",script:`!placer tobias 200 gauche
tobias: Je te parie dix \xE9cus que tu n'oses pas toucher la statue de la cour \xE0 minuit. Il para\xEEt qu'elle mord.
* Pari tenu. #rebelle
  test stat.courage vs 30
  si reussite
    > Minuit. Tu touches la statue. Elle ne mord pas. Elle \xE9ternue.
    ~ stat.ecus += 10; stat.courage += 2; rel.tobias += 3
  sinon
    > Tu t'approches\u2026 et un hibou te fonce dessus. Tu cours jusqu'au dortoir.
    ~ stat.ecus -= 10; rel.tobias += 1
* Non merci. #prudence
  tobias (rire): Poule mouill\xE9e.
  ~ stat.discipline += 1`,title:"Le pari de Tobias",when:"chapitre == ch1 ou chapitre == ch2",cooldown:6},{id:"al_etoiles_filantes",trigger:"random",script:`!moment nuit
> Des centaines d'\xE9toiles filantes traversent le ciel au-dessus du lac. Le ch\xE2teau entier est aux fen\xEAtres.
* [rel.ayla >= 15] Monter sur le toit avec Ayla. #romance
  > Elle compte les \xE9toiles \xE0 voix basse. \xC0 la centi\xE8me, elle pose sa t\xEAte sur ton \xE9paule.
  ~ rel.ayla += 8; stat.moral += 6
* Faire un v\u0153u avec No\xE9. #loyal
  ~ rel.noe += 4; stat.moral += 4
* Observer seul. #solitude
  ~ stat.moral += 3; stat.savoir += 1`,title:"La pluie d'\xE9toiles",when:"chapitre != ch1",cooldown:8},{id:"al_marche",trigger:"random",script:`> Pierrelune est en f\xEAte : jour de march\xE9. Des \xE9tals de bonbons qui crient, de plumes qui \xE9crivent seules, de pierres de lune.
* Acheter un cadeau pour No\xE9. #genereux
  ~ stat.ecus -= 8; rel.noe += 6
* [rel.ayla >= 10] Acheter un cadeau pour Ayla. #romance
  ~ stat.ecus -= 8; rel.ayla += 7
* Acheter des ingr\xE9dients rares. #etude
  ~ stat.ecus -= 10; stat.potions += 3
* Ne rien acheter.`,title:"Jour de march\xE9",when:"chapitre != ch1 et stat.ecus >= 10",cooldown:6},{id:"al_cauchemar",trigger:"random",script:`> Tu r\xEAves d'une biblioth\xE8que sans fin. Chaque livre a ton visage sur la couverture. L'un d'eux s'ouvre et murmure : \xAB Bient\xF4t. \xBB
* (Te r\xE9veiller et aller m\xE9diter) #lumiere
  ~ stat.ombre -= 5; stat.energie -= 10
* (Rester dans le r\xEAve, \xE9couter) #ombre
  ~ stat.ombre += 5; stat.puissance += 2; rel.malrik += 4`,title:"Le cauchemar",when:"stat.ombre >= 20",cooldown:4},{id:"al_harcelement",trigger:"random",script:`> Trois \xE9l\xE8ves plus \xE2g\xE9s encerclent un petit de premi\xE8re ann\xE9e et lui prennent son go\xFBter.
* Intervenir. #courage
  test stat.courage + stat.duel / 3 vs 32
  si reussite
    > Ils d\xE9talent. Le petit te regarde comme si tu \xE9tais un h\xE9ros.
    ~ stat.reputation += 4; stat.courage += 2
  sinon
    > Ils rient et repartent avec le go\xFBter. Et le tien.
    ~ stat.moral -= 3; stat.courage += 1
* Pr\xE9venir un professeur. #regle
  ~ stat.discipline += 2
* Passer son chemin.
  ~ stat.moral -= 2`,title:"Dans le couloir",cooldown:5},{id:"al_interro",trigger:"random",script:`!lieu classe_sorts 200 jour
!placer selene 300 gauche
selene (content): Surprise, mes astres ! Petite interrogation. Rangez vos grimoires, sortez vos neurones.
test stat.savoir + stat.sortileges / 2 vs 30 + temps.chapitre * 6
si reussite
  > Tu remplis la feuille sans h\xE9siter. S\xE9l\xE8ne te gratifie d'un \xAB Brillant ! \xBB en rouge.
  ~ stat.reputation += 3; rel.selene += 3; stat.discipline += 2
sinon
  > Tu rends une feuille couverte de ratures et d'un dessin de dragon.
  ~ stat.discipline -= 3; stat.moral -= 2`,title:"Interrogation surprise",cooldown:4},{id:"al_duel_couloir",trigger:"random",script:`!placer tobias 220 gauche
> Un \xE9l\xE8ve d'une autre affinit\xE9 te bouscule expr\xE8s, baguette \xE0 la main. \xAB Alors, il para\xEEt que tu te bats bien ? \xBB
* Accepter le duel. #duel
  test stat.duel vs 30 + temps.chapitre * 5
  si reussite
    !fx sort moi
    > Trois secondes. Il est assis par terre, sa baguette sur tes genoux.
    ~ var.duel_victoires += 1; stat.reputation += 3; stat.discipline -= 3
  sinon
    > Tu finis avec des oreilles d'\xE2ne pendant tout l'apr\xE8s-midi.
    ~ var.duel_defaites += 1; stat.moral -= 4; stat.discipline -= 2
* Refuser calmement. #sagesse
  ~ stat.discipline += 2; stat.reputation -= 1
* Lui faire une blague magique et s'enfuir. #ruse
  ~ stat.ruse += 2; stat.moral += 2`,title:"Duel dans le couloir",when:"chapitre != ch1",cooldown:5},{id:"al_couvre_feu",trigger:"random",script:`!moment nuit
> Minuit pass\xE9. Tu rentres au dortoir sur la pointe des pieds quand une lanterne s'allume au bout du couloir.
* Inventer une excuse. #ruse
  test stat.ruse vs 35
  si reussite
    > \xAB Une crise de somnambulisme, professeur. \xC7a me prend depuis tout petit. \xBB On te raccompagne au lit avec une tisane.
    ~ stat.ruse += 2
  sinon
    > Ton excuse ne tient pas dix secondes. Avertissement.
    ~ var.avertissements += 1; stat.discipline -= 6
* Courir te cacher derri\xE8re une armure. #rebelle
  test stat.ruse + stat.courage / 3 vs 40
  si reussite
    > La lanterne passe \xE0 un m\xE8tre de toi. Puis s'\xE9loigne. Ton c\u0153ur bat jusque dans tes oreilles.
    ~ stat.moral += 2; stat.discipline -= 2
  sinon
    > L'armure s'effondre dans un fracas \xE9pouvantable. Tout l'\xE9tage se r\xE9veille. Avertissement, et une semaine de corv\xE9e de chaudrons.
    ~ var.avertissements += 1; stat.discipline -= 8; stat.energie -= 10
* Avouer tout de suite. #honnete
  > \xAB Au moins, vous \xEAtes franc. \xBB Une heure de retenue, pas d'avertissement.
  ~ stat.discipline += 3; stat.energie -= 5`,title:"Apr\xE8s le couvre-feu",when:"stat.discipline < 50",cooldown:4},{id:"intro",trigger:"manual",script:`!lieu quai 60 nuit
!placer moi 70 droite
> Il y a trois semaines, un corbeau a d\xE9pos\xE9 une lettre sur ta table de petit-d\xE9jeuner. Cire violette, encre argent\xE9e, ton nom \xE9crit \xE0 la main.
> \xAB L'Acad\xE9mie d'Ombrelune a l'honneur de vous informer que vous poss\xE9dez le Don. \xBB
> Ce soir, une barque t'a d\xE9pos\xE9 sur ce quai, au pied d'un ch\xE2teau plus grand qu'une montagne.
!entrer noe gauche 120
noe (inquiet): Toi aussi, tu viens d'arriver ? Je\u2026 je m'appelle No\xE9. Mon p\xE8re fait du pain. Il a cru que la lettre \xE9tait une pub.
* Moi, c'est {joueur.nom}. On n'a qu'\xE0 rester ensemble. #loyal
  ~ rel.noe += 8
  ~ souvenir(noe, quai, "Tu lui as propos\xE9 de rester ensemble, le premier soir")
  noe (content): Oh, merci. Vraiment. J'avais peur de passer la soir\xE9e tout seul.
* Une pub pour une \xE9cole de sorcellerie ? Ton p\xE8re a de l'humour. #humour
  ~ rel.noe += 4
  noe (rire): Il a ri pendant une heure. Puis la lettre a pris feu toute seule. Il a arr\xEAt\xE9 de rire.
* (Lui faire un signe de t\xEAte et regarder le ch\xE2teau)
  ~ rel.noe -= 2
  noe: \u2026Bon. Il est impressionnant, hein.
!entrer sera droite 230
!entrer tobias droite 260
sera: Tiens donc. Les nouveaux sans lign\xE9e se reconnaissent entre eux.
tobias (rire): Ils sentent encore la farine.
noe (triste): \u2026
* Laisse-le tranquille. #courage
  ~ stat.courage += 3; rel.sera -= 6; rel.noe += 5
  ~ souvenir(sera, defi_quai, "Tu lui as tenu t\xEAte d\xE8s le premier soir")
  sera (colere): Pardon ? Tu sais \xE0 qui tu parles ?
  moi: \xC0 quelqu'un de mal \xE9lev\xE9, apparemment.
  sera: On se reverra, toi.
* Ma famille vaut bien la tienne. #fierte
  ~ rel.sera -= 3; stat.courage += 1
  sera (fier): Permets-moi d'en douter.
* (Ignorer et entra\xEEner No\xE9 plus loin) #prudence
  ~ stat.ruse += 2; rel.noe += 2
  sera: C'est \xE7a, fuyez.
!sortir sera droite
!sortir tobias droite
!entrer halloran droite 300
> Un tr\xE8s vieil homme descend les marches. Sa barbe blanche lui arrive \xE0 la ceinture et l'air autour de lui scintille.
halloran (content): Bienvenue \xE0 Ombrelune, jeunes gens. Je suis l'Archimage Halloran. Ce soir, la Flamme d'\xC9veil va dire \xE0 chacun de vous qui il est.
halloran (pensif): \u2026
> Son regard s'arr\xEAte sur toi un instant de trop. Comme s'il te reconnaissait.
!lieu grand_hall 300 soir
!placer moi 260 droite
!placer halloran 380 gauche
> Le grand hall. Des centaines de bougies flottent sous la vo\xFBte. Au centre, une vasque de pierre o\xF9 danse une flamme blanche.
halloran: Approche. Tends la main au-dessus de la flamme.
!fx magie moi
> La flamme bondit, s'enroule autour de ton poignet\u2026 et prend la couleur de l'{var.affinite_nom}.
halloran (fier): L'{var.affinite_nom}. Tr\xE8s bien. Tr\xE8s bien, vraiment.
si joueur.origine == trouve
  halloran (inquiet): Et\u2026 tes parents, mon enfant ?
  * Je n'en ai pas. On m'a trouv\xE9 devant un orphelinat.
    ~ rel.halloran += 3
    halloran (pensif): Je vois. Nous en reparlerons un jour, peut-\xEAtre.
    ~ souvenir(halloran, orphelin, "Tu lui as dit que tu \xE9tais un enfant trouv\xE9")
  * \xC7a ne vous regarde pas.
    ~ rel.halloran -= 2; stat.ruse += 1
    halloran: Tu as raison. Pardonne un vieil homme trop curieux.
halloran: Le dortoir de ton affinit\xE9 est au bout de la salle commune. Dors bien. Demain, tout commence.
~ objectif("premiere_annee", "R\xE9ussir les examens de premi\xE8re ann\xE9e")
!lieu dortoir 120 nuit
> Ton lit a des rideaux \xE0 la couleur de ton affinit\xE9. Sur l'oreiller, un emploi du temps qui change d'\xE9criture quand on le regarde.
> D\xE9place-toi avec \u2190 \u2192 ou en touchant l'\xE9cran. Interagis avec E. Chaque semaine, tu as 3 actions : \xE9tudier, t'entra\xEEner, explorer\u2026 Ton lit termine la semaine. Le PLAN permet de se d\xE9placer plus vite.`,title:"La lettre violette"},{id:"ch1_premier_sort",trigger:"enter:classe_sorts",script:`!placer selene 300 gauche
selene (content): Entrez, entrez, mes petits astres ! Aujourd'hui : faire l\xE9viter une plume. Rien de plus simple. Rien de plus difficile.
!placer sera 160 droite
selene: {joueur.nom}, \xE0 toi l'honneur.
* Se concentrer, respirer, essayer. #etude
  test stat.sortileges + stat.puissance / 2 vs 18
  si reussite
    !fx magie moi
    > La plume fr\xE9mit, h\xE9site\u2026 puis s'\xE9l\xE8ve jusqu'au plafond.
    ~ stat.reputation += 4; stat.sortileges += 2; var.sorts += 1; rel.selene += 5
    selene (fier): Magnifique ! Du premier coup !
    sera (colere): Coup de chance.
  sinon
    !fx fumee moi
    > La plume prend feu. Puis la manche de ta robe.
    ~ stat.moral -= 4; stat.sortileges += 1
    selene (rire): Ah ! Le feu, c'est d\xE9j\xE0 de la magie. On recommencera.
    sera (rire): Bravo, le petit g\xE9nie.
* Laisser S\xE9raphine passer avant toi. #prudence
  ~ stat.ruse += 1
  sera (fier): Regardez et apprenez.
  > Sa plume monte droit, \xE9l\xE9gante. Elle te jette un regard satisfait.
  > Quand vient ton tour, tu as eu le temps d'observer son geste.
  ~ stat.sortileges += 2
selene: Pratiquez dans le cercle d'entra\xEEnement quand vous voulez. Les sortil\xE8ges, c'est comme le piano : \xE7a s'use si on ne s'en sert pas.`,title:"Le premier sort",chapters:["ch1"],priority:6,once:!0},{id:"ch1_varn",trigger:"enter:cachot_potions",script:`!placer varn 300 gauche
varn: Asseyez-vous. Ne touchez \xE0 rien. Ne respirez pas trop fort.
varn: Ici, une erreur de dosage ne fait pas exploser un chaudron. Elle tue quelqu'un. Est-ce bien compris ?
varn (colere): Vous, l\xE0. Que se passe-t-il si l'on ajoute de la poudre de lune \xE0 une infusion de mandragore ?
* R\xE9pondre en r\xE9fl\xE9chissant. #etude
  test stat.savoir + stat.potions / 2 vs 20
  si reussite
    moi: \xC7a neutralise le poison\u2026 mais seulement si l'infusion est froide.
    ~ rel.varn += 6; stat.reputation += 2
    varn: \u2026Exact. Quelqu'un a ouvert un livre avant de venir. C'est rare.
  sinon
    moi: \xC7a\u2026 fait des bulles ?
    ~ rel.varn -= 3; stat.moral -= 2
    varn: \xC7a fait un mort, en g\xE9n\xE9ral. R\xE9visez.
* Avouer que tu n'en sais rien. #humble
  ~ rel.varn += 1
  varn: L'honn\xEAtet\xE9 ne remplace pas le travail, mais c'est un d\xE9but.
* Dire que c'est la question de S\xE9raphine, pas la tienne. #humour
  ~ rel.varn -= 4; stat.discipline -= 3; rel.noe += 2
  varn (colere): Un avertissement oral. Le prochain sera \xE9crit.
varn: Vos chaudrons vous attendent. Pr\xE9parez des potions d\xE8s que vous le pouvez. La main apprend plus vite que la t\xEAte.`,title:"Le cachot des potions",chapters:["ch1"],priority:6,once:!0},{id:"ch1_gaspard",trigger:"enter:cabane",script:`!placer gaspard 150 droite
gaspard: Hm. Un \xE9l\xE8ve qui vient jusqu'ici de lui-m\xEAme. \xC7a faisait longtemps.
gaspard (content): Je suis Gaspard. Je m'occupe des b\xEAtes, des arbres et de tout ce que les professeurs ne veulent pas toucher.
> Dans la cage, une petite boule de fourrure grise te fixe avec des yeux couleur de lune.
gaspard: Un renardeau de brume. Sa m\xE8re a \xE9t\xE9 tu\xE9e par quelque chose de\u2026 pas naturel. Il ne mange plus. Tu veux essayer ?
* (Tendre doucement la main) #creature
  test stat.creatures + stat.courage / 3 vs 15
  si reussite
    > Le renardeau renifle tes doigts, puis grimpe sur ton bras et s'enroule autour de ton cou.
    ~ stat.creatures += 4; rel.gaspard += 8; var.familier = vrai
    gaspard (surpris): \xC7a alors. Il t'a choisi. Il faut lui donner un nom.
    * Luciole.
      ~ var.familier_nom = "Luciole"
    * Braise.
      ~ var.familier_nom = "Braise"
    * Pip.
      ~ var.familier_nom = "Pip"
    gaspard (content): {var.familier_nom}. \xC7a lui va. Il dormira ici, mais il viendra te voir. Ces b\xEAtes-l\xE0 sentent quand on a besoin d'elles.
    ~ souvenir(gaspard, renardeau, "Le renardeau de brume t'a choisi")
  sinon
    > Le renardeau feule et se cache au fond de la cage.
    ~ stat.creatures += 1; rel.gaspard += 2
    gaspard: Pas grave. Il faut du temps. Reviens le voir.
* Ce n'est pas un peu dangereux ?
  ~ rel.gaspard -= 1
  gaspard (rire): Lui ? Le plus dangereux ici, c'est ma soupe.
gaspard: Si tu veux aider, viens soigner les b\xEAtes quand tu as un moment. Et ne t'approche pas de la for\xEAt sans moi. Jamais.`,title:"Le gardien",chapters:["ch1","ch2"],priority:6,once:!0},{id:"ch1_sera_noe",trigger:"enter:grand_hall",script:`!placer noe 260 droite
!placer sera 330 gauche
!placer tobias 360 gauche
> Un attroupement. Au milieu, No\xE9, les joues rouges, ramasse ses livres \xE9parpill\xE9s par terre.
sera (rire): P\xE9trir, il sait. Lire un grimoire, c'est autre chose.
tobias (rire): Retourne \xE0 ton four, Lambert !
* (S'interposer) Ramasse-les toi-m\xEAme, Tobias. #courage
  test stat.courage vs 30
  si reussite
    > Ton ton est si calme que Tobias recule d'un pas. Puis, sous les regards, il se baisse et ramasse un livre.
    ~ stat.reputation += 5; rel.noe += 10; rel.tobias -= 5; rel.sera -= 4
    ~ souvenir(noe, defendu, "Tu l'as d\xE9fendu devant tout le monde, dans le grand hall")
    sera (colere): Viens, Tobias. On s'en va.
  sinon
    > Tobias te pousse. Tu tombes \xE0 c\xF4t\xE9 de No\xE9, sous les rires.
    ~ stat.moral -= 5; rel.noe += 8
    ~ souvenir(noe, defendu, "Tu as essay\xE9 de le d\xE9fendre, m\xEAme si \xE7a a mal tourn\xE9")
    noe (emu): T'\xE9tais pas oblig\xE9\u2026
* (Aider No\xE9 \xE0 ramasser ses livres sans un mot) #loyal
  ~ rel.noe += 6; rel.sera -= 1
  sera: Comme c'est touchant.
* Lancer une blague qui fait rire tout le monde\u2026 aux d\xE9pens de S\xE9raphine. #ruse
  test stat.ruse vs 25
  si reussite
    moi: Dis donc, S\xE9raphine, ta m\xE8re t'\xE9crit toujours pour te dire qu'elle est d\xE9\xE7ue ?
    > Le silence est terrible. Puis quelqu'un pouffe. S\xE9raphine devient blanche comme un linge.
    ~ stat.reputation += 3; rel.noe += 5; rel.sera -= 15
    ~ souvenir(sera, humiliee, "Tu l'as humili\xE9e en parlant de sa m\xE8re devant tout le monde")
    ~ var.sera_humiliee = vrai
  sinon
    > Ta blague tombe \xE0 plat. S\xE9raphine hausse un sourcil, m\xE9prisante.
    ~ stat.reputation -= 2
!sortir sera droite
!sortir tobias droite
noe: Merci. Je te revaudrai \xE7a.`,title:"Fils de boulanger",when:"temps.semaine >= 2",chapters:["ch1"],priority:5,once:!0},{id:"ch1_brax",trigger:"enter:arene",script:`!placer brax 380 gauche
!placer tobias 330 gauche
brax: Silence ! Le duel, ce n'est pas de la magie de salon. C'est des r\xE9flexes, du sang-froid et de la sueur.
brax: Toi, le nouveau. Contre Wren. Sort de d\xE9sarmement uniquement. Le premier qui l\xE2che sa baguette a perdu.
* Attaquer tout de suite. #courage
  test stat.duel + stat.courage / 3 vs 16
  si reussite
    !fx sort moi tobias
    > Ton sort part avant m\xEAme que Tobias ait lev\xE9 le bras. Sa baguette roule dans le sable.
    ~ stat.duel += 3; var.duel_victoires += 1; rel.brax += 6; stat.reputation += 3
    brax: Rapide. Brouillon, mais rapide.
  sinon
    !fx sort tobias moi
    > Tobias esquive et te d\xE9sarme d'un geste lourd.
    ~ stat.duel += 2; var.duel_defaites += 1; stat.moral -= 3
    brax: Tu cours avant de savoir marcher. Recommence.
* Attendre son attaque pour la contrer. #ruse
  test stat.duel + stat.ruse / 3 vs 16
  si reussite
    !fx sort tobias moi
    > Tobias attaque en force. Tu pivotes, et son sort frappe le mur. Le tien ne le rate pas.
    ~ stat.duel += 3; var.duel_victoires += 1; rel.brax += 8; stat.reputation += 3
    brax (surpris): Patience et contre. \xC7a, \xE7a ne s'apprend pas.
  sinon
    > Tu attends\u2026 trop longtemps. Tobias te d\xE9sarme pendant que tu r\xE9fl\xE9chis encore.
    ~ stat.duel += 2; var.duel_defaites += 1; stat.moral -= 2
brax: Le cercle de duel est ouvert tous les jours. Ceux qui s'y entra\xEEnent finissent par gagner. Les autres finissent \xE0 l'infirmerie.`,title:"La garde haute",chapters:["ch1"],priority:6,once:!0},{id:"ch1_voix",trigger:"enter:bibliotheque",script:`!placer pell 330 gauche
> La biblioth\xE8que est si calme qu'on entend les pages tourner toutes seules.
> Tu passes devant une lourde porte de fer, au fond. Une plaque : \xAB R\xC9SERVE \u2014 ACC\xC8S INTERDIT \xBB.
> Et derri\xE8re, \xE0 peine un souffle\u2026
> \xAB \u2026 {joueur.nom}\u2026 \xBB
* (Coller l'oreille contre la porte) #curiosite
  > \xAB \u2026 enfin\u2026 je t'attendais\u2026 \xBB
  ~ stat.ombre += 2; var.voix_entendue = vrai
  pell (colere): \xC9loignez-vous de cette porte. Imm\xE9diatement.
  ~ rel.pell -= 3
* (Reculer et faire comme si de rien n'\xE9tait) #prudence
  ~ stat.ruse += 1; var.voix_entendue = vrai
* Madame Pell ! Il y a quelqu'un derri\xE8re la porte ! #honnete
  ~ rel.pell += 3; var.voix_entendue = vrai
  pell (inquiet): \u2026Il n'y a personne, derri\xE8re cette porte. Il n'y a jamais personne.
  > Elle ment. Ses mains tremblent.
  ~ souvenir(pell, voix, "Tu lui as signal\xE9 la voix derri\xE8re la porte de la R\xE9serve")
!placer ayla 160 droite
ayla: Tu l'as entendue aussi, hein ?
ayla (pensif): Moi, c'est Ayla. Je suis en Souffle. Je r\xEAve de cette porte toutes les nuits.
~ rencontrer(ayla)
ayla: Un jour, tu trouveras un livre qui parle. Ne lui r\xE9ponds pas.`,title:"La voix derri\xE8re la porte",when:"temps.semaine >= 2",chapters:["ch1"],priority:5,once:!0},{id:"ch1_escapade",trigger:"tick_start",script:`!lieu dortoir 150 nuit
!placer noe 100 droite
noe (content): Psst ! Tu dors ? On dit qu'il y a un passage secret derri\xE8re la tapisserie du hall. On va voir ?
* Allez, on y va. #rebelle
  ~ rel.noe += 5; stat.courage += 2
  !lieu grand_hall 395 nuit
  !placer noe 360 droite
  > La tapisserie \xE0 la lune d'argent bouge doucement, comme si elle respirait.
  noe (inquiet): Tu entends ? Des pas !
  !entrer orin droite 520
  orin: Deux premi\xE8res ann\xE9es hors du dortoir apr\xE8s le couvre-feu. Vous savez ce que \xE7a co\xFBte ?
  * Pardon. C'est de ma faute, c'est moi qui ai insist\xE9. #loyal
    ~ rel.noe += 8; rel.orin += 4
    orin (content): Courageux. J'aime \xE7a. Allez, filez. Je n'ai rien vu.
    ~ souvenir(orin, couvert, "Il t'a couvert la nuit o\xF9 tu es sorti du dortoir")
    ~ var.dette_orin = vrai
  * On cherchait juste le passage secret.
    ~ rel.orin += 6
    orin (rire): Le passage ? Il ne s'ouvre qu'avec un mot de passe. Un jour, je vous le dirai peut-\xEAtre. Filez.
    ~ souvenir(orin, couvert, "Il t'a couvert la nuit o\xF9 tu es sorti du dortoir")
    ~ var.dette_orin = vrai
  * (Prendre No\xE9 par le bras et s'enfuir en courant) #ruse
    test stat.ruse vs 28
    si reussite
      !courir moi 40
      > Vous filez entre les colonnes. Le pr\xE9fet ne vous a m\xEAme pas reconnus.
      ~ stat.ruse += 2; rel.noe += 3
    sinon
      > Vous tr\xE9buchez sur une armure. Le vacarme r\xE9veille la moiti\xE9 du ch\xE2teau.
      ~ var.avertissements += 1; stat.discipline -= 10; rel.varn -= 4
      varn (colere): Un avertissement. Chacun. Et dix heures de r\xE9curage des chaudrons.
      > No\xE9 ne te reproche rien, mais il fait la t\xEAte pendant deux jours.
      ~ rel.noe -= 2
* Non, No\xE9. On va se faire prendre. #regle
  ~ stat.discipline += 3; rel.noe -= 3
  noe (triste): T'es pas dr\xF4le\u2026
  > Il y va seul. Il revient une heure plus tard, ravi, avec une histoire de pr\xE9fet tr\xE8s gentil qui l'a laiss\xE9 filer.
  ~ var.noe_orin = vrai`,title:"L'escapade nocturne",when:"temps.semaine == 3",chapters:["ch1"],priority:4,once:!0},{id:"ch1_halloran",trigger:"enter:grand_hall",script:`!placer halloran 380 gauche
halloran: Ah, {joueur.nom}. Marche un peu avec moi.
halloran (pensif): Dis-moi\u2026 depuis que tu es ici, fais-tu des r\xEAves \xE9tranges ? Une voix, peut-\xEAtre ? Un livre ?
* Oui. J'ai entendu une voix derri\xE8re la porte de la R\xE9serve. #honnete
  ~ rel.halloran += 8
  ~ souvenir(halloran, confiance_voix, "Tu lui as parl\xE9 de la voix de la R\xE9serve")
  halloran (inquiet): Je vois. \xC9coute-moi bien : si cette voix te propose quelque chose, quoi que ce soit, viens me trouver. Promis ?
  * Promis.
    ~ var.promesse_halloran = vrai; rel.halloran += 3
  * Pourquoi ? Qu'est-ce qu'il y a derri\xE8re cette porte ?
    halloran: Un tr\xE8s vieux chagrin. Va, maintenant.
* Non, rien de sp\xE9cial. #ruse
  ~ stat.ruse += 1
  si var.voix_entendue
    ~ stat.ombre += 2
    halloran (pensif): Bien. Tant mieux.
    > Il ne te croit pas. Tu le vois dans ses yeux.
  sinon
    halloran (content): Tant mieux. Dors bien, alors.`,title:"Les r\xEAves",when:"temps.semaine >= 3",chapters:["ch1"],priority:4,once:!0},{id:"ch1_noe_doute",trigger:"talk:noe",script:`noe (triste): J'ai rat\xE9 mon devoir de potions. Et celui de sortil\xE8ges. Varn a dit que je ferais mieux de rentrer chez moi.
noe: Elle a peut-\xEAtre raison. Mon p\xE8re a besoin de quelqu'un \xE0 la boulangerie\u2026
* On r\xE9vise ensemble tous les soirs jusqu'aux examens. Tu vas y arriver. #loyal
  ~ rel.noe += 10; stat.savoir += 2; stat.energie -= 10
  ~ var.aide_noe = vrai
  ~ souvenir(noe, revisions, "Tu as r\xE9vis\xE9 avec lui tous les soirs quand il voulait abandonner")
  ~ planifier(ch1_noe_reussite, 2)
  noe (emu): Tu ferais \xE7a ? Pour moi ?
* Si tu n'es pas fait pour \xE7a, il vaut mieux le savoir maintenant. #franchise
  ~ rel.noe -= 8
  ~ souvenir(noe, abandon, "Tu lui as dit qu'il n'\xE9tait peut-\xEAtre pas fait pour la magie")
  noe: \u2026Ouais. Merci pour ta franchise.
* Varn dit \xE7a \xE0 tout le monde. Elle me l'a dit aussi. #humour
  ~ rel.noe += 4; stat.moral += 2
  noe (rire): S\xE9rieux ? Bon\u2026 je reste encore un peu, alors.`,title:"Je ne suis pas fait pour \xE7a",when:"temps.semaine >= 3",chapters:["ch1"],priority:5,once:!0},{id:"ch1_noe_reussite",trigger:"scheduled",script:`!placer noe 150 droite
noe (rire): {joueur.nom} ! Regarde ! Un \xAB Acceptable \xBB en potions ! Varn a m\xEAme dit \xAB hm \xBB en me rendant ma copie !
noe (emu): Sans toi, je serais d\xE9j\xE0 dans le bateau du retour.
~ rel.noe += 6; stat.moral += 4
!rappel noe.revisions`,title:"Le devoir de No\xE9"},{id:"ch1_renardeau_perdu",trigger:"enter:cour",script:`!placer gaspard 470 gauche
gaspard (inquiet): {joueur.nom} ! {var.familier_nom} s'est sauv\xE9. Il est parti vers la for\xEAt. Je dois y aller, mais seul, il ne viendra pas.
* Je viens avec vous. #courage
  !lieu foret 120 soir
  !placer gaspard 70 droite
  > La for\xEAt de Brume. Les arbres sont si serr\xE9s que la lumi\xE8re ne passe presque plus.
  gaspard: Appelle-le. Doucement.
  test stat.creatures + stat.courage / 2 vs 22
  si reussite
    > Un \xE9clair gris jaillit d'un buisson et saute dans tes bras en tremblant.
    ~ stat.creatures += 4; rel.gaspard += 10; stat.courage += 3
    gaspard (fier): Tu as du cran, petit. Et les b\xEAtes le savent.
    ~ souvenir(gaspard, foret, "Tu l'as suivi dans la for\xEAt pour retrouver ton renardeau")
  sinon
    > Quelque chose bouge entre les arbres. Une silhouette noire, sans visage. Elle te regarde.
    !fx fumee
    > Puis elle dispara\xEEt. {var.familier_nom} revient seul, la queue basse, comme s'il avait vu un fant\xF4me.
    ~ stat.courage += 2; stat.moral -= 4; rel.gaspard += 6; var.silhouette_vue = vrai
    gaspard (inquiet): Tu as vu \xE7a aussi ? \u2026N'en parle \xE0 personne.
* La for\xEAt est interdite. Je pr\xE9viens l'Archimage. #regle
  ~ stat.discipline += 4; rel.gaspard -= 3
  gaspard: \u2026Si tu veux. Mais le temps qu'il descende, la b\xEAte sera morte de froid.
  > Gaspard revient \xE0 la nuit tomb\xE9e, \xE9puis\xE9, le renardeau sous sa veste.`,title:"Le renardeau a disparu",when:"var.familier et temps.semaine >= 3",chapters:["ch1"],priority:5,once:!0},{id:"ch1_sera_duel",trigger:"enter:arene",script:`!placer sera 330 gauche
!placer brax 450 gauche
sera: {joueur.nom}. Duel. Maintenant. Devant tout le monde.
si mem.sera.humiliee
  sera (colere): Tu vas payer pour ce que tu as dit sur ma m\xE8re.
brax: Un duel d'entra\xEEnement ? Pourquoi pas. R\xE8gles habituelles.
* Accepter le duel. #courage
  test stat.duel + stat.puissance / 4 vs 20
  si reussite
    !fx sort moi sera
    > S\xE9raphine est rapide, pr\xE9cise, redoutable. Mais ton dernier sort la prend de vitesse. Sa baguette vole par-dessus le cercle.
    ~ var.duel_victoires += 1; stat.reputation += 8; stat.duel += 3; var.sera_battue = vrai
    sera (colere): \u2026
    * (Lui tendre sa baguette) Bien jou\xE9. Tu m'as fait peur. #humble
      ~ rel.sera += 10
      ~ souvenir(sera, respect, "Tu l'as battue et tu lui as rendu sa baguette avec respect")
      sera (surpris): \u2026Tu te moques de moi ?
      moi: Non. C'\xE9tait serr\xE9.
      sera: \u2026Hm.
    * (Lever les bras vers la foule) #fierte
      ~ rel.sera -= 10; stat.reputation += 3
      ~ souvenir(sera, humiliation_duel, "Tu as c\xE9l\xE9br\xE9 ta victoire sur elle devant tout le monde")
      sera (triste): Profite. \xC7a ne durera pas.
  sinon
    !fx sort sera moi
    > Elle te d\xE9sarme en trois sorts parfaits. Tu n'as rien vu venir.
    ~ var.duel_defaites += 1; stat.moral -= 6; stat.duel += 2; rel.sera += 3
    sera (fier): Voil\xE0 ce qu'est une vraie lign\xE9e.
* Refuser : je n'ai rien \xE0 te prouver. #sagesse
  ~ rel.sera -= 2; stat.reputation -= 3; rel.brax -= 2
  sera (rire): \xC9videmment. Les l\xE2ches ont toujours de bonnes excuses.
  > Mais plus tard, en passant, tu l'entends demander \xE0 Tobias : \xAB Pourquoi il n'a pas peur de moi, celui-l\xE0 ? \xBB`,title:"Le d\xE9fi",when:"temps.semaine >= 4",chapters:["ch1"],priority:6,once:!0},{id:"ch1_lettre",trigger:"tick_end",script:`> Un corbeau frappe \xE0 la fen\xEAtre du dortoir. Une lettre, l'\xE9criture de ta m\xE8re.
> \xAB Mon tr\xE9sor, la maison est bien vide sans toi. Est-ce qu'on te nourrit correctement ? Est-ce que tu t'es fait des amis ? Ici, le chat dort sur ton lit. Je t'embrasse fort. Maman. \xBB
* (R\xE9pondre longuement, tout raconter) #famille
  ~ rel.claire += 8; stat.moral += 4
  ~ souvenir(claire, lettre1, "Tu lui as tout racont\xE9 dans ta premi\xE8re lettre")
* (R\xE9pondre en deux lignes) \xAB Tout va bien. Bisous. \xBB
  ~ rel.claire -= 2
* (Garder la lettre sous ton oreiller sans r\xE9pondre)
  ~ rel.claire -= 5; stat.moral += 1`,title:"Une lettre de maman",when:"temps.semaine == 2",chapters:["ch1"],once:!0},{id:"ch1_examens",trigger:"chapter_end",script:`!lieu grand_hall 300 jour
> Fin de la premi\xE8re ann\xE9e. Les examens se d\xE9roulent dans le grand hall, sous l'\u0153il des portraits qui chuchotent.
> Sortil\xE8ges, potions, th\xE9orie : trois \xE9preuves, trois matin\xE9es.
~ var.note_annee1 = (stat.sortileges + stat.potions + stat.savoir) / 3 + stat.discipline / 6
si var.note_annee1 >= 34
  > R\xE9sultat : Mention Excellence. Ton nom est lu \xE0 voix haute devant toute l'acad\xE9mie.
  ~ stat.reputation += 10; stat.moral += 8; rel.halloran += 4
  ~ objectifReussi("premiere_annee")
  ~ var.mention1 = vrai
sinon si var.note_annee1 >= 22
  > R\xE9sultat : Admis. Sans \xE9clat, mais tu passes en deuxi\xE8me ann\xE9e.
  ~ stat.moral += 3
  ~ objectifReussi("premiere_annee")
sinon
  > R\xE9sultat : Admis de justesse, sous condition. Ma\xEEtresse Varn te regarde comme on regarde une potion rat\xE9e.
  ~ stat.moral -= 5; rel.varn -= 3
  ~ objectifReussi("premiere_annee")
!placer noe 260 droite
si var.aide_noe
  noe (content): On passe tous les deux ! On passe tous les deux !
  ~ rel.noe += 4
sinon si mem.noe.abandon
  noe: J'ai r\xE9ussi. Tout seul.
  > Il ne te regarde pas en le disant.
sinon
  noe (content): Je passe ! De justesse, mais je passe !
halloran: Bonnes vacances \xE0 tous. Et souvenez-vous : la magie ne s'arr\xEAte pas quand on quitte le ch\xE2teau. Les ennuis non plus.`,title:"Les examens de l'\xC9veil",chapters:["ch1"],priority:100,once:!0},{id:"ch2_rentree",trigger:"tick_start",script:`!lieu cour 200 jour
!placer noe 160 droite
noe (content): Tu as vu ? J'ai pris cinq centim\xE8tres ! Mon p\xE8re dit que c'est le pain. Moi je dis que c'est la magie.
si var.sera_battue et mem.sera.respect
  !entrer sera droite 330
  sera: {joueur.nom}. \u2026Bonne rentr\xE9e.
  > Elle s'\xE9loigne aussit\xF4t. No\xE9 te regarde, la bouche ouverte.
  noe (surpris): Elle t'a dit bonjour. S\xE9raphine de Valcourt t'a dit bonjour.
  ~ rel.sera += 3
sinon si mem.sera.humiliee ou mem.sera.humiliation_duel
  !entrer sera droite 330
  sera (colere): Profite de ta petite gloire. Cette ann\xE9e, je serai pr\xEAte.
  !sortir sera droite
!entrer orin droite 420
orin (content): Vous deux ! Le duo de l'an dernier. Je suis pr\xE9fet cette ann\xE9e : si on vous emb\xEAte, vous venez me voir.
si var.dette_orin
  orin: Et ne t'inqui\xE8te pas pour la petite promenade nocturne. Ton secret est bien gard\xE9.
  ~ rel.orin += 3
orin: Au fait, je r\xE9unis quelques \xE9l\xE8ves prometteurs le jeudi soir. Un petit cercle d'\xE9tude. Je vous en reparlerai.
!sortir orin droite
noe (pensif): Il est sympa, Orin. Un peu trop, non ?
~ objectif("deuxieme_annee", "R\xE9ussir la deuxi\xE8me ann\xE9e")`,title:"La rentr\xE9e",when:"temps.semaine == 1",chapters:["ch2"],priority:20,once:!0},{id:"ch2_tour",trigger:"enter:classe_sorts",script:`!placer selene 300 gauche
selene (content): Cette ann\xE9e, mes petits astres, nous ouvrons la Tour de l'Ouest. Divination, lecture des \xE9toiles, interpr\xE9tation des r\xEAves.
selene (pensif): Ceux qui r\xEAvent trop fort, venez me voir. Les r\xEAves, \xE7a se soigne. Ou \xE7a se cultive.
~ var.tour_ouverte = vrai
> La porte de la tour, au bout du grand hall, est d\xE9sormais ouverte. On peut y m\xE9diter dans le cercle de lune pour chasser les mauvaises pens\xE9es.
si stat.ombre >= 5
  selene (inquiet): Toi\u2026 tu as l'air fatigu\xE9. Viens m\xE9diter \xE0 la tour. Souvent.
  ~ rel.selene += 2`,title:"La tour de l'Ouest",chapters:["ch2"],priority:6,once:!0},{id:"ch2_foret_permission",trigger:"talk:gaspard",script:`gaspard: Tu as la main avec les b\xEAtes, et tu ne fais pas de b\xEAtises. Enfin, pas trop.
gaspard: \xC0 partir d'aujourd'hui, tu peux venir dans la for\xEAt de Brume. Par ma cabane, et nulle part ailleurs. Et tu rentres avant la nuit.
~ var.foret_ok = vrai
gaspard (inquiet): Et si tu vois une silhouette noire, sans visage\u2026 tu cours. Tu ne r\xE9fl\xE9chis pas, tu cours.
si var.silhouette_vue
  gaspard: Tu l'as d\xE9j\xE0 vue, toi. Je le sais.
* Qu'est-ce que c'est ?
  gaspard: Quelque chose qui n'a rien \xE0 faire dans ma for\xEAt. \xC7a tue mes b\xEAtes depuis deux ans.
  ~ var.ombre_foret = vrai
* Promis, je ferai attention. #prudence
  ~ rel.gaspard += 3`,title:"La permission de Gaspard",when:"rel.gaspard >= 15 ou stat.creatures >= 25",chapters:["ch2","ch3"],priority:6,once:!0},{id:"ch2_cercle_invitation",trigger:"enter:salle_commune",script:`!placer orin 250 gauche
orin: {joueur.nom}, j'ai une proposition. Le cercle d'\xE9tude dont je t'ai parl\xE9\u2026 on y apprend ce qu'on n'enseigne pas en cours.
orin (content): Les vrais secrets de la magie. Ceux qui font les grands mages. Tu en es ?
si var.mefiance_orin
  > Tu repenses \xE0 la lettre anonyme : \xAB M\xE9fie-toi du pr\xE9fet \xBB.
* Avec plaisir ! #ambition
  ~ var.cercle_orin = vrai; rel.orin += 6; stat.ombre += 2
  ~ souvenir(orin, cercle, "Tu as rejoint son cercle d'\xE9tude secret")
  orin (fier): Je savais que tu \xE9tais diff\xE9rent des autres. Jeudi, minuit, devant la tapisserie \xE0 la lune.
  ~ planifier(ch2_cercle_reunion, 1)
* Et No\xE9, il peut venir aussi ? #loyal
  orin (pensif): Lambert ? Il est\u2026 gentil. Mais le cercle, c'est pour les \xE9l\xE8ves qui ont du potentiel.
  * Alors sans moi. #loyal
    ~ rel.noe += 6; rel.orin -= 4
    ~ souvenir(noe, refus_cercle, "Tu as refus\xE9 le cercle d'Orin parce qu'il ne voulait pas de lui")
    orin: Dommage. La porte reste ouverte.
  * D'accord, je viendrai seul. #ambition
    ~ var.cercle_orin = vrai; rel.orin += 4; stat.ombre += 2
    ~ souvenir(orin, cercle, "Tu as rejoint son cercle d'\xE9tude secret")
    ~ planifier(ch2_cercle_reunion, 1)
* Non merci. Je pr\xE9f\xE8re les cours normaux. #prudence
  ~ rel.orin -= 2; stat.discipline += 2
  orin (content): Comme tu veux. Personne n'est oblig\xE9.
  > Son sourire ne monte pas jusqu'\xE0 ses yeux.`,title:"Le cercle d'Orin",when:"temps.semaine >= 2",chapters:["ch2"],priority:6,once:!0},{id:"ch2_cercle_reunion",trigger:"scheduled",script:`!lieu grand_hall 395 nuit
!placer orin 440 gauche
> Minuit. Orin murmure un mot et la tapisserie s'ouvre comme un rideau. Derri\xE8re, un escalier qui descend.
> En bas, une salle ronde. Cinq \xE9l\xE8ves en cercle autour d'une bougie noire.
orin: Bienvenue. Ici, on apprend la magie qui ne demande pas la permission.
orin: Mais d'abord, une petite \xE9preuve. J'ai besoin d'un livre de la R\xE9serve. Un livre noir, sans titre. Voici la cl\xE9.
~ var.cle_reserve = vrai
* Je vais le chercher. #ambition
  ~ var.mission_orin = vrai; rel.orin += 5; stat.ombre += 3
  orin (fier): Je savais que je pouvais compter sur toi.
* Pourquoi tu n'y vas pas toi-m\xEAme ? #ruse
  ~ stat.ruse += 2
  orin (pensif): Parce que le livre ne s'ouvre pas pour moi. Il para\xEEt qu'il choisit ses lecteurs.
  ~ var.mission_orin = vrai; var.mefiance_orin = vrai
* (Prendre la cl\xE9\u2026 et aller tout raconter \xE0 l'Archimage) #lumiere
  ~ var.denonce_orin = vrai; rel.halloran += 10; rel.orin -= 15
  ~ planifier(ch2_halloran_bureau, 1)
  > Orin te sourit pendant que tu remontes l'escalier. Il ne sait pas encore.
> La cl\xE9 est lourde, froide, et elle semble vibrer dans ta poche.`,title:"Minuit, la tapisserie"},{id:"ch2_reserve",trigger:"enter:section_interdite",script:`> La R\xE9serve. L'air y est \xE9pais, charg\xE9 de poussi\xE8re et d'autre chose. Une odeur d'orage.
> Sur un pupitre, un livre noir, sans titre. Il est ouvert. Il t'attendait.
> \xAB \u2026 {joueur.nom}\u2026 tu es venu\u2026 \xBB
* (Toucher le grimoire) #ombre
  !fx magie moi
  > Les pages s'animent. Une vision : un jeune homme en robe noire, aussi p\xE2le qu'un mort, qui sourit tristement.
  malrik (content): Enfin quelqu'un qui m'entend. Je m'appelle\u2026 j'ai oubli\xE9 mon nom. Tant d'ann\xE9es. Aide-moi \xE0 m'en souvenir.
  ~ var.grimoire_trouve = vrai; stat.ombre += 6; stat.puissance += 3; rencontrer(malrik); rel.malrik += 10
  ~ souvenir(malrik, premier_contact, "Tu as touch\xE9 le grimoire et tu l'as \xE9cout\xE9")
  > Le grimoire noir peut d\xE9sormais \xEAtre lu ici. Chaque lecture rend plus puissant\u2026 et plus sombre.
  si var.promesse_halloran
    > Tu te souviens de ta promesse \xE0 l'Archimage : venir le trouver si une voix te propose quelque chose.
    ~ planifier(ch2_halloran_bureau, 1)
* (Refermer le grimoire sans le lire) #lumiere
  > Le livre se referme avec un claquement sec. Les bougies s'\xE9teignent toutes en m\xEAme temps.
  > \xAB \u2026 tu reviendras\u2026 \xBB
  ~ stat.courage += 3; var.grimoire_ferme = vrai
  ~ var.grimoire_trouve = vrai
* (Repartir en courant) #prudence
  ~ stat.moral -= 3
  > Tu claques la porte de la R\xE9serve derri\xE8re toi. Ton c\u0153ur bat si fort que Madame Pell l\xE8ve la t\xEAte.
  ~ var.grimoire_trouve = vrai
si var.mission_orin
  * [non var.grimoire_ferme] (Emporter le grimoire pour Orin) #ombre
    ~ stat.ombre += 8; var.grimoire_orin = vrai; rel.orin += 10; rel.malrik += 6
    ~ souvenir(orin, grimoire, "Tu lui as apport\xE9 le grimoire noir")
    ~ planifier(ch2_orin_grimoire, 1)
    > Le livre est chaud contre ta poitrine, comme un animal endormi.
  * (Laisser le grimoire ici et mentir \xE0 Orin) #ruse
    ~ stat.ruse += 3
    ~ var.mensonge_orin = vrai`,title:"Le grimoire noir",chapters:["ch2","ch3","ch4"],priority:10,once:!0},{id:"ch2_porte_reserve",trigger:"enter:bibliotheque",script:`!moment nuit
> Tu r\xE9vises tard. Madame Pell est partie depuis longtemps. Les chandelles baissent toutes seules.
> Au fond de la salle, la porte de fer de la R\xE9serve grince. Elle s'entrouvre, d'un doigt. Puis d'une main.
> \xAB \u2026 {joueur.nom}\u2026 je t'ai ouvert\u2026 entre\u2026 \xBB
* (S'approcher et pousser la porte) #curiosite
  > La porte s'ouvre sans un bruit. Derri\xE8re, un escalier qui descend dans le noir, et une odeur d'orage.
  ~ var.cle_reserve = vrai; stat.ombre += 2
  > D\xE9sormais, la R\xE9serve s'ouvre pour toi. Tu le sais, sans savoir comment.
* (Refermer la porte et pr\xE9venir Madame Pell demain) #honnete
  ~ rel.pell += 6; var.pell_alliee = vrai
  pell (inquiet): Elle s'est ouverte ? Toute seule ? \u2026Il t'a choisi, alors. Je vais renforcer les verrous. Mais les verrous ne l'ont jamais arr\xEAt\xE9 longtemps.
  ~ souvenir(pell, porte, "Tu l'as pr\xE9venue quand la porte de la R\xE9serve s'est ouverte seule")
* (Ramasser tes affaires et partir en courant) #prudence
  ~ stat.moral -= 2
  > Dans ton dos, la porte se referme doucement. Comme si elle avait tout son temps.`,title:"La porte qui s'ouvre",when:"var.voix_entendue et non var.cle_reserve et temps.semaine >= 3",chapters:["ch2","ch3"],priority:5,once:!0},{id:"ch2_orin_grimoire",trigger:"scheduled",script:`!placer orin 250 gauche
orin (fier): Tu l'as fait. Tu es vraiment l'\xE9l\xE8ve que j'esp\xE9rais.
orin: En \xE9change, voici un sort que personne ne t'apprendra ici. Le Voile Noir. Il rend invisible\u2026 et il ne pardonne pas les h\xE9sitations.
~ var.sorts += 1; stat.sortileges += 4; stat.ombre += 4
> Le lendemain, le grimoire est de retour sur son pupitre, dans la R\xE9serve. Comme s'il n'en \xE9tait jamais parti.
~ var.orin_lu = vrai`,title:"Le cadeau d'Orin"},{id:"ch2_halloran_bureau",trigger:"scheduled",script:`!lieu bureau_archimage 120 soir
!placer halloran 250 gauche
halloran: Assieds-toi, {joueur.nom}.
si var.denonce_orin
  halloran (pensif): Tu as bien fait de venir. Orin Kael\u2026 J'avais des doutes. Tu me les confirmes.
  halloran: Mais je n'ai aucune preuve. Garde un \u0153il sur lui. Et surtout, ne touche jamais ce livre.
  ~ var.allie_halloran = vrai; rel.halloran += 5
  ~ souvenir(halloran, denonciation, "Tu es venu lui parler du cercle secret d'Orin")
sinon
  halloran: Tu es all\xE9 dans la R\xE9serve. Je le sais. Le ch\xE2teau me raconte tout.
  * Oui. Le grimoire m'a parl\xE9. #honnete
    ~ rel.halloran += 8; var.allie_halloran = vrai
    halloran (inquiet): Il s'appelle Malrik. C'\xE9tait un \xE9l\xE8ve, autrefois. Le plus dou\xE9 que j'aie connu. Il a voulu vaincre la mort\u2026 et il l'a presque fait.
    ~ var.malrik_nom = vrai
    halloran: Son \xE2me est enferm\xE9e dans ce livre. Chaque lecture le nourrit. Promets-moi de ne plus y toucher.
    * Je le promets. #lumiere
      ~ var.promesse_grimoire = vrai; rel.halloran += 4
    * Je ne peux pas promettre \xE7a. #ombre
      ~ rel.halloran -= 4; stat.ombre += 2
      halloran (triste): Alors sois prudent. Plus prudent que je ne l'ai \xE9t\xE9.
  * Non. Je n'y suis jamais all\xE9. #ruse
    ~ rel.halloran -= 10; stat.ombre += 3
    ~ souvenir(halloran, mensonge, "Tu lui as menti \xE0 propos de la R\xE9serve")
    halloran (triste): Tr\xE8s bien. Tu peux disposer.`,title:"Le bureau de l'Archimage"},{id:"ch2_ayla_vision",trigger:"enter:tour_ouest",script:`!placer ayla 250 gauche
> Ayla est assise au centre du cercle de lune, les yeux ferm\xE9s. Elle les ouvre en t'entendant.
ayla: J'ai r\xEAv\xE9 de toi. Il y avait une ombre qui portait ton visage. Elle souriait, mais pas comme toi.
* \xC7a veut dire quoi ? #curiosite
  ayla (pensif): Je ne sais pas. Mes r\xEAves ne disent jamais ce qu'ils veulent dire. Juste ce qui pourrait arriver.
  ~ rel.ayla += 4
* Tu r\xEAves souvent de moi ? #romance
  ~ rel.ayla += 6
  ayla (rire): \u2026Ce n'est pas ce que je voulais dire.
  > Mais elle ne d\xE9ment pas.
* Tes r\xEAves te font peur ? #ecoute
  ~ rel.ayla += 8
  ayla (triste): Tout le temps. Personne ne me l'avait jamais demand\xE9.
  ~ souvenir(ayla, ecoute, "Tu lui as demand\xE9 si ses r\xEAves lui faisaient peur")
ayla: Si tu vois un livre noir\u2026 ne l'\xE9coute pas. Il ment. Il ment toujours avec la voix de la personne qu'on aime le plus.`,title:"La vision d'Ayla",chapters:["ch2"],priority:6,once:!0},{id:"ch2_village",trigger:"enter:village",script:`!placer noe 90 droite
> Pierrelune, le village au pied du ch\xE2teau. Des toits pointus, des enseignes qui changent de couleur, une odeur de pain d'\xE9pice.
noe (content): Mon p\xE8re me tuerait s'il voyait les boulangeries d'ici. Les croissants volent !
noe: Tu viens \xE0 l'auberge de la Com\xE8te ? Il para\xEEt que Marthe fait le meilleur chocolat chaud du monde.
~ rel.noe += 3; stat.moral += 4`,title:"Pierrelune",chapters:["ch2","ch3","ch4","ch5"],priority:6,once:!0},{id:"ch2_marthe",trigger:"enter:auberge",script:`!placer marthe 340 gauche
marthe (content): Un nouveau visage ! Assieds-toi, mon poussin. Premier chocolat offert, c'est la r\xE8gle de la maison.
marthe: Tu es d'Ombrelune ? Si un jour tu as besoin d'\xE9cus, j'ai toujours besoin de bras le week-end.
~ rel.marthe += 5; stat.moral += 5
marthe (pensif): Et si un jour tu as besoin d'un endroit o\xF9 te cacher\u2026 la Com\xE8te a une cave. Personne ne la conna\xEEt. Retiens \xE7a.`,title:"L'auberge de la Com\xE8te",chapters:["ch2","ch3","ch4","ch5"],priority:6,once:!0},{id:"ch2_lettre_anonyme",trigger:"tick_start",script:`> Sous ton oreiller, un papier pli\xE9 en quatre. Une \xE9criture fine, trembl\xE9e.
> \xAB M\xE9fie-toi du pr\xE9fet. Il n'est pas celui qu'il pr\xE9tend \xEAtre. \u2014 Une amie \xBB
~ var.mefiance_orin = vrai
* (Garder la lettre)
  ~ stat.ruse += 1
* (La montrer \xE0 No\xE9)
  noe (inquiet): Orin ? Mais il est gentil avec tout le monde\u2026
  ~ rel.noe += 2
* (La br\xFBler) #prudence
  ~ stat.courage += 1`,title:"La lettre anonyme",when:"temps.semaine == 2",chapters:["ch2"],priority:5,once:!0},{id:"ch2_bal",trigger:"tick_start",script:`!lieu cour 300 nuit
> La Nuit des Lanternes. Chaque \xE9l\xE8ve fait voler une lanterne au-dessus du lac, avec un v\u0153u \xE9crit dessus.
> On y va \xE0 deux, c'est la tradition.
* [rel.ayla >= 5] Inviter Ayla. #romance
  !placer ayla 340 gauche
  ayla (surpris): Moi ? \u2026D'accord.
  > Vous l\xE2chez vos lanternes en m\xEAme temps. Elles montent, se cognent doucement, puis continuent ensemble.
  ~ rel.ayla += 12; stat.moral += 8
  ~ souvenir(ayla, lanternes, "Tu l'as invit\xE9e \xE0 la Nuit des Lanternes")
  ~ var.lanternes_ayla = vrai
  ayla (content): J'ai fait un v\u0153u. Je ne te dirai pas lequel.
* Y aller avec No\xE9, entre amis. #loyal
  !placer noe 340 gauche
  noe (rire): Je pensais que tu inviterais quelqu'un d'autre. Mais je suis content.
  ~ rel.noe += 8; stat.moral += 5
  ~ souvenir(noe, lanternes, "Tu es all\xE9 \xE0 la Nuit des Lanternes avec lui")
* [rel.sera >= 10] Proposer \xE0 S\xE9raphine. #audace
  !placer sera 340 gauche
  sera (surpris): \u2026Tu as perdu la t\xEAte ?
  sera: \u2026Bon. Mais si quelqu'un se moque, je te transforme en crapaud.
  ~ rel.sera += 12; stat.reputation += 4
  ~ souvenir(sera, lanternes, "Tu l'as invit\xE9e \xE0 la Nuit des Lanternes, et elle a accept\xE9")
  > Elle \xE9crit son v\u0153u en cachant le papier avec sa main. Plus tard, tu aper\xE7ois le mot : \xAB \xCAtre aim\xE9e pour ce que je suis. \xBB
* Y aller seul et regarder les lanternes. #solitude
  ~ stat.moral += 2; stat.savoir += 1
  > Tu \xE9cris ton v\u0153u sur ta lanterne. Elle monte plus haut que toutes les autres.`,title:"La Nuit des Lanternes",when:"temps.semaine == 3",chapters:["ch2"],priority:8,once:!0},{id:"ch2_qualifications",trigger:"enter:arene",script:`!placer brax 450 gauche
!placer tobias 330 gauche
!fx foule 0.6
brax: Qualifications pour le Tournoi des Duels de l'an prochain ! Seuls les huit meilleurs y entreront.
brax: {joueur.nom} contre Wren. En garde !
* Duel loyal, sorts r\xE9glementaires. #duel
  test stat.duel + stat.sortileges / 3 vs 26
  si reussite
    !fx sort moi tobias
    > Tobias tombe \xE0 genoux, d\xE9sarm\xE9. La foule applaudit.
    ~ var.qualifie = vrai; var.duel_victoires += 1; stat.reputation += 6; rel.brax += 5
    brax: Qualifi\xE9 !
  sinon
    !fx sort tobias moi
    > Tobias frappe fort. Tu roules dans le sable. C'est fini.
    ~ var.duel_defaites += 1; stat.moral -= 6
    brax: \xC9limin\xE9. Travaille, et tu auras ta chance au rep\xEAchage.
    ~ planifier(ch2_repechage, 1)
* [var.orin_lu] Utiliser le Voile Noir pour dispara\xEEtre et frapper dans le dos. #ombre
  !fx fumee moi
  > Tu disparais. Tobias tourne sur lui-m\xEAme, affol\xE9. Ton sort le frappe de nulle part.
  ~ var.qualifie = vrai; var.duel_victoires += 1; stat.ombre += 6; rel.brax -= 8
  brax (colere): \u2026Qualifi\xE9. Mais je ne sais pas o\xF9 tu as appris \xE7a. Et je n'aime pas \xE7a.
  ~ souvenir(brax, voile, "Tu as utilis\xE9 un sort interdit pendant les qualifications")`,title:"Les qualifications du tournoi",when:"temps.semaine >= 4",chapters:["ch2"],priority:8,once:!0},{id:"ch2_repechage",trigger:"scheduled",script:`!lieu arene 280 jour
!placer brax 450 gauche
brax: Rep\xEAchage. Un seul duel. Contre moi. Tiens trente secondes et tu es qualifi\xE9.
test stat.duel + stat.courage / 2 vs 30
si reussite
  !fx sort brax moi
  > Il t'envoie sort sur sort. Tu esquives, tu pares, tu roules\u2026 et tu es encore debout quand il baisse sa baguette.
  ~ var.qualifie = vrai; rel.brax += 10; stat.duel += 3
  brax (fier): Trente-deux secondes. Qualifi\xE9.
sinon
  > Il te d\xE9sarme en huit secondes. Il t'aide \xE0 te relever.
  ~ rel.brax += 4; stat.duel += 2
  brax: Pas encore. Mais tu as du c\u0153ur. Reviens l'an prochain.`,title:"Le rep\xEAchage"},{id:"ch2_sera_confidence",trigger:"talk:sera",script:`> S\xE9raphine est assise seule, une lettre froiss\xE9e \xE0 la main. Elle a les yeux rouges.
sera (colere): Quoi ? Qu'est-ce que tu veux ?
* (S'asseoir \xE0 c\xF4t\xE9 d'elle sans rien dire) #ecoute
  > Un long silence. Puis elle te tend la lettre.
  > \xAB Deuxi\xE8me de ta promotion. Ton grand-p\xE8re \xE9tait premier \xE0 ton \xE2ge. T\xE2che de ne pas nous faire honte. \u2014 M\xE8re \xBB
  sera (triste): Deuxi\xE8me. Derri\xE8re toi, en sortil\xE8ges. Elle ne me pardonnera jamais.
  ~ rel.sera += 12
  ~ souvenir(sera, confidence, "Tu t'es assis \xE0 c\xF4t\xE9 d'elle quand elle pleurait")
  ~ var.sera_confidence = vrai
* Tu pleures parce que je t'ai battue ? #cruaute
  ~ rel.sera -= 12; stat.ombre += 2
  sera (colere): Va-t'en. Va-t'en !
* (Faire demi-tour discr\xE8tement) #respect
  ~ rel.sera += 2`,title:"La lettre de sa m\xE8re",when:"rel.sera >= 5",chapters:["ch2","ch3"],priority:6,once:!0},{id:"ch2_noe_jaloux",trigger:"talk:noe",script:`noe (triste): Tu sais, depuis que tu vas aux r\xE9unions d'Orin, on ne se voit plus. Tu as chang\xE9.
noe: Tu parles comme lui, maintenant. \xAB Les \xE9l\xE8ves qui ont du potentiel \xBB\u2026
* Tu as raison. Je quitte le cercle. #loyal
  ~ var.cercle_orin = faux; rel.noe += 10; rel.orin -= 8
  ~ souvenir(noe, quitte_cercle, "Tu as quitt\xE9 le cercle d'Orin pour lui")
  noe (emu): Vraiment ? \u2026Merci.
* Tu es jaloux, No\xE9. C'est tout. #ambition
  ~ rel.noe -= 10; stat.ombre += 2
  ~ souvenir(noe, jaloux, "Tu l'as trait\xE9 de jaloux")
  noe: Peut-\xEAtre. Ou peut-\xEAtre que j'ai peur pour toi.
* On peut se voir le week-end, \xE0 Pierrelune ? Juste nous deux. #compromis
  ~ rel.noe += 4`,title:"No\xE9 se sent seul",when:"var.cercle_orin",chapters:["ch2","ch3"],priority:7,once:!0},{id:"ch2_pell",trigger:"enter:bibliotheque",script:`!placer pell 300 gauche
pell (colere): Vous. Approchez. Quelqu'un a ouvert la R\xE9serve. La serrure se souvient des mains qui la touchent.
* C'\xE9tait moi. Orin Kael m'a donn\xE9 la cl\xE9. #honnete
  ~ rel.pell += 8; stat.discipline -= 5; rel.orin -= 10
  pell (inquiet): Kael ? \u2026Je vois. Gardez la cl\xE9. Si on vous la prend, c'est lui qui l'aura. Je pr\xE9f\xE8re que ce soit vous.
  ~ var.pell_alliee = vrai
* Moi ? Jamais de la vie. #ruse
  test stat.ruse vs 32
  si reussite
    > Tu soutiens son regard sans ciller. Elle finit par baisser les yeux.
    ~ stat.ruse += 2
  sinon
    pell: Menteur. Un avertissement. Et je vous surveille.
    ~ var.avertissements += 1; stat.discipline -= 8; rel.pell -= 6`,title:"Les soup\xE7ons de Madame Pell",when:"var.cle_reserve",chapters:["ch2","ch3"],priority:6,once:!0},{id:"ch2_creature_blessee",trigger:"activity:soigner_creatures",script:`!placer gaspard 150 droite
gaspard (inquiet): Viens voir. Vite.
> Dans l'enclos, une biche argent\xE9e g\xEEt sur la paille. Une plaie noire sur le flanc, qui fume encore.
gaspard: De la magie noire. Celle des livres interdits. Quelqu'un s'entra\xEEne sur mes b\xEAtes.
* Pr\xE9parer un baume. #soin
  test stat.potions + stat.creatures / 2 vs 30
  si reussite
    > Ton baume mousse au contact de la plaie, puis la noirceur se dissout. La biche se rel\xE8ve en titubant.
    ~ stat.potions += 3; stat.creatures += 3; rel.gaspard += 10; stat.reputation += 3
    gaspard (emu): Tu l'as sauv\xE9e. Je n'oublierai pas.
    ~ souvenir(gaspard, biche, "Tu as sauv\xE9 la biche argent\xE9e bless\xE9e par la magie noire")
  sinon
    > Le baume ne suffit pas. Gaspard passe la nuit \xE0 son chevet. Au matin, elle respire encore, \xE0 peine.
    ~ rel.gaspard += 4; stat.moral -= 4
* [stat.ombre >= 15] (Sentir la marque\u2026 et reconna\xEEtre les sorts du grimoire) #ombre
  > Tu reconnais la signature de la magie. C'est un sort du grimoire noir. Un sort que tu as lu.
  ~ stat.ombre += 3; stat.moral -= 6
  gaspard: Pourquoi tu fais cette t\xEAte ?`,title:"La b\xEAte bless\xE9e",chapters:["ch2","ch3"],priority:6,once:!0},{id:"ch2_miroir",trigger:"activity:explorer",script:`> L'escalier te d\xE9pose devant une porte que tu n'avais jamais vue. Derri\xE8re, une salle couverte de miroirs.
> Dans le plus grand, ton reflet ne bouge pas en m\xEAme temps que toi.
si stat.ombre >= 25
  > Ton reflet porte une robe noire. Ses yeux sont vides. Il sourit.
  ~ stat.moral -= 6; var.miroir_ombre = vrai
sinon si stat.savoir >= 40
  > Ton reflet porte la robe violette des archimages. Il te salue, grave.
  ~ stat.moral += 6; var.miroir_lumiere = vrai
sinon
  > Ton reflet h\xE9site, flou, comme s'il n'avait pas encore d\xE9cid\xE9 qui il serait.
  ~ stat.savoir += 2
> Quand tu te retournes, la porte a disparu. Tu retrouves le grand hall une heure plus tard, sans savoir comment.`,title:"La salle des miroirs",chapters:["ch2","ch3"],priority:6,once:!0},{id:"ch2_fin",trigger:"chapter_end",script:`!lieu grand_hall 300 jour
~ var.note_annee2 = (stat.sortileges + stat.potions + stat.savoir) / 3 + stat.discipline / 6
si var.note_annee2 >= 40
  > Deuxi\xE8me ann\xE9e : Mention Excellence. M\xEAme Ma\xEEtresse Varn hoche la t\xEAte.
  ~ stat.reputation += 8; stat.moral += 6; rel.varn += 3
sinon si var.note_annee2 >= 26
  > Deuxi\xE8me ann\xE9e : admis.
  ~ stat.moral += 3
sinon
  > Deuxi\xE8me ann\xE9e : admis de justesse. L'Archimage te glisse : \xAB Le talent ne suffit pas. \xBB
  ~ stat.moral -= 4
~ objectifReussi("deuxieme_annee")
si var.qualifie
  > Ton nom est inscrit au tableau du Tournoi des Duels. L'an prochain, tu combattras devant toute l'acad\xE9mie.
si var.cercle_orin
  > Dernier soir. Orin te serre la main. \xAB L'an prochain, les choses s\xE9rieuses commencent. \xBB`,title:"Fin de la deuxi\xE8me ann\xE9e",chapters:["ch2"],priority:100,once:!0},{id:"ch3_rentree",trigger:"tick_start",script:`!lieu quai 200 nuit
!placer lia 240 gauche
> Le soir de la rentr\xE9e, sur le quai, une toute petite fille en robe verte pleure en serrant sa valise.
lia (triste): Je me suis perdue\u2026 Tout le monde est parti\u2026 Je ne sais m\xEAme pas o\xF9 est le ch\xE2teau\u2026
* Viens, je te montre. Moi aussi, j'\xE9tais perdu, la premi\xE8re fois. #genereux
  ~ rel.lia += 12; var.mentor_lia = vrai; stat.reputation += 2
  ~ souvenir(lia, quai, "Tu l'as accompagn\xE9e jusqu'au ch\xE2teau le soir de son arriv\xE9e")
  lia (content): Merci\u2026 Je m'appelle Lia. Lia Kade. Je suis en Racine.
  > Lia vient d\xE9sormais te voir dans la salle commune pour que tu l'aides \xE0 r\xE9viser.
* Le ch\xE2teau, c'est la grosse chose \xE9clair\xE9e, l\xE0-haut. #humour
  ~ rel.lia += 3
  lia (rire): \u2026Ah. Oui. Merci.
* (Passer ton chemin, tu es en retard) #indifference
  ~ rel.lia -= 5
  > Derri\xE8re toi, un sanglot. Puis plus rien. Un pr\xE9fet s'occupera d'elle.
~ objectif("troisieme_annee", "R\xE9ussir la troisi\xE8me ann\xE9e")
si var.qualifie
  ~ objectif("tournoi", "Remporter le Tournoi des Duels")`,title:"La petite nouvelle",when:"temps.semaine == 1",chapters:["ch3"],priority:20,once:!0},{id:"ch3_tournoi_premier",trigger:"enter:arene",script:`!placer brax 470 gauche
!placer sera 330 gauche
!fx foule 0.8
> L'ar\xE8ne est pleine. Des banni\xE8res de toutes les affinit\xE9s claquent dans le vent.
brax: Premier tour du Tournoi des Duels ! {joueur.nom} contre S\xE9raphine de Valcourt !
si mem.sera.confidence ou rel.sera >= 25
  sera: Pas de cadeau, hein ? Je ne t'en ferai pas non plus.
sinon
  sera (fier): J'attendais ce moment depuis deux ans.
* Duel loyal. #duel
  test stat.duel + stat.sortileges / 3 + stat.puissance / 4 vs 34
  si reussite
    !fx sort moi sera
    !fx foule 1
    > Un \xE9change fulgurant, sorts crois\xE9s, \xE9tincelles. Puis S\xE9raphine pose un genou \xE0 terre. Elle a perdu.
    ~ var.tour1 = vrai; var.duel_victoires += 1; stat.reputation += 6
    sera: \u2026Gagne la finale. Sinon, c'est que je t'ai surestim\xE9.
    ~ rel.sera += rel.sera >= 0 ? 5 : -3
  sinon
    !fx sort sera moi
    > S\xE9raphine danse autour de toi. Tu es d\xE9sarm\xE9 avant d'avoir compris.
    ~ var.duel_defaites += 1; stat.moral -= 8; var.elimine = vrai
    ~ objectifEchoue("tournoi")
    sera (content): D\xE9sol\xE9e. Enfin\u2026 pas vraiment.
* [var.pacte] Laisser Malrik guider ta main. #ombre
  !fx eclair
  > Ta baguette crache une flamme noire. S\xE9raphine est projet\xE9e hors du cercle. La foule se tait d'un coup.
  ~ var.tour1 = vrai; var.duel_victoires += 1; stat.ombre += 8; rel.sera -= 15; stat.reputation -= 3
  ~ souvenir(sera, flamme_noire, "Tu l'as frapp\xE9e avec une flamme noire pendant le tournoi")
  brax (colere): \u2026Victoire. Mais je t'ai \xE0 l'\u0153il.`,title:"Tournoi \u2014 premier tour",when:"var.qualifie et temps.semaine >= 2",chapters:["ch3"],priority:9,once:!0},{id:"ch3_tournoi_demi",trigger:"enter:arene",script:`!placer brax 470 gauche
!placer tobias 330 gauche
!fx foule 0.9
brax: Demi-finale ! {joueur.nom} contre Tobias Wren !
tobias: Cette fois, je ne suis plus le gros ben\xEAt qui rit des blagues de S\xE9raphine. Je me suis entra\xEEn\xE9 tout l'\xE9t\xE9.
* Duel loyal. #duel
  test stat.duel + stat.courage / 3 vs 36
  si reussite
    !fx sort moi tobias
    > Tobias est plus fort qu'avant. Bien plus fort. Mais tu trouves la faille.
    ~ var.demi = vrai; var.duel_victoires += 1; stat.reputation += 6; rel.tobias += 6
    tobias (content): \u2026Tu m'as eu. Mais j'ai tenu, hein ? Dis que j'ai tenu.
  sinon
    !fx sort tobias moi
    > Un sort de force pure. Tu d\xE9colles du sol et retombes hors du cercle.
    ~ var.duel_defaites += 1; stat.moral -= 8; var.elimine = vrai
    ~ objectifEchoue("tournoi")
    tobias (rire): Je l'ai fait ! Je l'ai fait !
* [var.pacte] (Laisser la flamme noire r\xE9pondre) #ombre
  !fx eclair
  ~ var.demi = vrai; var.duel_victoires += 1; stat.ombre += 8; rel.tobias -= 10
  > Tobias reste \xE0 terre longtemps. On l'emm\xE8ne \xE0 l'infirmerie.`,title:"Tournoi \u2014 demi-finale",when:"var.tour1 et temps.semaine >= 3",chapters:["ch3"],priority:9,once:!0},{id:"ch3_tournoi_finale",trigger:"enter:arene",script:`!placer brax 490 gauche
!placer orin 350 gauche
!fx foule 1
brax: Finale du Tournoi des Duels ! {joueur.nom} contre Orin Kael, champion en titre !
orin (content): Quel honneur. Montre-moi ce que tu as appris. Avec moi\u2026 ou sans moi.
* Duel loyal, de toutes tes forces. #duel
  test stat.duel + stat.sortileges / 3 + stat.puissance / 3 vs 46
  si reussite
    !fx sort moi orin
    !fx confettis
    > Orin est brillant, rapide, presque parfait. Presque. Ton dernier sort lui arrache la baguette des mains.
    ~ var.champion = vrai; var.duel_victoires += 1; stat.reputation += 15; stat.moral += 10; rel.brax += 10
    ~ objectifReussi("tournoi")
    orin (colere): \u2026Bravo. Profite de ta coupe.
    > Pour la premi\xE8re fois, tu vois quelque chose de froid dans ses yeux.
    ~ rel.orin -= 6
    brax (fier): Champion. Je le savais depuis le premier jour. Ne le r\xE9p\xE8te \xE0 personne.
  sinon
    !fx sort orin moi
    > Orin te d\xE9sarme avec une \xE9l\xE9gance presque cruelle, puis il te tend la main pour te relever.
    ~ var.duel_defaites += 1; stat.moral -= 6; stat.duel += 3; stat.reputation += 6
    ~ objectifEchoue("tournoi")
    orin: Tu seras peut-\xEAtre champion un jour. Avec un bon professeur.
* [var.pacte] Tout donner \xE0 la flamme noire. #ombre
  !fx eclair
  !fx tremblement
  > La flamme noire t'envahit. Orin sourit en la voyant\u2026 et baisse sa garde volontairement.
  ~ var.champion = vrai; var.duel_victoires += 1; stat.ombre += 12; stat.reputation += 8
  ~ objectifReussi("tournoi")
  orin (fier): Il a choisi le bon \xE9l\xE8ve.
  ~ souvenir(orin, flamme, "Il t'a laiss\xE9 gagner la finale quand il a vu la flamme noire")
  > Personne n'a compris pourquoi le champion en titre a baiss\xE9 sa garde. Toi, si.`,title:"Tournoi \u2014 la finale",when:"var.demi et temps.semaine >= 4",chapters:["ch3"],priority:10,once:!0},{id:"ch3_malrik_pacte",trigger:"tick_start",script:`!lieu section_interdite 200 nuit
> Tu ne te souviens pas d'\xEAtre venu ici. Tu \xE9tais dans ton lit, et maintenant le grimoire est ouvert devant toi.
!entrer malrik droite 280
malrik (content): Ne crains rien. Je t'ai seulement appel\xE9. Tu entends mieux que les autres. Tu es\u2026 comme moi.
